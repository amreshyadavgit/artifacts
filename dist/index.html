or `status: needs-human` instead of guessing>\n\n## validation\n\n\u003cOne paragraph: how anyone can check an output is acceptable: a command that exits 0, a golden task in evaluations/, a hook, a checklist a human applies.>\n\n## handoffFormat\n\n\u003cOne paragraph: the handoff file path (`.ai-sdlc/runs/\u003crun-id>/NN-\u003cagent-name>.md`), its YAML front matter keys (`run_id`, `step`, `agent`, `status`, `inputs`, `next`), and the required sections.>\n\n## humanGate\n\n\u003cOne paragraph: where a human must approve before the work continues, and the real mechanism that stops the work until they do (plan mode, a permission `ask` rule, PR approval, a hook that exits 2).>\n","tag":"illustrative"},{"path":"AI-SDLC/docs/foundations/reviewer-contract-draft.md","language":"markdown","content":"# Agent Contract: reviewer\n\n\u003c!--\nWorked example for module 01-foundations. This is a DRAFT filled in from agents/CONTRACT_TEMPLATE.md.\nModule 05-agent-roster finalises it as agents/reviewer/CONTRACT.md and ships the runtime definition\n.claude/agents/reviewer.md. Module 02 builds a simpler first version (evaluations/agent-versions/reviewer-v1.md).\n-->\n\nStatus: draft\nOwner: Platform engineering (AI-SDLC maintainers)\nRuntime definition: `.claude/agents/reviewer.md`\nFinalised in: 05-agent-roster\n\n## purpose\n\nReview one diff of `sample-app/` against the team standards and return structured findings so a human reviewer can decide faster whether the change is mergeable. The reviewer covers correctness, design, readability, testing and standards; it flags security and performance concerns but defers deep analysis of them to the `security` and `sre` agents. It never changes code and never approves a change.\n\n## inputs\n\n- Base ref to diff against, e.g. `main` (required, in the task message).\n- Run id, e.g. `2026-09-30-feat-observation-search` (required, in the task message; names the run folder).\n- Path of the upstream handoff that describes the intent of the change, e.g. `.ai-sdlc/runs/\u003crun-id>/04-developer.md` (optional; without it the reviewer reviews the diff on its own merits and says so).\n- Standards to apply: `context/standards/review-standards.md` and `context/standards/coding-standards.md` (always), `context/standards/testing-standards.md` when test files change.\n\n## outputs\n\n- Final message to the main session: the complete handoff document (YAML front matter plus the sections in handoffFormat). The orchestrator, which has Write access to the run folder, saves it as `.ai-sdlc/runs/\u003crun-id>/NN-reviewer.md`.\n- A findings table with one row per finding: `id | severity | category | location | evidence | recommendation`, severity from `critical | high | medium | low | info`.\n- An explicit \"no findings\" line for every category it checked and found clean.\n\n## tools\n\n- Read\n- Grep\n- Glob\n- Bash (only `git diff`, `git log`, `git status`)\n\n## permissions\n\nFrontmatter in `.claude/agents/reviewer.md`: `tools: Read, Grep, Glob, Bash` (an allowlist, so Edit, Write and Agent are not available) and `disallowedTools: Edit, Write, NotebookEdit` as a second guard, with `permissionMode: dontAsk`, which auto-denies any Bash command that is not pre-approved by the project rules in `.claude/settings.json` (`Bash(git diff *)`, `Bash(git status)`, `Bash(git log *)`). Caveat from the docs: a subagent's `permissionMode` is ignored when the parent session runs in `bypassPermissions`, `acceptEdits` or `auto`, so module 05 adds a `PreToolUse` hook in the agent's own `hooks` frontmatter that exits 2 for any Bash command outside `git diff|git log|git status`. The project `deny` rules (`Read(./.env)`, `Read(./**/secrets/**)`, `Read(./**/*.phi.*)`) apply to the reviewer like every other agent.\n\n## must\n\n- Give every finding all six fields: id, severity, category, location as `path:line`, evidence quoted from the diff or file, recommendation. [convention: checked by the reviewer golden tasks in module 09-agent-evaluation]\n- Cite the standard violated as file plus rule number, e.g. `context/standards/coding-standards.md` rule 6. [convention: checked by the reviewer golden tasks]\n- State \"no findings\" for each category it checked and found clean. [convention: human reviewer reads the handoff]\n- Read the change with `git diff \u003cbase>...HEAD`, not from memory of an earlier conversation. [mechanism: subagents start with no conversation history; Bash is limited to git by `permissionMode: dontAsk` plus allow rules]\n- End with a handoff whose front matter has `run_id`, `step`, `agent: reviewer`, `status`, `inputs`, `next`. [mechanism: `.claude/hooks/check-handoff.mjs` in module 08 rejects a handoff with missing keys]\n\n## mustNot\n\n- Edit, create or delete any file. [mechanism: Edit and Write are absent from `tools` and listed in `disallowedTools`]\n- Delegate to other agents. [mechanism: `Agent` is absent from `tools`, so the reviewer stays at depth 1]\n- Approve the change or write \"LGTM\", \"approved\" or \"ready to merge\". [convention: `context/standards/review-standards.md` says reviewers never approve; merge approval is a human PR approval]\n- Quote PHI in evidence (MRN values, names, birth dates, patient-linked observation values); quote code and synthetic fixtures such as `MRN-000123` only. [convention: `context/security/phi-and-secrets-policy.md`, re-checked by the security agent]\n- Report the marked `TEACHING-DEFECT(perf-n+1)` in `ObservationService.lastN` as a new finding. It may be mentioned as known, with a reference to `sample-app/docs/KNOWN_DEFECTS.md`. [convention: reviewer golden tasks include a case that checks this]\n- Run any shell command other than `git diff`, `git log` or `git status`. [mechanism: `permissionMode: dontAsk` with the project allow rules, backed by the agent-scoped `PreToolUse` hook from module 05]\n\n## failureConditions\n\n- The diff against the base ref is empty or the base ref does not exist: return `status: blocked` with the exact `git` error.\n- The diff touches more than 40 files or 2,000 changed lines: return `status: needs-human` and ask for the change to be split.\n- A referenced standard file or upstream handoff path does not exist: return `status: needs-human` naming the missing path.\n- The change touches `config/SecurityConfig.java`, `audit/AuditLogger.java` or `db/migration/`: review it, but set `next: security` and say why.\n- The task asks the reviewer to fix the code: refuse, return `status: blocked` and recommend routing to `developer`.\n- The run hits `maxTurns` (the output is marked partial): return `status: blocked` rather than a partial finding list presented as complete.\n\n## validation\n\nThis contract is checked with `node docs/foundations/validate-contract.mjs docs/foundations/reviewer-contract-draft.md` (exit 0). Reviewer output is checked three ways: the handoff front matter by `.claude/hooks/check-handoff.mjs` (module 08); the findings against golden tasks in `evaluations/` (module 09), where a seeded diff that adds a repository call inside a loop must produce a `performance` finding citing coding-standards rule 6 and a seeded unchecked `isActive()` must produce a `correctness` finding citing glossary business rule 3; and a human spot-check that no finding lacks quoted evidence.\n\n## handoffFormat\n\nMarkdown with YAML front matter as defined in `workflows/README.md` and the style guide: `run_id`, `step`, `agent: reviewer`, `status` (`complete | blocked | needs-human`), `inputs` (list of upstream handoff file names), `next` (`security`, `tester`, `developer` or `human`). Sections in order: `## Summary` (verdict in one sentence, counts per severity), `## Findings` (the six-column table), `## Decisions` (what was out of scope and why), `## Open questions`, `## Artifacts` (always \"none written; returned to main session\"). Saved by the orchestrator as `.ai-sdlc/runs/\u003crun-id>/NN-reviewer.md`.\n\n## humanGate\n\nThe reviewer is advisory; the gate is the human pull-request approval. Any `critical` or `high` finding blocks merge (review-standards), and in an orchestrated run the orchestrator stops with `status: needs-human` until a person accepts or rejects each one. Nothing the reviewer produces can merge code: `git push` is an `ask` rule in `.claude/settings.json`, force-push is denied, and CLAUDE.md rule 7 leaves push, merge and deploy to a human.\n","tag":"illustrative"},{"path":"AI-SDLC/docs/foundations/validate-contract.mjs","language":"javascript","content":"#!/usr/bin/env node\n// Validate an Agent Contract markdown file (course convention; see agents/CONTRACT_TEMPLATE.md).\n// Zero dependencies, Node 22.\n//\n// Usage:\n//   node docs/foundations/validate-contract.mjs \u003ccontract.md> [more.md ...]   validate filled contracts\n//   node docs/foundations/validate-contract.mjs --template agents/CONTRACT_TEMPLATE.md   headings only\n//   node docs/foundations/validate-contract.mjs --json \u003ccontract.md>   print the agentContracts JSON object\n// Exit codes: 0 valid, 1 invalid, 2 usage or I/O error.\nimport { readFileSync } from \"node:fs\";\n\nexport const FIELDS = [\n  \"purpose\", \"inputs\", \"outputs\", \"tools\", \"permissions\", \"must\", \"mustNot\",\n  \"failureConditions\", \"validation\", \"handoffFormat\", \"humanGate\",\n];\nexport const LIST_FIELDS = new Set([\"inputs\", \"outputs\", \"tools\", \"must\", \"mustNot\", \"failureConditions\"]);\nexport const ROSTER = [\"architect\", \"developer\", \"reviewer\", \"tester\", \"security\", \"sre\", \"orchestrator\"];\n// Built-in tool names as Claude Code spells them (build/CLAUDE_CODE_FACTS.md section 1), plus MCP tools.\nconst TOOLS = new Set([\n  \"Read\", \"Grep\", \"Glob\", \"LSP\", \"Bash\", \"PowerShell\", \"Edit\", \"Write\", \"NotebookEdit\", \"WebFetch\",\n  \"WebSearch\", \"TodoWrite\", \"Skill\", \"ToolSearch\", \"EnterWorktree\", \"ExitWorktree\", \"Monitor\",\n  \"TaskStop\", \"SendMessage\", \"Agent\",\n]);\nconst MCP_TOOL = /^mcp__[A-Za-z0-9_-]+(__[A-Za-z0-9_*-]+)?$/;\nconst ENFORCEMENT = /\\[(mechanism|convention):\\s*[^\\]]+\\]\\s*$/;\nconst GATE_MECHANISM = /plan mode|permissionMode: plan|`ask`|\\bask rule|pull[- ]request approval|PR approval|hook|exit 2/i;\n\nconst stripComments = (s) => s.replace(/\u003c!--[\\s\\S]*?-->/g, \"\");\nconst stripCode = (s) => s.replace(/`[^`\\n]*`/g, \"``\");\n\nexport function parseContract(markdown) {\n  const text = stripComments(markdown);\n  const title = (text.match(/^# Agent Contract:\\s*(.+?)\\s*$/m) || [])[1] || null;\n  const sections = [];\n  let current = null;\n  for (const line of text.split(\"\\n\")) {\n    const h = line.match(/^## (\\S.*?)\\s*$/);\n    if (h) { current = { name: h[1], lines: [] }; sections.push(current); continue; }\n    if (/^# /.test(line)) { current = null; continue; }\n    if (current) current.lines.push(line);\n  }\n  return { title, sections };\n}\n\nexport function validateContract(markdown, { template = false } = {}) {\n  const errors = [];\n  const warnings = [];\n  const { title, sections } = parseContract(markdown);\n  const names = sections.map((s) => s.name);\n\n  if (!title) errors.push('missing title line \"# Agent Contract: \u003cagent>\"');\n  else if (!template && !ROSTER.includes(title)) errors.push(`agent \"${title}\" is not in the roster (${ROSTER.join(\", \")})`);\n\n  for (const f of FIELDS) {\n    const n = names.filter((x) => x === f).length;\n    if (n === 0) errors.push(`missing section \"## ${f}\"`);\n    if (n > 1) errors.push(`section \"## ${f}\" appears ${n} times`);\n  }\n  const known = names.filter((x) => FIELDS.includes(x));\n  const expectedOrder = FIELDS.filter((f) => known.includes(f));\n  if (known.join() !== expectedOrder.join()) errors.push(`sections out of order: expected ${expectedOrder.join(\", \")}`);\n  for (const x of names) if (!FIELDS.includes(x)) warnings.push(`extra section \"## ${x}\" is not an agentContracts field`);\n\n  if (template) return { ok: errors.length === 0, errors, warnings };\n\n  for (const s of sections) {\n    if (!FIELDS.includes(s.name)) continue;\n    const body = s.lines.join(\"\\n\").trim();\n    const bullets = s.lines.filter((l) => /^- \\S/.test(l)).map((l) => l.slice(2).trim());\n    if (!body) { errors.push(`${s.name}: section is empty`); continue; }\n    if (/\u003c[a-z][^>\\n]*>/i.test(stripCode(body))) errors.push(`${s.name}: unreplaced \u003cplaceholder> text`);\n    if (LIST_FIELDS.has(s.name) && bullets.length === 0) errors.push(`${s.name}: needs at least one \"- \" bullet`);\n    if (!LIST_FIELDS.has(s.name) && bullets.length > 0) errors.push(`${s.name}: must be a paragraph, not a bullet list`);\n    if (s.name === \"must\" || s.name === \"mustNot\") {\n      bullets.forEach((b, i) => {\n        if (!ENFORCEMENT.test(b)) errors.push(`${s.name}[${i + 1}]: must end with [mechanism: ...] or [convention: ...]`);\n      });\n      const mech = bullets.filter((b) => /\\[mechanism:/.test(b)).length;\n      if (s.name === \"mustNot\" && bullets.length && mech === 0) warnings.push(\"mustNot: no rule is enforced by a mechanism; all are conventions\");\n    }\n    if (s.name === \"tools\") {\n      bullets.forEach((b) => {\n        const name = b.split(/[\\s(]/)[0];\n        if (!TOOLS.has(name) && !MCP_TOOL.test(name)) errors.push(`tools: \"${name}\" is not a Claude Code tool name`);\n      });\n    }\n    if (s.name === \"humanGate\" && !GATE_MECHANISM.test(body)) {\n      errors.push(\"humanGate: name the real mechanism (plan mode, a permission ask rule, PR approval, or a hook that exits 2)\");\n    }\n    if (s.name === \"handoffFormat\" && !body.includes(\".ai-sdlc/runs/\")) {\n      errors.push(\"handoffFormat: must name the run-folder path .ai-sdlc/runs/\u003crun-id>/NN-\u003cagent>.md\");\n    }\n  }\n  return { ok: errors.length === 0, errors, warnings };\n}\n\nexport function toAgentContract(markdown) {\n  const { title, sections } = parseContract(markdown);\n  const out = { agent: title };\n  for (const f of FIELDS) {\n    const s = sections.find((x) => x.name === f);\n    const lines = s ? s.lines : [];\n    out[f] = LIST_FIELDS.has(f)\n      ? lines.filter((l) => /^- \\S/.test(l)).map((l) => l.slice(2).trim())\n      : lines.join(\"\\n\").trim().replace(/\\s*\\n\\s*/g, \" \");\n  }\n  return out;\n}\n\nfunction main(argv) {\n  const template = argv.includes(\"--template\");\n  const json = argv.includes(\"--json\");\n  const files = argv.filter((a) => !a.startsWith(\"--\"));\n  if (files.length === 0) {\n    process.stderr.write(\"usage: validate-contract.mjs [--template] [--json] \u003ccontract.md> [...]\\n\");\n    return 2;\n  }\n  let failed = false;\n  for (const file of files) {\n    let md;\n    try { md = readFileSync(file, \"utf8\"); } catch (e) { process.stderr.write(`ERROR ${file}: ${e.message}\\n`); return 2; }\n    const r = validateContract(md, { template });\n    for (const w of r.warnings) process.stderr.write(`WARN  ${file}: ${w}\\n`);\n    for (const e of r.errors) process.stderr.write(`FAIL  ${file}: ${e}\\n`);\n    if (!r.ok) { failed = true; continue; }\n    if (json) process.stdout.write(JSON.stringify(toAgentContract(md), null, 2) + \"\\n\");\n    else process.stdout.write(`OK    ${file}: ${FIELDS.length}/${FIELDS.length} contract sections${template ? \" (template mode)\" : \"\"}\\n`);\n  }\n  return failed ? 1 : 0;\n}\n\nif (import.meta.url === `file://${process.argv[1]}`) process.exit(main(process.argv.slice(2)));\n","tag":"illustrative"},{"path":"AI-SDLC/docs/foundations/foundations.test.mjs","language":"javascript","content":"// Tests for the module 01-foundations scripts. Run from AI-SDLC/:\n//   node --test docs/foundations/foundations.test.mjs\nimport { test } from \"node:test\";\nimport assert from \"node:assert/strict\";\nimport { readFileSync } from \"node:fs\";\nimport { spawnSync } from \"node:child_process\";\nimport { dirname, join } from \"node:path\";\nimport { fileURLToPath } from \"node:url\";\nimport { validateContract, toAgentContract, FIELDS } from \"./validate-contract.mjs\";\nimport { parseKey, grade, PRIMITIVES } from \"./grade-classification.mjs\";\n\nconst HERE = dirname(fileURLToPath(import.meta.url));\nconst ROOT = join(HERE, \"..\", \"..\");\nconst draft = readFileSync(join(HERE, \"reviewer-contract-draft.md\"), \"utf8\");\nconst template = readFileSync(join(ROOT, \"agents\", \"CONTRACT_TEMPLATE.md\"), \"utf8\");\nconst keyMd = readFileSync(join(HERE, \"classification-answer-key.md\"), \"utf8\");\nconst run = (script, args) => spawnSync(process.execPath, [join(HERE, script), ...args], { encoding: \"utf8\" });\n\ntest(\"reviewer draft is a valid contract\", () => {\n  const r = validateContract(draft);\n  assert.deepEqual(r.errors, []);\n  assert.equal(r.ok, true);\n});\n\ntest(\"template passes template mode but fails as a filled contract\", () => {\n  assert.equal(validateContract(template, { template: true }).ok, true);\n  const r = validateContract(template);\n  assert.equal(r.ok, false);\n  assert.ok(r.errors.some((e) => e.includes(\"unreplaced \u003cplaceholder>\")));\n});\n\ntest(\"missing section is reported\", () => {\n  const r = validateContract(draft.replace(\"## humanGate\", \"## Human gate\"));\n  assert.ok(r.errors.includes('missing section \"## humanGate\"'));\n  assert.ok(r.warnings.some((w) => w.includes('\"## Human gate\"')));\n});\n\ntest(\"sections out of order are reported\", () => {\n  const swapped = draft.replace(\"## must\\n\", \"## TMP\\n\").replace(\"## mustNot\\n\", \"## must\\n\").replace(\"## TMP\\n\", \"## mustNot\\n\");\n  assert.ok(validateContract(swapped).errors.some((e) => e.startsWith(\"sections out of order\")));\n});\n\ntest(\"must rule without enforcement tag fails\", () => {\n  const bad = draft.replace(\"[convention: human reviewer reads the handoff]\", \"\");\n  assert.ok(validateContract(bad).errors.some((e) => /^must\\[3\\]/.test(e)));\n});\n\ntest(\"invented tool name fails\", () => {\n  const bad = draft.replace(\"- Glob\\n\", \"- CodeSearch\\n\");\n  assert.ok(validateContract(bad).errors.includes('tools: \"CodeSearch\" is not a Claude Code tool name'));\n});\n\ntest(\"MCP tool names are accepted\", () => {\n  const ok = draft.replace(\"- Glob\\n\", \"- Glob\\n- mcp__fhir-lite__search_observations\\n\");\n  assert.equal(validateContract(ok).ok, true);\n});\n\ntest(\"humanGate without a real mechanism fails\", () => {\n  const i = draft.indexOf(\"## humanGate\");\n  const bad = draft.slice(0, i) + \"## humanGate\\n\\nA senior engineer looks at the output when they have time.\\n\";\n  assert.ok(validateContract(bad).errors.some((e) => e.startsWith(\"humanGate:\")));\n});\n\ntest(\"agent outside the roster fails\", () => {\n  const bad = draft.replace(\"# Agent Contract: reviewer\", \"# Agent Contract: code-reviewer\");\n  assert.ok(validateContract(bad).errors.some((e) => e.includes(\"not in the roster\")));\n});\n\ntest(\"toAgentContract yields every schema field with the right types\", () => {\n  const c = toAgentContract(draft);\n  assert.deepEqual(Object.keys(c), [\"agent\", ...FIELDS]);\n  assert.equal(c.agent, \"reviewer\");\n  for (const f of [\"inputs\", \"outputs\", \"tools\", \"must\", \"mustNot\", \"failureConditions\"]) assert.ok(Array.isArray(c[f]) && c[f].length > 0, f);\n  for (const f of [\"purpose\", \"permissions\", \"validation\", \"handoffFormat\", \"humanGate\"]) assert.equal(typeof c[f], \"string\");\n  assert.deepEqual(c.tools, [\"Read\", \"Grep\", \"Glob\", \"Bash (only `git diff`, `git log`, `git status`)\"]);\n});\n\ntest(\"validator CLI exit codes: 0 valid, 1 invalid, 2 usage\", () => {\n  assert.equal(run(\"validate-contract.mjs\", [join(HERE, \"reviewer-contract-draft.md\")]).status, 0);\n  assert.equal(run(\"validate-contract.mjs\", [join(ROOT, \"agents\", \"CONTRACT_TEMPLATE.md\")]).status, 1);\n  assert.equal(run(\"validate-contract.mjs\", []).status, 2);\n});\n\ntest(\"answer key parses ten needs with valid primitives\", () => {\n  const key = parseKey(keyMd);\n  assert.equal(key.size, 10);\n  for (const k of key.values()) {\n    assert.ok(PRIMITIVES.includes(k.answer));\n    for (const a of k.accepted) assert.ok(PRIMITIVES.includes(a));\n  }\n  assert.equal(key.get(\"N01\").answer, \"hook\");\n  assert.deepEqual(key.get(\"N09\").accepted, [\"skill\"]);\n});\n\ntest(\"grader scores correct, accepted, wrong and missing answers\", () => {\n  const key = parseKey(keyMd);\n  const r = grade(key, { N01: \"hook\", N04: { answer: \"skill\", why: \"reuse\" }, N09: { answer: \"skill\", why: \"production-rca inside the sre agent\" } });\n  const by = Object.fromEntries(r.rows.map((x) => [x.id, x.verdict]));\n  assert.equal(by.N01, \"CORRECT\");\n  assert.equal(by.N04, \"WRONG\");\n  assert.equal(by.N09, \"ACCEPTED\");\n  assert.equal(by.N02, \"MISSING\");\n  assert.equal(r.score, 2);\n});\n\ntest(\"grader CLI passes the example answers at 8/10\", () => {\n  const r = run(\"grade-classification.mjs\", [join(HERE, \"example-answers.json\")]);\n  assert.equal(r.status, 0);\n  assert.match(r.stdout, /SCORE 8\\/10 \\(pass mark 8\\) PASS/);\n  assert.equal(run(\"grade-classification.mjs\", [join(HERE, \"example-answers.json\"), \"--pass\", \"9\"]).status, 1);\n});\n","tag":"illustrative"}],"exampleInput":"cd AI-SDLC\nnode docs/foundations/validate-contract.mjs --template agents/CONTRACT_TEMPLATE.md\nnode docs/foundations/validate-contract.mjs docs/foundations/reviewer-contract-draft.md   # first attempt\n# fix the reported lines, then:\nnode docs/foundations/validate-contract.mjs docs/foundations/reviewer-contract-draft.md\nnode docs/foundations/validate-contract.mjs --json docs/foundations/reviewer-contract-draft.md | jq '{agent, tools, humanGate}'","expectedOutput":"OK    agents/CONTRACT_TEMPLATE.md: 11/11 contract sections (template mode)\n\nFirst attempt (tool name invented, one must rule untagged, gate with no mechanism):\nFAIL  docs/foundations/reviewer-contract-draft.md: tools: \"CodeSearch\" is not a Claude Code tool name\nFAIL  docs/foundations/reviewer-contract-draft.md: must[3]: must end with [mechanism: ...] or [convention: ...]\nFAIL  docs/foundations/reviewer-contract-draft.md: humanGate: name the real mechanism (plan mode, a permission ask rule, PR approval, or a hook that exits 2)\n\nAfter fixing:\nOK    docs/foundations/reviewer-contract-draft.md: 11/11 contract sections\n{\n  \"agent\": \"reviewer\",\n  \"tools\": [\"Read\", \"Grep\", \"Glob\", \"Bash (only `git diff`, `git log`, `git status`)\"],\n  \"humanGate\": \"The reviewer is advisory; the gate is the human pull-request approval. Any `critical` or `high` finding blocks merge (review-standards), ...\"\n}","testCases":[{"name":"Filled contract validates","input":"node docs/foundations/validate-contract.mjs docs/foundations/reviewer-contract-draft.md; echo $?","expected":"`OK    docs/foundations/reviewer-contract-draft.md: 11/11 contract sections` then `0`"},{"name":"Unfilled template is rejected","input":"node docs/foundations/validate-contract.mjs agents/CONTRACT_TEMPLATE.md; echo $?","expected":"`FAIL ... agent \"\u003cagent-name>\" is not in the roster` plus one `unreplaced \u003cplaceholder> text` line per section, then `1`"},{"name":"Template headings match the schema","input":"grep -E '^## ' agents/CONTRACT_TEMPLATE.md | sed 's/## //' | paste -sd, -","expected":"purpose,inputs,outputs,tools,permissions,must,mustNot,failureConditions,validation,handoffFormat,humanGate"},{"name":"Every must/mustNot rule names its enforcement","input":"awk '/^## must$/,/^## failureConditions$/' docs/foundations/reviewer-contract-draft.md | grep '^- ' | grep -vcE '\\[(mechanism|convention):'","expected":"0"},{"name":"Boundaries are mechanisms, not only conventions","input":"awk '/^## mustNot$/,/^## failureConditions$/' docs/foundations/reviewer-contract-draft.md | grep -c '\\[mechanism:'","expected":"3 (no Edit/Write, no Agent, Bash limited to git)"},{"name":"Unit tests","input":"node --test docs/foundations/foundations.test.mjs","expected":"`# tests 14`, `# pass 14`, `# fail 0`"}],"evaluationCriteria":["All eleven fields filled; `validate-contract.mjs` exits 0 with no warnings.","`tools` and `permissions` agree: nothing in permissions grants a tool that `tools` omits.","At least the no-edit and no-delegation rules are enforced by mechanism (`tools`, `disallowedTools`), not by instruction.","The `permissionMode` caveat (ignored under `acceptEdits`, `auto`, `bypassPermissions` parents) is acknowledged with a backstop.","`failureConditions` cover empty diff, oversized diff, missing inputs, and a request to fix code.","`humanGate` names a real mechanism (PR approval, `ask` rule) and states that the reviewer never approves."],"improvements":["Fill the template for `tester` next; its `tools` include Edit and Write, so its `mustNot` must restrict *where* it writes (tests only) and say whether that is a mechanism or a convention.","Add a `--frontmatter` mode that prints the matching `.claude/agents/reviewer.md` frontmatter (`name`, `description`, `tools`, `disallowedTools`, `permissionMode`) from the contract, and diff it against the real file in module 05.","Run the validator over `agents/*/CONTRACT.md` in CI once module 05 has written them."]}],"agentContracts":[{"agent":"reviewer","purpose":"Review one diff of `sample-app/` against the team standards and return structured findings so a human reviewer can decide faster whether the change is mergeable. The reviewer covers correctness, design, readability, testing and standards; it flags security and performance concerns but defers deep analysis of them to the `security` and `sre` agents. It never changes code and never approves a change.","inputs":["Base ref to diff against, e.g. `main` (required, in the task message).","Run id, e.g. `2026-09-30-feat-observation-search` (required, in the task message; names the run folder).","Path of the upstream handoff that describes the intent of the change, e.g. `.ai-sdlc/runs/\u003crun-id>/04-developer.md` (optional; without it the reviewer reviews the diff on its own merits and says so).","Standards to apply: `context/standards/review-standards.md` and `context/standards/coding-standards.md` (always), `context/standards/testing-standards.md` when test files change."],"outputs":["Final message to the main session: the complete handoff document (YAML front matter plus the sections in handoffFormat). The orchestrator, which has Write access to the run folder, saves it as `.ai-sdlc/runs/\u003crun-id>/NN-reviewer.md`.","A findings table with one row per finding: `id | severity | category | location | evidence | recommendation`, severity from `critical | high | medium | low | info`.","An explicit \"no findings\" line for every category it checked and found clean."],"tools":["Read","Grep","Glob","Bash (only `git diff`, `git log`, `git status`)"],"permissions":"Frontmatter in `.claude/agents/reviewer.md`: `tools: Read, Grep, Glob, Bash` (an allowlist, so Edit, Write and Agent are not available) and `disallowedTools: Edit, Write, NotebookEdit` as a second guard, with `permissionMode: dontAsk`, which auto-denies any Bash command that is not pre-approved by the project rules in `.claude/settings.json` (`Bash(git diff *)`, `Bash(git status)`, `Bash(git log *)`). Caveat from the docs: a subagent's `permissionMode` is ignored when the parent session runs in `bypassPermissions`, `acceptEdits` or `auto`, so module 05 adds a `PreToolUse` hook in the agent's own `hooks` frontmatter that exits 2 for any Bash command outside `git diff|git log|git status`. The project `deny` rules (`Read(./.env)`, `Read(./**/secrets/**)`, `Read(./**/*.phi.*)`) apply to the reviewer like every other agent.","must":["Give every finding all six fields: id, severity, category, location as `path:line`, evidence quoted from the diff or file, recommendation. [convention: checked by the reviewer golden tasks in module 09-agent-evaluation]","Cite the standard violated as file plus rule number, e.g. `context/standards/coding-standards.md` rule 6. [convention: checked by the reviewer golden tasks]","State \"no findings\" for each category it checked and found clean. [convention: human reviewer reads the handoff]","Read the change with `git diff \u003cbase>...HEAD`, not from memory of an earlier conversation. [mechanism: subagents start with no conversation history; Bash is limited to git by `permissionMode: dontAsk` plus allow rules]","End with a handoff whose front matter has `run_id`, `step`, `agent: reviewer`, `status`, `inputs`, `next`. [mechanism: `.claude/hooks/check-handoff.mjs` in module 08 rejects a handoff with missing keys]"],"mustNot":["Edit, create or delete any file. [mechanism: Edit and Write are absent from `tools` and listed in `disallowedTools`]","Delegate to other agents. [mechanism: `Agent` is absent from `tools`, so the reviewer stays at depth 1]","Approve the change or write \"LGTM\", \"approved\" or \"ready to merge\". [convention: `context/standards/review-standards.md` says reviewers never approve; merge approval is a human PR approval]","Quote PHI in evidence (MRN values, names, birth dates, patient-linked observation values); quote code and synthetic fixtures such as `MRN-000123` only. [convention: `context/security/phi-and-secrets-policy.md`, re-checked by the security agent]","Report the marked `TEACHING-DEFECT(perf-n+1)` in `ObservationService.lastN` as a new finding. It may be mentioned as known, with a reference to `sample-app/docs/KNOWN_DEFECTS.md`. [convention: reviewer golden tasks include a case that checks this]","Run any shell command other than `git diff`, `git log` or `git status`. [mechanism: `permissionMode: dontAsk` with the project allow rules, backed by the agent-scoped `PreToolUse` hook from module 05]"],"failureConditions":["The diff against the base ref is empty or the base ref does not exist: return `status: blocked` with the exact `git` error.","The diff touches more than 40 files or 2,000 changed lines: return `status: needs-human` and ask for the change to be split.","A referenced standard file or upstream handoff path does not exist: return `status: needs-human` naming the missing path.","The change touches `config/SecurityConfig.java`, `audit/AuditLogger.java` or `db/migration/`: review it, but set `next: security` and say why.","The task asks the reviewer to fix the code: refuse, return `status: blocked` and recommend routing to `developer`.","The run hits `maxTurns` (the output is marked partial): return `status: blocked` rather than a partial finding list presented as complete."],"validation":"This contract is checked with `node docs/foundations/validate-contract.mjs docs/foundations/reviewer-contract-draft.md` (exit 0). Reviewer output is checked three ways: the handoff front matter by `.claude/hooks/check-handoff.mjs` (module 08); the findings against golden tasks in `evaluations/` (module 09), where a seeded diff that adds a repository call inside a loop must produce a `performance` finding citing coding-standards rule 6 and a seeded unchecked `isActive()` must produce a `correctness` finding citing glossary business rule 3; and a human spot-check that no finding lacks quoted evidence.","handoffFormat":"Markdown with YAML front matter as defined in `workflows/README.md` and the style guide: `run_id`, `step`, `agent: reviewer`, `status` (`complete | blocked | needs-human`), `inputs` (list of upstream handoff file names), `next` (`security`, `tester`, `developer` or `human`). Sections in order: `## Summary` (verdict in one sentence, counts per severity), `## Findings` (the six-column table), `## Decisions` (what was out of scope and why), `## Open questions`, `## Artifacts` (always \"none written; returned to main session\"). Saved by the orchestrator as `.ai-sdlc/runs/\u003crun-id>/NN-reviewer.md`.","humanGate":"The reviewer is advisory; the gate is the human pull-request approval. Any `critical` or `high` finding blocks merge (review-standards), and in an orchestrated run the orchestrator stops with `status: needs-human` until a person accepts or rejects each one. Nothing the reviewer produces can merge code: `git push` is an `ask` rule in `.claude/settings.json`, force-push is denied, and CLAUDE.md rule 7 leaves push, merge and deploy to a human."}],"checklist":["You can state, for a given job, whether it needs a different context, different tools or different authority, and therefore whether it is an agent.","`docs/foundations/anatomy-breakdown-reviewer.md` has twelve rows, each ending in Mechanism: or Convention:.","Every Claude Code field you cite exists in `build/CLAUDE_CODE_FACTS.md` (agent fields camelCase, skill fields hyphenated).","`node docs/foundations/grade-classification.mjs` scores your classification at 8/10 or better.","`agents/CONTRACT_TEMPLATE.md` has the eleven `## field` headings in schema order and passes `--template` validation.","`docs/foundations/reviewer-contract-draft.md` passes `validate-contract.mjs` with exit code 0.","Every `must` and `mustNot` rule in the reviewer draft is tagged `[mechanism: ...]` or `[convention: ...]`.","The reviewer draft omits `Agent`, `Edit` and `Write` from `tools`, and says why.","The `humanGate` field names a real mechanism, not \"someone looks at it\".","`node --test docs/foundations/foundations.test.mjs` reports 14 passing tests.","You know which parts of the reviewer contract module 05-agent-roster will finalise, and which module 09 will measure."]},{"id":"02-first-agent-skill-tools","level":2,"title":"Your First Agent, Skill, and Tools","summary":"Build and test the first working pieces of the AI-SDLC system: a reviewer subagent (kept as the v1 snapshot later modules improve and evaluate), an explain-endpoint skill that traces a FHIR-lite route from security rule to SQL, and a run-tests skill that runs Maven with pre-approved commands and a tested summary script. Then restrict an agent's tools and scope a PreToolUse hook to it, and test everything headless with claude -p.","prerequisites":["00-example","01-foundations","Claude Code CLI installed and authenticated (`claude --version`)","Java 21, Maven 3.9 and Node 22 on PATH; `cd AI-SDLC/sample-app && mvn -q -B test` passes","`jq` installed (used to read `--output-format json` results)"],"concepts":[{"heading":"Anatomy of a subagent file","body_md":"A subagent is **one Markdown file with YAML frontmatter**. Only two keys are required:\n\n- `name`: the identity (`reviewer`). The filename does not have to match, and subfolders do not change identity. Hooks see it as `agent_type`.\n- `description`: when Claude should delegate to it. The main session reads every description to decide routing, so write it as a trigger: *what* it does and *when* to use it (\"Reviews code changes in the sample app. Use after code changes.\").\n\nOptional keys you use in this module: `tools`, `disallowedTools`, `model` (`sonnet`, `opus`, `haiku`, `fable`, a full id, or `inherit`), `permissionMode`, `maxTurns`, `skills`, `hooks`. Multi-word keys are **camelCase** in subagent files. Unknown keys are **silently ignored**, so `allowed-tools:` (the skill spelling) or `max_turns:` in an agent file does nothing and raises no error. Check spelling against the docs table, not memory.\n\n### Where the file lives decides who gets it\n\nFor the same `name`, the higher entry wins: managed settings `.claude/agents/` > `--agents` JSON flag > project `.claude/agents/` (closest to the working directory) > `~/.claude/agents/` > plugin `agents/`. So in practice:\n\n- Team agents go in `AI-SDLC/.claude/agents/` and are reviewed like code.\n- `--agents '{...}'` is the **test harness**: it overrides a project agent for one session without touching the file.\n- A personal `~/.claude/agents/reviewer.md` is shadowed by the project's reviewer; that is usually what you want.\n\nNew files are hot-reloaded, with one exception: the first agent in a newly created `agents` directory needs a restart. This bites people on day one."},{"heading":"The body is the whole system prompt","body_md":"The Markdown body becomes the subagent's system prompt. It **replaces** the Claude Code system prompt rather than adding to it. At start-up a subagent receives only:\n\n1. its body,\n2. the task message the main session wrote when delegating,\n3. the CLAUDE.md hierarchy and git status,\n4. basic environment details (working directory),\n5. any skills listed in `skills:` (full content preloaded).\n\nIt does **not** get your conversation, the main session's output style or auto memory. Whatever the reviewer needs to know about *this* repository must come from CLAUDE.md, a preloaded skill, or files it reads.\n\n### Writing it\n\n- **Role and scope in the first line**: \"senior Java and Spring Boot reviewer for the FHIR-lite API in `sample-app/`\". Specialization is what makes a subagent better than the general-purpose one.\n- **A procedure**: numbered steps the agent can follow without guessing (run `git diff HEAD -- sample-app`, read changed files and their callers, check named standards).\n- **Repository awareness by path**: name `context/standards/review-standards.md` and `context/security/phi-and-secrets-policy.md` instead of pasting them. The agent reads them when needed; CLAUDE.md already imports the PHI policy.\n- **An output format** someone can parse. v1 in this module says \"report the problems you find\" and nothing more. That vagueness is deliberate: it gives module `09-agent-evaluation` a baseline to measure v2 against.\n\nEvery sentence in the body costs tokens on every turn of that agent. Put project facts all agents need in CLAUDE.md, and keep the body for role, procedure, and output."},{"heading":"Tool selection: allowlist, denylist, inheritance","body_md":"`tools` is an **allowlist**. If you **omit** it, the subagent inherits every tool available to subagents, including MCP tools from the main session. That is what reviewer v1 does, and it means a \"reviewer\" can Edit, Write and run any Bash command the permission rules allow.\n\n`disallowedTools` is a **denylist** removed from the inherited or listed set. Two consequences:\n\n- `disallowedTools: Edit, Write, NotebookEdit` on an otherwise inheriting agent keeps new MCP tools flowing in automatically. Convenient, but you no longer know the agent's full tool set by reading the file.\n- A specifier does not narrow a tool: `disallowedTools: Bash(git push *)` removes **all** of Bash. You cannot scope Bash to some commands from the tool list.\n\nRules of thumb for this course:\n\n| Agent kind | Use |\n|---|---|\n| Read-only (reviewer, security, architect) | explicit `tools: Read, Grep, Glob` plus `Bash` only if a hook or permission rules narrow it |\n| Writes code (developer, tester) | explicit `tools` including `Edit, Write, Bash` |\n| Must not delegate | leave `Agent` out of `tools` (roster agents stay at depth 1) |\n\nTo narrow Bash, combine `tools: ..., Bash` with a `PreToolUse` hook in the agent's own frontmatter (exit code 2 blocks) and `permissions.allow` rules in `.claude/settings.json` (`Bash(git diff *)`). The tool list says *which* tools; hooks and permission rules say *which calls*."},{"heading":"Permissions: permissionMode and the parent's mode","body_md":"A subagent can declare `permissionMode`: `default`, `acceptEdits`, `plan`, `auto`, `dontAsk` or `bypassPermissions`. For a read-only reviewer, `dontAsk` is attractive: anything that would prompt is denied automatically, and commands allowed by `permissions.allow` (for example `Bash(git diff *)` in `AI-SDLC/.claude/settings.json`) still run. No one has to sit at the terminal answering prompts for a background review.\n\nBut the docs are explicit that the **parent's mode wins in three cases**: a subagent's `permissionMode` is ignored when the parent session runs in `bypassPermissions`, `acceptEdits` or `auto`, and a subagent cannot escalate to `bypassPermissions` unless the parent already is. Recent versions start new terminal sessions in `auto`, so in practice your `dontAsk` line is often not in effect.\n\nThat is why this module layers controls:\n\n1. `tools` removes what the agent can never use (no Edit, no Write).\n2. The subagent-scoped `PreToolUse` hook in the agent's frontmatter runs whatever mode the parent is in; `reviewer-bash-guard.mjs` exits 2 for anything except `git diff/log/show/status`.\n3. `permissions.deny` in settings (`Read(./.env)`, `Bash(rm -rf *)`) applies everywhere.\n4. `permissionMode` is the last, best-effort layer.\n\nFor headless tests, `claude -p ... --permission-mode plan` makes the whole run read-only. Use it when testing an agent that still inherits Edit and Write, like v1."},{"heading":"Context injection: CLAUDE.md, preloaded skills, and !`cmd`","body_md":"Three ways to get repository knowledge into an agent or skill **before** it starts working:\n\n- **CLAUDE.md**: loaded for every subagent (except the built-in Explore and Plan). Put rules and commands here. `AI-SDLC/CLAUDE.md` already tells every agent the test command and the no-PHI rule.\n- **`skills:` in agent frontmatter**: the listed skills' full content is injected at start-up. Module 05 gives the tester and developer `skills: [run-tests]`. A skill with `disable-model-invocation: true` cannot be preloaded, which is why run-tests leaves it at the default.\n- **`` !`command` `` in a SKILL.md body**: the command runs when the skill is invoked and its output replaces the placeholder before Claude sees the prompt. `explain-endpoint` injects the current route map from a `grep` over the controllers; `run-tests` injects the invocation time and `git status --short -- sample-app`.\n\nInjection has sharp edges:\n\n- A **non-zero exit aborts the whole skill** (except exit 1 from search or compare commands such as `grep`). Never inject `mvn test`: it exits 1 exactly when a test fails.\n- The command is **checked against permission rules**; if it is not allowed, invocation aborts outside auto mode. Pre-approve it in the skill's `allowed-tools` (`Bash(grep *)`, `Bash(date *)`).\n- `allowed-tools` **pre-approves** while the skill is active; it does not restrict. Use `disallowed-tools` to remove tools.\n\nArguments: `$ARGUMENTS` is the full argument string, `$0` the first word, `$1` the second. `argument-hint` shows in autocomplete. Supporting files (`reference.md`, `scripts/`) sit next to SKILL.md; the body links them and Claude reads or runs them only when needed."},{"heading":"Testing and iterating headless","body_md":"An agent is code you cannot unit-test directly, so you test its behaviour on fixed inputs. The fixed inputs in this module are two labelled patches under `docs/tutorials/level-2/patches/` (they are exercise inputs, not app changes). The runner is `claude -p`:\n\n| Flag | Why |\n|---|---|\n| `--output-format json` | one JSON object with `result`, `subtype`, `is_error`, `num_turns`, `total_cost_usd`, `session_id`, `usage` |\n| `--max-turns 10` | caps the loop; hitting it gives `subtype: error_max_turns` |\n| `--permission-mode plan` | read-only run, safe for agents that still inherit Edit/Write |\n| `--agent reviewer` | run the agent as the main thread (its body replaces the system prompt) |\n| `--agents '{\"reviewer\": {...}}'` | define or override an agent for one session without editing files |\n| `--output-format stream-json --verbose` | every message, so you can see the `Agent` tool call that delegated |\n\nIn `-p` mode a user-invoked skill runs by putting `/run-tests SecurityTest` in the prompt.\n\nThe iteration loop: change **one** thing, re-run the same command on the same patch, compare `result`, `num_turns` and `total_cost_usd`, and write the change and observation into the iteration log in `docs/tutorials/level-2/README.md`. Anything that does not need a model is tested without one: `summarize-surefire.mjs` and `reviewer-bash-guard.mjs` each ship a `node --test` suite, and hooks can be exercised by piping hook JSON into them and checking the exit code.\n\nNo API key? Everything except the `claude -p` lines still runs: the Maven tests, both script suites, the hook simulation, and every `grep`/`git` test case below."}],"diagrams":[{"title":"Which reviewer definition wins","mermaid":"flowchart TD\n  Q[\"Delegation to name: reviewer\"] --> M{\"Managed .claude/agents/ has it?\"}\n  M -->|\"yes\"| MW[\"Use managed definition\"]\n  M -->|\"no\"| C{\"--agents JSON has it?\"}\n  C -->|\"yes\"| CW[\"Use CLI definition (this session)\"]\n  C -->|\"no\"| P{\"Project .claude/agents/ has it?\"}\n  P -->|\"yes\"| PW[\"Use AI-SDLC/.claude/agents/reviewer.md\"]\n  P -->|\"no\"| U{\"~/.claude/agents/ has it?\"}\n  U -->|\"yes\"| UW[\"Use personal definition\"]\n  U -->|\"no\"| PL[\"Plugin agents (namespaced plugin:reviewer)\"]"},{"title":"What happens when /run-tests SecurityTest is invoked","mermaid":"sequenceDiagram\n  participant U as Engineer\n  participant CC as Claude Code\n  participant SH as Shell\n  participant CL as Claude\n  U->>CC: /run-tests SecurityTest\n  CC->>SH: !date and !git status (pre-approved by allowed-tools)\n  SH-->>CC: timestamp and changed files\n  CC->>CL: SKILL.md body with injections and $ARGUMENTS filled in\n  CL->>SH: mvn -q -B test -f sample-app/pom.xml -Dtest=SecurityTest\n  SH-->>CL: exit 1 plus log noise (not quoted)\n  CL->>SH: node summarize-surefire.mjs --since timestamp\n  SH-->>CL: compact summary: 1 failed at SecurityTest.java:33\n  CL-->>U: summary, failure analysis, verdict NOT READY"},{"title":"Layers a reviewer Bash call passes through","mermaid":"flowchart LR\n  A[\"Reviewer wants: mvn -q -B test\"] --> T{\"Bash in tools?\"}\n  T -->|\"no\"| X1[\"Tool not available\"]\n  T -->|\"yes\"| H{\"Subagent PreToolUse hook\"}\n  H -->|\"exit 2\"| X2[\"Blocked, stderr shown to agent\"]\n  H -->|\"exit 0\"| R{\"permissions deny / ask / allow\"}\n  R -->|\"deny\"| X3[\"Denied\"]\n  R -->|\"allow\"| OK[\"Runs\"]\n  R -->|\"would prompt\"| MD{\"Effective mode\"}\n  MD -->|\"dontAsk\"| X4[\"Auto-denied\"]\n  MD -->|\"default\"| PR[\"Prompt the human\"]"}],"comparisonTables":[{"title":"Controls for what an agent may do","columns":["Control","Where","Granularity","Survives parent auto/acceptEdits/bypass?","Use it for"],"rows":[["`tools` allowlist","Subagent frontmatter","Whole tools","Yes","Read-only agents: `Read, Grep, Glob`"],["`disallowedTools`","Subagent frontmatter","Whole tools (a specifier still removes the whole tool)","Yes","Inherit everything except Edit/Write"],["`permissionMode`","Subagent frontmatter","Whole session behaviour","No: ignored under `bypassPermissions`, `acceptEdits`, `auto`","`dontAsk` for unattended read-only agents"],["`hooks` (`PreToolUse`)","Subagent frontmatter","Individual calls (inspect `tool_input`)","Yes","Narrow Bash to `git diff/log/show/status`"],["`permissions.allow/ask/deny`","`.claude/settings.json`","Individual calls by rule (`Bash(git diff *)`)","Deny rules yes","Project-wide guardrails"],["Skill `allowed-tools`","SKILL.md frontmatter","Rules, while the skill is active","Not a restriction at all","Pre-approving `mvn -q -B test *` for /run-tests"]]},{"title":"Subagent or skill?","columns":["Question","Subagent (`.claude/agents/`)","Skill (`.claude/skills/`)"],"rows":[["Context","Fresh context: body, task message, CLAUDE.md, git status, preloaded skills","Runs in the current conversation (unless `context: fork`)"],["Invocation","Delegation by description, `@agent-reviewer`, `--agent`","`/explain-endpoint ...` or auto-load by description"],["Tool control","`tools`, `disallowedTools`, `permissionMode`, `hooks`","`allowed-tools` (pre-approve), `disallowed-tools` (remove), `hooks`"],["Key spelling","camelCase (`disallowedTools`, `maxTurns`)","hyphenated (`allowed-tools`, `argument-hint`) plus `when_to_use`"],["Best for","A role with its own judgement and tool boundary (reviewer)","A repeatable procedure (explain an endpoint, run tests)"],["In this module","`reviewer-v1.md`, `reviewer-v1-restricted.md`","`explain-endpoint`, `run-tests`"]]}],"exercises":[{"id":"02-first-agent-reviewer-v1","title":"Create reviewer v1 and test it headless","objective":"Write the first subagent, a deliberately simple `reviewer` with only `name`, `description`, `model` and a short body, install it at `.claude/agents/reviewer.md`, and prove with `claude -p` that the main session delegates to it and that it finds the two labelled defects in a patch. Keep the file unchanged as `evaluations/agent-versions/reviewer-v1.md`: module 05 builds v2 and module 09 compares the two.","startingFiles":[{"path":"AI-SDLC/docs/tutorials/level-2/patches/02-review-exercise.patch","content":"diff --git a/sample-app/src/main/java/org/example/fhir/service/PatientService.java b/sample-app/src/main/java/org/example/fhir/service/PatientService.java\nindex 51685a0..31eae2b 100644\n--- a/sample-app/src/main/java/org/example/fhir/service/PatientService.java\n+++ b/sample-app/src/main/java/org/example/fhir/service/PatientService.java\n@@ -6,12 +6,16 @@ import org.example.fhir.audit.AuditLogger.Action;\n import org.example.fhir.domain.Patient;\n import org.example.fhir.error.FhirApiException;\n import org.example.fhir.repository.PatientRepository;\n+import org.slf4j.Logger;\n+import org.slf4j.LoggerFactory;\n import org.springframework.stereotype.Service;\n import org.springframework.transaction.annotation.Transactional;\n \n @Service\n public class PatientService {\n \n+    private static final Logger log = LoggerFactory.getLogger(PatientService.class);\n+\n     private final PatientRepository patients;\n     private final AuditLogger audit;\n \n@@ -24,6 +28,7 @@ public class PatientService {\n     public Patient get(Long id) {\n         Patient patient = patients.findById(id).orElseThrow(() -> FhirApiException.notFound(\"Patient\", id));\n         audit.record(Action.READ, \"Patient\", id);\n+        log.info(\"Loaded patient {} {} (MRN {})\", patient.getGivenNames(), patient.getFamilyName(), patient.getMrn());\n         return patient;\n     }\n \n@@ -33,7 +38,8 @@ public class PatientService {\n         boolean hasFamily = family != null && !family.isBlank();\n         boolean hasMrn = mrn != null && !mrn.isBlank();\n         if (!hasFamily && !hasMrn) {\n-            throw FhirApiException.badRequest(\"At least one search parameter (family, identifier) is required\");\n+            // No criteria: return everyone so the UI can show a full patient list\n+            return patients.findAll();\n         }\n         List\u003cPatient> result;\n         if (hasMrn) {\n"}],"requiredStructure":"AI-SDLC/\n├── .claude/agents/reviewer.md                    # copy of v1 for this exercise\n├── evaluations/agent-versions/reviewer-v1.md     # frozen v1 snapshot (name: reviewer)\n├── docs/tutorials/level-2/patches/02-review-exercise.patch\n└── .ai-sdlc/runs/level-2/review-v1.json          # headless result (git-ignored)","implementation":[{"path":"AI-SDLC/evaluations/agent-versions/reviewer-v1.md","language":"markdown","content":"---\nname: reviewer\ndescription: Reviews code changes in the sample app. Use after code changes.\nmodel: inherit\n---\n\nYou are a senior Java and Spring Boot code reviewer for the FHIR-lite API in `sample-app/`.\n\nWhen invoked:\n\n1. Run `git diff` to see what changed. If there is no diff, review the files the task mentions.\n2. Read the changed files and enough surrounding code to understand them.\n3. Check the change for bugs, security problems, missing tests, and anything that breaks the project rules in CLAUDE.md.\n\nReport the problems you find, starting with the most important, and suggest how to fix each one. Keep the review concise.\n","tag":"verified-format"},{"path":"AI-SDLC/docs/tutorials/level-2/patches/02-review-exercise.patch","language":"diff","content":"diff --git a/sample-app/src/main/java/org/example/fhir/service/PatientService.java b/sample-app/src/main/java/org/example/fhir/service/PatientService.java\nindex 51685a0..31eae2b 100644\n--- a/sample-app/src/main/java/org/example/fhir/service/PatientService.java\n+++ b/sample-app/src/main/java/org/example/fhir/service/PatientService.java\n@@ -6,12 +6,16 @@ import org.example.fhir.audit.AuditLogger.Action;\n import org.example.fhir.domain.Patient;\n import org.example.fhir.error.FhirApiException;\n import org.example.fhir.repository.PatientRepository;\n+import org.slf4j.Logger;\n+import org.slf4j.LoggerFactory;\n import org.springframework.stereotype.Service;\n import org.springframework.transaction.annotation.Transactional;\n \n @Service\n public class PatientService {\n \n+    private static final Logger log = LoggerFactory.getLogger(PatientService.class);\n+\n     private final PatientRepository patients;\n     private final AuditLogger audit;\n \n@@ -24,6 +28,7 @@ public class PatientService {\n     public Patient get(Long id) {\n         Patient patient = patients.findById(id).orElseThrow(() -> FhirApiException.notFound(\"Patient\", id));\n         audit.record(Action.READ, \"Patient\", id);\n+        log.info(\"Loaded patient {} {} (MRN {})\", patient.getGivenNames(), patient.getFamilyName(), patient.getMrn());\n         return patient;\n     }\n \n@@ -33,7 +38,8 @@ public class PatientService {\n         boolean hasFamily = family != null && !family.isBlank();\n         boolean hasMrn = mrn != null && !mrn.isBlank();\n         if (!hasFamily && !hasMrn) {\n-            throw FhirApiException.badRequest(\"At least one search parameter (family, identifier) is required\");\n+            // No criteria: return everyone so the UI can show a full patient list\n+            return patients.findAll();\n         }\n         List\u003cPatient> result;\n         if (hasMrn) {\n","tag":"illustrative"}],"exampleInput":"cd AI-SDLC\nmkdir -p .claude/agents .ai-sdlc/runs/level-2\ncp evaluations/agent-versions/reviewer-v1.md .claude/agents/reviewer.md\ngit apply docs/tutorials/level-2/patches/02-review-exercise.patch\nclaude -p \"Use the reviewer subagent to review the uncommitted changes in sample-app.\" \\\n  --permission-mode plan --max-turns 10 --output-format json > .ai-sdlc/runs/level-2/review-v1.json\njq -r '.result' .ai-sdlc/runs/level-2/review-v1.json","expectedOutput":"The reviewer found two problems in `PatientService.java`, both serious:\n\n1. **PHI written to the application log.** `get()` now logs the patient's given names, family name and MRN:\n   `log.info(\"Loaded patient {} {} (MRN {})\", patient.getGivenNames(), patient.getFamilyName(), patient.getMrn());`\n   This breaks rule 1 in CLAUDE.md (never put PHI in logs). `AuditLogger.record(Action.READ, \"Patient\", id)` already records the access with the id only. Remove the line (and the unused `Logger`).\n\n2. **Search without criteria now returns every patient.** In `search()` the 400 guard was replaced by `return patients.findAll();`. That is an unbounded listing of PHI, it skips `audit.recordSearch`, and it contradicts the architecture overview (\"Patient search without parameters returns 400\"). The existing test `PatientApiTest.searchWithoutParametersIs400` will fail. Restore `throw FhirApiException.badRequest(...)`.\n\nNo other changes in the diff.","testCases":[{"name":"Frontmatter has exactly the v1 keys","input":"sed -n '1,5p' AI-SDLC/evaluations/agent-versions/reviewer-v1.md","expected":"---\nname: reviewer\ndescription: Reviews code changes in the sample app. Use after code changes.\nmodel: inherit\n---"},{"name":"v1 is deliberately broad: no tools line","input":"grep -c '^tools:' AI-SDLC/evaluations/agent-versions/reviewer-v1.md","expected":"0 (the agent inherits every tool; exercise 02-restrict-tools-and-hook narrows it)"},{"name":"Installed copy is identical","input":"cmp AI-SDLC/evaluations/agent-versions/reviewer-v1.md AI-SDLC/.claude/agents/reviewer.md && echo same","expected":"same"},{"name":"Patch applies and breaks exactly one test","input":"cd AI-SDLC && git apply --check docs/tutorials/level-2/patches/02-review-exercise.patch && git apply docs/tutorials/level-2/patches/02-review-exercise.patch && (cd sample-app && mvn -q -B test 2>&1 | grep 'Tests run: 25')","expected":"[ERROR] Tests run: 25, Failures: 1, Errors: 0, Skipped: 0 (the failing test is PatientApiTest.searchWithoutParametersIs400:76, Status expected:\u003c400> but was:\u003c200>)"},{"name":"Delegation really happened","input":"claude -p \"Use the reviewer subagent to review the uncommitted changes in sample-app.\" --permission-mode plan --max-turns 10 --output-format stream-json --verbose | jq -r 'select(.type==\"assistant\") | .message.content[]? | select(.type==\"tool_use\" and .name==\"Agent\") | .input.subagent_type'","expected":"reviewer"},{"name":"Run finished inside the turn budget","input":"jq '{subtype, is_error, num_turns}' AI-SDLC/.ai-sdlc/runs/level-2/review-v1.json","expected":"\"subtype\": \"success\", \"is_error\": false, num_turns at most 10"},{"name":"Both defects reported","input":"jq -r '.result' AI-SDLC/.ai-sdlc/runs/level-2/review-v1.json | grep -iE 'MRN|PHI' && jq -r '.result' AI-SDLC/.ai-sdlc/runs/level-2/review-v1.json | grep -E 'findAll|every patient|all patients'","expected":"At least one matching line from each grep."},{"name":"Plan mode kept it read-only","input":"cd AI-SDLC && git diff --stat","expected":"Only `sample-app/src/main/java/org/example/fhir/service/PatientService.java | 8 +++++++-` (the patch itself); no other file changed."}],"evaluationCriteria":["`description` states what the agent does and when to delegate to it.","The body is a system prompt: role, numbered procedure, and where to look (`git diff`, CLAUDE.md), with no conversation-style text.","v1 is valid but naive on purpose: no `tools` line and no structured output format. Do not improve the snapshot; improvements go in later versions.","The headless command uses only documented flags (`-p`, `--permission-mode`, `--max-turns`, `--output-format`).","The learner can explain why the output (prose, no severity, no `path:line`) is hard to evaluate automatically."],"improvements":["Run the same command three times and diff the `result` fields: note how much v1's wording and ordering vary. This is the baseline noise module 09 measures.","Override the project agent for one run without editing files: `claude -p ... --agents '{\"reviewer\": {\"description\": \"Reviews code changes in the sample app.\", \"prompt\": \"You are a reviewer. Reply with findings only.\", \"tools\": [\"Read\", \"Grep\", \"Glob\"]}}'`.","Add `color: blue` so the reviewer is easy to spot in an interactive session."]},{"id":"02-explain-endpoint-skill","title":"Write the explain-endpoint skill","objective":"Create `.claude/skills/explain-endpoint/` with a SKILL.md that takes the endpoint as `$ARGUMENTS`, shows an `argument-hint`, injects the current route map with a pre-approved `!` command, and links a `reference.md` supporting file. Invoke it on `GET /fhir/Observation/$lastn` and check that the answer traces controller, service, repository, SQL, security, errors, audit and tests with real `path:line` citations, including the two SQL statements per subject of the teaching defect.","startingFiles":[],"requiredStructure":"AI-SDLC/.claude/skills/explain-endpoint/\n├── SKILL.md       # name, description, when_to_use, argument-hint, allowed-tools; $ARGUMENTS; !`grep ...` route map\n└── reference.md   # repository map + Spring Data method -> SQL table (observed with show-sql)","implementation":[{"path":"AI-SDLC/.claude/skills/explain-endpoint/SKILL.md","language":"markdown","content":"---\nname: explain-endpoint\ndescription: Explain one sample-app HTTP endpoint end to end (security rule, controller, mapper, service, repository, SQL, error paths, audit logging, covering tests) with file:line citations. Read-only.\nwhen_to_use: When someone asks how an endpoint works, what SQL it runs, who may call it, what errors it returns, or where to change it, for any /fhir/Patient or /fhir/Observation route.\nargument-hint: \"\u003cMETHOD> \u003cpath>, e.g. GET /fhir/Patient/{id}\"\nallowed-tools:\n  - Read\n  - Grep\n  - Glob\n  - Bash(grep *)\n---\n\n# Explain a sample-app endpoint\n\nEndpoint to explain: **$ARGUMENTS**\n\nIf no endpoint was given, list the routes below and ask which one to explain. Do not guess.\n\nCurrent route map (generated from the controllers when this skill was invoked):\n\n!`grep -rnE \"@(Get|Post|Put|Delete|Request)Mapping\" sample-app/src/main/java/org/example/fhir/api`\n\nA class-level `@RequestMapping` is the path prefix for every method mapping in the same file. Match the requested method and path against this map. If nothing matches, say so and show the closest routes.\n\n## Procedure\n\nRead [reference.md](reference.md) first: it says where each concern lives in this repository and how Spring Data method names become SQL. Then trace the request in this order, reading each file rather than assuming:\n\n1. **Security**: the matching `requestMatchers` rule in `SecurityConfig.securityFilterChain` (roles required, what an anonymous or wrong-role caller receives).\n2. **Controller**: the handler method, its parameters (`@PathVariable`, `@RequestParam`, `@Valid @RequestBody`) and any parsing it does itself.\n3. **Mapper**: the `PatientMapper` / `ObservationMapper` calls that convert between the DTO record and the JPA entity.\n4. **Service**: the method called, its `@Transactional` setting, business-rule checks and every `FhirApiException` it can throw.\n5. **Repository**: each repository method used and the SQL it produces (derived query rules in reference.md; tables and indexes from `sample-app/src/main/resources/db/migration/V1__init.sql`). Count the statements per request; say whether the count depends on input size.\n6. **Errors**: each HTTP status the endpoint can return, and the exact line that produces it (service exception, Bean Validation via `GlobalExceptionHandler`, or the security entry point).\n7. **Audit and PHI**: which `AuditLogger` call records the access, and confirm that no PHI field (see `context/domain/fhir-lite-glossary.md`) reaches a log line or an `OperationOutcome` diagnostic.\n8. **Tests**: the test methods in `sample-app/src/test/java/org/example/fhir/` that call this endpoint, and which of success, 4xx, 401 and 403 are not covered.\n\n## Output format\n\n```markdown\n## \u003cMETHOD> \u003cpath>\nOne-paragraph summary: what it does and for whom.\n\n### Request flow\n| Step | Layer | Location (path:line) | What happens |\n|---|---|---|---|\n\n### SQL\nNumbered list of statements with the table and index each one uses, and the statement count per request.\n\n### Responses\n| Status | When | Produced at (path:line) |\n|---|---|---|\n\n### Audit and PHI\n### Test coverage\n### Notes and risks\n```\n\nRules:\n- Every row cites a real `path:line` you read in this session.\n- Quote code only as short fragments; never paste whole files.\n- Mention a marked `TEACHING-DEFECT` if the path runs through one, but do not propose a fix unless asked.\n- Do not edit files. Do not run the application or the tests.\n","tag":"verified-format"},{"path":"AI-SDLC/.claude/skills/explain-endpoint/reference.md","language":"markdown","content":"# explain-endpoint reference: where things live in sample-app\n\nAll Java paths are under `sample-app/src/main/java/org/example/fhir/`.\n\n## Map of concerns\n\n| Concern | File | What to look for |\n|---|---|---|\n| Who may call it | `config/SecurityConfig.java` | `authorizeHttpRequests` rules are evaluated top to bottom; the first matching `requestMatchers` wins. `DELETE /fhir/**` needs `ADMIN`; other `/fhir/**` need `CLINICIAN` or `ADMIN`; `/actuator/health/**` is public; everything else is `denyAll`. |\n| 401 and 403 bodies | `config/SecurityConfig.java` | The `unauthorized` entry point (401, issue code `login`) and the `accessDeniedHandler` (403, issue code `forbidden`) both write an `OperationOutcome`. |\n| Routes and parameters | `api/PatientController.java`, `api/ObservationController.java` | Class-level `@RequestMapping` prefix plus the method mapping. Note any string parsing done in the controller (for example FHIR token syntax `system\\|value`). |\n| DTO and entity conversion | `api/PatientMapper.java`, `api/ObservationMapper.java` | `toResource`, `toEntity`, and `ObservationMapper.parseSubject` (accepts `Patient/{id}` or a bare id, 400 otherwise). |\n| Request validation | `api/PatientResource.java`, `api/ObservationResource.java` | Bean Validation annotations on the records. Failures become 422 in `GlobalExceptionHandler.handleValidation`. |\n| Business rules, transactions | `service/PatientService.java`, `service/ObservationService.java` | `@Transactional(readOnly = true)` on reads; `FhirApiException.notFound / badRequest / unprocessable / conflict`. |\n| Error mapping | `error/GlobalExceptionHandler.java`, `error/FhirApiException.java` | Status and issue code per exception type. |\n| Data access | `repository/PatientRepository.java`, `repository/ObservationRepository.java` | Spring Data derived queries; the inherited `JpaRepository` methods (`findById`, `existsById`, `save`, `deleteById`, `findAll`). |\n| Schema and indexes | `src/main/resources/db/migration/V1__init.sql` (under `sample-app/`) | Tables `patient`, `observation`; `uq_patient_mrn`, `ix_patient_family_name`, `ix_observation_patient_code (patient_id, code)`; `ON DELETE CASCADE` from observation to patient. |\n| Audit | `audit/AuditLogger.java` | `record(Action, type, id)` and `recordSearch(type, count)`; ids and counts only. |\n| Tests | `sample-app/src/test/java/org/example/fhir/` | `PatientApiTest`, `ObservationApiTest`, `SecurityTest`; helpers in `ApiTestSupport`. |\n| Known defect | `sample-app/docs/KNOWN_DEFECTS.md` | `TEACHING-DEFECT(perf-n+1)` in `ObservationService.lastN`. |\n\n## From Spring Data method names to SQL\n\nHibernate 6 generates the SQL. These are the statements observed with `-Dspring.jpa.show-sql=true` on the test profile (H2 in PostgreSQL mode); PostgreSQL gets the same shape.\n\n| Repository call | SQL shape |\n|---|---|\n| `findById(id)` | `select \u003call patient columns> from patient p1_0 where p1_0.id=?` |\n| `existsById(id)` | `select count(*) from patient p1_0 where p1_0.id=?` |\n| `existsByMrn(mrn)` | `select p1_0.id from patient p1_0 where p1_0.mrn=? fetch first ? rows only` (uses `uq_patient_mrn`) |\n| `findByMrn(mrn)` | `select \u003call patient columns> from patient p1_0 where p1_0.mrn=?` |\n| `findByFamilyNameIgnoreCaseOrderByIdAsc(f)` | `select \u003call patient columns> from patient p1_0 where upper(p1_0.family_name)=upper(?) order by p1_0.id` (the `upper()` call means a plain index on `family_name` is not used) |\n| `findByPatientIdOrderByEffectiveDateTimeDesc(id)` | `select \u003cobservation columns> from observation o1_0 join patient p1_0 on p1_0.id=o1_0.patient_id where p1_0.id=? order by o1_0.effective_date_time desc` |\n| `findByPatientIdAndCodeOrderByEffectiveDateTimeDesc(id, code)` | same join, plus `and o1_0.code=?` (can use `ix_observation_patient_code`) |\n| `save(entity)` new | `insert into patient (...) values (?,...,default)` (identity column) |\n| dirty entity at commit (`PatientService.update`) | `update patient set active=?,birth_date=?,... where id=?` (no explicit `save` call) |\n| `deleteById(id)` | `select \u003call patient columns> ... where p1_0.id=?`, then `delete from patient where id=?`; observations go through the database `ON DELETE CASCADE` |\n\nA human can confirm the statements for one endpoint by running its test with SQL logging, for example:\n\n```bash\ncd sample-app\nmvn -q -B test -Dtest='ObservationApiTest#lastnReturnsMostRecentObservationPerSubject' -Dspring.jpa.show-sql=true | grep '^Hibernate:'\n```\n\n## Counting statements\n\nCount per request, not per test. Say explicitly when the count grows with input (a loop over ids that calls a repository), because that is an N+1 pattern and violates rule 6 of `context/standards/coding-standards.md`.\n","tag":"illustrative"}],"exampleInput":"cd AI-SDLC\nclaude -p '/explain-endpoint GET /fhir/Observation/$lastn' --permission-mode plan --max-turns 15 --output-format json | jq -r '.result'","expectedOutput":"## GET /fhir/Observation/$lastn\nReturns a searchset Bundle with the most recent Observation per requested subject, optionally filtered by LOINC code. Any authenticated CLINICIAN or ADMIN may call it.\n\n### Request flow\n| Step | Layer | Location (path:line) | What happens |\n|---|---|---|---|\n| 1 | Security | sample-app/src/main/java/org/example/fhir/config/SecurityConfig.java:44 | `.requestMatchers(\"/fhir/**\").hasAnyRole(CLINICIAN, ADMIN)` |\n| 2 | Controller | sample-app/src/main/java/org/example/fhir/api/ObservationController.java:42 | `@GetMapping(\"/$lastn\")`, binds `@RequestParam List\u003cLong> subjects`, optional `code` |\n| 3 | Controller | ObservationController.java:44 | strips an optional `system|` prefix: `code.substring(code.indexOf('|') + 1)` |\n| 4 | Service | sample-app/src/main/java/org/example/fhir/service/ObservationService.java:61 | `@Transactional(readOnly = true)` `lastN(subjectIds, code)` |\n| 5 | Service | ObservationService.java:69-75 | loop per subject: `patients.findById`, then `findByPatientIdOrderByEffectiveDateTimeDesc`, keep the first matching row (marked `TEACHING-DEFECT(perf-n+1)` at line 64) |\n| 6 | Mapper | ObservationController.java:45 | `ObservationMapper::toResource`, wrapped by `Bundle.searchset` |\n\n### SQL\n1. `select ... from patient p1_0 where p1_0.id=?` (primary key)\n2. `select ... from observation o1_0 join patient p1_0 on p1_0.id=o1_0.patient_id where p1_0.id=? order by o1_0.effective_date_time desc` (can use `ix_observation_patient_code` via `patient_id`; the sort is not indexed)\n\nStatements per request: 2 x number of subjects. 500 subjects means about 1000 round trips, and each second query loads the patient's full history to keep one row.\n\n### Responses\n| Status | When | Produced at (path:line) |\n|---|---|---|\n| 200 | Bundle, possibly empty; unknown subject ids are silently skipped (`ifPresent`) | ObservationService.java:70 |\n| 400 | `subjects` missing | GlobalExceptionHandler.java:44 (`handleMissingParam`) |\n| 400 | a subject id is not a number | GlobalExceptionHandler.java:49 (`handleTypeMismatch`) |\n| 401 | no or wrong credentials | SecurityConfig.java:34 (`unauthorized` entry point, issue code `login`) |\n\n403 is not reachable with the two configured users: both have CLINICIAN.\n\n### Audit and PHI\n`audit.recordSearch(\"Observation\", result.size())` at ObservationService.java:76 logs a count only. No PHI in logs or diagnostics.\n\n### Test coverage\n`ObservationApiTest.lastnReturnsMostRecentObservationPerSubject` (ObservationApiTest.java:80) covers the success path. Not covered: missing `subjects` (400), non-numeric id (400), anonymous call (401), `code` filter.\n\n### Notes and risks\n- N+1 teaching defect, see sample-app/docs/KNOWN_DEFECTS.md (not fixed here, as instructed).\n- No cap on the number of `subjects`.","testCases":[{"name":"Skill frontmatter uses hyphenated skill keys","input":"sed -n '1,12p' AI-SDLC/.claude/skills/explain-endpoint/SKILL.md | grep -E '^(name|description|when_to_use|argument-hint|allowed-tools):'","expected":"Five lines: name, description, when_to_use, argument-hint, allowed-tools. No camelCase keys such as allowedTools."},{"name":"Arguments and injection present","input":"grep -nE '\\$ARGUMENTS|^!`grep' AI-SDLC/.claude/skills/explain-endpoint/SKILL.md","expected":"One line with `**$ARGUMENTS**` and one line starting with !`grep -rnE \"@(Get|Post|Put|Delete|Request)Mapping\""},{"name":"Injected command works and is pre-approved","input":"cd AI-SDLC && grep -rnE \"@(Get|Post|Put|Delete|Request)Mapping\" sample-app/src/main/java/org/example/fhir/api | wc -l && grep -c 'Bash(grep \\*)' .claude/skills/explain-endpoint/SKILL.md","expected":"11 (2 class-level prefixes + 9 routes), then 1"},{"name":"Supporting file is linked","input":"grep -c '\\[reference.md\\](reference.md)' AI-SDLC/.claude/skills/explain-endpoint/SKILL.md","expected":"1"},{"name":"Reference SQL matches Hibernate","input":"cd AI-SDLC/sample-app && mvn -q -B test -Dtest='ObservationApiTest#lastnReturnsMostRecentObservationPerSubject' -Dspring.jpa.show-sql=true | grep -c 'from observation o1_0 join patient p1_0 on p1_0.id=o1_0.patient_id where p1_0.id=? order by o1_0.effective_date_time desc'","expected":"2 (one per subject in the test: the N+1 pattern the skill must report)"},{"name":"Answer cites real locations","input":"The exampleInput command, piped to grep -E 'ObservationService.java:(6[0-9]|7[0-9])|SecurityConfig.java:4[34]'","expected":"At least two matching lines; the loop (lines 69-75) and the `/fhir/**` security rule are cited."},{"name":"Skill stays read-only","input":"cd AI-SDLC && git status --short","expected":"No changes after running the skill."}],"evaluationCriteria":["The description says what the skill does and when to use it, so auto-invocation works for questions like \"what SQL does patient search run?\".","Every injected command is safe to fail (grep exit 1 is tolerated) and is pre-approved in `allowed-tools`.","The output format forces `path:line` citations and a statement count.","Long reference material lives in `reference.md`, not in SKILL.md.","The skill never edits files and does not propose fixing the teaching defect unless asked."],"improvements":["Add `paths: [\"sample-app/src/main/java/**\"]` so the skill auto-activates only when Claude works on the Java sources.","Add a named argument (`arguments: [method, path]`) and use `$method` and `$path` in the body instead of `$ARGUMENTS`.","Run it with `context: fork` and `agent: Explore` to keep the trace out of the main context, and compare the answer quality (Explore does not load CLAUDE.md)."]},{"id":"02-run-tests-skill","title":"Give the agent a tool: the run-tests skill","objective":"Build `/run-tests [TestClass | TestClass#method]`: pre-approve exactly the Maven, Node, `date` and `git status` commands it needs with `allowed-tools`, inject the invocation time and changed files with `!`, and turn Surefire's XML reports into a compact summary with a tested zero-dependency script. Use it to catch a labelled regression that lets clinicians delete patients.","startingFiles":[{"path":"AI-SDLC/docs/tutorials/level-2/patches/02-clinician-delete-regression.patch","content":"diff --git a/sample-app/src/main/java/org/example/fhir/config/SecurityConfig.java b/sample-app/src/main/java/org/example/fhir/config/SecurityConfig.java\nindex c31d018..689ac00 100644\n--- a/sample-app/src/main/java/org/example/fhir/config/SecurityConfig.java\n+++ b/sample-app/src/main/java/org/example/fhir/config/SecurityConfig.java\n@@ -40,7 +40,7 @@ public class SecurityConfig {\n             .sessionManagement(s -> s.sessionCreationPolicy(SessionCreationPolicy.STATELESS))\n             .authorizeHttpRequests(auth -> auth\n                 .requestMatchers(\"/actuator/health/**\", \"/actuator/info\").permitAll()\n-                .requestMatchers(HttpMethod.DELETE, \"/fhir/**\").hasRole(ADMIN)\n+                .requestMatchers(HttpMethod.DELETE, \"/fhir/**\").hasAnyRole(CLINICIAN, ADMIN)\n                 .requestMatchers(\"/fhir/**\").hasAnyRole(CLINICIAN, ADMIN)\n                 .anyRequest().denyAll())\n             .httpBasic(basic -> basic.authenticationEntryPoint(unauthorized))\n"}],"requiredStructure":"AI-SDLC/.claude/skills/run-tests/\n├── SKILL.md                              # allowed-tools list, !`date`, !`git status`, $ARGUMENTS validation, output format\n└── scripts/\n    ├── summarize-surefire.mjs            # TEST-*.xml -> Markdown summary; --since, --strict; exit 0/1/2\n    └── summarize-surefire.test.mjs       # node --test suite (6 tests)","implementation":[{"path":"AI-SDLC/.claude/skills/run-tests/SKILL.md","language":"markdown","content":"---\nname: run-tests\ndescription: Run the sample-app Maven test suite (or one test class or method) and report a compact pass/fail summary with each failing test, its assertion message and the failing line. Use after any change under sample-app/ and before reporting a task complete.\nwhen_to_use: When asked to run tests, check whether the build is green, verify a fix, or investigate a failing JUnit test in sample-app.\nargument-hint: \"[TestClass | TestClass#method]\"\nallowed-tools:\n  - Bash(mvn -q -B test)\n  - Bash(mvn -q -B test *)\n  - Bash(node .claude/skills/run-tests/scripts/summarize-surefire.mjs *)\n  - Bash(date *)\n  - Bash(git status *)\n---\n\n# Run the sample-app tests\n\nContext captured when this skill was invoked:\n\n- Invoked at (UTC): !`date -u +%Y-%m-%dT%H:%M:%SZ`\n- Uncommitted changes under `sample-app/` (empty means none):\n\n!`git status --short -- sample-app`\n\nRequested selection: \"$ARGUMENTS\" (empty means the whole suite).\n\n## Procedure\n\n1. **Validate the selection.** It must be empty or match `^[A-Za-z0-9_#*,]+$` (for example `SecurityTest` or `PatientApiTest#duplicateMrnIs409`). If it contains anything else (spaces, quotes, `;`, `$`, `|`, `&`, `/`), stop and reply that the argument was rejected. Never pass it to the shell.\n2. **Run Maven exactly once**, from the project root, with one of:\n   - whole suite: `mvn -q -B test -f sample-app/pom.xml`\n   - selection: `mvn -q -B test -f sample-app/pom.xml -Dtest=\u003cselection>`\n\n   Maven exits non-zero when a test fails. That is expected; continue to step 3. Do not paste Maven's console output into your answer: it is hundreds of lines of Spring and `AUDIT` log lines.\n3. **Summarize the reports** with the bundled script, passing the invocation time above so reports left over from an earlier run are ignored:\n\n   `node .claude/skills/run-tests/scripts/summarize-surefire.mjs sample-app/target/surefire-reports --since \u003cInvoked at value>`\n\n4. **If the summary says `NO REPORTS`**, the build failed before tests ran. Quote the first `[ERROR]` lines from the Maven output of step 2 (compilation error, unknown test pattern, dependency problem) and stop. Do not guess at test results.\n5. **For each failing test**, read the test method at the `at:` line and the production code it exercises (controller, service, `SecurityConfig`, `GlobalExceptionHandler`). Write one sentence on the likely cause and label it a hypothesis. Cite `path:line`.\n6. **Do not edit any file.** This skill reports; fixing is a separate, explicit request.\n\n## Output format\n\nReply with exactly these sections:\n\n```markdown\n\u003cthe script's summary block, unchanged>\n\n### Failure analysis\n| Test | Assertion | Likely cause (hypothesis) | Code to look at |\n|---|---|---|---|\n\n### Verdict\nREADY (all tests pass) | NOT READY (\u003cn> failing, \u003cn> errors)\n```\n\nOmit the Failure analysis table when everything passes. Never include patient names, MRNs, birth dates or observation values in the reply, even if a test fixture contains synthetic ones: refer to tests by class and method name.\n","tag":"verified-format"},{"path":"AI-SDLC/.claude/skills/run-tests/scripts/summarize-surefire.mjs","language":"javascript","content":"#!/usr/bin/env node\n// Summarize Maven Surefire XML reports into a compact Markdown block for an agent's context.\n//\n// Usage:\n//   node .claude/skills/run-tests/scripts/summarize-surefire.mjs [reportsDir] [--since \u003cISO-8601 time>] [--strict]\n//\n//   reportsDir  default: sample-app/target/surefire-reports (relative to the current directory)\n//   --since     ignore report files last modified before this time (drops stale reports left\n//               over from an earlier run, e.g. after running a single test class)\n//   --strict    exit 1 when any test failed or errored (for CI); default exit 0 so the summary\n//               is always delivered to the caller\n//\n// Exit codes: 0 summary printed; 1 tests failed (only with --strict); 2 no usable reports found.\n//\n// Deliberately never prints \u003csystem-out>/\u003csystem-err>: test logs can contain request data, and\n// the summary is meant to be pa
