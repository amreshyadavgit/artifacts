or `status: needs-human` instead of guessing>\n\n## validation\n\n\u003cOne paragraph: how anyone can check an output is acceptable: a command that exits 0, a golden task in evaluations/, a hook, a checklist a human applies.>\n\n## handoffFormat\n\n\u003cOne paragraph: the handoff file path (`.ai-sdlc/runs/\u003crun-id>/NN-\u003cagent-name>.md`), its YAML front matter keys (`run_id`, `step`, `agent`, `status`, `inputs`, `next`), and the required sections.>\n\n## humanGate\n\n\u003cOne paragraph: where a human must approve before the work continues, and the real mechanism that stops the work until they do (plan mode, a permission `ask` rule, PR approval, a hook that exits 2).>\n","tag":"illustrative"},{"path":"AI-SDLC/docs/foundations/reviewer-contract-draft.md","language":"markdown","content":"# Agent Contract: reviewer\n\n\u003c!--\nWorked example for module 01-foundations. This is a DRAFT filled in from agents/CONTRACT_TEMPLATE.md.\nModule 05-agent-roster finalises it as agents/reviewer/CONTRACT.md and ships the runtime definition\n.claude/agents/reviewer.md. Module 02 builds a simpler first version (evaluations/agent-versions/reviewer-v1.md).\n-->\n\nStatus: draft\nOwner: Platform engineering (AI-SDLC maintainers)\nRuntime definition: `.claude/agents/reviewer.md`\nFinalised in: 05-agent-roster\n\n## purpose\n\nReview one diff of `sample-app/` against the team standards and return structured findings so a human reviewer can decide faster whether the change is mergeable. The reviewer covers correctness, design, readability, testing and standards; it flags security and performance concerns but defers deep analysis of them to the `security` and `sre` agents. It never changes code and never approves a change.\n\n## inputs\n\n- Base ref to diff against, e.g. `main` (required, in the task message).\n- Run id, e.g. `2026-09-30-feat-observation-search` (required, in the task message; names the run folder).\n- Path of the upstream handoff that describes the intent of the change, e.g. `.ai-sdlc/runs/\u003crun-id>/04-developer.md` (optional; without it the reviewer reviews the diff on its own merits and says so).\n- Standards to apply: `context/standards/review-standards.md` and `context/standards/coding-standards.md` (always), `context/standards/testing-standards.md` when test files change.\n\n## outputs\n\n- Final message to the main session: the complete handoff document (YAML front matter plus the sections in handoffFormat). The orchestrator, which has Write access to the run folder, saves it as `.ai-sdlc/runs/\u003crun-id>/NN-reviewer.md`.\n- A findings table with one row per finding: `id | severity | category | location | evidence | recommendation`, severity from `critical | high | medium | low | info`.\n- An explicit \"no findings\" line for every category it checked and found clean.\n\n## tools\n\n- Read\n- Grep\n- Glob\n- Bash (only `git diff`, `git log`, `git status`)\n\n## permissions\n\nFrontmatter in `.claude/agents/reviewer.md`: `tools: Read, Grep, Glob, Bash` (an allowlist, so Edit, Write and Agent are not available) and `disallowedTools: Edit, Write, NotebookEdit` as a second guard, with `permissionMode: dontAsk`, which auto-denies any Bash command that is not pre-approved by the project rules in `.claude/settings.json` (`Bash(git diff *)`, `Bash(git status)`, `Bash(git log *)`). Caveat from the docs: a subagent's `permissionMode` is ignored when the parent session runs in `bypassPermissions`, `acceptEdits` or `auto`, so module 05 adds a `PreToolUse` hook in the agent's own `hooks` frontmatter that exits 2 for any Bash command outside `git diff|git log|git status`. The project `deny` rules (`Read(./.env)`, `Read(./**/secrets/**)`, `Read(./**/*.phi.*)`) apply to the reviewer like every other agent.\n\n## must\n\n- Give every finding all six fields: id, severity, category, location as `path:line`, evidence quoted from the diff or file, recommendation. [convention: checked by the reviewer golden tasks in module 09-agent-evaluation]\n- Cite the standard violated as file plus rule number, e.g. `context/standards/coding-standards.md` rule 6. [convention: checked by the reviewer golden tasks]\n- State \"no findings\" for each category it checked and found clean. [convention: human reviewer reads the handoff]\n- Read the change with `git diff \u003cbase>...HEAD`, not from memory of an earlier conversation. [mechanism: subagents start with no conversation history; Bash is limited to git by `permissionMode: dontAsk` plus allow rules]\n- End with a handoff whose front matter has `run_id`, `step`, `agent: reviewer`, `status`, `inputs`, `next`. [mechanism: `.claude/hooks/check-handoff.mjs` in module 08 rejects a handoff with missing keys]\n\n## mustNot\n\n- Edit, create or delete any file. [mechanism: Edit and Write are absent from `tools` and listed in `disallowedTools`]\n- Delegate to other agents. [mechanism: `Agent` is absent from `tools`, so the reviewer stays at depth 1]\n- Approve the change or write \"LGTM\", \"approved\" or \"ready to merge\". [convention: `context/standards/review-standards.md` says reviewers never approve; merge approval is a human PR approval]\n- Quote PHI in evidence (MRN values, names, birth dates, patient-linked observation values); quote code and synthetic fixtures such as `MRN-000123` only. [convention: `context/security/phi-and-secrets-policy.md`, re-checked by the security agent]\n- Report the marked `TEACHING-DEFECT(perf-n+1)` in `ObservationService.lastN` as a new finding. It may be mentioned as known, with a reference to `sample-app/docs/KNOWN_DEFECTS.md`. [convention: reviewer golden tasks include a case that checks this]\n- Run any shell command other than `git diff`, `git log` or `git status`. [mechanism: `permissionMode: dontAsk` with the project allow rules, backed by the agent-scoped `PreToolUse` hook from module 05]\n\n## failureConditions\n\n- The diff against the base ref is empty or the base ref does not exist: return `status: blocked` with the exact `git` error.\n- The diff touches more than 40 files or 2,000 changed lines: return `status: needs-human` and ask for the change to be split.\n- A referenced standard file or upstream handoff path does not exist: return `status: needs-human` naming the missing path.\n- The change touches `config/SecurityConfig.java`, `audit/AuditLogger.java` or `db/migration/`: review it, but set `next: security` and say why.\n- The task asks the reviewer to fix the code: refuse, return `status: blocked` and recommend routing to `developer`.\n- The run hits `maxTurns` (the output is marked partial): return `status: blocked` rather than a partial finding list presented as complete.\n\n## validation\n\nThis contract is checked with `node docs/foundations/validate-contract.mjs docs/foundations/reviewer-contract-draft.md` (exit 0). Reviewer output is checked three ways: the handoff front matter by `.claude/hooks/check-handoff.mjs` (module 08); the findings against golden tasks in `evaluations/` (module 09), where a seeded diff that adds a repository call inside a loop must produce a `performance` finding citing coding-standards rule 6 and a seeded unchecked `isActive()` must produce a `correctness` finding citing glossary business rule 3; and a human spot-check that no finding lacks quoted evidence.\n\n## handoffFormat\n\nMarkdown with YAML front matter as defined in `workflows/README.md` and the style guide: `run_id`, `step`, `agent: reviewer`, `status` (`complete | blocked | needs-human`), `inputs` (list of upstream handoff file names), `next` (`security`, `tester`, `developer` or `human`). Sections in order: `## Summary` (verdict in one sentence, counts per severity), `## Findings` (the six-column table), `## Decisions` (what was out of scope and why), `## Open questions`, `## Artifacts` (always \"none written; returned to main session\"). Saved by the orchestrator as `.ai-sdlc/runs/\u003crun-id>/NN-reviewer.md`.\n\n## humanGate\n\nThe reviewer is advisory; the gate is the human pull-request approval. Any `critical` or `high` finding blocks merge (review-standards), and in an orchestrated run the orchestrator stops with `status: needs-human` until a person accepts or rejects each one. Nothing the reviewer produces can merge code: `git push` is an `ask` rule in `.claude/settings.json`, force-push is denied, and CLAUDE.md rule 7 leaves push, merge and deploy to a human.\n","tag":"illustrative"},{"path":"AI-SDLC/docs/foundations/validate-contract.mjs","language":"javascript","content":"#!/usr/bin/env node\n// Validate an Agent Contract markdown file (course convention; see agents/CONTRACT_TEMPLATE.md).\n// Zero dependencies, Node 22.\n//\n// Usage:\n//   node docs/foundations/validate-contract.mjs \u003ccontract.md> [more.md ...]   validate filled contracts\n//   node docs/foundations/validate-contract.mjs --template agents/CONTRACT_TEMPLATE.md   headings only\n//   node docs/foundations/validate-contract.mjs --json \u003ccontract.md>   print the agentContracts JSON object\n// Exit codes: 0 valid, 1 invalid, 2 usage or I/O error.\nimport { readFileSync } from \"node:fs\";\n\nexport const FIELDS = [\n  \"purpose\", \"inputs\", \"outputs\", \"tools\", \"permissions\", \"must\", \"mustNot\",\n  \"failureConditions\", \"validation\", \"handoffFormat\", \"humanGate\",\n];\nexport const LIST_FIELDS = new Set([\"inputs\", \"outputs\", \"tools\", \"must\", \"mustNot\", \"failureConditions\"]);\nexport const ROSTER = [\"architect\", \"developer\", \"reviewer\", \"tester\", \"security\", \"sre\", \"orchestrator\"];\n// Built-in tool names as Claude Code spells them (build/CLAUDE_CODE_FACTS.md section 1), plus MCP tools.\nconst TOOLS = new Set([\n  \"Read\", \"Grep\", \"Glob\", \"LSP\", \"Bash\", \"PowerShell\", \"Edit\", \"Write\", \"NotebookEdit\", \"WebFetch\",\n  \"WebSearch\", \"TodoWrite\", \"Skill\", \"ToolSearch\", \"EnterWorktree\", \"ExitWorktree\", \"Monitor\",\n  \"TaskStop\", \"SendMessage\", \"Agent\",\n]);\nconst MCP_TOOL = /^mcp__[A-Za-z0-9_-]+(__[A-Za-z0-9_*-]+)?$/;\nconst ENFORCEMENT = /\\[(mechanism|convention):\\s*[^\\]]+\\]\\s*$/;\nconst GATE_MECHANISM = /plan mode|permissionMode: plan|`ask`|\\bask rule|pull[- ]request approval|PR approval|hook|exit 2/i;\n\nconst stripComments = (s) => s.replace(/\u003c!--[\\s\\S]*?-->/g, \"\");\nconst stripCode = (s) => s.replace(/`[^`\\n]*`/g, \"``\");\n\nexport function parseContract(markdown) {\n  const text = stripComments(markdown);\n  const title = (text.match(/^# Agent Contract:\\s*(.+?)\\s*$/m) || [])[1] || null;\n  const sections = [];\n  let current = null;\n  for (const line of text.split(\"\\n\")) {\n    const h = line.match(/^## (\\S.*?)\\s*$/);\n    if (h) { current = { name: h[1], lines: [] }; sections.push(current); continue; }\n    if (/^# /.test(line)) { current = null; continue; }\n    if (current) current.lines.push(line);\n  }\n  return { title, sections };\n}\n\nexport function validateContract(markdown, { template = false } = {}) {\n  const errors = [];\n  const warnings = [];\n  const { title, sections } = parseContract(markdown);\n  const names = sections.map((s) => s.name);\n\n  if (!title) errors.push('missing title line \"# Agent Contract: \u003cagent>\"');\n  else if (!template && !ROSTER.includes(title)) errors.push(`agent \"${title}\" is not in the roster (${ROSTER.join(\", \")})`);\n\n  for (const f of FIELDS) {\n    const n = names.filter((x) => x === f).length;\n    if (n === 0) errors.push(`missing section \"## ${f}\"`);\n    if (n > 1) errors.push(`section \"## ${f}\" appears ${n} times`);\n  }\n  const known = names.filter((x) => FIELDS.includes(x));\n  const expectedOrder = FIELDS.filter((f) => known.includes(f));\n  if (known.join() !== expectedOrder.join()) errors.push(`sections out of order: expected ${expectedOrder.join(\", \")}`);\n  for (const x of names) if (!FIELDS.includes(x)) warnings.push(`extra section \"## ${x}\" is not an agentContracts field`);\n\n  if (template) return { ok: errors.length === 0, errors, warnings };\n\n  for (const s of sections) {\n    if (!FIELDS.includes(s.name)) continue;\n    const body = s.lines.join(\"\\n\").trim();\n    const bullets = s.lines.filter((l) => /^- \\S/.test(l)).map((l) => l.slice(2).trim());\n    if (!body) { errors.push(`${s.name}: section is empty`); continue; }\n    if (/\u003c[a-z][^>\\n]*>/i.test(stripCode(body))) errors.push(`${s.name}: unreplaced \u003cplaceholder> text`);\n    if (LIST_FIELDS.has(s.name) && bullets.length === 0) errors.push(`${s.name}: needs at least one \"- \" bullet`);\n    if (!LIST_FIELDS.has(s.name) && bullets.length > 0) errors.push(`${s.name}: must be a paragraph, not a bullet list`);\n    if (s.name === \"must\" || s.name === \"mustNot\") {\n      bullets.forEach((b, i) => {\n        if (!ENFORCEMENT.test(b)) errors.push(`${s.name}[${i + 1}]: must end with [mechanism: ...] or [convention: ...]`);\n      });\n      const mech = bullets.filter((b) => /\\[mechanism:/.test(b)).length;\n      if (s.name === \"mustNot\" && bullets.length && mech === 0) warnings.push(\"mustNot: no rule is enforced by a mechanism; all are conventions\");\n    }\n    if (s.name === \"tools\") {\n      bullets.forEach((b) => {\n        const name = b.split(/[\\s(]/)[0];\n        if (!TOOLS.has(name) && !MCP_TOOL.test(name)) errors.push(`tools: \"${name}\" is not a Claude Code tool name`);\n      });\n    }\n    if (s.name === \"humanGate\" && !GATE_MECHANISM.test(body)) {\n      errors.push(\"humanGate: name the real mechanism (plan mode, a permission ask rule, PR approval, or a hook that exits 2)\");\n    }\n    if (s.name === \"handoffFormat\" && !body.includes(\".ai-sdlc/runs/\")) {\n      errors.push(\"handoffFormat: must name the run-folder path .ai-sdlc/runs/\u003crun-id>/NN-\u003cagent>.md\");\n    }\n  }\n  return { ok: errors.length === 0, errors, warnings };\n}\n\nexport function toAgentContract(markdown) {\n  const { title, sections } = parseContract(markdown);\n  const out = { agent: title };\n  for (const f of FIELDS) {\n    const s = sections.find((x) => x.name === f);\n    const lines = s ? s.lines : [];\n    out[f] = LIST_FIELDS.has(f)\n      ? lines.filter((l) => /^- \\S/.test(l)).map((l) => l.slice(2).trim())\n      : lines.join(\"\\n\").trim().replace(/\\s*\\n\\s*/g, \" \");\n  }\n  return out;\n}\n\nfunction main(argv) {\n  const template = argv.includes(\"--template\");\n  const json = argv.includes(\"--json\");\n  const files = argv.filter((a) => !a.startsWith(\"--\"));\n  if (files.length === 0) {\n    process.stderr.write(\"usage: validate-contract.mjs [--template] [--json] \u003ccontract.md> [...]\\n\");\n    return 2;\n  }\n  let failed = false;\n  for (const file of files) {\n    let md;\n    try { md = readFileSync(file, \"utf8\"); } catch (e) { process.stderr.write(`ERROR ${file}: ${e.message}\\n`); return 2; }\n    const r = validateContract(md, { template });\n    for (const w of r.warnings) process.stderr.write(`WARN  ${file}: ${w}\\n`);\n    for (const e of r.errors) process.stderr.write(`FAIL  ${file}: ${e}\\n`);\n    if (!r.ok) { failed = true; continue; }\n    if (json) process.stdout.write(JSON.stringify(toAgentContract(md), null, 2) + \"\\n\");\n    else process.stdout.write(`OK    ${file}: ${FIELDS.length}/${FIELDS.length} contract sections${template ? \" (template mode)\" : \"\"}\\n`);\n  }\n  return failed ? 1 : 0;\n}\n\nif (import.meta.url === `file://${process.argv[1]}`) process.exit(main(process.argv.slice(2)));\n","tag":"illustrative"},{"path":"AI-SDLC/docs/foundations/foundations.test.mjs","language":"javascript","content":"// Tests for the module 01-foundations scripts. Run from AI-SDLC/:\n//   node --test docs/foundations/foundations.test.mjs\nimport { test } from \"node:test\";\nimport assert from \"node:assert/strict\";\nimport { readFileSync } from \"node:fs\";\nimport { spawnSync } from \"node:child_process\";\nimport { dirname, join } from \"node:path\";\nimport { fileURLToPath } from \"node:url\";\nimport { validateContract, toAgentContract, FIELDS } from \"./validate-contract.mjs\";\nimport { parseKey, grade, PRIMITIVES } from \"./grade-classification.mjs\";\n\nconst HERE = dirname(fileURLToPath(import.meta.url));\nconst ROOT = join(HERE, \"..\", \"..\");\nconst draft = readFileSync(join(HERE, \"reviewer-contract-draft.md\"), \"utf8\");\nconst template = readFileSync(join(ROOT, \"agents\", \"CONTRACT_TEMPLATE.md\"), \"utf8\");\nconst keyMd = readFileSync(join(HERE, \"classification-answer-key.md\"), \"utf8\");\nconst run = (script, args) => spawnSync(process.execPath, [join(HERE, script), ...args], { encoding: \"utf8\" });\n\ntest(\"reviewer draft is a valid contract\", () => {\n  const r = validateContract(draft);\n  assert.deepEqual(r.errors, []);\n  assert.equal(r.ok, true);\n});\n\ntest(\"template passes template mode but fails as a filled contract\", () => {\n  assert.equal(validateContract(template, { template: true }).ok, true);\n  const r = validateContract(template);\n  assert.equal(r.ok, false);\n  assert.ok(r.errors.some((e) => e.includes(\"unreplaced \u003cplaceholder>\")));\n});\n\ntest(\"missing section is reported\", () => {\n  const r = validateContract(draft.replace(\"## humanGate\", \"## Human gate\"));\n  assert.ok(r.errors.includes('missing section \"## humanGate\"'));\n  assert.ok(r.warnings.some((w) => w.includes('\"## Human gate\"')));\n});\n\ntest(\"sections out of order are reported\", () => {\n  const swapped = draft.replace(\"## must\\n\", \"## TMP\\n\").replace(\"## mustNot\\n\", \"## must\\n\").replace(\"## TMP\\n\", \"## mustNot\\n\");\n  assert.ok(validateContract(swapped).errors.some((e) => e.startsWith(\"sections out of order\")));\n});\n\ntest(\"must rule without enforcement tag fails\", () => {\n  const bad = draft.replace(\"[convention: human reviewer reads the handoff]\", \"\");\n  assert.ok(validateContract(bad).errors.some((e) => /^must\\[3\\]/.test(e)));\n});\n\ntest(\"invented tool name fails\", () => {\n  const bad = draft.replace(\"- Glob\\n\", \"- CodeSearch\\n\");\n  assert.ok(validateContract(bad).errors.includes('tools: \"CodeSearch\" is not a Claude Code tool name'));\n});\n\ntest(\"MCP tool names are accepted\", () => {\n  const ok = draft.replace(\"- Glob\\n\", \"- Glob\\n- mcp__fhir-lite__search_observations\\n\");\n  assert.equal(validateContract(ok).ok, true);\n});\n\ntest(\"humanGate without a real mechanism fails\", () => {\n  const i = draft.indexOf(\"## humanGate\");\n  const bad = draft.slice(0, i) + \"## humanGate\\n\\nA senior engineer looks at the output when they have time.\\n\";\n  assert.ok(validateContract(bad).errors.some((e) => e.startsWith(\"humanGate:\")));\n});\n\ntest(\"agent outside the roster fails\", () => {\n  const bad = draft.replace(\"# Agent Contract: reviewer\", \"# Agent Contract: code-reviewer\");\n  assert.ok(validateContract(bad).errors.some((e) => e.includes(\"not in the roster\")));\n});\n\ntest(\"toAgentContract yields every schema field with the right types\", () => {\n  const c = toAgentContract(draft);\n  assert.deepEqual(Object.keys(c), [\"agent\", ...FIELDS]);\n  assert.equal(c.agent, \"reviewer\");\n  for (const f of [\"inputs\", \"outputs\", \"tools\", \"must\", \"mustNot\", \"failureConditions\"]) assert.ok(Array.isArray(c[f]) && c[f].length > 0, f);\n  for (const f of [\"purpose\", \"permissions\", \"validation\", \"handoffFormat\", \"humanGate\"]) assert.equal(typeof c[f], \"string\");\n  assert.deepEqual(c.tools, [\"Read\", \"Grep\", \"Glob\", \"Bash (only `git diff`, `git log`, `git status`)\"]);\n});\n\ntest(\"validator CLI exit codes: 0 valid, 1 invalid, 2 usage\", () => {\n  assert.equal(run(\"validate-contract.mjs\", [join(HERE, \"reviewer-contract-draft.md\")]).status, 0);\n  assert.equal(run(\"validate-contract.mjs\", [join(ROOT, \"agents\", \"CONTRACT_TEMPLATE.md\")]).status, 1);\n  assert.equal(run(\"validate-contract.mjs\", []).status, 2);\n});\n\ntest(\"answer key parses ten needs with valid primitives\", () => {\n  const key = parseKey(keyMd);\n  assert.equal(key.size, 10);\n  for (const k of key.values()) {\n    assert.ok(PRIMITIVES.includes(k.answer));\n    for (const a of k.accepted) assert.ok(PRIMITIVES.includes(a));\n  }\n  assert.equal(key.get(\"N01\").answer, \"hook\");\n  assert.deepEqual(key.get(\"N09\").accepted, [\"skill\"]);\n});\n\ntest(\"grader scores correct, accepted, wrong and missing answers\", () => {\n  const key = parseKey(keyMd);\n  const r = grade(key, { N01: \"hook\", N04: { answer: \"skill\", why: \"reuse\" }, N09: { answer: \"skill\", why: \"production-rca inside the sre agent\" } });\n  const by = Object.fromEntries(r.rows.map((x) => [x.id, x.verdict]));\n  assert.equal(by.N01, \"CORRECT\");\n  assert.equal(by.N04, \"WRONG\");\n  assert.equal(by.N09, \"ACCEPTED\");\n  assert.equal(by.N02, \"MISSING\");\n  assert.equal(r.score, 2);\n});\n\ntest(\"grader CLI passes the example answers at 8/10\", () => {\n  const r = run(\"grade-classification.mjs\", [join(HERE, \"example-answers.json\")]);\n  assert.equal(r.status, 0);\n  assert.match(r.stdout, /SCORE 8\\/10 \\(pass mark 8\\) PASS/);\n  assert.equal(run(\"grade-classification.mjs\", [join(HERE, \"example-answers.json\"), \"--pass\", \"9\"]).status, 1);\n});\n","tag":"illustrative"}],"exampleInput":"cd AI-SDLC\nnode docs/foundations/validate-contract.mjs --template agents/CONTRACT_TEMPLATE.md\nnode docs/foundations/validate-contract.mjs docs/foundations/reviewer-contract-draft.md   # first attempt\n# fix the reported lines, then:\nnode docs/foundations/validate-contract.mjs docs/foundations/reviewer-contract-draft.md\nnode docs/foundations/validate-contract.mjs --json docs/foundations/reviewer-contract-draft.md | jq '{agent, tools, humanGate}'","expectedOutput":"OK    agents/CONTRACT_TEMPLATE.md: 11/11 contract sections (template mode)\n\nFirst attempt (tool name invented, one must rule untagged, gate with no mechanism):\nFAIL  docs/foundations/reviewer-contract-draft.md: tools: \"CodeSearch\" is not a Claude Code tool name\nFAIL  docs/foundations/reviewer-contract-draft.md: must[3]: must end with [mechanism: ...] or [convention: ...]\nFAIL  docs/foundations/reviewer-contract-draft.md: humanGate: name the real mechanism (plan mode, a permission ask rule, PR approval, or a hook that exits 2)\n\nAfter fixing:\nOK    docs/foundations/reviewer-contract-draft.md: 11/11 contract sections\n{\n  \"agent\": \"reviewer\",\n  \"tools\": [\"Read\", \"Grep\", \"Glob\", \"Bash (only `git diff`, `git log`, `git status`)\"],\n  \"humanGate\": \"The reviewer is advisory; the gate is the human pull-request approval. Any `critical` or `high` finding blocks merge (review-standards), ...\"\n}","testCases":[{"name":"Filled contract validates","input":"node docs/foundations/validate-contract.mjs docs/foundations/reviewer-contract-draft.md; echo $?","expected":"`OK    docs/foundations/reviewer-contract-draft.md: 11/11 contract sections` then `0`"},{"name":"Unfilled template is rejected","input":"node docs/foundations/validate-contract.mjs agents/CONTRACT_TEMPLATE.md; echo $?","expected":"`FAIL ... agent \"\u003cagent-name>\" is not in the roster` plus one `unreplaced \u003cplaceholder> text` line per section, then `1`"},{"name":"Template headings match the schema","input":"grep -E '^## ' agents/CONTRACT_TEMPLATE.md | sed 's/## //' | paste -sd, -","expected":"purpose,inputs,outputs,tools,permissions,must,mustNot,failureConditions,validation,handoffFormat,humanGate"},{"name":"Every must/mustNot rule names its enforcement","input":"awk '/^## must$/,/^## failureConditions$/' docs/foundations/reviewer-contract-draft.md | grep '^- ' | grep -vcE '\\[(mechanism|convention):'","expected":"0"},{"name":"Boundaries are mechanisms, not only conventions","input":"awk '/^## mustNot$/,/^## failureConditions$/' docs/foundations/reviewer-contract-draft.md | grep -c '\\[mechanism:'","expected":"3 (no Edit/Write, no Agent, Bash limited to git)"},{"name":"Unit tests","input":"node --test docs/foundations/foundations.test.mjs","expected":"`# tests 14`, `# pass 14`, `# fail 0`"}],"evaluationCriteria":["All eleven fields filled; `validate-contract.mjs` exits 0 with no warnings.","`tools` and `permissions` agree: nothing in permissions grants a tool that `tools` omits.","At least the no-edit and no-delegation rules are enforced by mechanism (`tools`, `disallowedTools`), not by instruction.","The `permissionMode` caveat (ignored under `acceptEdits`, `auto`, `bypassPermissions` parents) is acknowledged with a backstop.","`failureConditions` cover empty diff, oversized diff, missing inputs, and a request to fix code.","`humanGate` names a real mechanism (PR approval, `ask` rule) and states that the reviewer never approves."],"improvements":["Fill the template for `tester` next; its `tools` include Edit and Write, so its `mustNot` must restrict *where* it writes (tests only) and say whether that is a mechanism or a convention.","Add a `--frontmatter` mode that prints the matching `.claude/agents/reviewer.md` frontmatter (`name`, `description`, `tools`, `disallowedTools`, `permissionMode`) from the contract, and diff it against the real file in module 05.","Run the validator over `agents/*/CONTRACT.md` in CI once module 05 has written them."]}],"agentContracts":[{"agent":"reviewer","purpose":"Review one diff of `sample-app/` against the team standards and return structured findings so a human reviewer can decide faster whether the change is mergeable. The reviewer covers correctness, design, readability, testing and standards; it flags security and performance concerns but defers deep analysis of them to the `security` and `sre` agents. It never changes code and never approves a change.","inputs":["Base ref to diff against, e.g. `main` (required, in the task message).","Run id, e.g. `2026-09-30-feat-observation-search` (required, in the task message; names the run folder).","Path of the upstream handoff that describes the intent of the change, e.g. `.ai-sdlc/runs/\u003crun-id>/04-developer.md` (optional; without it the reviewer reviews the diff on its own merits and says so).","Standards to apply: `context/standards/review-standards.md` and `context/standards/coding-standards.md` (always), `context/standards/testing-standards.md` when test files change."],"outputs":["Final message to the main session: the complete handoff document (YAML front matter plus the sections in handoffFormat). The orchestrator, which has Write access to the run folder, saves it as `.ai-sdlc/runs/\u003crun-id>/NN-reviewer.md`.","A findings table with one row per finding: `id | severity | category | location | evidence | recommendation`, severity from `critical | high | medium | low | info`.","An explicit \"no findings\" line for every category it checked and found clean."],"tools":["Read","Grep","Glob","Bash (only `git diff`, `git log`, `git status`)"],"permissions":"Frontmatter in `.claude/agents/reviewer.md`: `tools: Read, Grep, Glob, Bash` (an allowlist, so Edit, Write and Agent are not available) and `disallowedTools: Edit, Write, NotebookEdit` as a second guard, with `permissionMode: dontAsk`, which auto-denies any Bash command that is not pre-approved by the project rules in `.claude/settings.json` (`Bash(git diff *)`, `Bash(git status)`, `Bash(git log *)`). Caveat from the docs: a subagent's `permissionMode` is ignored when the parent session runs in `bypassPermissions`, `acceptEdits` or `auto`, so module 05 adds a `PreToolUse` hook in the agent's own `hooks` frontmatter that exits 2 for any Bash command outside `git diff|git log|git status`. The project `deny` rules (`Read(./.env)`, `Read(./**/secrets/**)`, `Read(./**/*.phi.*)`) apply to the reviewer like every other agent.","must":["Give every finding all six fields: id, severity, category, location as `path:line`, evidence quoted from the diff or file, recommendation. [convention: checked by the reviewer golden tasks in module 09-agent-evaluation]","Cite the standard violated as file plus rule number, e.g. `context/standards/coding-standards.md` rule 6. [convention: checked by the reviewer golden tasks]","State \"no findings\" for each category it checked and found clean. [convention: human reviewer reads the handoff]","Read the change with `git diff \u003cbase>...HEAD`, not from memory of an earlier conversation. [mechanism: subagents start with no conversation history; Bash is limited to git by `permissionMode: dontAsk` plus allow rules]","End with a handoff whose front matter has `run_id`, `step`, `agent: reviewer`, `status`, `inputs`, `next`. [mechanism: `.claude/hooks/check-handoff.mjs` in module 08 rejects a handoff with missing keys]"],"mustNot":["Edit, create or delete any file. [mechanism: Edit and Write are absent from `tools` and listed in `disallowedTools`]","Delegate to other agents. [mechanism: `Agent` is absent from `tools`, so the reviewer stays at depth 1]","Approve the change or write \"LGTM\", \"approved\" or \"ready to merge\". [convention: `context/standards/review-standards.md` says reviewers never approve; merge approval is a human PR approval]","Quote PHI in evidence (MRN values, names, birth dates, patient-linked observation values); quote code and synthetic fixtures such as `MRN-000123` only. [convention: `context/security/phi-and-secrets-policy.md`, re-checked by the security agent]","Report the marked `TEACHING-DEFECT(perf-n+1)` in `ObservationService.lastN` as a new finding. It may be mentioned as known, with a reference to `sample-app/docs/KNOWN_DEFECTS.md`. [convention: reviewer golden tasks include a case that checks this]","Run any shell command other than `git diff`, `git log` or `git status`. [mechanism: `permissionMode: dontAsk` with the project allow rules, backed by the agent-scoped `PreToolUse` hook from module 05]"],"failureConditions":["The diff against the base ref is empty or the base ref does not exist: return `status: blocked` with the exact `git` error.","The diff touches more than 40 files or 2,000 changed lines: return `status: needs-human` and ask for the change to be split.","A referenced standard file or upstream handoff path does not exist: return `status: needs-human` naming the missing path.","The change touches `config/SecurityConfig.java`, `audit/AuditLogger.java` or `db/migration/`: review it, but set `next: security` and say why.","The task asks the reviewer to fix the code: refuse, return `status: blocked` and recommend routing to `developer`.","The run hits `maxTurns` (the output is marked partial): return `status: blocked` rather than a partial finding list presented as complete."],"validation":"This contract is checked with `node docs/foundations/validate-contract.mjs docs/foundations/reviewer-contract-draft.md` (exit 0). Reviewer output is checked three ways: the handoff front matter by `.claude/hooks/check-handoff.mjs` (module 08); the findings against golden tasks in `evaluations/` (module 09), where a seeded diff that adds a repository call inside a loop must produce a `performance` finding citing coding-standards rule 6 and a seeded unchecked `isActive()` must produce a `correctness` finding citing glossary business rule 3; and a human spot-check that no finding lacks quoted evidence.","handoffFormat":"Markdown with YAML front matter as defined in `workflows/README.md` and the style guide: `run_id`, `step`, `agent: reviewer`, `status` (`complete | blocked | needs-human`), `inputs` (list of upstream handoff file names), `next` (`security`, `tester`, `developer` or `human`). Sections in order: `## Summary` (verdict in one sentence, counts per severity), `## Findings` (the six-column table), `## Decisions` (what was out of scope and why), `## Open questions`, `## Artifacts` (always \"none written; returned to main session\"). Saved by the orchestrator as `.ai-sdlc/runs/\u003crun-id>/NN-reviewer.md`.","humanGate":"The reviewer is advisory; the gate is the human pull-request approval. Any `critical` or `high` finding blocks merge (review-standards), and in an orchestrated run the orchestrator stops with `status: needs-human` until a person accepts or rejects each one. Nothing the reviewer produces can merge code: `git push` is an `ask` rule in `.claude/settings.json`, force-push is denied, and CLAUDE.md rule 7 leaves push, merge and deploy to a human."}],"checklist":["You can state, for a given job, whether it needs a different context, different tools or different authority, and therefore whether it is an agent.","`docs/foundations/anatomy-breakdown-reviewer.md` has twelve rows, each ending in Mechanism: or Convention:.","Every Claude Code field you cite exists in `build/CLAUDE_CODE_FACTS.md` (agent fields camelCase, skill fields hyphenated).","`node docs/foundations/grade-classification.mjs` scores your classification at 8/10 or better.","`agents/CONTRACT_TEMPLATE.md` has the eleven `## field` headings in schema order and passes `--template` validation.","`docs/foundations/reviewer-contract-draft.md` passes `validate-contract.mjs` with exit code 0.","Every `must` and `mustNot` rule in the reviewer draft is tagged `[mechanism: ...]` or `[convention: ...]`.","The reviewer draft omits `Agent`, `Edit` and `Write` from `tools`, and says why.","The `humanGate` field names a real mechanism, not \"someone looks at it\".","`node --test docs/foundations/foundations.test.mjs` reports 14 passing tests.","You know which parts of the reviewer contract module 05-agent-roster will finalise, and which module 09 will measure."]}]};

<script>
(function () {
  "use strict";
  var DATA = window.CURRICULUM || { modules: [], builtAt: "" };
  var MODULES = DATA.modules || [];
  var view = document.getElementById("view");
  var FIELD_TABS = [
    ["objective", "Objective"], ["startingFiles", "Starting files"], ["requiredStructure", "Required structure"],
    ["implementation", "Implementation"], ["exampleInput", "Example input"], ["expectedOutput", "Expected output"],
    ["testCases", "Test cases"], ["evaluationCriteria", "Evaluation criteria"], ["improvements", "Improvements"]
  ];
  var TYPES = [
    ["agents", "Agents", /(^|\/)(\.claude\/agents\/|agents\/)/],
    ["skills", "Skills", /(^|\/)(\.claude\/skills\/|\.claude\/commands\/|skills\/)/],
    ["workflows", "Workflows", /(^|\/)workflows\//],
    ["evals", "Evals", /(^|\/)evaluations\//],
    ["contracts", "Contracts", null]
  ];

  /* ---------- storage (optional) ---------- */
  var store = {
    get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
  };
  var PKEY = "ai-sdlc-progress-v1";
  var progress = {};
  try { progress = JSON.parse(store.get(PKEY) || "{}") || {}; } catch (e) { progress = {}; }
  function saveProgress() { store.set(PKEY, JSON.stringify(progress)); updateProgress(); }

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function md(s) {
    if (window.marked && marked.parse) { try { return marked.parse(String(s || ""), { mangle: false, headerIds: false }); } catch (e) {} }
    return "<p>" + esc(s).replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>") + "</p>";
  }
  function slugPath(p) { return "f~" + String(p).replace(/[^A-Za-z0-9._-]/g, "~"); }
  function el(html) { var d = document.createElement("div"); d.innerHTML = html; return d; }
  var LANG_ALIAS = { yml: "yaml", sh: "bash", shell: "bash", js: "javascript", mjs: "javascript", md: "markdown", text: "plaintext", txt: "plaintext", html: "xml", dockerfile: "dockerfile", properties: "ini" };
  function codeBlock(path, lang, content, tag) {
    var l = LANG_ALIAS[String(lang || "").toLowerCase()] || String(lang || "plaintext").toLowerCase();
    var tagChip = tag ? '<span class="chip ' + (tag === "verified-format" ? "tag-verified" : "tag-illustrative") + '">' + esc(tag) + "</span>" : "";
    return '<figure class="code"><figcaption><span class="path" title="' + esc(path) + '">' + esc(path || lang || "snippet") + "</span>" + tagChip +
      '<button class="copy" type="button">Copy</button></figcaption><pre><code class="language-' + esc(l) + '">' + esc(content) + "</code></pre></figure>";
  }

  /* ---------- indexes ---------- */
  var exercises = [], files = [], contracts = [];
  MODULES.forEach(function (m) {
    (m.exercises || []).forEach(function (x) {
      exercises.push({ m: m, x: x });
      (x.implementation || []).forEach(function (f) { files.push({ m: m, x: x, f: f, kind: "implementation" }); });
      (x.startingFiles || []).forEach(function (f) { files.push({ m: m, x: x, f: f, kind: "starting" }); });
    });
    (m.agentContracts || []).forEach(function (c) { contracts.push({ m: m, c: c }); });
  });
  function filesOfType(t) {
    var re = null; TYPES.forEach(function (T) { if (T[0] === t) re = T[2]; });
    if (!re) return [];
    var seen = {}, out = [];
    files.forEach(function (e) {
      if (e.kind !== "implementation") return;
      var p = e.f.path.replace(/^AI-SDLC\//, "");
      if (!re.test(p) || /sample-app\//.test(p)) return;
      if (t === "agents" && /skills\//.test(p)) return;
      if (seen[e.f.path]) return; seen[e.f.path] = 1; out.push(e);
    });
    return out.sort(function (a, b) { return a.f.path < b.f.path ? -1 : 1; });
  }

  /* ---------- nav ---------- */
  function buildNav() {
    var lv = document.getElementById("nav-levels"), html = "";
    MODULES.forEach(function (m) {
      html += '<li><a href="#m-' + esc(m.id) + '" data-route="m-' + esc(m.id) + '"><span class="lv">L' + m.level + "</span><span>" + esc(m.title) + "</span></a></li>";
    });
    lv.innerHTML = html;
    var tp = document.getElementById("nav-types"); html = "";
    TYPES.forEach(function (T) {
      var n = T[0] === "contracts" ? contracts.length : filesOfType(T[0]).length;
      html += '<li><a href="#t-' + T[0] + '" data-route="t-' + T[0] + '"><span>' + T[1] + '</span><span class="count">' + n + "</span></a></li>";
    });
    tp.innerHTML = html;
    document.getElementById("build-info").textContent = MODULES.length + " modules · " + exercises.length + " exercises" + (DATA.builtAt ? " · built " + DATA.builtAt.slice(0, 10) : "");
  }
  function markActive(route) {
    document.querySelectorAll(".navgroup a").forEach(function (a) {
      var r = a.getAttribute("data-route");
      a.classList.toggle("active", r === route || (route.indexOf("x-") === 0 && r === "m-" + (findEx(route.slice(2)) || { m: {} }).m.id));
    });
  }
  function updateProgress() {
    var done = exercises.filter(function (e) { return progress[e.x.id]; }).length;
    document.getElementById("progress-text").textContent = done + " of " + exercises.length + " exercises done";
    document.getElementById("progress-fill").style.width = exercises.length ? (100 * done / exercises.length) + "%" : "0";
  }
  function findEx(id) { for (var i = 0; i < exercises.length; i++) if (exercises[i].x.id === id) return exercises[i]; return null; }
  function findMod(id) { for (var i = 0; i < MODULES.length; i++) if (MODULES[i].id === id) return MODULES[i]; return null; }

  /* ---------- views ---------- */
  function renderHome() {
    var levels = {};
    MODULES.forEach(function (m) { (levels[m.level] = levels[m.level] || []).push(m); });
    var h = '<div class="section"><span class="eyebrow">Curriculum</span><h1>AI-SDLC: Agent &amp; Skill Engineering with Claude Code</h1>' +
      '<p class="lede">Build a working, reviewable AI engineering system for a Spring Boot FHIR-lite API: subagents with contracts, skills as tested assets, hooks and permissions as real human gates, and an evaluation harness that tells you when a prompt change made things worse.</p>' +
      '<div class="stats"><div><b>' + MODULES.length + '</b><span>Modules</span></div><div><b>' + exercises.length + '</b><span>Exercises</span></div><div><b>' +
      files.filter(function (f) { return f.kind === "implementation"; }).length + '</b><span>Repo files</span></div><div><b>' + contracts.length + "</b><span>Agent contracts</span></div></div></div>";
    h += '<div class="section"><h2>Levels</h2><div class="cards">';
    MODULES.forEach(function (m) {
      var n = (m.exercises || []).length, d = (m.exercises || []).filter(function (x) { return progress[x.id]; }).length;
      h += '<a class="card" href="#m-' + esc(m.id) + '"><span class="meta">Level ' + m.level + " · " + d + "/" + n + " exercises</span><b>" + esc(m.title) + "</b><p>" + esc(m.summary) + "</p></a>";
    });
    h += "</div></div>";
    h += '<div class="section"><h2>How to read the tags</h2><div class="prose">' + md("Every code sample carries a tag. **verified-format** means the file's structure matches the Claude Code documentation as recorded in `build/CLAUDE_CODE_FACTS.md` (subagent files, `SKILL.md`, `settings.json`, `.mcp.json`, `CLAUDE.md`, `claude -p` invocations). **illustrative** means a pattern or convention of this course, such as Agent Contracts, workflow specs, eval datasets, and helper scripts. Illustrative files are real and runnable where they are code, but they are not Claude Code features.") + "</div></div>";
    view.innerHTML = h;
  }

  function renderModule(m, focusEx) {
    var idx = MODULES.indexOf(m), h = "";
    h += '<div class="section"><span class="eyebrow">Level ' + m.level + " · " + esc(m.id) + "</span><h1>" + esc(m.title) + '</h1><p class="lede">' + esc(m.summary) + "</p>";
    if ((m.prerequisites || []).length) {
      h += '<div class="chips"><span class="eyebrow" style="align-self:center">Prerequisites</span>' + m.prerequisites.map(function (p) {
        var pm = findMod(p); return pm ? '<a class="chip" href="#m-' + esc(pm.id) + '">' + esc(pm.title) + "</a>" : '<span class="chip">' + inline(p) + "</span>";
      }).join("") + "</div>";
    }
    h += "</div>";
    if ((m.concepts || []).length) {
      h += '<div class="section"><h2>Concepts</h2>' + m.concepts.map(function (c) {
        return '<div class="concept"><h3>' + esc(c.heading) + '</h3><div class="prose">' + md(c.body_md) + "</div></div>";
      }).join("") + "</div>";
    }
    if ((m.diagrams || []).length) {
      h += '<div class="section"><h2>Diagrams</h2>' + m.diagrams.map(function (d) {
        return '<div><p class="diagram-title">' + esc(d.title) + '</p><div class="scroll-x diagram"><pre class="mermaid">' + esc(d.mermaid) + "</pre></div></div>";
      }).join("") + "</div>";
    }
    if ((m.comparisonTables || []).length) {
      h += '<div class="section"><h2>Comparisons</h2>' + m.comparisonTables.map(tableHtml).join("") + "</div>";
    }
    if ((m.exercises || []).length) {
      h += '<div class="section"><h2>Exercises</h2>' + m.exercises.map(exerciseHtml).join("") + "</div>";
    }
    if ((m.agentContracts || []).length) {
      h += '<div class="section"><h2>Agent contracts</h2>' + m.agentContracts.map(contractHtml).join("") + "</div>";
    }
    if ((m.checklist || []).length) {
      h += '<div class="section"><h2>Checklist</h2><ul class="checklist">' + m.checklist.map(function (c) { return "<li><span>" + inline(c) + "</span></li>"; }).join("") + "</ul></div>";
    }
    h += '<div class="pager">' + (idx > 0 ? '<a class="btn" href="#m-' + esc(MODULES[idx - 1].id) + '">← ' + esc(MODULES[idx - 1].title) + "</a>" : "<span></span>") +
      (idx < MODULES.length - 1 ? '<a class="btn" href="#m-' + esc(MODULES[idx + 1].id) + '">' + esc(MODULES[idx + 1].title) + " →</a>" : "") + "</div>";
    view.innerHTML = h;
    wireExercises();
    if (focusEx) { var t = document.getElementById("x-" + focusEx); if (t) setTimeout(function () { t.scrollIntoView(); }, 30); }
  }
  function inline(s) { if (window.marked && marked.parseInline) { try { return marked.parseInline(String(s)); } catch (e) {} } return esc(s); }
  function tableHtml(t) {
    return '<div><p class="diagram-title">' + esc(t.title) + '</p><div class="scroll-x"><table class="cmp"><thead><tr>' + t.columns.map(function (c) { return "<th>" + esc(c) + "</th>"; }).join("") +
      "</tr></thead><tbody>" + t.rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div></div>";
  }
  function listHtml(a) { return '<ul class="criteria">' + (a || []).map(function (s) { return "<li>" + inline(s) + "</li>"; }).join("") + "</ul>"; }
  function exercisePanel(x, key) {
    switch (key) {
      case "objective": return '<div class="prose">' + md(x.objective) + "</div>";
      case "startingFiles": return (x.startingFiles || []).length ? x.startingFiles.map(function (f) { return codeBlock(f.path, extOf(f.path), f.content); }).join("") : "<p>No starting files. You begin from the current state of the repository.</p>";
      case "requiredStructure": return codeBlock("required structure", "plaintext", x.requiredStructure);
      case "implementation": return (x.implementation || []).map(function (f) { return codeBlock(f.path, f.language, f.content, f.tag); }).join("");
      case "exampleInput": return codeBlock("example input", guessLang(x.exampleInput), x.exampleInput);
      case "expectedOutput": return codeBlock("expected output", guessLang(x.expectedOutput), x.expectedOutput);
      case "testCases": return (x.testCases || []).map(function (t) {
        return '<div class="testcase"><div class="name">' + esc(t.name) + '</div><div><span class="lbl">Input</span><pre>' + esc(t.input) + '</pre></div><div><span class="lbl">Expected</span><pre>' + esc(t.expected) + "</pre></div></div>";
      }).join("");
      case "evaluationCriteria": return listHtml(x.evaluationCriteria);
      case "improvements": return listHtml(x.improvements);
    }
    return "";
  }
  function extOf(p) { var m = /\.([a-z0-9]+)$/i.exec(p || ""); if (/Dockerfile$/.test(p || "")) return "dockerfile"; return m ? m[1] : "plaintext"; }
  function guessLang(s) { s = String(s || "").trim(); if (/^[\[{]/.test(s)) return "json"; if (/^(\$ |claude |mvn |node |curl |git |bash )/.test(s)) return "bash"; return "plaintext"; }
  function exerciseHtml(x) {
    var done = !!progress[x.id];
    var tabs = FIELD_TABS.map(function (f, i) {
      return '<button type="button" role="tab" data-key="' + f[0] + '" aria-selected="' + (i === 0) + '"><span class="n">' + (i + 1) + "</span>" + f[1] + "</button>";
    }).join("");
    return '<article class="exercise' + (done ? " is-done" : "") + '" id="x-' + esc(x.id) + '" data-ex="' + esc(x.id) + '"><header><div class="t"><span class="xid">' + esc(x.id) + '</span><h3>' + esc(x.title) + "</h3></div>" +
      '<label class="done-toggle"><input type="checkbox" data-done="' + esc(x.id) + '"' + (done ? " checked" : "") + "> Done</label></header>" +
      '<div class="tabs" role="tablist" aria-label="Exercise sections">' + tabs + '</div><div class="panel" role="tabpanel">' + exercisePanel(x, "objective") + "</div></article>";
  }
  function contractHtml(c) {
    function row(k, v, cls) { return "<dt>" + k + '</dt><dd' + (cls ? ' class="' + cls + '"' : "") + ">" + v + "</dd>"; }
    return '<div class="contract" id="c-' + esc(c.agent) + '"><header><code>' + esc(c.agent) + "</code><span>" + esc(c.purpose) + "</span></header><dl>" +
      row("Inputs", listHtml(c.inputs)) + row("Outputs", listHtml(c.outputs)) + row("Tools", listHtml(c.tools)) + row("Permissions", inline(c.permissions)) +
      row("Must", listHtml(c.must)) + row("Must not", listHtml(c.mustNot)) + row("Failure conditions", listHtml(c.failureConditions)) +
      row("Validation", inline(c.validation)) + row("Handoff format", inline(c.handoffFormat)) + row("Human gate", inline(c.humanGate), "gate") + "</dl></div>";
  }
  function wireExercises() {
    view.querySelectorAll(".exercise").forEach(function (art) {
      var ex = findEx(art.getAttribute("data-ex")); if (!ex) return;
      var panel = art.querySelector(".panel");
      art.querySelectorAll(".tabs button").forEach(function (b) {
        b.addEventListener("click", function () {
          art.querySelectorAll(".tabs button").forEach(function (o) { o.setAttribute("aria-selected", String(o === b)); });
          panel.innerHTML = exercisePanel(ex.x, b.getAttribute("data-key"));
          enhance(panel);
        });
      });
      var cb = art.querySelector("input[data-done]");
      cb.addEventListener("change", function () {
        if (cb.checked) progress[ex.x.id] = Date.now(); else delete progress[ex.x.id];
        art.classList.toggle("is-done", cb.checked); saveProgress();
      });
    });
  }

  function renderType(t) {
    var label = ""; TYPES.forEach(function (T) { if (T[0] === t) label = T[1]; });
    var h = '<div class="section"><span class="eyebrow">Artifact type</span><h1>' + esc(label) + "</h1>";
    if (t === "contracts") {
      h += '<p class="lede">Every Agent Contract defined across the curriculum. The roster is fixed: architect, developer, reviewer, tester, security, sre, orchestrator.</p></div>';
      h += contracts.map(function (e) { return '<div class="section"><span class="eyebrow">From <a href="#m-' + esc(e.m.id) + '">' + esc(e.m.title) + "</a></span>" + contractHtml(e.c) + "</div>"; }).join("");
    } else {
      var list = filesOfType(t);
      h += '<p class="lede">' + list.length + " files in the reference repository. Each links back to the exercise that builds it.</p></div>";
      h += '<div class="results">' + list.map(function (e) {
        return '<a class="result" href="#' + slugPath(e.f.path) + '"><span><code>' + esc(e.f.path) + '</code></span><small>' + esc(e.x.title) + " · " + esc(e.m.title) + " · " + esc(e.f.tag) + "</small></a>";
      }).join("") + "</div>";
    }
    view.innerHTML = h;
  }
  function renderFile(slug) {
    var hits = files.filter(function (e) { return slugPath(e.f.path) === slug; });
    if (!hits.length) return renderNotFound();
    var e = hits.filter(function (h) { return h.kind === "implementation"; })[0] || hits[0];
    var h = '<div class="section"><span class="eyebrow">' + (e.kind === "implementation" ? "Repository file" : "Starting file") + "</span><h1><code>" + esc(e.f.path.split("/").pop()) + "</code></h1>" +
      '<p class="lede">Built in <a href="#x-' + esc(e.x.id) + '">' + esc(e.x.title) + "</a> (" + esc(e.m.title) + ").</p></div>";
    h += codeBlock(e.f.path, e.f.language || extOf(e.f.path), e.f.content, e.f.tag);
    view.innerHTML = h;
  }
  function renderSearch(q) {
    q = q.trim(); var ql = q.toLowerCase(), out = [];
    if (ql.length < 2) { view.innerHTML = '<div class="section"><h1>Search</h1><p class="lede">Type at least two characters.</p></div>'; return; }
    function snip(text) {
      var t = String(text || ""), i = t.toLowerCase().indexOf(ql); if (i < 0) return null;
      var s = Math.max(0, i - 60), e = Math.min(t.length, i + ql.length + 90);
      return (s > 0 ? "…" : "") + esc(t.slice(s, i)) + "<mark>" + esc(t.slice(i, i + ql.length)) + "</mark>" + esc(t.slice(i + ql.length, e)) + (e < t.length ? "…" : "");
    }
    function add(href, title, where, text) { var s = snip(text); if (s) out.push({ href: href, title: title, where: where, s: s }); }
    MODULES.forEach(function (m) {
      add("#m-" + m.id, m.title, "Module summary", m.title + " — " + m.summary);
      (m.concepts || []).forEach(function (c) { add("#m-" + m.id, c.heading, m.title + " · concept", c.heading + " — " + c.body_md); });
      (m.comparisonTables || []).forEach(function (t) { add("#m-" + m.id, t.title, m.title + " · table", t.title + " " + t.rows.map(function (r) { return r.join(" | "); }).join(" \n ")); });
      (m.exercises || []).forEach(function (x) {
        add("#x-" + x.id, x.title, m.title + " · exercise", x.title + " — " + x.objective);
        (x.implementation || []).forEach(function (f) { add("#" + slugPath(f.path), f.path, x.title + " · file", f.path + "\n" + f.content); });
        add("#x-" + x.id, x.title + " · expected output", m.title, x.expectedOutput);
      });
      (m.agentContracts || []).forEach(function (c) { add("#m-" + m.id, c.agent + " contract", m.title, [c.purpose].concat(c.must, c.mustNot, c.failureConditions, [c.humanGate]).join(" · ")); });
      (m.checklist || []).forEach(function (c) { add("#m-" + m.id, "Checklist item", m.title, c); });
    });
    view.innerHTML = '<div class="section"><span class="eyebrow">Search</span><h1>' + out.length + " results for “" + esc(q) + '”</h1></div><div class="results">' +
      out.slice(0, 200).map(function (r) { return '<a class="result" href="' + esc(r.href) + '"><b>' + esc(r.title) + "</b><small>" + esc(r.where) + "</small><span>" + r.s + "</span></a>"; }).join("") + "</div>";
  }
  function renderNotFound() { view.innerHTML = '<div class="section"><h1>Not found</h1><p class="lede">That link does not match a module, exercise, or file. <a href="#home">Go to the overview</a>.</p></div>'; }

  /* ---------- enhancement: highlight, copy, mermaid ---------- */
  var mermaidReady = false;
  function isDark() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t) return t === "dark";
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function enhance(root) {
    root.querySelectorAll("pre code").forEach(function (c) {
      if (window.hljs && !c.dataset.hl) { try { hljs.highlightElement(c); } catch (e) {} c.dataset.hl = "1"; }
    });
    root.querySelectorAll("figure.code .copy").forEach(function (b) {
      if (b.dataset.wired) return; b.dataset.wired = "1";
      b.addEventListener("click", function () {
        var code = b.closest("figure").querySelector("code"), text = code.textContent;
        function ok() { b.textContent = "Copied"; b.classList.add("done"); setTimeout(function () { b.textContent = "Copy"; b.classList.remove("done"); }, 1500); }
        function fallback() { var r = document.createRange(); r.selectNodeContents(code); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Press Ctrl+C"; }
        try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
      });
    });
    var ms = root.querySelectorAll("pre.mermaid:not([data-processed])");
    if (ms.length && window.mermaid) {
      try {
        mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: isDark() ? "dark" : "neutral", fontFamily: "Public Sans, system-ui, sans-serif" });
        mermaid.run({ nodes: ms }).catch(function (e) { console.warn("mermaid", e); });
      } catch (e) { console.warn("mermaid", e); }
    }
  }

  /* ---------- router ---------- */
  var lastRoute = "";
  function route() {
    var h = decodeURIComponent((location.hash || "#home").slice(1)) || "home";
    lastRoute = h;
    document.body.classList.remove("nav-open"); closeScrim();
    if (h === "home") renderHome();
    else if (h.indexOf("m-") === 0) { var m = findMod(h.slice(2)); m ? renderModule(m) : renderNotFound(); }
    else if (h.indexOf("x-") === 0) { var e = findEx(h.slice(2)); e ? renderModule(e.m, e.x.id) : renderNotFound(); }
    else if (h.indexOf("c-") === 0) { renderType("contracts"); }
    else if (h.indexOf("t-") === 0) renderType(h.slice(2));
    else if (h.indexOf("f~") === 0) renderFile(h);
    else if (h.indexOf("s-") === 0) renderSearch(h.slice(2).replace(/_/g, " "));
    else renderNotFound();
    markActive(h);
    enhance(view);
    if (h.indexOf("x-") !== 0) window.scrollTo(0, 0);
  }

  /* ---------- zip download ---------- */
  function download() {
    var btn = document.getElementById("download");
    if (!window.JSZip) { btn.textContent = "Zip library failed to load"; return; }
    var zip = new JSZip(), impl = {};
    files.forEach(function (e) { if (e.kind === "implementation") impl[e.f.path] = e.f.content; });
    Object.keys(impl).forEach(function (p) { zip.file(p, impl[p]); });
    files.forEach(function (e) {
      if (e.kind !== "starting") return;
      var p = impl[e.f.path] !== undefined ? "starting-files/" + e.x.id + "/" + e.f.path : e.f.path;
      zip.file(p, e.f.content);
    });
    zip.file("AI-SDLC/STARTER_README.md", "# AI-SDLC starter repo\n\nGenerated from the curriculum SPA (" + MODULES.length + " modules, " + exercises.length + " exercises).\n\n" +
      "Implementation files are at their real paths. Starting files that would overwrite an implementation file are under `starting-files/<exercise-id>/`.\n\n" +
      "The Java sample app is included only where exercises embed its files; clone the full reference repository for the complete `sample-app/`.\n");
    btn.textContent = "Building zip…";
    zip.generateAsync({ type: "blob" }).then(function (blob) {
      try {
        var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "ai-sdlc-starter.zip";
        document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
        btn.textContent = "Download starter repo";
      } catch (e) { btn.textContent = "Download blocked by this viewer"; }
    }, function () { btn.textContent = "Zip failed, try again"; });
  }

  /* ---------- theme + mobile nav ---------- */
  function toggleTheme() {
    var next = isDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next); store.set("ai-sdlc-theme", next);
    route();
  }
  (function () { var t = store.get("ai-sdlc-theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); })();
  var scrim = null;
  function closeScrim() { if (scrim) { scrim.remove(); scrim = null; } document.getElementById("nav-toggle").setAttribute("aria-expanded", "false"); }
  document.getElementById("nav-toggle").addEventListener("click", function () {
    var open = !document.body.classList.contains("nav-open");
    document.body.classList.toggle("nav-open", open);
    this.setAttribute("aria-expanded", String(open));
    if (open) { scrim = document.createElement("div"); scrim.className = "scrim"; scrim.addEventListener("click", function () { document.body.classList.remove("nav-open"); closeScrim(); }); document.body.appendChild(scrim); }
    else closeScrim();
  });
  document.getElementById("theme-toggle").addEventListener("click", toggleTheme);
  document.getElementById("theme-toggle-m").addEventListener("click", toggleTheme);
  document.getElementById("download").addEventListener("click", download);
  var qt = null;
  document.getElementById("q").addEventListener("input", function () {
    var v = this.value; clearTimeout(qt);
    qt = setTimeout(function () { if (v.trim().length >= 2) renderSearch(v); else if (lastRoute) route(); enhance(view); }, 180);
  });
  window.addEventListener("hashchange", route);

  buildNav(); updateProgress(); route();
})();
</script>
</body>
</html>
