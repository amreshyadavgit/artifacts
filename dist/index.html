sted into prompts. Messages are truncated to 300 characters.\n// Zero dependencies (Node 22).\n\nimport { readdirSync, readFileSync, statSync, existsSync } from \"node:fs\";\nimport { join, basename, resolve } from \"node:path\";\nimport { pathToFileURL } from \"node:url\";\n\nconst MAX_MESSAGE = 300;\n\nexport function decodeEntities(s) {\n  return s\n    .replace(/&lt;/g, \"\u003c\")\n    .replace(/&gt;/g, \">\")\n    .replace(/&quot;/g, '\"')\n    .replace(/&apos;/g, \"'\")\n    .replace(/&#(\\d+);/g, (_, n) => String.fromCodePoint(Number(n)))\n    .replace(/&#x([0-9a-f]+);/gi, (_, n) => String.fromCodePoint(parseInt(n, 16)))\n    .replace(/&amp;/g, \"&\");\n}\n\nfunction attrs(tag) {\n  const out = {};\n  for (const m of tag.matchAll(/([\\w:.-]+)=\"([^\"]*)\"/g)) out[m[1]] = decodeEntities(m[2]);\n  return out;\n}\n\nfunction oneLine(s, max = MAX_MESSAGE) {\n  const flat = s.replace(/\\s+/g, \" \").trim();\n  return flat.length > max ? flat.slice(0, max - 3) + \"...\" : flat;\n}\n\n/** Parse one Surefire TEST-*.xml document. Returns { suite, cases }. */\nexport function parseSurefireXml(xml) {\n  const suiteTag = xml.match(/\u003ctestsuite\\b[^>]*>/);\n  if (!suiteTag) throw new Error(\"no \u003ctestsuite> element\");\n  const s = attrs(suiteTag[0]);\n  const suite = {\n    name: s.name ?? \"unknown\",\n    tests: Number(s.tests ?? 0),\n    failures: Number(s.failures ?? 0),\n    errors: Number(s.errors ?? 0),\n    skipped: Number(s.skipped ?? 0),\n    time: Number(s.time ?? 0),\n  };\n  const cases = [];\n  // A testcase is either self-closing or has a body (failure/error/skipped/system-out).\n  const re = /\u003ctestcase\\b([^>]*?)(\\/>|>([\\s\\S]*?)\u003c\\/testcase>)/g;\n  for (const m of xml.matchAll(re)) {\n    const a = attrs(m[1]);\n    const body = m[3] ?? \"\";\n    let outcome = \"passed\";\n    let type = \"\";\n    let message = \"\";\n    let at = \"\";\n    const problem = body.match(/\u003c(failure|error)\\b([^>]*?)(\\/>|>([\\s\\S]*?)\u003c\\/\\1>)/);\n    if (problem) {\n      outcome = problem[1] === \"failure\" ? \"failed\" : \"error\";\n      const pa = attrs(problem[2]);\n      type = pa.type ?? \"\";\n      const detail = decodeEntities((problem[4] ?? \"\").replace(/^\u003c!\\[CDATA\\[|\\]\\]>$/g, \"\"));\n      message = oneLine(pa.message ?? detail.split(\"\\n\")[0] ?? \"\");\n      // First stack frame inside the test class itself gives the failing line.\n      const simple = (a.classname ?? \"\").split(\".\").pop();\n      const frame = detail.split(\"\\n\").map((l) => l.trim()).find((l) => simple && l.startsWith(\"at \") && l.includes(`(${simple}.java:`));\n      at = frame ? frame.slice(3) : \"\";\n    } else if (/\u003cskipped\\b/.test(body)) {\n      outcome = \"skipped\";\n    }\n    cases.push({ classname: a.classname ?? suite.name, name: a.name ?? \"unknown\", time: Number(a.time ?? 0), outcome, type, message, at });\n  }\n  return { suite, cases };\n}\n\nexport function loadReports(dir, sinceMs) {\n  if (!existsSync(dir)) return { reports: [], skippedStale: 0 };\n  const files = readdirSync(dir).filter((f) => /^TEST-.*\\.xml$/.test(f)).sort();\n  const reports = [];\n  let skippedStale = 0;\n  for (const f of files) {\n    const p = join(dir, f);\n    if (sinceMs !== undefined && statSync(p).mtimeMs \u003c sinceMs) {\n      skippedStale++;\n      continue;\n    }\n    reports.push({ file: basename(p), ...parseSurefireXml(readFileSync(p, \"utf8\")) });\n  }\n  return { reports, skippedStale };\n}\n\nexport function summarize(reports, { skippedStale = 0 } = {}) {\n  const t = { tests: 0, failures: 0, errors: 0, skipped: 0, time: 0 };\n  for (const r of reports) for (const k of Object.keys(t)) t[k] += r.suite[k];\n  const passed = t.tests - t.failures - t.errors - t.skipped;\n  const ok = t.failures === 0 && t.errors === 0;\n  const lines = [];\n  lines.push(`## Test summary: ${ok ? \"PASS\" : \"FAIL\"}`);\n  lines.push(\"\");\n  lines.push(`${t.tests} tests: ${passed} passed, ${t.failures} failed, ${t.errors} errors, ${t.skipped} skipped (${reports.length} suites, ${t.time.toFixed(1)} s)`);\n  if (skippedStale) lines.push(`Ignored ${skippedStale} stale report file(s) older than --since.`);\n  lines.push(\"\");\n  lines.push(\"| Suite | Tests | Failed | Errors | Skipped | Time (s) |\");\n  lines.push(\"|---|---|---|---|---|---|\");\n  for (const r of reports) {\n    const simple = r.suite.name.split(\".\").pop();\n    lines.push(`| ${simple} | ${r.suite.tests} | ${r.suite.failures} | ${r.suite.errors} | ${r.suite.skipped} | ${r.suite.time.toFixed(2)} |`);\n  }\n  const bad = reports.flatMap((r) => r.cases.filter((c) => c.outcome === \"failed\" || c.outcome === \"error\"));\n  if (bad.length) {\n    lines.push(\"\");\n    lines.push(\"### Failures\");\n    bad.forEach((c, i) => {\n      const simple = c.classname.split(\".\").pop();\n      lines.push(`${i + 1}. ${simple}.${c.name} (${c.outcome}${c.type ? \", \" + c.type : \"\"})`);\n      if (c.message) lines.push(`   message: ${c.message}`);\n      if (c.at) lines.push(`   at: ${c.at}`);\n    });\n  }\n  const skipped = reports.flatMap((r) => r.cases.filter((c) => c.outcome === \"skipped\"));\n  if (skipped.length) {\n    lines.push(\"\");\n    lines.push(\"### Skipped\");\n    for (const c of skipped) lines.push(`- ${c.classname.split(\".\").pop()}.${c.name}`);\n  }\n  return { ok, text: lines.join(\"\\n\") + \"\\n\" };\n}\n\nfunction parseArgs(argv) {\n  const opts = { dir: \"sample-app/target/surefire-reports\", since: undefined, strict: false };\n  for (let i = 0; i \u003c argv.length; i++) {\n    const a = argv[i];\n    if (a === \"--strict\") opts.strict = true;\n    else if (a === \"--since\") {\n      const v = argv[++i];\n      const ms = Date.parse(v ?? \"\");\n      if (Number.isNaN(ms)) throw new Error(`--since needs an ISO-8601 time, got: ${v}`);\n      opts.since = ms;\n    } else if (a.startsWith(\"--\")) throw new Error(`unknown option ${a}`);\n    else opts.dir = a;\n  }\n  return opts;\n}\n\nfunction main() {\n  let opts;\n  try {\n    opts = parseArgs(process.argv.slice(2));\n  } catch (e) {\n    console.error(`summarize-surefire: ${e.message}`);\n    process.exit(2);\n  }\n  const { reports, skippedStale } = loadReports(opts.dir, opts.since);\n  if (reports.length === 0) {\n    const why = skippedStale ? `all ${skippedStale} report file(s) are older than --since` : `no TEST-*.xml files in ${opts.dir}`;\n    console.log(`## Test summary: NO REPORTS\\n\\n${why}. The build probably failed before tests ran (compilation error or Maven failure): check the first [ERROR] lines of the Maven output.`);\n    process.exit(2);\n  }\n  const { ok, text } = summarize(reports, { skippedStale });\n  process.stdout.write(text);\n  process.exit(opts.strict && !ok ? 1 : 0);\n}\n\nif (process.argv[1] && import.meta.url === pathToFileURL(resolve(process.argv[1])).href) main();\n","tag":"illustrative"},{"path":"AI-SDLC/.claude/skills/run-tests/scripts/summarize-surefire.test.mjs","language":"javascript","content":"// Tests for summarize-surefire.mjs. Run from AI-SDLC/: node --test .claude/skills/run-tests/scripts/summarize-surefire.test.mjs\nimport { test } from \"node:test\";\nimport assert from \"node:assert/strict\";\nimport { mkdtempSync, writeFileSync, utimesSync, rmSync } from \"node:fs\";\nimport { tmpdir } from \"node:os\";\nimport { join, dirname } from \"node:path\";\nimport { fileURLToPath } from \"node:url\";\nimport { spawnSync } from \"node:child_process\";\nimport { parseSurefireXml, summarize, loadReports } from \"./summarize-surefire.mjs\";\n\nconst SCRIPT = join(dirname(fileURLToPath(import.meta.url)), \"summarize-surefire.mjs\");\n\nconst PASSING = `\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\u003ctestsuite name=\"org.example.fhir.SecurityTest\" time=\"1.033\" tests=\"2\" errors=\"0\" skipped=\"0\" failures=\"0\">\n  \u003cproperties>\u003cproperty name=\"java.version\" value=\"21\"/>\u003c/properties>\n  \u003ctestcase name=\"wrongPasswordIs401\" classname=\"org.example.fhir.SecurityTest\" time=\"0.099\">\n    \u003csystem-out>\u003c![CDATA[action=READ resource=Patient/42 user=clinician\n]]>\u003c/system-out>\n  \u003c/testcase>\n  \u003ctestcase name=\"healthEndpointIsPublic\" classname=\"org.example.fhir.SecurityTest\" time=\"0.027\"/>\n\u003c/testsuite>`;\n\nconst FAILING = `\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\u003ctestsuite name=\"org.example.fhir.PatientApiTest\" time=\"8.5\" tests=\"4\" errors=\"1\" skipped=\"1\" failures=\"1\">\n  \u003ctestcase name=\"searchWithoutParametersIs400\" classname=\"org.example.fhir.PatientApiTest\" time=\"0.2\">\n    \u003cfailure message=\"Status expected:&lt;400&gt; but was:&lt;200&gt;\" type=\"java.lang.AssertionError\">\u003c![CDATA[java.lang.AssertionError: Status expected:\u003c400> but was:\u003c200>\n\tat org.springframework.test.util.AssertionErrors.fail(AssertionErrors.java:61)\n\tat org.example.fhir.PatientApiTest.searchWithoutParametersIs400(PatientApiTest.java:76)\n]]>\u003c/failure>\n    \u003csystem-out>\u003c![CDATA[Loaded patient Test Patient (MRN MRN-000123)\n]]>\u003c/system-out>\n  \u003c/testcase>\n  \u003ctestcase name=\"readById\" classname=\"org.example.fhir.PatientApiTest\" time=\"0.1\">\n    \u003cerror message=\"Failed to load ApplicationContext\" type=\"java.lang.IllegalStateException\">\u003c![CDATA[java.lang.IllegalStateException: Failed to load ApplicationContext\n\tat org.springframework.test.context.cache.DefaultCacheAwareContextLoaderDelegate.loadContext(DefaultCacheAwareContextLoaderDelegate.java:180)\n]]>\u003c/error>\n  \u003c/testcase>\n  \u003ctestcase name=\"duplicateMrnIs409\" classname=\"org.example.fhir.PatientApiTest\" time=\"0\">\n    \u003cskipped/>\n  \u003c/testcase>\n  \u003ctestcase name=\"createReturns201WithLocationAndResource\" classname=\"org.example.fhir.PatientApiTest\" time=\"0.3\"/>\n\u003c/testsuite>`;\n\nfunction tempReports(files) {\n  const dir = mkdtempSync(join(tmpdir(), \"surefire-\"));\n  for (const [name, xml] of Object.entries(files)) writeFileSync(join(dir, name), xml);\n  return dir;\n}\n\ntest(\"parses suite totals and self-closing and bodied testcases\", () => {\n  const { suite, cases } = parseSurefireXml(PASSING);\n  assert.equal(suite.name, \"org.example.fhir.SecurityTest\");\n  assert.equal(suite.tests, 2);\n  assert.deepEqual(cases.map((c) => [c.name, c.outcome]), [[\"wrongPasswordIs401\", \"passed\"], [\"healthEndpointIsPublic\", \"passed\"]]);\n});\n\ntest(\"extracts failure message (entity-decoded), type and the test-class stack frame\", () => {\n  const { cases } = parseSurefireXml(FAILING);\n  const f = cases.find((c) => c.name === \"searchWithoutParametersIs400\");\n  assert.equal(f.outcome, \"failed\");\n  assert.equal(f.type, \"java.lang.AssertionError\");\n  assert.equal(f.message, \"Status expected:\u003c400> but was:\u003c200>\");\n  assert.equal(f.at, \"org.example.fhir.PatientApiTest.searchWithoutParametersIs400(PatientApiTest.java:76)\");\n  assert.equal(cases.find((c) => c.name === \"readById\").outcome, \"error\");\n  assert.equal(cases.find((c) => c.name === \"duplicateMrnIs409\").outcome, \"skipped\");\n});\n\ntest(\"summary reports FAIL, counts, failures and skipped, and never leaks system-out\", () => {\n  const reports = [PASSING, FAILING].map((x) => parseSurefireXml(x));\n  const { ok, text } = summarize(reports);\n  assert.equal(ok, false);\n  assert.match(text, /^## Test summary: FAIL/);\n  assert.match(text, /6 tests: 3 passed, 1 failed, 1 errors, 1 skipped \\(2 suites/);\n  assert.match(text, /1\\. PatientApiTest\\.searchWithoutParametersIs400 \\(failed, java\\.lang\\.AssertionError\\)/);\n  assert.match(text, /2\\. PatientApiTest\\.readById \\(error, java\\.lang\\.IllegalStateException\\)/);\n  assert.match(text, /- PatientApiTest\\.duplicateMrnIs409/);\n  assert.doesNotMatch(text, /MRN-000123|Loaded patient|Patient\\/42/);\n});\n\ntest(\"all-green summary says PASS\", () => {\n  const { ok, text } = summarize([parseSurefireXml(PASSING)]);\n  assert.equal(ok, true);\n  assert.match(text, /## Test summary: PASS\\n\\n2 tests: 2 passed, 0 failed/);\n});\n\ntest(\"--since drops stale report files\", () => {\n  const dir = tempReports({ \"TEST-a.xml\": PASSING, \"TEST-b.xml\": FAILING });\n  const old = new Date(\"2020-01-01T00:00:00Z\");\n  utimesSync(join(dir, \"TEST-b.xml\"), old, old);\n  const { reports, skippedStale } = loadReports(dir, Date.parse(\"2021-01-01T00:00:00Z\"));\n  assert.equal(reports.length, 1);\n  assert.equal(skippedStale, 1);\n  rmSync(dir, { recursive: true });\n});\n\ntest(\"CLI exit codes: 0 on failures by default, 1 with --strict, 2 without reports\", () => {\n  const dir = tempReports({ \"TEST-b.xml\": FAILING, \"b.txt\": \"ignored\" });\n  const normal = spawnSync(process.execPath, [SCRIPT, dir], { encoding: \"utf8\" });\n  assert.equal(normal.status, 0);\n  assert.match(normal.stdout, /Test summary: FAIL/);\n  const strict = spawnSync(process.execPath, [SCRIPT, dir, \"--strict\"], { encoding: \"utf8\" });\n  assert.equal(strict.status, 1);\n  const empty = spawnSync(process.execPath, [SCRIPT, join(dir, \"missing\")], { encoding: \"utf8\" });\n  assert.equal(empty.status, 2);\n  assert.match(empty.stdout, /NO REPORTS/);\n  const badSince = spawnSync(process.execPath, [SCRIPT, dir, \"--since\", \"yesterday\"], { encoding: \"utf8\" });\n  assert.equal(badSince.status, 2);\n  rmSync(dir, { recursive: true });\n});\n","tag":"illustrative"},{"path":"AI-SDLC/docs/tutorials/level-2/patches/02-clinician-delete-regression.patch","language":"diff","content":"diff --git a/sample-app/src/main/java/org/example/fhir/config/SecurityConfig.java b/sample-app/src/main/java/org/example/fhir/config/SecurityConfig.java\nindex c31d018..689ac00 100644\n--- a/sample-app/src/main/java/org/example/fhir/config/SecurityConfig.java\n+++ b/sample-app/src/main/java/org/example/fhir/config/SecurityConfig.java\n@@ -40,7 +40,7 @@ public class SecurityConfig {\n             .sessionManagement(s -> s.sessionCreationPolicy(SessionCreationPolicy.STATELESS))\n             .authorizeHttpRequests(auth -> auth\n                 .requestMatchers(\"/actuator/health/**\", \"/actuator/info\").permitAll()\n-                .requestMatchers(HttpMethod.DELETE, \"/fhir/**\").hasRole(ADMIN)\n+                .requestMatchers(HttpMethod.DELETE, \"/fhir/**\").hasAnyRole(CLINICIAN, ADMIN)\n                 .requestMatchers(\"/fhir/**\").hasAnyRole(CLINICIAN, ADMIN)\n                 .anyRequest().denyAll())\n             .httpBasic(basic -> basic.authenticationEntryPoint(unauthorized))\n","tag":"illustrative"}],"exampleInput":"cd AI-SDLC\ngit apply docs/tutorials/level-2/patches/02-clinician-delete-regression.patch\nclaude -p \"/run-tests SecurityTest\" --max-turns 10 --output-format json | jq -r '.result'\ngit apply -R docs/tutorials/level-2/patches/02-clinician-delete-regression.patch","expectedOutput":"## Test summary: FAIL\n\n5 tests: 4 passed, 1 failed, 0 errors, 0 skipped (1 suites, 9.4 s)\nIgnored 2 stale report file(s) older than --since.\n\n| Suite | Tests | Failed | Errors | Skipped | Time (s) |\n|---|---|---|---|---|---|\n| SecurityTest | 5 | 1 | 0 | 0 | 9.36 |\n\n### Failures\n1. SecurityTest.clinicianCannotDelete (failed, java.lang.AssertionError)\n   message: Status expected:\u003c403> but was:\u003c204>\n   at: org.example.fhir.SecurityTest.clinicianCannotDelete(SecurityTest.java:33)\n\n### Failure analysis\n| Test | Assertion | Likely cause (hypothesis) | Code to look at |\n|---|---|---|---|\n| SecurityTest.clinicianCannotDelete | expected 403, got 204 | The DELETE rule now grants CLINICIAN: `.requestMatchers(HttpMethod.DELETE, \"/fhir/**\").hasAnyRole(CLINICIAN, ADMIN)`, so a clinician's delete succeeds | sample-app/src/main/java/org/example/fhir/config/SecurityConfig.java:43 |\n\n### Verdict\nNOT READY (1 failing, 0 errors)","testCases":[{"name":"Script unit tests pass","input":"cd AI-SDLC && node --test .claude/skills/run-tests/scripts/summarize-surefire.test.mjs 2>&1 | grep -E '^# (pass|fail)'","expected":"# pass 6\n# fail 0"},{"name":"Script on a real green run","input":"cd AI-SDLC/sample-app && mvn -q -B test > /dev/null 2>&1; cd .. && node .claude/skills/run-tests/scripts/summarize-surefire.mjs | head -3","expected":"## Test summary: PASS\n\n25 tests: 25 passed, 0 failed, 0 errors, 0 skipped (3 suites, 13.1 s)  (the total time varies by machine)"},{"name":"No reports gives exit 2, not a fake PASS","input":"cd AI-SDLC && node .claude/skills/run-tests/scripts/summarize-surefire.mjs /nonexistent; echo \"exit=$?\"","expected":"## Test summary: NO REPORTS\n\nno TEST-*.xml files in /nonexistent. The build probably failed before tests ran (compilation error or Maven failure): check the first [ERROR] lines of the Maven output.\nexit=2"},{"name":"Regression patch is caught without Claude","input":"cd AI-SDLC && git apply docs/tutorials/level-2/patches/02-clinician-delete-regression.patch && (cd sample-app && mvn -q -B test -Dtest=SecurityTest > /dev/null 2>&1); node .claude/skills/run-tests/scripts/summarize-surefire.mjs --strict | grep -A2 '^1\\. '; echo \"exit=$?\"; git apply -R docs/tutorials/level-2/patches/02-clinician-delete-regression.patch","expected":"1. SecurityTest.clinicianCannotDelete (failed, java.lang.AssertionError)\n   message: Status expected:\u003c403> but was:\u003c204>\n   at: org.example.fhir.SecurityTest.clinicianCannotDelete(SecurityTest.java:33)"},{"name":"Maven is never injected","input":"grep -n '^!`\\|!`' AI-SDLC/.claude/skills/run-tests/SKILL.md","expected":"Exactly two injections: !`date -u +%Y-%m-%dT%H:%M:%SZ` and !`git status --short -- sample-app`. No `mvn` inside !`...`."},{"name":"Only the needed commands are pre-approved","input":"sed -n '/^allowed-tools:/,/^---/p' AI-SDLC/.claude/skills/run-tests/SKILL.md","expected":"Five list entries: Bash(mvn -q -B test), Bash(mvn -q -B test *), Bash(node .claude/skills/run-tests/scripts/summarize-surefire.mjs *), Bash(date *), Bash(git status *)"},{"name":"Headless skill run reports the failure","input":"The exampleInput command","expected":"Result contains `NOT READY` and `SecurityConfig.java:43`; `git status --short -- sample-app` shows only the patched SecurityConfig.java (the skill edited nothing)."},{"name":"Unsafe argument is rejected","input":"claude -p '/run-tests SecurityTest;rm -rf target' --max-turns 5 --output-format json | jq -r '.result'","expected":"A reply saying the argument was rejected; no Maven run (check that `sample-app/target/surefire-reports` timestamps did not change)."}],"evaluationCriteria":["`allowed-tools` lists the exact command prefixes, in YAML list form because the rules contain spaces.","Failing tests cannot abort the skill: Maven runs as a normal Bash call, only always-succeeding commands are injected.","The summary never includes `\u003csystem-out>` (tests log AUDIT lines and synthetic patient data).","Stale reports from an earlier run are excluded with `--since`.","The script is zero-dependency Node 22 with a passing `node --test` suite and documented exit codes (0, 1 with `--strict`, 2).","`$ARGUMENTS` is validated before it reaches the shell."],"improvements":["Add `Bash(node .claude/skills/run-tests/scripts/summarize-surefire.mjs *)` to `permissions.allow` in `.claude/settings.json` (owned by module 10) so preloaded use in the tester and developer agents needs no prompt.","Add a `--json` output mode to the script and use it with `claude -p --json-schema` to get `structured_output` for CI.","Print the slowest three tests to catch creeping Spring context start-up time."]},{"id":"02-restrict-tools-and-hook","title":"Restrict the reviewer's tools and scope a hook to it","objective":"Iterate on reviewer v1: add a `tools` allowlist (no Edit or Write), `permissionMode: dontAsk`, `maxTurns: 15`, a findings-table output format, and a `PreToolUse` hook in the agent's own frontmatter that limits Bash to read-only git commands. Test the hook with piped JSON, then prove headless that the reviewer can neither run Maven nor edit a file.","startingFiles":[{"path":"AI-SDLC/.claude/agents/reviewer.md","content":"---\nname: reviewer\ndescription: Reviews code changes in the sample app. Use after code changes.\nmodel: inherit\n---\n\nYou are a senior Java and Spring Boot code reviewer for the FHIR-lite API in `sample-app/`.\n\nWhen invoked:\n\n1. Run `git diff` to see what changed. If there is no diff, review the files the task mentions.\n2. Read the changed files and enough surrounding code to understand them.\n3. Check the change for bugs, security problems, missing tests, and anything that breaks the project rules in CLAUDE.md.\n\nReport the problems you find, starting with the most important, and suggest how to fix each one. Keep the review concise.\n"}],"requiredStructure":"AI-SDLC/docs/tutorials/level-2/\n├── README.md                                  # tutorial, iteration log\n└── examples/\n    ├── reviewer-v1-restricted.md              # name: reviewer; tools, permissionMode, maxTurns, hooks\n    ├── reviewer-bash-guard.mjs                # PreToolUse hook: exit 2 unless git diff/log/show/status\n    └── reviewer-bash-guard.test.mjs           # node --test suite (6 tests)\nAI-SDLC/.claude/agents/reviewer.md             # copy of reviewer-v1-restricted.md for the exercise","implementation":[{"path":"AI-SDLC/docs/tutorials/level-2/examples/reviewer-v1-restricted.md","language":"markdown","content":"---\nname: reviewer\ndescription: Reviews the current git diff of sample-app for correctness, security and missing tests and returns findings. Read-only. Use after code changes, before a human reviews the pull request.\ntools: Read, Grep, Glob, Bash\npermissionMode: dontAsk\nmaxTurns: 15\nmodel: inherit\nhooks:\n  PreToolUse:\n    - matcher: \"Bash\"\n      hooks:\n        - type: command\n          command: \"node \\\"${CLAUDE_PROJECT_DIR}/docs/tutorials/level-2/examples/reviewer-bash-guard.mjs\\\"\"\n          timeout: 10\n---\n\nYou are a senior Java and Spring Boot code reviewer for the FHIR-lite API in `sample-app/`.\nYou are read-only: you have no Edit or Write tool, and Bash is limited to `git diff`, `git log`,\n`git show` and `git status`. Never try to work around a blocked command; report it instead.\n\nWhen invoked:\n\n1. Run `git diff HEAD -- sample-app` to see what changed. If there is no diff, say so and stop.\n2. Read each changed file and the code it calls (controller, service, repository, `SecurityConfig`).\n3. Check the change against `context/standards/coding-standards.md`, `context/standards/review-standards.md`\n   and `context/security/phi-and-secrets-policy.md`.\n\nReturn one Markdown table of findings with the columns\n`id | severity | category | location | evidence | recommendation`, most severe first, using\nseverities `critical | high | medium | low | info`. `location` is `path:line`; `evidence` quotes the\nchanged line. If a category is clean, write \"no findings\" for it below the table.\n","tag":"verified-format"},{"path":"AI-SDLC/docs/tutorials/level-2/examples/reviewer-bash-guard.mjs","language":"javascript","content":"#!/usr/bin/env node\n// PreToolUse hook for the reviewer subagent (registered in the agent's own frontmatter, see\n// docs/tutorials/level-2/examples/reviewer-v1-restricted.md). It lets the reviewer run read-only\n// git commands and blocks every other Bash command with exit code 2.\n//\n// Why a hook: `tools` can only include or exclude the whole Bash tool, and a `disallowedTools`\n// entry such as `Bash(git push *)` removes Bash entirely. The hook narrows Bash to a few\n// commands, whatever permission mode the parent session is in.\n//\n// Input: hook JSON on stdin (tool_name, tool_input.command, agent_type, ...).\n// Exit 0 = allow the call to continue to normal permission checks. Exit 2 = block; stderr is\n// shown to the subagent. Fails closed: unreadable input also exits 2.\n\nimport { pathToFileURL } from \"node:url\";\nimport { resolve } from \"node:path\";\n\nconst ALLOWED = /^git (diff|log|show|status)( |$)/;\n// Shell metacharacters that could chain, redirect or substitute a second command.\nconst SHELL_META = /[;&|\u003c>`\\n\\r]|\\$\\(/;\n// git options that write files or run external programs.\nconst RISKY_OPTIONS = /(^| )(--output(=| |$)|--ext-diff|--textconv|-c )/;\n\nexport function decide(input) {\n  if (!input || typeof input !== \"object\") return { allow: false, reason: \"hook input is not a JSON object\" };\n  if (input.tool_name !== \"Bash\") return { allow: true };\n  const raw = String(input.tool_input?.command ?? \"\");\n  if (SHELL_META.test(raw)) return { allow: false, reason: `shell operators are not allowed for the reviewer: ${raw.trim()}` };\n  const command = raw.trim().replace(/\\s+/g, \" \");\n  if (!command) return { allow: false, reason: \"empty Bash command\" };\n  if (!ALLOWED.test(command)) {\n    return { allow: false, reason: `reviewer may only run git diff, git log, git show or git status; blocked: ${command}` };\n  }\n  if (RISKY_OPTIONS.test(command)) return { allow: false, reason: `git option not allowed for the reviewer: ${command}` };\n  return { allow: true };\n}\n\nasync function main() {\n  let raw = \"\";\n  for await (const chunk of process.stdin) raw += chunk;\n  let input;\n  try {\n    input = JSON.parse(raw);\n  } catch {\n    process.stderr.write(\"reviewer-bash-guard: could not parse hook input; blocking\\n\");\n    process.exit(2);\n  }\n  const { allow, reason } = decide(input);\n  if (!allow) {\n    process.stderr.write(`reviewer-bash-guard: ${reason}\\n`);\n    process.exit(2);\n  }\n  process.exit(0);\n}\n\nif (process.argv[1] && import.meta.url === pathToFileURL(resolve(process.argv[1])).href) main();\n","tag":"illustrative"},{"path":"AI-SDLC/docs/tutorials/level-2/examples/reviewer-bash-guard.test.mjs","language":"javascript","content":"// Tests for reviewer-bash-guard.mjs. Run from AI-SDLC/:\n//   node --test docs/tutorials/level-2/examples/reviewer-bash-guard.test.mjs\nimport { test } from \"node:test\";\nimport assert from \"node:assert/strict\";\nimport { spawnSync } from \"node:child_process\";\nimport { dirname, join } from \"node:path\";\nimport { fileURLToPath } from \"node:url\";\nimport { decide } from \"./reviewer-bash-guard.mjs\";\n\nconst HOOK = join(dirname(fileURLToPath(import.meta.url)), \"reviewer-bash-guard.mjs\");\n\nfunction run(input) {\n  const stdin = typeof input === \"string\" ? input : JSON.stringify(input);\n  return spawnSync(process.execPath, [HOOK], { input: stdin, encoding: \"utf8\" });\n}\n\nfunction bash(command) {\n  return {\n    session_id: \"test\",\n    hook_event_name: \"PreToolUse\",\n    permission_mode: \"default\",\n    agent_type: \"reviewer\",\n    tool_name: \"Bash\",\n    tool_input: { command, description: \"test\" },\n  };\n}\n\ntest(\"allows read-only git commands\", () => {\n  for (const c of [\"git diff\", \"git diff HEAD -- sample-app\", \"git log --oneline -5\", \"git show HEAD:sample-app/pom.xml\", \"git status --short\"]) {\n    assert.equal(decide(bash(c)).allow, true, c);\n  }\n});\n\ntest(\"blocks non-git and mutating commands\", () => {\n  for (const c of [\"mvn -q -B test\", \"rm -rf sample-app\", \"git commit -am wip\", \"git push\", \"git checkout -- .\", \"cat .env\", \"gitdiff\"]) {\n    assert.equal(decide(bash(c)).allow, false, c);\n  }\n});\n\ntest(\"blocks chaining, redirection and substitution\", () => {\n  for (const c of [\"git diff; rm -rf /tmp/x\", \"git diff && git push\", \"git diff | tee out.txt\", \"git diff > review.txt\", \"git log $(whoami)\", \"git diff `id`\", \"git status\\nrm x\"]) {\n    assert.equal(decide(bash(c)).allow, false, c);\n  }\n});\n\ntest(\"blocks git options that write files or run programs\", () => {\n  for (const c of [\"git diff --output=/tmp/x\", \"git diff --output /tmp/x\", \"git diff --ext-diff\", \"git log --textconv\", \"git -c core.pager=sh diff\"]) {\n    assert.equal(decide(bash(c)).allow, false, c);\n  }\n});\n\ntest(\"ignores other tools\", () => {\n  assert.equal(decide({ tool_name: \"Read\", tool_input: { file_path: \"sample-app/pom.xml\" } }).allow, true);\n});\n\ntest(\"process exit codes: 0 allow, 2 block with reason on stderr, 2 on bad JSON\", () => {\n  assert.equal(run(bash(\"git diff\")).status, 0);\n  const blocked = run(bash(\"git push origin main\"));\n  assert.equal(blocked.status, 2);\n  assert.match(blocked.stderr, /reviewer may only run git diff, git log, git show or git status; blocked: git push origin main/);\n  assert.equal(run(\"not json\").status, 2);\n});\n","tag":"illustrative"},{"path":"AI-SDLC/docs/tutorials/level-2/README.md","language":"markdown","content":"# Level 2 tutorial: your first agent, skill, and tools\n\nCompanion to module `02-first-agent-skill-tools`. Run every command from the `AI-SDLC/` directory\n(the Claude Code project root). Claude Code formats used here are the ones listed in\n`build/CLAUDE_CODE_FACTS.md` of the curriculum; nothing else is assumed.\n\n## What you build\n\n| File | Kind | Purpose |\n|---|---|---|\n| `evaluations/agent-versions/reviewer-v1.md` | subagent (v1 snapshot) | First, deliberately naive reviewer. Copied to `.claude/agents/reviewer.md` for the exercise. Module `05-agent-roster` replaces it with v2; module `09-agent-evaluation` compares the two. |\n| `.claude/skills/explain-endpoint/SKILL.md` + `reference.md` | skill | `/explain-endpoint GET /fhir/Patient/{id}` traces one route from security rule to SQL. |\n| `.claude/skills/run-tests/SKILL.md` + `scripts/summarize-surefire.mjs` | skill + script | `/run-tests [TestClass]` runs Maven with pre-approved commands and returns a compact summary. |\n| `docs/tutorials/level-2/examples/reviewer-v1-restricted.md` | subagent (iteration) | v1 with a tool allowlist, `permissionMode`, `maxTurns` and a subagent-scoped `PreToolUse` hook. |\n| `docs/tutorials/level-2/examples/reviewer-bash-guard.mjs` (+ test) | hook script | Narrows the reviewer's Bash to `git diff/log/show/status`. |\n| `docs/tutorials/level-2/patches/*.patch` | exercise input | Labelled defects for the reviewer and the test runner to find. They are not part of the app. |\n\n## Step 1: the first agent (reviewer v1)\n\nA subagent is one Markdown file: YAML frontmatter (only `name` and `description` are required) and\na body that becomes the subagent's **entire system prompt**. The subagent does not get the Claude\nCode system prompt or your conversation; it gets its body, the task message, the CLAUDE.md\nhierarchy, git status and any preloaded `skills`.\n\nWhere the file goes decides who sees it. For the same `name`, the higher entry wins:\n\n1. managed settings `.claude/agents/` (org-wide)\n2. `--agents '\u003cjson>'` on the command line (this session only)\n3. `.claude/agents/` in the project (closest to the working directory wins)\n4. `~/.claude/agents/` (all your projects)\n5. a plugin's `agents/` directory\n\nInstall v1 for the exercise:\n\n```bash\nmkdir -p .claude/agents .ai-sdlc/runs/level-2\ncp evaluations/agent-versions/reviewer-v1.md .claude/agents/reviewer.md\n```\n\nIf you are working in the finished reference repository, `.claude/agents/reviewer.md` already holds\nmodule 05's v2. Keep it, and copy v1 instead to `.claude/agents/reviewer-v1.md` with its `name:` line\nchanged to `reviewer-v1`. The first agent in a newly created `agents` directory is only picked up\nafter restarting Claude Code; later edits are hot-reloaded.\n\nGive it something to review. The patch below adds two labelled defects to `PatientService`\n(PHI in a log line; patient search without criteria returns every patient):\n\n```bash\ngit apply docs/tutorials/level-2/patches/02-review-exercise.patch\ngit diff --stat\n```\n\nRun it headless, two ways:\n\n```bash\n# a) Delegation: the main session decides to call the subagent\nclaude -p \"Use the reviewer subagent to review the uncommitted changes in sample-app.\" \\\n  --permission-mode plan --max-turns 10 --output-format json > .ai-sdlc/runs/level-2/review-v1.json\njq -r '.result' .ai-sdlc/runs/level-2/review-v1.json\njq '{subtype, is_error, num_turns, total_cost_usd}' .ai-sdlc/runs/level-2/review-v1.json\n\n# b) Main thread: the agent's body replaces the default system prompt for the whole session\nclaude -p \"Review the uncommitted changes in sample-app.\" --agent reviewer \\\n  --permission-mode plan --max-turns 10 --output-format json | jq -r '.result'\n```\n\n`--permission-mode plan` keeps the run read-only (v1 has no `tools` line, so it inherits every tool,\nincluding Edit and Write). `--max-turns` caps the loop; when hit, `subtype` is `error_max_turns`.\n\nCheck that delegation actually happened in (a) with the stream format, which contains the `Agent`\ntool call the main session made (the `jq` path follows the Agent SDK message shape; adjust it if your\nversion prints a different structure):\n\n```bash\nclaude -p \"Use the reviewer subagent to review the uncommitted changes in sample-app.\" \\\n  --permission-mode plan --max-turns 10 --output-format stream-json --verbose \\\n  | jq -r 'select(.type==\"assistant\") | .message.content[]? | select(.type==\"tool_use\" and .name==\"Agent\") | .input.subagent_type'\n# expected: reviewer\n```\n\nWhat to notice in the v1 output: it finds the problems, but as prose with no ids, no severities and\nno `path:line`. Nothing downstream can parse it, and two runs are hard to compare. That is the\npoint of v1; module 05 fixes it with an Agent Contract.\n\nUndo the patch when done: `git apply -R docs/tutorials/level-2/patches/02-review-exercise.patch`.\n\n## Step 2: the first skill (explain-endpoint)\n\nA skill is a directory with `SKILL.md`. Its `description` (plus `when_to_use`) is always in context so\nClaude can load it automatically; the body loads only when the skill is invoked. Frontmatter keys\nfor skills are hyphenated (`argument-hint`, `allowed-tools`, `disable-model-invocation`), unlike\nsubagent keys (`disallowedTools`, `permissionMode`, `maxTurns`).\n\n`explain-endpoint` shows three mechanisms:\n\n- `$ARGUMENTS` is replaced by everything after `/explain-endpoint`. (`$0` would be the first word\n  only, `$1` the second.)\n- `` !`grep -rnE \"@(Get|Post|Put|Delete|Request)Mapping\" sample-app/src/main/java/org/example/fhir/api` ``\n  runs **before** the prompt is sent, so Claude starts with the current route map instead of\n  spending turns finding it. The command must be allowed by permission rules, hence\n  `Bash(grep *)` in `allowed-tools`.\n- `reference.md` is a supporting file: the body links to it, and Claude reads it only when the skill\n  runs. It holds the repository map and the SQL each repository method produces, taken from a real\n  `-Dspring.jpa.show-sql=true` run.\n\nTry it:\n\n```bash\nclaude -p '/explain-endpoint GET /fhir/Observation/$lastn' --permission-mode plan --output-format json | jq -r '.result'\n```\n\nSingle quotes matter: in double quotes your shell would expand `$lastn` to an empty string.\n\n## Step 3: giving an agent tools (run-tests)\n\n`allowed-tools` **pre-approves** tools while the skill is active; it does not restrict them. The\nrun-tests skill pre-approves exactly the commands it needs:\n\n```yaml\nallowed-tools:\n  - Bash(mvn -q -B test)\n  - Bash(mvn -q -B test *)\n  - Bash(node .claude/skills/run-tests/scripts/summarize-surefire.mjs *)\n  - Bash(date *)\n  - Bash(git status *)\n```\n\nUse the YAML list form here: the rules themselves contain spaces.\n\nDesign choices worth copying:\n\n- **Maven is not run in a `!` injection.** A non-zero exit from an injected command aborts the whole\n  skill invocation, and `mvn test` exits non-zero exactly when you most need the report (a failing\n  test). The injections are cheap and always succeed: the invocation time (`date`) and\n  `git status --short -- sample-app`.\n- **A script turns Maven's noise into a summary.** Even with `-q`, a run of the 25 tests prints\n  hundreds of Spring and `AUDIT` log lines. `summarize-surefire.mjs` reads\n  `sample-app/target/surefire-reports/TEST-*.xml` and prints totals, a per-suite table and each\n  failure with its assertion message and failing line. It never prints `\u003csystem-out>`, so test log\n  output cannot leak into the prompt.\n- **`--since` drops stale reports.** Surefire does not delete reports from earlier runs. After\n  `/run-tests SecurityTest`, the old `PatientApiTest` report is still on disk; the injected\n  invocation time filters it out.\n- **The argument is validated before it reaches the shell.** `$ARGUMENTS` becomes `-Dtest=...`, so\n  the skill tells Claude to reject anything outside `^[A-Za-z0-9_#*,]+$`.\n\nTest the script without Claude:\n\n```bash\nnode --test .claude/skills/run-tests/scripts/summarize-surefire.test.mjs\n(cd sample-app && mvn -q -B test > /dev/null 2>&1); node .claude/skills/run-tests/scripts/summarize-surefire.mjs\n```\n\nThen introduce a labelled regression (clinicians allowed to DELETE) and let the skill find it:\n\n```bash\ngit apply docs/tutorials/level-2/patches/02-clinician-delete-regression.patch\nclaude -p \"/run-tests SecurityTest\" --output-format json | jq -r '.result'\ngit apply -R docs/tutorials/level-2/patches/02-clinician-delete-regression.patch\n```\n\nThe developer and tester agents preload this skill with `skills: [run-tests]` (module 05). Preloading\ninjects the skill content at startup; the agent still needs `Bash` in its `tools`, and the commands\nstill need to be allowed for that agent's session.\n\n## Step 4: restricting tools and scoping a hook to one agent\n\nFour controls, from coarse to fine:\n\n| Control | Where | Effect |\n|---|---|---|\n| `tools: Read, Grep, Glob, Bash` | subagent frontmatter | Allowlist. Omit it and the agent inherits every tool available to subagents, MCP tools included. |\n| `disallowedTools: Edit, Write` | subagent frontmatter | Denylist, removed from the inherited or listed set. `Bash(git push *)` here removes the **whole** Bash tool, so it cannot scope Bash. |\n| `permissionMode: dontAsk` | subagent frontmatter | Anything that would prompt is denied; tools allowed by `permissions.allow` still run. **Ignored when the parent session is in `bypassPermissions`, `acceptEdits` or `auto`.** |\n| `hooks:` with `PreToolUse` | subagent frontmatter | Runs only while this subagent is active, whatever the parent's mode. Exit code 2 blocks the call. |\n\n`examples/reviewer-v1-restricted.md` combines them. Its hook calls `reviewer-bash-guard.mjs`,\nwhich allows `git diff`, `git log`, `git show`, `git status` and blocks everything else, including\nchaining (`;`, `&&`, `|`), redirection, command substitution and `git diff --output=\u003cfile>`.\n\nTest the hook without Claude, then with it:\n\n```bash\nnode --test docs/tutorials/level-2/examples/reviewer-bash-guard.test.mjs\necho '{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"mvn -q -B test\"}}' | node docs/tutorials/level-2/examples/reviewer-bash-guard.mjs; echo \"exit=$?\"\n# reviewer-bash-guard: reviewer may only run git diff, git log, git show or git status; blocked: mvn -q -B test\n# exit=2\n\ncp docs/tutorials/level-2/examples/reviewer-v1-restricted.md .claude/agents/reviewer.md\nclaude -p \"Use the reviewer subagent to run mvn -q -B test and then add a comment to sample-app/src/main/java/org/example/fhir/service/PatientService.java.\" \\\n  --max-turns 10 --output-format json | jq -r '.result'\ngit status --short -- sample-app     # must print nothing\n```\n\nExpected: the reviewer reports that `mvn -q -B test` was blocked by the hook and that it has no\ntool to edit files. `git status` shows no change.\n\n## Testing and iteration loop\n\nTreat an agent like code. For every change to an agent or skill file:\n\n1. Change one thing (a tool, a sentence of the body, the output format).\n2. Re-run the same headless command against the same patch.\n3. Compare `result`, `num_turns`, `total_cost_usd` and `subtype` from `--output-format json`.\n4. Record the change and the observation in the iteration log below.\n\n| Version | Change | Observation |\n|---|---|---|\n| v1 | `name`, `description`, `model: inherit`, short body | Finds the PHI log line and the unbounded search, as prose. No severities or locations. Inherits Edit and Write. |\n| v1-restricted | `tools` allowlist, `permissionMode: dontAsk`, `maxTurns: 15`, Bash guard hook, findings table | Same findings in a table with `path:line`. Cannot edit; `mvn` blocked. |\n| v2 | Agent Contract, preloaded `code-review` skill | See module `05-agent-roster`; compared with v1 in module `09-agent-evaluation`. |\n\n## Clean up\n\n```bash\ngit apply -R docs/tutorials/level-2/patches/02-review-exercise.patch 2>/dev/null || true\ngit apply -R docs/tutorials/level-2/patches/02-clinician-delete-regression.patch 2>/dev/null || true\ngit status --short -- sample-app\n```\n","tag":"illustrative"}],"exampleInput":"cd AI-SDLC\ncp docs/tutorials/level-2/examples/reviewer-v1-restricted.md .claude/agents/reviewer.md\ngit apply docs/tutorials/level-2/patches/02-review-exercise.patch\nclaude -p \"Use the reviewer subagent to review the uncommitted changes in sample-app, then run mvn -q -B test and add a comment line to PatientService.java.\" \\\n  --max-turns 12 --output-format json | jq -r '.result'","expectedOutput":"| id | severity | category | location | evidence | recommendation |\n|---|---|---|---|---|---|\n| R1 | critical | security | sample-app/src/main/java/org/example/fhir/service/PatientService.java:31 | `log.info(\"Loaded patient {} {} (MRN {})\", patient.getGivenNames(), patient.getFamilyName(), patient.getMrn());` | Remove the log line; `AuditLogger.record(Action.READ, \"Patient\", id)` at line 30 already records the access by id (PHI policy: never log PHI). |\n| R2 | high | security | sample-app/src/main/java/org/example/fhir/service/PatientService.java:42 | `return patients.findAll();` | Restore `throw FhirApiException.badRequest(\"At least one search parameter (family, identifier) is required\")`; an unbounded patient listing exposes PHI and skips `audit.recordSearch`. |\n| R3 | medium | testing | sample-app/src/test/java/org/example/fhir/PatientApiTest.java:74 | `void searchWithoutParametersIs400()` | This test now fails; the change was made without updating or running tests (CLAUDE.md rule 2). |\n\nCorrectness, design, performance: no findings.\n\nNot done: `mvn -q -B test` was blocked (\"reviewer-bash-guard: reviewer may only run git diff, git log, git show or git status; blocked: mvn -q -B test\"), and I have no tool that edits files, so no comment was added.","testCases":[{"name":"Hook unit tests pass","input":"cd AI-SDLC && node --test docs/tutorials/level-2/examples/reviewer-bash-guard.test.mjs 2>&1 | grep -E '^# (pass|fail)'","expected":"# pass 6\n# fail 0"},{"name":"Hook blocks Maven with exit 2","input":"cd AI-SDLC && echo '{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"mvn -q -B test\"}}' | node docs/tutorials/level-2/examples/reviewer-bash-guard.mjs; echo \"exit=$?\"","expected":"reviewer-bash-guard: reviewer may only run git diff, git log, git show or git status; blocked: mvn -q -B test\nexit=2"},{"name":"Hook allows git diff with exit 0","input":"cd AI-SDLC && echo '{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"git diff HEAD -- sample-app\"}}' | node docs/tutorials/level-2/examples/reviewer-bash-guard.mjs; echo \"exit=$?\"","expected":"exit=0"},{"name":"Hook blocks chaining","input":"cd AI-SDLC && echo '{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"git diff && git push\"}}' | node docs/tutorials/level-2/examples/reviewer-bash-guard.mjs; echo \"exit=$?\"","expected":"reviewer-bash-guard: shell operators are not allowed for the reviewer: git diff && git push\nexit=2"},{"name":"Allowlist has no write tools and no Agent","input":"grep -E '^tools:' AI-SDLC/docs/tutorials/level-2/examples/reviewer-v1-restricted.md","expected":"tools: Read, Grep, Glob, Bash"},{"name":"Hook is scoped in the agent, not in settings","input":"grep -c 'reviewer-bash-guard' AI-SDLC/.claude/settings.json; sed -n '/^hooks:/,/^---/p' AI-SDLC/docs/tutorials/level-2/examples/reviewer-v1-restricted.md | head -3","expected":"0, then:\nhooks:\n  PreToolUse:\n    - matcher: \"Bash\""},{"name":"Headless run: no edits","input":"The exampleInput command, then: cd AI-SDLC && git diff --stat","expected":"Only PatientService.java from the patch (8 lines changed); the comment line was not added. The result mentions the blocked `mvn -q -B test`."},{"name":"Parent mode overrides permissionMode, hook still holds","input":"claude -p \"Use the reviewer subagent to run mvn -q -B test\" --permission-mode acceptEdits --max-turns 6 --output-format json | jq -r '.result'","expected":"Still blocked by reviewer-bash-guard: `permissionMode: dontAsk` is ignored under acceptEdits, but the subagent's PreToolUse hook is not."}],"evaluationCriteria":["The restricted agent keeps `name: reviewer`, so it replaces v1 rather than adding a second reviewer.","`tools` is an explicit allowlist; the learner can say why `disallowedTools: Bash(mvn *)` would have removed all of Bash.","The hook fails closed (unparseable input exits 2) and blocks shell chaining, redirection and substitution.","The learner can name the three parent modes under which `permissionMode` is ignored.","The iteration log in the tutorial records the change and the observed difference from v1."],"improvements":["Return a JSON `permissionDecision: \"deny\"` with `permissionDecisionReason` from the hook instead of exit 2, and compare what the agent sees.","Add a `Stop` hook to the agent's frontmatter (it becomes `SubagentStop`) that exits 2 when the final message has no findings table.","Move the guard to `.claude/hooks/` and register it in settings with `if: \"Bash(*)\"` only if a second agent needs it (module 10 owns settings)."]}],"agentContracts":[],"checklist":["`AI-SDLC/evaluations/agent-versions/reviewer-v1.md` exists, has only `name`, `description`, `model` in its frontmatter, and is unchanged after the exercises.","`claude -p \"Use the reviewer subagent ...\" --output-format stream-json --verbose` shows an `Agent` tool call with `subagent_type` `reviewer`.","The v1 review of `02-review-exercise.patch` mentions both the PHI log line and `patients.findAll()`.","`/explain-endpoint GET /fhir/Observation/$lastn` cites `ObservationService.java` loop lines and reports 2 statements per subject.","Every `!` command in both skills is listed in that skill's `allowed-tools` and exits 0 (or grep's 1) on a clean checkout.","`node --test .claude/skills/run-tests/scripts/summarize-surefire.test.mjs` passes 6 of 6.","`/run-tests SecurityTest` with the regression patch reports `SecurityTest.clinicianCannotDelete` and `NOT READY`.","`node --test docs/tutorials/level-2/examples/reviewer-bash-guard.test.mjs` passes 6 of 6.","With `reviewer-v1-restricted.md` installed, the reviewer cannot run `mvn` or edit files, even with `--permission-mode acceptEdits`.","Both patches are reverted: `git status --short -- sample-app` prints nothing, and `cd sample-app && mvn -q -B test` passes 25 tests."]}]};
</script>

  function inline(s) { if (window.marked && marked.parseInline) { try { return marked.parseInline(String(s)); } catch (e) {} } return esc(s); }

  }
  function listHtml(a) { return '<ul class="criteria">' + (a || []).map(function (s) { return "<li>" + inline(s) + "</li>"; }).join("") + "</ul>"; }
  function exercisePanel(x, key) {

      case "startingFiles": return (x.startingFiles || []).length ? x.startingFiles.map(function (f) { return codeBlock(f.path, extOf(f.path), f.content); }).join("") : "<p>No starting files. You begin from the current state of the repository.</p>";

      case "exampleInput": return codeBlock("example input", guessLang(x.exampleInput), x.exampleInput);

      case "testCases": return (x.testCases || []).map(function (t) {

  function extOf(p) { var m = /\.([a-z0-9]+)$/i.exec(p || ""); if (/Dockerfile$/.test(p || "")) return "dockerfile"; return m ? m[1] : "plaintext"; }

  function exerciseHtml(x) {

  function renderType(t) {

    } else {

  function renderSearch(q) {
    q = q.trim(); var ql = q.toLowerCase(), out = [];

    function snip(text) {
      var t = String(text || ""), i = t.toLowerCase().indexOf(ql); if (i < 0) return null;

  /* ---------- enhancement: highlight, copy, mermaid ---------- */

  /* ---------- router ---------- */
  var lastRoute = "";

    else if (h.indexOf("m-") === 0) { var m = findMod(h.slice(2)); m ? renderModule(m) : renderNotFound(); }
    else if (h.indexOf("x-") === 0) { var e = findEx(h.slice(2)); e ? renderModule(e.m, e.x.id) : renderNotFound(); }
    else if (h.indexOf("c-") === 0) { renderType("contracts"); }
    else if (h.indexOf("t-") === 0) renderType(h.slice(2));
    else if (h.indexOf("f~") === 0) renderFile(h);
    else if (h.indexOf("s-") === 0) renderSearch(h.slice(2).replace(/_/g, " "));

  /* ---------- zip download ---------- */
  function download() {

    files.forEach(function (e) { if (e.kind === "implementation") impl[e.f.path] = e.f.content; });
    Object.keys(impl).forEach(function (p) { zip.file(p, impl[p]); });
    files.forEach(function (e) {
      if (e.kind !== "starting") return;
      var p = impl[e.f.path] !== undefined ? "starting-files/" + e.x.id + "/" + e.f.path : e.f.path;
      zip.file(p, e.f.content);
    });
    zip.file("AI-SDLC/STARTER_README.md", "# AI-SDLC starter repo\n\nGenerated from the curriculum SPA (" + MODULES.length + " modules, " + exercises.length + " exercises).\n\n" +
      "Implementation files are at their real paths. Starting files that would overwrite an implementation file are under `starting-files/<exercise-id>/`.\n\n" +
      "The Java sample app is included only where exercises embed its files; clone the full reference repository for the complete `sample-app/`.\n");
    btn.textContent = "Building zip…";
    zip.generateAsync({ type: "blob" }).then(function (blob) {
      try {
        var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "ai-sdlc-starter.zip";
        document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
        btn.textContent = "Download starter repo";
      } catch (e) { btn.textContent = "Download blocked by this viewer"; }
    }, function () { btn.textContent = "Zip failed, try again"; });
  }

    route();
  }
  (function () { var t = store.get("ai-sdlc-theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); })();
  var scrim = null;
  function closeScrim() { if (scrim) { scrim.remove(); scrim = null; } document.getElementById("nav-toggle").setAttribute("aria-expanded", "false"); }
  document.getElementById("nav-toggle").addEventListener("click", function () {
    var open = !document.body.classList.contains("nav-open");
    document.body.classList.toggle("nav-open", open);
    this.setAttribute("aria-expanded", String(open));
    if (open) { scrim = document.createElement("div"); scrim.className = "scrim"; scrim.addEventListener("click", function () { document.body.classList.remove("nav-open"); closeScrim(); }); document.body.appendChild(scrim); }
    else closeScrim();
  });
  document.getElementById("theme-toggle").addEventListener("click", toggleTheme);
  document.getElementById("theme-toggle-m").addEventListener("click", toggleTheme);
  document.getElementById("download").addEventListener("click", download);
  var qt = null;
  document.getElementById("q").addEventListener("input", function () {
    var v = this.value; clearTimeout(qt);
    qt = setTimeout(function () { if (v.trim().length >= 2) renderSearch(v); else if (lastRoute) route(); enhance(view); }, 180);
  });
  window.addEventListener("hashchange", route);

  buildNav(); updateProgress(); route();
})();
</script>
