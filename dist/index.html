* { box-sizing: border-box; }
html, body { margin: 0; }

<script>
window.CURRICULUM = {"builtAt":"2026-09-30T03:09:07.426Z","modules":[{"id":"00-example","level":1,"title":"Orientation: Project Memory and Context Engineering","summary":"Tour the AI-SDLC reference repository and give Claude Code the project knowledge every later agent depends on: a lean CLAUDE.md with on-demand imports, path-scoped rules for the Java code, and a context pack (domain, security, standards) that keeps PHI out of every prompt.","prerequisites":["Git and a terminal","Java 21 and Maven 3.9 installed","Claude Code CLI installed and authenticated (`claude --version`)"],"concepts":[{"heading":"Why context comes before agents","body_md":"A subagent starts with **no conversation history**. Per the docs it receives its own system prompt (the body of its `.claude/agents/\u003cname>.md` file), the task message the main session sends it, basic environment details, git status, and the **CLAUDE.md hierarchy**. That last item is the only project knowledge every agent gets for free.\n\nSo in practice the quality of every agent in this course is capped by three files you write in this module:\n\n- `AI-SDLC/CLAUDE.md`: what the repo is, the commands that prove a change works, and the non-negotiable rules (no PHI, tests must pass, never push).\n- `AI-SDLC/.claude/rules/*.md`: rules that load only when Claude works on matching paths.\n- `AI-SDLC/context/**`: longer reference material (architecture, standards, threat model, glossary) that agents read *when the task needs it*.\n\nA senior engineer onboarding to a codebase reads the README, the architecture doc, and the contributing guide before touching code. CLAUDE.md is where you tell Claude which of those to read, and when."},{"heading":"How CLAUDE.md loads (verified behaviour)","body_md":"From `build/CLAUDE_CODE_FACTS.md` §6:\n\n- Project memory lives in `./CLAUDE.md` or `./.claude/CLAUDE.md`. Personal overrides go in `./CLAUDE.local.md` (git-ignored).\n- Claude Code walks from the working directory **up** to the root and **concatenates** every CLAUDE.md it finds, root first. Nothing overrides; closer files are read last.\n- CLAUDE.md files in **subdirectories** load on demand, when Claude reads files in that directory.\n- `@path/to/file` imports another file, relative to the importing file, up to 4 hops deep. Imports are not expanded inside code spans or code blocks.\n- Target under 200 lines. Everything in CLAUDE.md costs tokens on *every* turn of *every* agent.\n\nThe design consequence: put **rules and commands** in CLAUDE.md, put **reference material** in `context/`, and import only the two or three files almost every task needs. Name the rest by path so agents can `Read` them when relevant."},{"heading":"Path-scoped rules with .claude/rules","body_md":"`.claude/rules/**/*.md` files are loaded as project instructions. The only frontmatter field Claude Code reads there is `paths` (a list of globs). A rule with `paths` applies only when Claude works with matching files; a rule without `paths` loads at launch like CLAUDE.md.\n\nUse this for stack-specific guidance that would be noise elsewhere. The Java conventions for `sample-app/` (records for DTOs, `OperationOutcome` via `GlobalExceptionHandler`, ids-only logging through `AuditLogger`) matter when editing `sample-app/src/**/*.java` and are irrelevant when the tester agent edits an eval dataset.\n\nKeep rules **testable**. \"Write clean code\" cannot be checked; \"New endpoints need MockMvc tests for success, 4xx, 401 and 403\" can be checked by the reviewer agent and by a human in code review."},{"heading":"The context pack and PHI","body_md":"Healthcare adds a constraint most tutorials skip: **anything an agent reads can end up in a prompt, a log, a commit message, or an MCP call to Jira or GitHub.** The context pack therefore does two jobs:\n\n1. **Informs**: `context/domain/fhir-lite-glossary.md` defines Patient, Observation, Bundle, OperationOutcome, MRN, and LOINC codes exactly as the sample app implements them, so agents stop inventing FHIR fields that do not exist here.\n2. **Constrains**: the same glossary classifies each field as PHI or not, and `context/security/phi-and-secrets-policy.md` states where PHI may never appear. Later modules enforce this with real mechanisms (`permissions.deny` rules and a `PreToolUse` hook), because an instruction alone is not a control.\n\n**Rule of thumb:** instructions describe intent, permissions and hooks enforce it. Write both."},{"heading":"What the reference repository contains","body_md":"`AI-SDLC/` is the Claude Code project root. It already contains the sample app and the shared configuration you build on:\n\n- `sample-app/`: Spring Boot 3.5 FHIR-lite API with 25 passing tests and one labelled teaching defect (`TEACHING-DEFECT(perf-n+1)` in `ObservationService.lastN`).\n- `.claude/settings.json`: permission `allow`/`ask`/`deny` rules and a `PreToolUse` hook that blocks secrets in file writes.\n- `.claude/agents/`, `.claude/skills/`: filled in by later modules.\n- `agents/\u003cname>/CONTRACT.md`: the Agent Contract for each roster agent (architect, developer, reviewer, tester, security, sre, orchestrator).\n- `workflows/`, `evaluations/`, `docs/`: workflow specs, the eval harness, ADRs, and runbooks.\n\nEvery exercise in the course edits or runs something in this tree. Nothing is hypothetical."}],"diagrams":[{"title":"What a subagent actually receives at start-up","mermaid":"flowchart LR\n  A[\"Agent file body\u003cbr/>(.claude/agents/NAME.md)\"] --> S((\"Subagent context\"))\n  T[\"Task message from main session\"] --> S\n  C[\"CLAUDE.md hierarchy\"] --> S\n  G[\"git status + env details\"] --> S\n  K[\"Preloaded skills (skills field)\"] --> S\n  H[\"Main-session history\"] -. \"not passed\" .-> S\n  O[\"Output style / auto memory\"] -. \"not passed\" .-> S"},{"title":"Where project knowledge lives","mermaid":"flowchart TD\n  CM[\"CLAUDE.md: rules and commands, loaded every turn\"] -->|\"@import\"| AO[\"context/architecture/overview.md\"]\n  CM -->|\"@import\"| GL[\"context/domain/fhir-lite-glossary.md\"]\n  CM -->|\"@import\"| PP[\"context/security/phi-and-secrets-policy.md\"]\n  CM -.->|\"named, read on demand\"| ST[\"context/standards/*.md\"]\n  R[\".claude/rules/sample-app-java.md\"] -->|\"paths: sample-app/src/**/*.java\"| J[\"Java edits only\"]"}],"comparisonTables":[{"title":"Where should this piece of knowledge go?","columns":["Mechanism","Loaded when","Good for","Bad for","Example in this repo"],"rows":[["`CLAUDE.md`","Every turn, every agent","Commands, hard rules, repo map","Long reference docs","`AI-SDLC/CLAUDE.md`"],["`@import` from CLAUDE.md","With CLAUDE.md","The 2-3 docs nearly every task needs","Docs only one agent needs","`@context/domain/fhir-lite-glossary.md`"],["`.claude/rules/*.md` with `paths`","When Claude works on matching files","Stack- or folder-specific conventions","Global rules","`.claude/rules/sample-app-java.md`"],["`context/**` file (not imported)","When an agent reads it","Standards, threat model, ADRs","Rules that must always apply","`context/standards/testing-standards.md`"],["Agent file body","Only in that subagent","Role-specific procedure","Project facts all agents need","`.claude/agents/reviewer.md` (module 05)"],["`CLAUDE.local.md`","Every turn, only on your machine","Personal preferences","Anything the team relies on","git-ignored"]]}],"exercises":[{"id":"00-claude-md","title":"Write a lean project CLAUDE.md with imports","objective":"Create `AI-SDLC/CLAUDE.md` that tells any agent what the repo is, which commands prove a change works, and which rules are non-negotiable, while importing only the three context files nearly every task needs. Verify that Claude Code actually loads it by asking a question only CLAUDE.md can answer.","startingFiles":[{"path":"AI-SDLC/CLAUDE.md","content":"# AI-SDLC\n\nThis is a Spring Boot project. Please write good code and tests.\n"}],"requiredStructure":"AI-SDLC/\n├── CLAUDE.md                                  # \u003c 200 lines, 3 @imports\n├── context/\n│   ├── architecture/overview.md\n│   ├── domain/fhir-lite-glossary.md\n│   └── security/phi-and-secrets-policy.md\n└── sample-app/                                # unchanged","implementation":[{"path":"AI-SDLC/CLAUDE.md","language":"markdown","content":"# AI-SDLC reference repository\n\nThis repository is a working AI-assisted SDLC system for a small FHIR-lite API. It contains Claude Code subagents, skills, hooks, workflows, evaluations, and the Java service they operate on.\n\n## Layout\n- `sample-app/`: Java 21 / Spring Boot 3.5 FHIR-lite Patient/Observation API. Build and test with `mvn -q -B test` from `sample-app/`.\n- `.claude/agents/`: subagents: architect, developer, reviewer, tester, security, sre, orchestrator.\n- `.claude/skills/`: skills (architecture-review, code-review, test-strategy, security-review, performance-review, production-rca, and workflow entry points).\n- `agents/\u003cname>/CONTRACT.md`: the Agent Contract each subagent must satisfy. Treat it as the spec.\n- `workflows/`: feature-delivery, bug-fix, incident-response.\n- `context/`: architecture, standards, security, domain. Read the relevant file before acting.\n- `evaluations/`: golden datasets and the eval harness.\n\n## Context to load on demand\n- Architecture: @context/architecture/overview.md\n- Domain terms and PHI classification: @context/domain/fhir-lite-glossary.md\n- Security and PHI policy: @context/security/phi-and-secrets-policy.md\n- Standards live in `context/standards/` (coding, testing, API, review). Read the one that matches the task; do not load all of them.\n\n## Rules\n1. Never put PHI or secrets in code, logs, prompts, test fixtures, commit messages, or MCP calls. Use synthetic data such as `MRN-000123`.\n2. Every change to `sample-app/` needs tests, and `mvn -q -B test` must pass before you report completion.\n3. Follow the layering in `context/standards/coding-standards.md`: controllers call services, services call repositories.\n4. Findings use the format in `context/standards/review-standards.md` (id, severity, category, location, evidence, recommendation).\n5. Agent handoffs go to `.ai-sdlc/runs/\u003crun-id>/NN-\u003cagent>.md` with the YAML front matter defined in `workflows/README.md`.\n6. Do not fix the `TEACHING-DEFECT(perf-n+1)` in `sample-app` unless the task explicitly asks for it; exercises depend on it.\n7. Never push, merge, or deploy. A human does that after review.\n\n## Commands\n- Test: `cd sample-app && mvn -q -B test`\n- Run locally: `cd sample-app && mvn spring-boot:run -Dspring-boot.run.profiles=local`\n- Evals (offline replay): `node evaluations/harness/run-evals.mjs --mode replay`\n","tag":"verified-format"},{"path":"AI-SDLC/.gitignore","language":"plaintext","content":".ai-sdlc/runs/\n.claude/settings.local.json\nCLAUDE.local.md\nevaluations/reports/live-*\nsample-app/target/\n.env\n.env.*\n","tag":"illustrative"}],"exampleInput":"cd AI-SDLC\nclaude -p \"Without running anything: what exact command runs the sample-app tests, and what must never appear in logs? Answer in two bullet points.\" --output-format json | jq -r '.result'","expectedOutput":"- Run `cd sample-app && mvn -q -B test` (tests must pass before reporting completion).\n- PHI must never appear in logs: log resource ids only, never MRN, names, birth dates, or observation values linked to a patient.","testCases":[{"name":"CLAUDE.md stays lean","input":"wc -l AI-SDLC/CLAUDE.md","expected":"Fewer than 200 lines (the reference file is about 40)."},{"name":"Exactly three imports","input":"grep -c '^- .*@context/' AI-SDLC/CLAUDE.md","expected":"3"},{"name":"Imported files exist","input":"for p in $(grep -o '@context/[^ ]*' AI-SDLC/CLAUDE.md | tr -d '@'); do test -f AI-SDLC/$p && echo ok $p; done","expected":"ok context/architecture/overview.md\nok context/domain/fhir-lite-glossary.md\nok context/security/phi-and-secrets-policy.md"},{"name":"Claude answers from memory, not by guessing","input":"The exampleInput command above","expected":"The answer names `mvn -q -B test` inside `sample-app` and the ids-only logging rule. If it says `./gradlew test` or `mvn test` without `-q -B`, CLAUDE.md was not loaded (check you ran it from inside AI-SDLC/)."},{"name":"Local overrides stay out of git","input":"grep -x 'CLAUDE.local.md' AI-SDLC/.gitignore","expected":"CLAUDE.local.md"}],"evaluationCriteria":["Every rule is checkable by a reviewer (no \"write clean code\").","Commands are copy-pasteable and correct for this repo.","Long reference material is linked or imported, not pasted inline.","PHI and secrets rules are stated explicitly and point to the policy file.","The file names the roster agents and where their contracts live."],"improvements":["Run `/memory` in an interactive session to confirm which memory files loaded.","Move the Commands section into a `context/standards/commands.md` if it grows past ten lines, and import it.","Add a subdirectory `sample-app/CLAUDE.md` for Maven-specific tips; it loads only when Claude reads files there."]},{"id":"00-path-scoped-rules","title":"Add a path-scoped rule for the Java code","objective":"Create `.claude/rules/sample-app-java.md` with a `paths` glob so the Java conventions load only when Claude works on `sample-app/src/**/*.java`. Show that a question about an eval JSON file does not pull the rule in, while a Java edit does.","startingFiles":[],"requiredStructure":"AI-SDLC/.claude/\n└── rules/\n    └── sample-app-java.md   # frontmatter: paths: [\"sample-app/src/**/*.java\"]","implementation":[{"path":"AI-SDLC/.claude/rules/sample-app-java.md","language":"markdown","content":"---\npaths:\n  - \"sample-app/src/**/*.java\"\n---\n\n# Java rules for sample-app\n\n- Java 21, Spring Boot 3.5, package `org.example.fhir`.\n- DTOs are Java records in `api/`; never return JPA entities from controllers.\n- Throw `FhirApiException` subclasses or use its factory methods; `GlobalExceptionHandler` turns them into `OperationOutcome`.\n- Log through `AuditLogger` for patient access. Log ids only.\n- New endpoints need MockMvc tests for success, 4xx, 401, and 403 (see `SecurityTest`).\n- No queries inside loops over entities (the one exception is the marked teaching defect).\n","tag":"verified-format"}],"exampleInput":"cd AI-SDLC\nclaude -p \"Add a GET /fhir/Patient/{id}/\\$summary endpoint plan (do not edit files). Which conventions from this repo apply to the controller and its tests?\" --permission-mode plan --output-format json | jq -r '.result'","expectedOutput":"Conventions that apply:\n1. Return a `PatientResource` record from `api/`, never the `Patient` JPA entity.\n2. Missing patient: throw via `FhirApiException` so `GlobalExceptionHandler` returns a 404 `OperationOutcome`.\n3. Record access through `AuditLogger` with the patient id only.\n4. MockMvc tests: 200 success, 404 unknown id, 401 without credentials, 403 wrong role if restricted.\n5. No per-row queries in a loop.","testCases":[{"name":"Frontmatter has only paths","input":"sed -n '1,4p' AI-SDLC/.claude/rules/sample-app-java.md","expected":"---\npaths:\n  - \"sample-app/src/**/*.java\"\n---"},{"name":"Rule is specific and checkable","input":"grep -c '^- ' AI-SDLC/.claude/rules/sample-app-java.md","expected":"6 bullet rules, each naming a concrete class, annotation, or test type."},{"name":"Java task picks up the rule","input":"The exampleInput command","expected":"Output mentions `AuditLogger`, `OperationOutcome`/`FhirApiException`, and 401/403 tests."},{"name":"No rule leakage for non-Java work","input":"claude -p \"Which conventions apply when editing evaluations/datasets/architecture-golden.json?\" --permission-mode plan","expected":"No mention of `AuditLogger` or MockMvc; answer refers to eval dataset conventions instead."}],"evaluationCriteria":["Uses `paths` as the only frontmatter key (the only one Claude Code reads for rules).","Glob matches the Java sources and nothing else.","Each rule references a real type in `sample-app` (verify with grep).","Does not duplicate content already in CLAUDE.md."],"improvements":["Add `.claude/rules/k8s-manifests.md` with `paths: [\"sample-app/k8s/**\"]` for resource-limit and probe rules the sre agent relies on.","Add a rule for `sample-app/src/main/resources/db/migration/**` stating that applied migrations are immutable."]},{"id":"00-context-pack","title":"Build the domain and PHI context pack","objective":"Write the FHIR-lite glossary with a PHI classification table and the PHI and secrets policy, then prove the pack changes agent behaviour: ask Claude to draft a log line for a patient lookup before and after the pack exists, and compare.","startingFiles":[{"path":"AI-SDLC/context/domain/fhir-lite-glossary.md","content":"# Glossary\n\nPatient: a patient.\nObservation: a measurement.\n"}],"requiredStructure":"AI-SDLC/context/\n├── domain/\n│   └── fhir-lite-glossary.md         # terms, business rules, PHI table\n└── security/\n    ├── phi-and-secrets-policy.md     # where PHI/secrets may never appear\n    └── threat-model.md               # STRIDE summary used by the security agent","implementation":[{"path":"AI-SDLC/context/domain/fhir-lite-glossary.md","language":"markdown","content":"# FHIR-lite domain glossary\n\nThe sample app (`sample-app/`) implements a deliberately small subset of HL7 FHIR R4 shapes. It is **not** a conformant FHIR server. Agents must use these terms exactly.\n\n| Term | Meaning in this repo |\n|---|---|\n| Resource | A JSON document with a `resourceType` field. Only `Patient`, `Observation`, `Bundle`, `OperationOutcome` exist. |\n| Patient | A person receiving care. Fields: `id`, `identifier[]` (MRN, system `urn:example:mrn`), `name[]` (`family`, `given[]`), `gender` (`male`, `female`, `other`, `unknown`), `birthDate` (ISO date), `active` (boolean). |\n| MRN | Medical Record Number. Unique per patient. Synthetic values only, format `MRN-` + 6 digits. |\n| Observation | A measurement about a patient. Fields: `id`, `status` (`registered`, `preliminary`, `final`, `amended`), `code` (LOINC `system`, `code`, `display`), `subject.reference` (`Patient/{id}`), `effectiveDateTime`, `valueQuantity` (`value`, `unit`). |\n| LOINC | Code system for observations, `http://loinc.org`. Common codes used in tests: `8867-4` heart rate, `8480-6` systolic BP, `29463-7` body weight. |\n| Bundle | Search result wrapper: `{ \"resourceType\": \"Bundle\", \"type\": \"searchset\", \"total\": n, \"entry\": [{ \"resource\": {...} }] }`. |\n| OperationOutcome | Error body: `{ \"resourceType\": \"OperationOutcome\", \"issue\": [{ \"severity\", \"code\", \"diagnostics\" }] }`. Returned for every 4xx/5xx. |\n| Subject reference | The string `Patient/{id}`. Observations must reference an existing Patient. |\n\n## Business rules\n\n1. A Patient must have exactly one MRN identifier; MRN is unique (409/422 on duplicate).\n2. `birthDate` cannot be in the future.\n3. An Observation's `subject` must resolve to an existing, `active` Patient.\n4. `status = final` Observations are immutable; corrections create an `amended` Observation.\n5. Delete is ADMIN-only and is a soft concern in real systems; here it is a hard delete used only in tests.\n6. Search results are always a `Bundle`, even when empty (`total: 0`).\n\n## PHI classification\n\n| Field | PHI? | May appear in logs? |\n|---|---|---|\n| Patient `id` (surrogate key) | No (opaque) | Yes |\n| MRN | **Yes** | No |\n| name, birthDate, gender | **Yes** | No |\n| Observation values linked to a patient | **Yes** | No (log observation id only) |\n| LOINC code | No | Yes |\n","tag":"illustrative"},{"path":"AI-SDLC/context/security/phi-and-secrets-policy.md","language":"markdown","content":"# PHI and secrets policy (agents and humans)\n\nThis policy applies to code, logs, prompts, eval datasets, commit messages, and anything an agent sends to an MCP server.\n\n## PHI\n- Never log PHI. Log resource ids, request ids, and outcome codes only (see `sample-app` `AuditLogger`).\n- Never paste real patient data into a prompt, a skill, an eval case, or a Jira/GitHub comment. Use synthetic data (`MRN-000123`, \"Test Patient\").\n- Error responses (`OperationOutcome.diagnostics`) must not echo request bodies containing PHI.\n- Agents must not read files under `sample-app/data/real/` or any path matching `**/*.phi.*` (enforced by `permissions.deny` in `.claude/settings.json`).\n\n## Secrets\n- No secrets in the repo. Database passwords come from environment variables locally and from a Kubernetes `Secret` in the cluster.\n- `.env`, `.env.*`, `**/secrets/**` are denied to agents via `permissions.deny`.\n- MCP server credentials are passed with `${VAR}` expansion in `.mcp.json`, never inline.\n- A `PreToolUse` hook blocks writes that contain likely secrets (see `.claude/hooks/`).\n\n## Authentication and authorization (sample app)\n- All `/fhir/**` endpoints require authentication. `/actuator/health/**` is public.\n- Roles: `CLINICIAN` (read/write Patient and Observation), `ADMIN` (everything, including DELETE).\n- Authorization is enforced server-side per endpoint; never trust client-supplied role claims.\n\n## Review severities\n`critical` (exploitable now, PHI exposure, auth bypass) · `high` (exploitable with effort, missing authZ on a write path) · `medium` (defence-in-depth gap) · `low` (hardening) · `info`.\n","tag":"illustrative"},{"path":"AI-SDLC/context/security/threat-model.md","language":"markdown","content":"# Threat model: FHIR-lite API (STRIDE summary)\n\n| Asset | Threat | STRIDE | Current control | Gap / agent check |\n|---|---|---|---|---|\n| Patient records | Unauthenticated read | Spoofing / Info disclosure | Spring Security, all `/fhir/**` authenticated | security agent verifies every new endpoint is covered by the filter chain |\n| Patient records | Clinician deletes data | Elevation of privilege | `DELETE` restricted to `ADMIN` | security agent checks role annotations/matchers on new write endpoints |\n| Search parameters | SQL injection via `family` / `identifier` | Tampering | Spring Data derived queries (parameterised) | reviewer and security flag any string-concatenated JPQL/SQL |\n| Logs | PHI leakage | Info disclosure | `AuditLogger` logs ids only | security agent greps for logging of request bodies or names |\n| DB credentials | Secret in repo/manifests | Info disclosure | env vars + k8s `Secret` | hook blocks secret-like strings; security agent scans manifests |\n| Availability | Unbounded search / N+1 | Denial of service | page size cap (planned) | sre / performance-review flags missing limits and N+1 |\n| Agent tooling | Prompt injection via repo or MCP content | Tampering / Elevation | permissions deny-list, human gates | see `docs/governance/prompt-injection.md` |\n","tag":"illustrative"}],"exampleInput":"cd AI-SDLC\nclaude -p \"Write the SLF4J log statement PatientService.read(id) should emit after loading a Patient. One line of Java, then one sentence explaining the choice.\" --permission-mode plan --output-format json | jq -r '.result'","expectedOutput":"Before the context pack (typical):\nlog.info(\"Loaded patient {} {} (MRN {})\", p.getGivenNames(), p.getFamilyName(), p.getMrn());\n\nAfter the context pack:\naudit.recordRead(\"Patient\", patient.getId());\nPatient names, MRN and birth date are PHI under context/domain/fhir-lite-glossary.md, so only the opaque resource id is logged, through AuditLogger.","testCases":[{"name":"PHI table covers every Patient field","input":"grep -E '^\\| (MRN|name, birthDate, gender|Patient `id`)' AI-SDLC/context/domain/fhir-lite-glossary.md | wc -l","expected":"3"},{"name":"Policy names the enforcing mechanisms","input":"grep -E 'permissions.deny|PreToolUse' AI-SDLC/context/security/phi-and-secrets-policy.md","expected":"At least one line referencing `permissions.deny` and one referencing the `PreToolUse` hook."},{"name":"Behaviour change","input":"Run exampleInput with and without the glossary import in CLAUDE.md","expected":"Without: log line contains name or MRN. With: log line contains only the id, via `AuditLogger`."},{"name":"No real data","input":"grep -rE 'MRN-[0-9]{6}' AI-SDLC/context | grep -v 'MRN-000'","expected":"No output: only synthetic MRN-000xxx values appear."}],"evaluationCriteria":["Glossary terms match the actual sample-app DTO field names.","Every PHI field has an explicit may-appear-in-logs answer.","Policy distinguishes intent (instructions) from enforcement (permissions, hooks).","Threat model rows map to a check a specific roster agent performs."],"improvements":["Add `context/domain/loinc-codes.md` listing the LOINC codes the tests use, so the tester agent stops inventing codes.","Add a `context/security/data-retention.md` once the app stores audit events.","Turn the PHI table into a machine-readable `phi-fields.json` that a hook can use to scan diffs."]}],"agentContracts":[],"checklist":["`AI-SDLC/CLAUDE.md` is under 200 lines and has exactly three `@context/...` imports that resolve.","`claude -p` run from `AI-SDLC/` answers the test command as `mvn -q -B test` inside `sample-app/`.","`.claude/rules/sample-app-java.md` uses only the `paths` frontmatter key.","The glossary classifies every Patient and Observation field as PHI or not.","The PHI policy names the enforcing mechanisms (deny rules, hook), not just the intent.","`CLAUDE.local.md` and `.ai-sdlc/runs/` are git-ignored.","`cd AI-SDLC/sample-app && mvn -q -B test` passes (25 tests)."]},{"id":"01-foundations","level":1,"title":"Foundations: Agent Anatomy, Primitives and the Agent Contract","summary":"Learn what separates an agent from a prompt or a template, take an agent apart into twelve anatomy elements and map each one to the Claude Code mechanism that implements it (or admit it is only a convention), choose correctly between prompt, skill, agent, workflow, MCP server and hook, and write your first Agent Contract, validated by a script you run.","prerequisites":["00-example","Node 22 (`node --version`)","Claude Code CLI installed and authenticated (`claude --version`)","Comfort reading a Spring Boot service layer"],"concepts":[{"heading":"Prompt, template, agent: what actually differs","body_md":"A **prompt** is one instruction inside the conversation you are already in. It borrows everything from that conversation: its history, its tools, its permission mode, and your attention to check the answer. A **template** is a prompt you saved so you can paste it again. In Claude Code the saved, versioned form of a template is a **skill** (`.claude/skills/\u003cname>/SKILL.md`): same idea, plus supporting files, arguments (`$ARGUMENTS`, `$0` for the first one) and an optional `/name` entry point.\n\nAn **agent** (a Claude Code subagent, `.claude/agents/\u003cname>.md`) is different in kind, not in wording. Per `build/CLAUDE_CODE_FACTS.md` §1 it has:\n\n- **its own context window**: it starts with its file body as system prompt, the task message, the CLAUDE.md hierarchy, git status and any preloaded `skills`. It does **not** get your conversation history, the Claude Code system prompt, your output style or auto memory;\n- **its own tool boundary**: `tools` is an allowlist, `disallowedTools` a denylist;\n- **its own authority**: `permissionMode`, `maxTurns`, `model`, optional `memory`, `hooks` and `isolation: worktree`;\n- **a loop**: it keeps calling tools until it decides it is done, then returns **one final message** to the main session.\n\nSo the practical test is not \"is the prompt long\". It is: *does this job need a different context, different tools, or different authority from the conversation that asks for it?* A code review written by the same context that wrote the code is not independent. A reviewer that holds `Edit` can quietly fix what it was asked to judge. Those are problems a better prompt cannot solve and a subagent definition can.\n\nThe cost is real too: a subagent re-reads files the main session already knows, and whatever you forget to put in its task message it simply does not have. So in practice you promote a prompt to an agent only when isolation, a tool boundary or a repeatable independent opinion is worth that cost."},{"heading":"Agent anatomy: twelve elements","body_md":"Every agent in this course is specified with the same twelve elements. Most failures of \"it worked once in chat\" prompts come from leaving one of them implicit.\n\n1. **Responsibilities**: the one job. Two jobs (review *and* fix) means two agents.\n2. **Boundaries**: what is out of scope, even if the agent could do it.\n3. **Inputs**: exactly what arrives in the task message (base ref, run id, handoff path). A subagent has nothing else from you.\n4. **Outputs**: the artifact and its format, precise enough for a script to check.\n5. **Tools**: the allowlist, spelled as Claude Code spells tools (`Read`, `Grep`, `Glob`, `Bash`, `mcp__server__tool`).\n6. **Context**: which project knowledge it loads automatically (CLAUDE.md, preloaded skills) and which files it must `Read` for this task.\n7. **Instructions**: the procedure, not a persona. \"You are a senior reviewer\" is not a step.\n8. **Memory/state**: what survives between runs (the `memory` field, or handoff files) and what deliberately does not.\n9. **Permissions**: what it may do without asking, what needs a human, what is denied.\n10. **Verification**: how anyone can tell a good output from a plausible one.\n11. **Failure handling**: what it does when the input is bad or the job is too big, instead of guessing.\n12. **Handoffs**: the structured artifact the next step consumes.\n\nThe table *Anatomy element to Claude Code mechanism* below maps each element to the real configuration that implements it. The pattern to notice: elements 1, 5, 6, 7, 8 and 9 have first-class Claude Code fields; elements 2, 3, 4, 10, 11 and 12 are mostly **conventions** until you add a hook, a permission rule or an eval that enforces them. Modules 05, 08, 09 and 10 exist largely to turn those conventions into mechanisms.\n\nExercise `01-anatomy-breakdown` applies this list to a real one-off review prompt and shows which elements it leaves undefined."},{"heading":"Mechanism or convention: enforced versus requested","body_md":"Module 00 stated the rule: **instructions describe intent, permissions and hooks enforce it.** This module makes it a habit: every rule you write for an agent gets labelled as one or the other.\n\nA **mechanism** is something Claude Code itself does regardless of what the model decides:\n\n- `tools: Read, Grep, Glob` means `Edit` is not in the agent's toolset. It cannot be talked into editing.\n- `permissions.deny: [\"Read(./.env)\"]` in `.claude/settings.json` blocks the read for every agent.\n- `.claude/hooks/block-secrets.mjs` is a `PreToolUse` hook on `Edit|Write`; it exits **2**, which blocks the call. Exit 1 would not block. Settings hooks fire inside subagents too.\n- A `SubagentStop` hook that exits 2 forces the subagent to keep working.\n\nA **convention** is something only a person, a script or an eval checks: the six-field finding format, \"cite the standard\", \"never write LGTM\", the handoff front matter until module 08 adds `check-handoff.mjs`.\n\nConventions are not bad; most of a contract is convention. The failure mode is believing a convention is a mechanism. Two real traps from the docs:\n\n- A subagent's `permissionMode` is **ignored** when the parent session runs in `bypassPermissions`, `acceptEdits` or `auto`. `permissionMode: dontAsk` on the reviewer is a mechanism only when the parent is in `default` or `plan`; the durable guard is an agent-scoped `PreToolUse` hook.\n- Skill `allowed-tools` **pre-approves** tools for the turn; it does not restrict them. Use `disallowed-tools` to remove one.\n\nSo in practice, each `must` and `mustNot` line in an Agent Contract ends with `[mechanism: ...]` or `[convention: ...]`, and `validate-contract.mjs` rejects a line that has neither. When a `mustNot` has only conventions, the validator warns you: that agent's boundaries depend entirely on the model behaving."},{"heading":"Six primitives and how to choose","body_md":"Claude Code gives you six building blocks for SDLC automation. They overlap, and most bad designs use the wrong one: an agent where a hook was needed, a prompt where a skill would have been reused fifty times.\n\nUse this decision order; the first \"yes\" wins (it is also the answer key logic for exercise `01-classify-primitives`):\n\n1. **Must it happen every time**, whether or not the model remembers? Use a **hook** (or a permission rule). Secrets scanning, handoff validation and blocking `kubectl delete` are not suggestions.\n2. **Does it need data or actions outside the repo** (Jira, a running FHIR server, GitHub)? Use an **MCP server**, so access is a named tool (`mcp__\u003cserver>__\u003ctool>`) that permission rules can allow or deny.\n3. **Does it chain several roles with human gates** between them? Use a **workflow**: a documented sequence in `workflows/`, run from the main session (module 08).\n4. **Does it need its own context, its own tool limits, or an independent opinion?** Use an **agent**.\n5. **Will the same procedure be repeated** by people or agents? Use a **skill**. Agents preload skills with the `skills` field, so the procedure is written once.\n6. Otherwise it is a **prompt**. Do not package a question you will ask once.\n\nTwo combinations recur so often they are worth naming:\n\n- **Agent + preloaded skill**: the agent supplies the boundary, the skill the procedure (`reviewer` preloads `code-review`; `sre` preloads `production-rca`). Upgrading the procedure does not touch the agent's permissions.\n- **Workflow + hooks**: the workflow defines order and gates; hooks make the gates real.\n\nThe comparison table *Prompt, skill, agent, workflow, MCP, hook* below gives where each lives, who triggers it and how deterministic it is."},{"heading":"The Agent Contract","body_md":"An **Agent Contract** is this course's specification for an agent, written before the agent file and kept next to it. It is a convention, not a Claude Code feature: Claude Code only reads `.claude/agents/\u003cname>.md`. The contract is what that file is reviewed against, what the evals in module 09 score, and what a new team member reads first.\n\nEleven fields, identical to `agentContracts` in `build/schema.json`:\n\n| Field | Question it answers |\n|---|---|\n| `purpose` | What single decision does the output support? |\n| `inputs` / `outputs` | What arrives in the task message; what comes back and where it is saved |\n| `tools` | Exact tool names, with scope (\"Bash (git diff only)\") |\n| `permissions` | Which frontmatter and settings enforce the boundary |\n| `must` / `mustNot` | Required and forbidden behaviour, each tagged mechanism or convention |\n| `failureConditions` | When to stop with `blocked` or `needs-human` instead of guessing |\n| `validation` | The command, eval or check that proves an output acceptable |\n| `handoffFormat` | The run-folder file and its front matter |\n| `humanGate` | Where a person approves, and the real mechanism that waits for them |\n\nThe reusable template is `AI-SDLC/agents/CONTRACT_TEMPLATE.md`; each roster agent's filled copy lives at `AI-SDLC/agents/\u003cagent>/CONTRACT.md`. `AI-SDLC/docs/foundations/validate-contract.mjs` checks that all eleven `## field` headings are present and in order, that list fields are bullets, that tool names are real Claude Code tools, that every `must`/`mustNot` line names its enforcement, and that `humanGate` names a real mechanism. `--json` prints the contract as a schema-shaped object.\n\nThis module ships a worked **reviewer** draft (`docs/foundations/reviewer-contract-draft.md`). Module 02 builds a deliberately simple first reviewer, module 05-agent-roster finalises this contract as `agents/reviewer/CONTRACT.md` with the runtime definition, and module 09 measures the agent against it. So in practice the contract changes through review like code, and the agent file follows it."},{"heading":"Handoffs and depth: why the roster stays flat","body_md":"Agents in this course never talk to each other directly. Each one returns a **handoff**: a Markdown document with YAML front matter (`run_id`, `step`, `agent`, `status`, `inputs`, `next`) saved under `.ai-sdlc/runs/\u003crun-id>/NN-\u003cagent>.md`. The next agent reads the file, not the previous agent's conversation, because it has none.\n\nClaude Code does allow deeper structures. Per the current docs, a subagent **can** spawn subagents of its own, up to three layers below the main conversation by default (`CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH` changes it; `1` turns nesting off), and at the limit the `Agent` tool is withheld. The `Agent(architect, developer, ...)` allowlist syntax in `tools` only applies to an agent running as the main thread with `claude --agent \u003cname>`; inside a subagent definition the parenthesised list is ignored.\n\nThis course's design decision built on those facts:\n\n- The **orchestrator** runs as the main thread (`claude --agent orchestrator`, or the `/feature` skill in the main session). It is the only place delegation happens.\n- Roster agents (`architect`, `developer`, `reviewer`, `tester`, `security`, `sre`) do **not** list `Agent` in `tools`. They run at depth 1, so every delegation is visible in one place and every handoff is a file you can audit.\n- Module 07 shows one sanctioned depth-2 pattern and the real limits.\n\nFor the anatomy that means element 12 (handoffs) and element 2 (boundaries) meet: leaving `Agent` out of `tools` is a mechanism that keeps the handoff chain linear. The reviewer draft's `mustNot` records it as exactly that."}],"diagrams":[{"title":"Contract fields and the Claude Code mechanisms behind them","mermaid":"flowchart LR\n  P[\"purpose\"] --> D[\"description field + agent file body\"]\n  I[\"inputs\"] --> TM[\"Agent tool prompt (task message)\"]\n  T[\"tools\"] --> TL[\"tools / disallowedTools\"]\n  PM[\"permissions\"] --> PS[\"permissionMode + settings allow/ask/deny\"]\n  MN[\"must / mustNot\"] --> HK[\"hooks (exit 2 blocks)\"]\n  MN -.->|\"when not enforceable\"| CV[\"convention: evals, human review\"]\n  F[\"failureConditions\"] --> MT[\"maxTurns + status: blocked\"]\n  V[\"validation\"] --> EV[\"scripts, golden tasks, SubagentStop hook\"]\n  H[\"handoffFormat\"] --> RF[\"file in .ai-sdlc/runs/RUN-ID/\"]\n  G[\"humanGate\"] --> HG[\"plan mode, ask rule, PR approval\"]"},{"title":"Choosing a primitive (first yes wins)","mermaid":"flowchart TD\n  Q1{\"Must it happen every time?\"} -->|\"yes\"| HOOK[\"hook or permission rule\"]\n  Q1 -->|\"no\"| Q2{\"Needs a system outside the repo?\"}\n  Q2 -->|\"yes\"| MCP[\"MCP server\"]\n  Q2 -->|\"no\"| Q3{\"Several roles with human gates?\"}\n  Q3 -->|\"yes\"| WF[\"workflow\"]\n  Q3 -->|\"no\"| Q4{\"Own context, tool limits or independent opinion?\"}\n  Q4 -->|\"yes\"| AG[\"agent\"]\n  Q4 -->|\"no\"| Q5{\"Repeated procedure?\"}\n  Q5 -->|\"yes\"| SK[\"skill\"]\n  Q5 -->|\"no\"| PR[\"prompt\"]"},{"title":"A reviewer run under its contract","mermaid":"sequenceDiagram\n  participant H as Human\n  participant M as Main session (orchestrator)\n  participant R as reviewer subagent\n  participant F as Run folder .ai-sdlc/runs/RUN-ID\n  H->>M: Review the change against main\n  M->>R: Task message with base ref, run id and upstream handoff path\n  R->>R: git diff main...HEAD and Read standards (no Edit, no Agent)\n  R-->>M: Final message is the handoff with the findings table\n  M->>F: Write NN-reviewer.md\n  M-->>H: status needs-human if any critical or high finding\n  H->>H: Approve or reject the pull request"}],"comparisonTables":[{"title":"Prompt, skill, agent, workflow, MCP, hook","columns":["Primitive","Purpose","Where it lives","Who triggers it","Determinism","Example in this repo"],"rows":[["Prompt","One-off instruction in the current conversation","Nowhere (typed, or `claude -p \"...\"`)","You","Low: model output, shares the session's history and tools","`claude -p 'Which tests call $lastn?' --permission-mode plan`"],["Skill","Reusable procedure plus supporting files","`.claude/skills/\u003cname>/SKILL.md`","You via `/name`, Claude by `description` match, or preloaded into an agent via `skills`","Medium: loading and `!` shell injection are deterministic; execution is model-driven","`.claude/skills/code-review/SKILL.md` (module 03)"],["Agent","Isolated worker with its own context, tools and permissions","`.claude/agents/\u003cname>.md`","Main session delegation (by `description`, by name, `@agent-\u003cname>`) or `claude --agent \u003cname>`","Low output determinism, deterministic boundary (`tools`, `disallowedTools`)","`.claude/agents/reviewer.md` (module 05)"],["Workflow","Ordered composition of agents, skills and human gates","`workflows/*.md` spec plus an entry skill such as `/feature`","You, from the main session","Order and gates are fixed by the spec and hooks; each step is model-driven","`workflows/feature-delivery.md` (module 08)"],["MCP server","Tools and data from a system outside the repo","`.mcp.json` (project scope) or `~/.claude.json` (local, user)","Claude calls `mcp__\u003cserver>__\u003ctool>` when the task needs it","The server code is deterministic; whether and how it is called is model-driven","FHIR-lite server in `mcp/` (module 06)"],["Hook","Enforce or react at a lifecycle event","`hooks` in `.claude/settings.json` (also agent or skill frontmatter)","Claude Code itself, on events such as `PreToolUse`, `SubagentStop`","High: a script; exit code 2 blocks","`.claude/hooks/block-secrets.mjs` (exists today)"]]},{"title":"Anatomy element to Claude Code mechanism","columns":["Element","Claude Code mechanism","Mechanism or convention","Reviewer example"],"rows":[["Responsibilities","`description` frontmatter (delegation) and file body","Mechanism for routing; the single-job rule is convention","\"Reviews a diff against the standards; never edits\""],["Boundaries","`tools`, `disallowedTools`, `permissions.deny`","Mechanism where a tool or rule expresses it; otherwise `mustNot` convention","No Edit, Write or Agent"],["Inputs","Agent tool `prompt` (task message); CLAUDE.md hierarchy; git status","Mechanism for delivery; required fields are convention","Base ref, run id, upstream handoff path"],["Outputs","Subagent final message returned to the main session","Mechanism for return; format is convention","Six-field findings table"],["Tools","`tools` allowlist, `disallowedTools`, `mcpServers`","Mechanism","`Read, Grep, Glob, Bash`"],["Context","CLAUDE.md hierarchy, `skills` preload, `omitClaudeMd`","Mechanism","`skills: [code-review]`"],["Instructions","Agent file body = the subagent's system prompt","Mechanism (what the model reads), content is yours","Step-by-step review procedure"],["Memory/state","`memory: user|project|local` (`MEMORY.md`); handoff files","Mechanism for `memory`; run state in files is convention","No memory; state in `.ai-sdlc/runs/`"],["Permissions","`permissionMode`, settings allow/ask/deny, hooks","Mechanism (note: `permissionMode` ignored under `acceptEdits`, `auto`, `bypassPermissions` parents)","`permissionMode: dontAsk` + agent-scoped `PreToolUse` hook"],["Verification","`SubagentStop`/`PostToolUse` hooks, scripts, evals","Convention until a hook runs the check","Golden tasks in module 09"],["Failure handling","`maxTurns` (output marked partial); `-p` result `subtype`, `is_error`","Mechanism for limits; `status: blocked` is convention","Empty diff returns `blocked`"],["Handoffs","None built in","Convention; made a mechanism by `check-handoff.mjs` (module 08)","`.ai-sdlc/runs/\u003crun-id>/NN-reviewer.md`"]]}],"exercises":[{"id":"01-anatomy-breakdown","title":"Break a one-off review prompt into agent anatomy","objective":"Take the review prompt a developer pastes into chat today, run it once to see what it produces against the real `ObservationService`, then break it into the twelve anatomy elements. For each element record what the prompt says, the gap, and the Claude Code mechanism (or convention) that will implement it in the `reviewer` agent.","startingFiles":[{"path":"AI-SDLC/docs/foundations/one-off-review-prompt.md","content":"You are a senior Java reviewer. Look at my latest changes to the Observation API and tell me\nwhat's wrong. Check for bugs, security, performance and style. Use our standards. Be thorough\nbut concise. Fix anything obvious while you're at it. If everything looks fine, reply LGTM.\n"}],"requiredStructure":"AI-SDLC/docs/foundations/\n├── one-off-review-prompt.md          # given: the prompt as pasted in chat\n└── anatomy-breakdown-reviewer.md     # you write: 12-row table\n                                      # columns: # | element | what the prompt says | gap or risk | where it lives in Claude Code\n                                      # last column starts with \"Mechanism:\" or \"Convention:\"","implementation":[{"path":"AI-SDLC/docs/foundations/anatomy-breakdown-reviewer.md","language":"markdown","content":"# Anatomy breakdown: the one-off review prompt\n\nReference answer for exercise `01-anatomy-breakdown` (module 01-foundations).\nSource prompt: `docs/foundations/one-off-review-prompt.md`.\n\nEach row takes one anatomy element, quotes what the prompt says about it, names the gap, and says\nwhere that element lives once the prompt becomes the `reviewer` agent. The last column starts with\n**Mechanism:** when Claude Code enforces or loads it, or **Convention:** when it is a course rule that\nonly a human, a script or an eval checks.\n\n| # | element | what the prompt says | gap or risk | where it lives in Claude Code |\n|---|---|---|---|---|\n| 1 | responsibilities | \"tell me what's wrong\", \"Fix anything obvious\" | Two jobs in one: reviewing and editing. An agent that fixes what it reviews cannot give an independent opinion. | Mechanism: the `description` frontmatter field decides when the main session delegates to `reviewer`; the body states the single job. |\n| 2 | boundaries | nothing | No statement of what is out of scope (deep security analysis, performance profiling, approving). | Mechanism: `tools` allowlist and `disallowedTools`; Convention: the contract `mustNot` list for boundaries no tool setting can express. |\n| 3 | inputs | \"my latest changes to the Observation API\" | Which base ref? Staged or committed? A subagent has no conversation history, so \"latest\" means nothing to it. | Mechanism: the Agent tool `prompt` (task message) is the only runtime input besides CLAUDE.md, git status and preloaded skills; Convention: the contract names the required fields (base ref, run id). |\n| 4 | outputs | \"tell me\", \"be thorough but concise\" | No format, so findings cannot be counted, compared between runs, or checked by a script. | Mechanism: the subagent's final message is what returns to the main session; Convention: the six-field finding table from `context/standards/review-standards.md` and the handoff file. |\n| 5 | tools | nothing | In the main session the prompt runs with every tool the session has, including Edit and Write. | Mechanism: `tools: Read, Grep, Glob, Bash` in `.claude/agents/reviewer.md`; omitting `Agent` also stops it delegating. |\n| 6 | context | \"Use our standards\" | Which standards? The model will invent generic Java advice. | Mechanism: the CLAUDE.md hierarchy loads automatically and `skills: [code-review]` preloads the review procedure; Convention: the body names `context/standards/review-standards.md` and `coding-standards.md` to Read. |\n| 7 | instructions | \"You are a senior Java reviewer\" | A persona, not a procedure. No steps, no order, no definition of done. | Mechanism: the agent file body becomes the subagent's system prompt (it does not get the Claude Code system prompt). |\n| 8 | memory/state | nothing | Nothing carries over between reviews, which is fine; but the prompt also relies on \"my latest changes\" living in chat history. | Mechanism: optional `memory: project` gives `.claude/agent-memory/reviewer/MEMORY.md`; Convention: run state lives in handoff files under `.ai-sdlc/runs/\u003crun-id>/`. |\n| 9 | permissions | \"Fix anything obvious\" | Grants write authority implicitly. In `acceptEdits` mode those edits would land without a prompt. | Mechanism: `permissionMode` in frontmatter plus project `permissions` allow/ask/deny in `.claude/settings.json`; the `PreToolUse` hook `block-secrets.mjs` still runs inside subagents. |\n| 10 | verification | nothing | No way to tell a good review from a plausible one. | Convention: golden tasks in `evaluations/` (module 09) and `validate-contract.mjs` for the contract; Mechanism: a `SubagentStop` hook can reject output that lacks the required structure (module 08). |\n| 11 | failure handling | \"If everything looks fine, reply LGTM\" | The only exit is success. No instruction for an empty diff, a huge diff, or a missing standard, so the model guesses. | Mechanism: `maxTurns` caps the loop and marks the output partial; Convention: `status: blocked` or `needs-human` in the handoff front matter with the reason. |\n| 12 | handoffs | \"reply LGTM\" | \"LGTM\" reads as approval, which review-standards forbids, and it carries nothing the next step can use. | Convention: handoff file `.ai-sdlc/runs/\u003crun-id>/NN-reviewer.md` with front matter `run_id, step, agent, status, inputs, next`; Mechanism once module 08 adds it: `.claude/hooks/check-handoff.mjs`. |\n\n## Rewritten as a contract (summary)\n\n- purpose: review one diff against the standards and return findings; never edit, never approve.\n- inputs: base ref and run id in the task message; optional upstream handoff path.\n- outputs: handoff with six-field findings table and explicit \"no findings\" per category.\n- tools: Read, Grep, Glob, Bash (git diff, git log, git status only).\n- humanGate: PR approval by a human; critical or high findings block merge.\n\nFull draft: `docs/foundations/reviewer-contract-draft.md`.\n","tag":"illustrative"}],"exampleInput":"cd AI-SDLC\n# 1. Run the one-off prompt as-is (plan mode so nothing is edited)\nclaude -p \"$(cat docs/foundations/one-off-review-prompt.md) The changes are in sample-app/src/main/java/org/example/fhir/service/ObservationService.java and api/ObservationController.java.\" --permission-mode plan --output-format json | jq -r '.result'\n\n# 2. Ask for the anatomy breakdown, then compare it with your own table\nclaude -p 'Read docs/foundations/one-off-review-prompt.md. For each of these elements: responsibilities, boundaries, inputs, outputs, tools, context, instructions, memory/state, permissions, verification, failure handling, handoffs, give one table row: what the prompt says, the gap, and the Claude Code subagent field or setting that would implement it, or the word convention if none does.' --permission-mode plan --output-format json | jq -r '.result'","expectedOutput":"Run 1 (the raw prompt), typical result:\n\nHere's what I found:\n1. Performance: `lastN` in ObservationService loops over `subjectIds` and calls `patients.findById` and `findByPatientIdOrderByEffectiveDateTimeDesc` per subject, an N+1. I'd replace it with a single query using `IN (:ids)`.\n2. `ObservationController.lastN` accepts an unbounded `List\u003cLong> subjects`; add a max size.\n3. `create()` doesn't check that the subject Patient is active.\n4. Style: consider extracting the code-parsing `substring(indexOf('|') + 1)` into the mapper.\nI can apply fixes 1 and 2 now if you exit plan mode. Otherwise LGTM.\n\nWhat is wrong with it: no severities, no `path:line`, no quoted evidence, no standard cited; finding 1 is the documented TEACHING-DEFECT(perf-n+1) reported as new; it offers to edit; it ends with LGTM, which review-standards forbids.\n\nRun 2 (anatomy), excerpt:\n\n| element | prompt says | gap | Claude Code |\n|---|---|---|---|\n| tools | nothing | inherits every session tool incl. Edit | `tools: Read, Grep, Glob, Bash` |\n| inputs | \"my latest changes\" | subagent has no chat history | task message must name the base ref |\n| failure handling | \"reply LGTM\" | only a success exit | `maxTurns`; otherwise convention |\n| handoffs | \"LGTM\" | nothing reusable | convention (handoff file) |","testCases":[{"name":"All twelve elements present","input":"grep -cE '^\\| (1[0-2]|[1-9]) \\|' AI-SDLC/docs/foundations/anatomy-breakdown-reviewer.md","expected":"12"},{"name":"Every row says mechanism or convention","input":"grep -E '^\\| [0-9]+ \\|' AI-SDLC/docs/foundations/anatomy-breakdown-reviewer.md | grep -vcE 'Mechanism:|Convention:'","expected":"0 (every row names one or the other)"},{"name":"Real subagent fields, no invented ones","input":"grep -oE '`(tools|disallowedTools|permissionMode|maxTurns|memory|skills|description)' AI-SDLC/docs/foundations/anatomy-breakdown-reviewer.md | sort -u | wc -l","expected":"7 (and `grep -E 'temperature|allowed-tools|timeout' ` on the file prints nothing)"},{"name":"Approval-by-LGTM is caught","input":"grep -n 'LGTM' AI-SDLC/docs/foundations/anatomy-breakdown-reviewer.md","expected":"At least one row (failure handling or handoffs) explains that LGTM reads as approval, which context/standards/review-standards.md forbids."},{"name":"Run 1 shows the teaching defect misreported","input":"The first exampleInput command","expected":"The raw prompt reports the `lastN` loop at ObservationService.java line 69 as a new finding without referencing sample-app/docs/KNOWN_DEFECTS.md; your breakdown lists this under boundaries or context."}],"evaluationCriteria":["Every one of the twelve elements has a concrete gap, quoted from the prompt where it says anything.","The Claude Code column uses only fields and settings from build/CLAUDE_CODE_FACTS.md (no `temperature`, no hyphenated `allowed-tools` in an agent).","Conventions are labelled as conventions, not dressed up as mechanisms.","The breakdown identifies that \"Fix anything obvious\" merges two responsibilities and grants write authority.","Inputs are rewritten in terms a subagent with no chat history can act on (base ref, run id)."],"improvements":["Repeat the breakdown for a one-off security prompt and compare which elements are mechanisms for `security` versus `reviewer`.","Add a thirteenth column: which later module turns each convention into a mechanism.","Run the raw prompt three times and record how many findings differ between runs; that variance is the argument for a fixed output format."]},{"id":"01-classify-primitives","title":"Classify ten SDLC needs into prompt, skill, agent, workflow, MCP or hook","objective":"For ten real needs from this repository's SDLC, choose the one primitive that fits and justify it in one sentence. Grade yourself with a script against the answer key, then read the justification for anything you missed. The point is the decision order: enforcement first, external systems second, orchestration third, isolation fourth, reuse fifth.","startingFiles":[{"path":"AI-SDLC/docs/foundations/my-classification.json","content":"{\n  \"N01\": {\n    \"need\": \"Refuse any file write that contains an AWS access key or a hard-coded password.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N02\": {\n    \"need\": \"Once, today: ask which existing tests exercise `GET /fhir/Observation/$lastn`.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N03\": {\n    \"need\": \"A repeatable procedure for reviewing a diff against `context/standards/review-standards.md`, producing findings in the six-field format, usable by a human with `/code-review` and preloaded by the reviewer agent.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N04\": {\n    \"need\": \"An independent second opinion on a diff, from something that starts with a clean context and physically cannot edit files.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N05\": {\n    \"need\": \"Deliver a feature: requirements, architect ADR, developer change with tests, reviewer and security findings, then human approval before merge.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N06\": {\n    \"need\": \"Pull the summary and acceptance criteria of a Jira ticket into the requirements step.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N07\": {\n    \"need\": \"`/run-tests`: run `mvn -q -B test` in `sample-app/` and summarise failures with file and test name.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N08\": {\n    \"need\": \"Do not let a subagent finish until its handoff file has valid YAML front matter (`run_id`, `step`, `agent`, `status`, `inputs`, `next`).\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N09\": {\n    \"need\": \"Root-cause a latency spike on `$lastn` from logs and the k8s manifests, and propose (not apply) a patch.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N10\": {\n    \"need\": \"While designing tests, look up synthetic Observation data served by a running FHIR-lite server, read-only.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  }\n}\n"}],"requiredStructure":"AI-SDLC/docs/foundations/\n├── my-classification.json          # you fill: answer = prompt|skill|agent|workflow|mcp|hook, why = one sentence\n├── classification-answer-key.md    # key: table N01..N10 with answer, accepted, justification, repo example\n├── grade-classification.mjs        # zero-dependency grader, exit 0 at >= 8/10\n└── example-answers.json            # a realistic attempt with two mistakes","implementation":[{"path":"AI-SDLC/docs/foundations/classification-answer-key.md","language":"markdown","content":"# Answer key: classify ten SDLC needs\n\nExercise `01-classify-primitives` (module 01-foundations). For each need, pick exactly one primary\nprimitive from `prompt | skill | agent | workflow | mcp | hook`. The grader\n(`docs/foundations/grade-classification.mjs`) reads the table below: column `answer` is the primary\nanswer, column `accepted` lists other answers that earn full marks when the justification is sound.\n\nDecision order used for the key (first \"yes\" wins):\n\n1. Must it happen **every time**, whether or not the model remembers? -> `hook` (or a permission rule).\n2. Does it need data or actions in a **system outside the repo**? -> `mcp`.\n3. Does it chain **several roles with a human gate** between them? -> `workflow`.\n4. Does it need **its own context, its own tool limits, or an independent opinion**? -> `agent`.\n5. Will it be **repeated** by people or agents with the same procedure? -> `skill`.\n6. Otherwise it is a one-off -> `prompt`.\n\n| id | need | answer | accepted | justification | repo example |\n|---|---|---|---|---|---|\n| N01 | Refuse any file write that contains an AWS access key or a hard-coded password. | hook | none | Policy must hold even when the model ignores instructions. A `PreToolUse` hook on `Edit\\|Write` that exits 2 is deterministic; a CLAUDE.md rule is only a request. | `.claude/hooks/block-secrets.mjs` |\n| N02 | Once, today: ask which existing tests exercise `GET /fhir/Observation/$lastn`. | prompt | none | One-off question with no reuse, no special tools and no need for isolation. Packaging it would cost more than it saves. | `claude -p \"Which tests call /fhir/Observation/\\$lastn?\" --permission-mode plan` |\n| N03 | A repeatable procedure for reviewing a diff against `context/standards/review-standards.md`, producing findings in the six-field format, usable by a human with `/code-review` and preloaded by the reviewer agent. | skill | none | Same procedure every time, invoked by people and preloaded into an agent. A skill keeps the steps and the output template in one versioned file with supporting files. | `.claude/skills/code-review/SKILL.md` (module 03) |\n| N04 | An independent second opinion on a diff, from something that starts with a clean context and physically cannot edit files. | agent | none | Needs isolation (fresh context, no author bias) and a tool boundary (`tools: Read, Grep, Glob, Bash`). Only a subagent gives both. | `.claude/agents/reviewer.md` (module 05) |\n| N05 | Deliver a feature: requirements, architect ADR, developer change with tests, reviewer and security findings, then human approval before merge. | workflow | none | Several roles in a fixed order with gates and handoff files between them. No single agent should own all of it. | `workflows/feature-delivery.md` and `/feature` (module 08) |\n| N06 | Pull the summary and acceptance criteria of a Jira ticket into the requirements step. | mcp | none | The data lives in an external system. An MCP server exposes it as tools (`mcp__\u003cserver>__\u003ctool>`) that permission rules can allow or deny per tool. | `.mcp.json` and `/ticket-intake` (module 06) |\n| N07 | `/run-tests`: run `mvn -q -B test` in `sample-app/` and summarise failures with file and test name. | skill | none | A named, repeatable procedure with a user-invoked entry point. `allowed-tools` pre-approves the Maven command for that turn. | `.claude/skills/run-tests/SKILL.md` (module 02) |\n| N08 | Do not let a subagent finish until its handoff file has valid YAML front matter (`run_id`, `step`, `agent`, `status`, `inputs`, `next`). | hook | none | Enforcement at a lifecycle event: a `SubagentStop` hook that exits 2 forces the agent to continue. Asking nicely in the prompt is not a control. | `.claude/hooks/check-handoff.mjs` (module 08) |\n| N09 | Root-cause a latency spike on `$lastn` from logs and the k8s manifests, and propose (not apply) a patch. | agent | skill | Needs a read-only tool boundary and its own context for long log reading, so an agent (`sre`). The analysis procedure itself is the `production-rca` skill the agent preloads, so `skill` is accepted if the answer says it runs inside the `sre` agent. | `.claude/agents/sre.md` preloading `production-rca` (modules 04, 05) |\n| N10 | While designing tests, look up synthetic Observation data served by a running FHIR-lite server, read-only. | mcp | none | Live data behind an API, reused by several agents, with a read-only boundary best enforced at the tool level. | `mcp/` FHIR-lite server (module 06) |\n\nCommon wrong answers and why they lose marks:\n\n- N01 as `prompt` or CLAUDE.md rule: instructions describe intent; only hooks and permission rules enforce it.\n- N04 as `skill`: a skill runs in the current context (unless `context: fork`), so it shares the author's history and tools.\n- N05 as `agent`: one agent doing every role hides the gates; a subagent cannot ask the user questions (`AskUserQuestion` is not available to subagents).\n- N08 as `agent`: a checker agent is itself non-deterministic; the check is a script, triggered by a hook.\n","tag":"illustrative"},{"path":"AI-SDLC/docs/foundations/grade-classification.mjs","language":"javascript","content":"#!/usr/bin/env node\n// Grade a learner's primitive classification against docs/foundations/classification-answer-key.md.\n// Zero dependencies, Node 22.\n//\n// Usage: node docs/foundations/grade-classification.mjs \u003canswers.json> [--key \u003canswer-key.md>] [--pass \u003cn>]\n// answers.json: { \"N01\": { \"answer\": \"hook\", \"why\": \"...\" }, ... }  (a bare string \"hook\" is also accepted)\n// Exit codes: 0 score >= pass mark (default 8), 1 below pass mark, 2 usage or I/O error.\nimport { readFileSync } from \"node:fs\";\nimport { dirname, join } from \"node:path\";\nimport { fileURLToPath } from \"node:url\";\n\nexport const PRIMITIVES = [\"prompt\", \"skill\", \"agent\", \"workflow\", \"mcp\", \"hook\"];\nconst DEFAULT_KEY = join(dirname(fileURLToPath(import.meta.url)), \"classification-answer-key.md\");\n\n// Split a markdown table row on pipes that are not escaped as \\|\nfunction cells(row) {\n  return row.trim().replace(/^\\|/, \"\").replace(/\\|$/, \"\").split(/(?\u003c!\\\\)\\|/).map((c) => c.trim().replace(/\\\\\\|/g, \"|\"));\n}\n\nexport function parseKey(markdown) {\n  const key = new Map();\n  for (const line of markdown.split(\"\\n\")) {\n    if (!/^\\| N\\d{2} \\|/.test(line)) continue;\n    const [id, need, answer, accepted, justification] = cells(line);\n    if (!PRIMITIVES.includes(answer)) throw new Error(`${id}: answer \"${answer}\" is not a primitive`);\n    const alt = accepted === \"none\" ? [] : accepted.split(/,\\s*/);\n    key.set(id, { need, answer, accepted: alt, justification });\n  }\n  return key;\n}\n\nexport function grade(key, answers) {\n  const rows = [];\n  let score = 0;\n  for (const [id, k] of key) {\n    const raw = answers[id];\n    const given = String((raw && typeof raw === \"object\" ? raw.answer : raw) || \"\").trim().toLowerCase();\n    const why = raw && typeof raw === \"object\" ? String(raw.why || \"\").trim() : \"\";\n    let verdict;\n    if (!given) verdict = \"MISSING\";\n    else if (!PRIMITIVES.includes(given)) verdict = \"INVALID\";\n    else if (given === k.answer) verdict = \"CORRECT\";\n    else if (k.accepted.includes(given)) verdict = \"ACCEPTED\";\n    else verdict = \"WRONG\";\n    const points = verdict === \"CORRECT\" || verdict === \"ACCEPTED\" ? 1 : 0;\n    score += points;\n    rows.push({ id, given: given || \"-\", expected: k.answer, verdict, points, noWhy: points === 1 && why.length \u003c 20 });\n  }\n  return { score, total: key.size, rows };\n}\n\nfunction main(argv) {\n  const args = [...argv];\n  const opt = (name, def) => { const i = args.indexOf(name); if (i \u003c 0) return def; const v = args[i + 1]; args.splice(i, 2); return v; };\n  const keyPath = opt(\"--key\", DEFAULT_KEY);\n  const pass = Number(opt(\"--pass\", \"8\"));\n  const [answersPath] = args;\n  if (!answersPath) { process.stderr.write(\"usage: grade-classification.mjs \u003canswers.json> [--key \u003cmd>] [--pass \u003cn>]\\n\"); return 2; }\n  let key, answers;\n  try {\n    key = parseKey(readFileSync(keyPath, \"utf8\"));\n    answers = JSON.parse(readFileSync(answersPath, \"utf8\"));\n  } catch (e) { process.stderr.write(`ERROR ${e.message}\\n`); return 2; }\n  const r = grade(key, answers);\n  for (const row of r.rows) {\n    let line = `${row.id}  ${row.verdict.padEnd(8)} given=${row.given.padEnd(8)} key=${row.expected}`;\n    if (row.verdict === \"WRONG\") line += `  -> ${key.get(row.id).justification}`;\n    if (row.verdict === \"ACCEPTED\") line += \"  (alternative answer: check the justification names the agent it runs in)\";\n    if (row.noWhy) line += \"  (warning: justification missing or under 20 characters)\";\n    process.stdout.write(line + \"\\n\");\n  }\n  const ok = r.score >= pass;\n  process.stdout.write(`SCORE ${r.score}/${r.total} (pass mark ${pass}) ${ok ? \"PASS\" : \"FAIL\"}\\n`);\n  return ok ? 0 : 1;\n}\n\nif (import.meta.url === `file://${process.argv[1]}`) process.exit(main(process.argv.slice(2)));\n","tag":"illustrative"},{"path":"AI-SDLC/docs/foundations/example-answers.json","language":"json","content":"{\n  \"N01\": { \"answer\": \"hook\", \"why\": \"Must block every write deterministically; PreToolUse on Edit|Write exiting 2.\" },\n  \"N02\": { \"answer\": \"prompt\", \"why\": \"One question, asked once, no reuse or isolation needed.\" },\n  \"N03\": { \"answer\": \"skill\", \"why\": \"Same review procedure every time, shared by humans and the reviewer agent.\" },\n  \"N04\": { \"answer\": \"skill\", \"why\": \"Reuse the code-review skill for the second opinion.\" },\n  \"N05\": { \"answer\": \"workflow\", \"why\": \"Several roles in order with a human approval gate before merge.\" },\n  \"N06\": { \"answer\": \"mcp\", \"why\": \"Ticket data lives in Jira, outside the repo.\" },\n  \"N07\": { \"answer\": \"skill\", \"why\": \"Named user-invoked procedure with the Maven command pre-approved.\" },\n  \"N08\": { \"answer\": \"agent\", \"why\": \"A checker agent reads the handoff and complains if it is wrong.\" },\n  \"N09\": { \"answer\": \"skill\", \"why\": \"The production-rca skill, run inside the sre agent with read-only tools.\" },\n  \"N10\": { \"answer\": \"mcp\", \"why\": \"Live read-only data behind the FHIR-lite API, reused by several agents.\" }\n}\n","tag":"illustrative"}],"exampleInput":"cd AI-SDLC\nnode docs/foundations/grade-classification.mjs docs/foundations/example-answers.json","expectedOutput":"N01  CORRECT  given=hook     key=hook\nN02  CORRECT  given=prompt   key=prompt\nN03  CORRECT  given=skill    key=skill\nN04  WRONG    given=skill    key=agent  -> Needs isolation (fresh context, no author bias) and a tool boundary (`tools: Read, Grep, Glob, Bash`). Only a subagent gives both.\nN05  CORRECT  given=workflow key=workflow\nN06  CORRECT  given=mcp      key=mcp\nN07  CORRECT  given=skill    key=skill\nN08  WRONG    given=agent    key=hook  -> Enforcement at a lifecycle event: a `SubagentStop` hook that exits 2 forces the agent to continue. Asking nicely in the prompt is not a control.\nN09  ACCEPTED given=skill    key=agent  (alternative answer: check the justification names the agent it runs in)\nN10  CORRECT  given=mcp      key=mcp\nSCORE 8/10 (pass mark 8) PASS","testCases":[{"name":"Grader passes the example attempt","input":"node docs/foundations/grade-classification.mjs docs/foundations/example-answers.json; echo $?","expected":"Last two lines: `SCORE 8/10 (pass mark 8) PASS` and `0`"},{"name":"Stricter pass mark fails it","input":"node docs/foundations/grade-classification.mjs docs/foundations/example-answers.json --pass 9; echo $?","expected":"`SCORE 8/10 (pass mark 9) FAIL` then `1`"},{"name":"Blank starting file scores zero","input":"node docs/foundations/grade-classification.mjs docs/foundations/my-classification.json (before filling it in)","expected":"Ten lines with `MISSING`, then `SCORE 0/10 (pass mark 8) FAIL`, exit code 1"},{"name":"Key examples point at real files","input":"test -f .claude/hooks/block-secrets.mjs && grep -c 'block-secrets.mjs' docs/foundations/classification-answer-key.md","expected":"At least 1: the N01 example is the hook that exists in the repo today."},{"name":"Unit tests for the grader and key","input":"node --test docs/foundations/foundations.test.mjs","expected":"`# pass 14` and `# fail 0`"}],"evaluationCriteria":["Score at least 8/10 with the grader.","Each justification names the property that decided it (enforcement, external system, gates, isolation, reuse), not just the primitive's name.","N01 and N08 are recognised as enforcement problems, not instruction problems.","For N09, an answer of `skill` explicitly says the skill runs inside the `sre` agent's tool boundary.","No answer uses a primitive outside the six (a permission rule is noted as part of the hook answer, not as a seventh category)."],"improvements":["Add five needs from your own team's backlog to the key, with a justification each, and have a colleague grade themselves.","Extend the grader to fail an answer whose `why` does not contain one of the decision-order keywords.","Ask Claude to classify the same ten needs with `claude -p` and grade its answers; note where it picks `agent` for enforcement problems."]},{"id":"01-contract-validate","title":"Write the reviewer Agent Contract and validate it","objective":"Copy `agents/CONTRACT_TEMPLATE.md`, fill all eleven fields for the `reviewer` roster agent, tag every must and mustNot rule as mechanism or convention, and make `validate-contract.mjs` exit 0. Then export it as the JSON `agentContracts` entry. Module 05-agent-roster finalises this draft as `agents/reviewer/CONTRACT.md`.","startingFiles":[{"path":"AI-SDLC/docs/foundations/reviewer-contract-draft.md","content":"# Agent Contract: \u003cagent-name>\n\n\u003c!--\nHow to use this template (course convention, not a Claude Code feature):\n1. Copy it to agents/\u003cagent-name>/CONTRACT.md. \u003cagent-name> is one of:\n   architect, developer, reviewer, tester, security, sre, orchestrator.\n2. Replace every \u003cangle-bracket> placeholder. Keep the eleven \"## field\" headings exactly as\n   written, in this order: they are the agentContracts fields of build/schema.json, and\n   docs/foundations/validate-contract.mjs checks them.\n3. List fields (inputs, outputs, tools, must, mustNot, failureConditions) use \"- \" bullets.\n   Text fields (purpose, permissions, validation, handoffFormat, humanGate) are one paragraph.\n4. Every line in must / mustNot ends with how it is enforced, in square brackets:\n   [mechanism: \u003cthe Claude Code config or hook that enforces it>] or\n   [convention: \u003cwho or what checks it>]. A rule with no enforcement is a wish.\n5. Validate: node docs/foundations/validate-contract.mjs agents/\u003cagent-name>/CONTRACT.md\nBlock-level HTML comments like this one are ignored by the validator.\n-->\n\nStatus: \u003cdraft | final>\nOwner: \u003cteam or person accountable for this agent>\nRuntime definition: `.claude/agents/\u003cagent-name>.md`\nFinalised in: \u003cmodule id that ships the final version>\n\n## purpose\n\n\u003cOne paragraph: the single job this agent does, for whom, and the decision its output supports. Name what it does NOT do if that is a common confusion.>\n\n## inputs\n\n- \u003cInput 1: what it is, where it comes from (task message, handoff file path, repo path), required or optional>\n- \u003cInput 2>\n\n## outputs\n\n- \u003cOutput 1: the artifact, its path, and its format>\n- \u003cOutput 2: the final message returned to the main session>\n\n## tools\n\n- \u003cTool name exactly as Claude Code spells it, e.g. Read, Grep, Glob, Bash, Edit, Write, mcp__server__tool, plus any scope such as \"Bash (git diff only)\">\n\n## permissions\n\n\u003cOne paragraph: the frontmatter and settings that bound this agent: `tools`, `disallowedTools`, `permissionMode`, and the project `permissions` allow/ask/deny rules it relies on. Say what is enforced by config and what is only requested.>\n\n## must\n\n- \u003cRequired behaviour> [mechanism: \u003cconfig or hook>]\n- \u003cRequired behaviour> [convention: \u003cchecked by whom>]\n\n## mustNot\n\n- \u003cForbidden behaviour> [mechanism: \u003cconfig or hook>]\n- \u003cForbidden behaviour> [convention: \u003cchecked by whom>]\n\n## failureConditions\n\n- \u003cCondition under which the agent must stop and report `status: blocked` or `status: needs-human` instead of guessing>\n\n## validation\n\n\u003cOne paragraph: how anyone can check an output is acceptable: a command that exits 0, a golden task in evaluations/, a hook, a checklist a human applies.>\n\n## handoffFormat\n\n\u003cOne paragraph: the handoff file path (`.ai-sdlc/runs/\u003crun-id>/NN-\u003cagent-name>.md`), its YAML front matter keys (`run_id`, `step`, `agent`, `status`, `inputs`, `next`), and the required sections.>\n\n## humanGate\n\n\u003cOne paragraph: where a human must approve before the work continues, and the real mechanism that stops the work until they do (plan mode, a permission `ask` rule, PR approval, a hook that exits 2).>\n"}],"requiredStructure":"AI-SDLC/\n├── agents/\n│   └── CONTRACT_TEMPLATE.md               # 11 \"## field\" headings = build/schema.json agentContracts\n└── docs/foundations/\n    ├── reviewer-contract-draft.md         # you fill (starts as a copy of the template)\n    ├── validate-contract.mjs              # zero-dependency validator, exit 0 / 1 / 2\n    └── foundations.test.mjs               # node --test suite for the validator and grader","implementation":[{"path":"AI-SDLC/agents/CONTRACT_TEMPLATE.md","language":"markdown","content":"# Agent Contract: \u003cagent-name>\n\n\u003c!--\nHow to use this template (course convention, not a Claude Code feature):\n1. Copy it to agents/\u003cagent-name>/CONTRACT.md. \u003cagent-name> is one of:\n   architect, developer, reviewer, tester, security, sre, orchestrator.\n2. Replace every \u003cangle-bracket> placeholder. Keep the eleven \"## field\" headings exactly as\n   written, in this order: they are the agentContracts fields of build/schema.json, and\n   docs/foundations/validate-contract.mjs checks them.\n3. List fields (inputs, outputs, tools, must, mustNot, failureConditions) use \"- \" bullets.\n   Text fields (purpose, permissions, validation, handoffFormat, humanGate) are one paragraph.\n4. Every line in must / mustNot ends with how it is enforced, in square brackets:\n   [mechanism: \u003cthe Claude Code config or hook that enforces it>] or\n   [convention: \u003cwho or what checks it>]. A rule with no enforcement is a wish.\n5. Validate: node docs/foundations/validate-contract.mjs agents/\u003cagent-name>/CONTRACT.md\nBlock-level HTML comments like this one are ignored by the validator.\n-->\n\nStatus: \u003cdraft | final>\nOwner: \u003cteam or person accountable for this agent>\nRuntime definition: `.claude/agents/\u003cagent-name>.md`\nFinalised in: \u003cmodule id that ships the final version>\n\n## purpose\n\n\u003cOne paragraph: the single job this agent does, for whom, and the decision its output supports. Name what it does NOT do if that is a common confusion.>\n\n## inputs\n\n- \u003cInput 1: what it is, where it comes from (task message, handoff file path, repo path), required or optional>\n- \u003cInput 2>\n\n## outputs\n\n- \u003cOutput 1: the artifact, its path, and its format>\n- \u003cOutput 2: the final message returned to the main session>\n\n## tools\n\n- \u003cTool name exactly as Claude Code spells it, e.g. Read, Grep, Glob, Bash, Edit, Write, mcp__server__tool, plus any scope such as \"Bash (git diff only)\">\n\n## permissions\n\n\u003cOne paragraph: the frontmatter and settings that bound this agent: `tools`, `disallowedTools`, `permissionMode`, and the project `permissions` allow/ask/deny rules it relies on. Say what is enforced by config and what is only requested.>\n\n## must\n\n- \u003cRequired behaviour> [mechanism: \u003cconfig or hook>]\n- \u003cRequired behaviour> [convention: \u003cchecked by whom>]\n\n## mustNot\n\n- \u003cForbidden behaviour> [mechanism: \u003cconfig or hook>]\n- \u003cForbidden behaviour> [convention: \u003cchecked by whom>]\n\n## failureConditions\n\n- \u003cCondition under which the agent must stop and report `status: blocked`
