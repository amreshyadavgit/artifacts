validation\", \"handoffFormat\", \"humanGate\"]) assert.equal(typeof c[f], \"string\");\n  assert.deepEqual(c.tools, [\"Read\", \"Grep\", \"Glob\", \"Bash (only `git diff`, `git log`, `git status`)\"]);\n  assert.equal(c.mustNot.filter((x) => x.includes(\"[mechanism:\")).length, 4);\n});\n\ntest(\"validator CLI exit codes: 0 valid, 1 invalid, 2 usage\", () => {\n  assert.equal(run(\"validate-contract.mjs\", [join(HERE, \"reviewer-contract-draft.md\")]).status, 0);\n  assert.equal(run(\"validate-contract.mjs\", [join(HERE, \"reviewer-contract-first-attempt.md\")]).status, 1);\n  assert.equal(run(\"validate-contract.mjs\", [join(ROOT, \"agents\", \"CONTRACT_TEMPLATE.md\")]).status, 1);\n  assert.equal(run(\"validate-contract.mjs\", [\"--template\", join(ROOT, \"agents\", \"CONTRACT_TEMPLATE.md\")]).status, 0);\n  assert.equal(run(\"validate-contract.mjs\", []).status, 2);\n});\n\ntest(\"answer key parses twelve needs with valid answers, two of them frappe-hook traps\", () => {\n  const key = parseKey(keyMd);\n  assert.equal(key.size, 12);\n  for (const k of key.values()) {\n    assert.ok(PRIMITIVES.includes(k.answer));\n    for (const a of k.accepted) assert.ok(PRIMITIVES.includes(a));\n  }\n  assert.equal(key.get(\"N01\").answer, \"claude-code-hook\");\n  assert.equal(key.get(\"N11\").answer, \"frappe-hook\");\n  assert.equal(key.get(\"N12\").answer, \"claude-code-hook\");\n  assert.deepEqual(key.get(\"N09\").accepted, [\"skill\"]);\n});\n\ntest(\"grader scores correct, accepted, wrong, ambiguous and missing answers\", () => {\n  const key = parseKey(keyMd);\n  const r = grade(key, {\n    N01: \"claude-code-hook\",\n    N04: { answer: \"skill\", why: \"reuse\" },\n    N08: \"hook\",\n    N09: { answer: \"skill\", why: \"production-rca inside the sre agent\" },\n    N11: \"frappe-hook\",\n  });\n  const by = Object.fromEntries(r.rows.map((x) => [x.id, x.verdict]));\n  assert.equal(by.N01, \"CORRECT\");\n  assert.equal(by.N04, \"WRONG\");\n  assert.equal(by.N08, \"AMBIGUOUS\");\n  assert.equal(by.N09, \"ACCEPTED\");\n  assert.equal(by.N11, \"CORRECT\");\n  assert.equal(by.N02, \"MISSING\");\n  assert.equal(r.score, 3);\n});\n\ntest(\"grader CLI passes the example answers at 10/12\", () => {\n  const r = run(\"grade-classification.mjs\", [join(HERE, \"example-answers.json\")]);\n  assert.equal(r.status, 0);\n  assert.match(r.stdout, /SCORE 10\\/12 \\(pass mark 10\\) PASS/);\n  assert.equal(run(\"grade-classification.mjs\", [join(HERE, \"example-answers.json\"), \"--pass\", \"11\"]).status, 1);\n});\n","tag":"illustrative"}],"exampleInput":"cd AI-SDLC-frappe\nnode docs/foundations/validate-contract.mjs --template agents/CONTRACT_TEMPLATE.md\nnode docs/foundations/validate-contract.mjs docs/foundations/reviewer-contract-first-attempt.md\n# fix the same mistakes in your own copy, then:\nnode docs/foundations/validate-contract.mjs docs/foundations/reviewer-contract-draft.md\nnode docs/foundations/validate-contract.mjs --json docs/foundations/reviewer-contract-draft.md | jq '{agent, tools}'","expectedOutput":"OK    agents/CONTRACT_TEMPLATE.md: 11/11 contract sections (template mode)\n\nWARN  docs/foundations/reviewer-contract-first-attempt.md: must: 1 bare \"hook\" (say \"Frappe hook\" or \"Claude Code hook\", CLAUDE.md rule 5)\nFAIL  docs/foundations/reviewer-contract-first-attempt.md: tools: \"DocTypeInspector\" is not a Claude Code tool name\nFAIL  docs/foundations/reviewer-contract-first-attempt.md: tools: \"bench ... console\" must not be in a tool scope (arbitrary code as Administrator or destroys a site)\nFAIL  docs/foundations/reviewer-contract-first-attempt.md: must[4]: must end with [mechanism: ...] or [convention: ...]\nFAIL  docs/foundations/reviewer-contract-first-attempt.md: humanGate: name the real mechanism (plan mode, a permission ask rule, PR approval, or a Claude Code hook that exits 2)\n\nOK    docs/foundations/reviewer-contract-draft.md: 11/11 contract sections\n{\n  \"agent\": \"reviewer\",\n  \"tools\": [\n    \"Read\",\n    \"Grep\",\n    \"Glob\",\n    \"Bash (only `git diff`, `git log`, `git status`)\"\n  ]\n}","testCases":[{"name":"Filled contract validates with no warnings","input":"node docs/foundations/validate-contract.mjs docs/foundations/reviewer-contract-draft.md; echo $?","expected":"`OK    docs/foundations/reviewer-contract-draft.md: 11/11 contract sections`, no `WARN` line, then `0`"},{"name":"First attempt is rejected for the planted mistakes","input":"node docs/foundations/validate-contract.mjs docs/foundations/reviewer-contract-first-attempt.md 2>&1 | grep -c '^FAIL'; echo ${PIPESTATUS[0]}","expected":"4 FAIL lines (DocTypeInspector, bench console, must[4], humanGate) plus one WARN for the bare \"hook\"; exit code 1"},{"name":"Unfilled template is rejected","input":"node docs/foundations/validate-contract.mjs agents/CONTRACT_TEMPLATE.md; echo $?","expected":"`FAIL ... agent \"\u003cagent-name>\" is not in the roster` plus one `unreplaced \u003cplaceholder> text` line per section, then `1`"},{"name":"Template headings match the schema","input":"grep -E '^## ' agents/CONTRACT_TEMPLATE.md | sed 's/## //' | paste -sd, -","expected":"purpose,inputs,outputs,tools,permissions,must,mustNot,failureConditions,validation,handoffFormat,humanGate"},{"name":"Boundaries are mechanisms, not only conventions","input":"awk '/^## mustNot$/,/^## failureConditions$/' docs/foundations/reviewer-contract-draft.md | grep -c '\\[mechanism:'","expected":"4 (no Edit/Write, no Agent, Bash limited to git with no bench, no site_config reads)"},{"name":"The permissions the contract relies on exist in settings","input":"node -e 'const s=require(\"./.claude/settings.json\").permissions; console.log(s.ask.includes(\"Bash(bench --site * console)\"), s.deny.includes(\"Read(**/site_config.json)\"), s.allow.includes(\"Bash(git diff *)\"))'","expected":"true true true"},{"name":"Unit tests","input":"node --test docs/foundations/foundations.test.mjs","expected":"`# tests 16`, `# pass 16`, `# fail 0`"}],"evaluationCriteria":["All eleven fields filled; `validate-contract.mjs` exits 0 with no warnings.","`tools` and `permissions` agree: nothing in permissions grants a tool that `tools` omits, and the Bash scope names no `bench` command.","The no-edit, no-delegation, git-only Bash and no-site_config rules are enforced by mechanism, not by instruction.","The `dontAsk` gap is acknowledged: `bench --site test.localhost run-tests` is on the project allow list, so an agent-scoped Claude Code `PreToolUse` hook is the backstop (and also covers the `permissionMode` caveat under `acceptEdits`, `auto`, `bypassPermissions` parents).","`failureConditions` cover empty diff, oversized diff, missing inputs, a `permissions` or whitelist change (next: security), an edited `patches.txt` line, and a request to fix, test or migrate.","`humanGate` names a real mechanism (PR approval, the `ask` rule on `bench --site * migrate`) and states that the reviewer never gives merge approval."],"improvements":["Fill the template for `developer` next; its `tools` include Edit, Write and Bash with `bench --site test.localhost run-tests *`, so its `mustNot` must restrict where it writes and say that `migrate` runs only behind the `ask` rule.","Add a `--frontmatter` mode that prints the matching `.claude/agents/reviewer.md` frontmatter (`name`, `description`, `tools`, `disallowedTools`, `permissionMode`) from the contract, and diff it against the real file in module 05.","Run the validator over `agents/*/CONTRACT.md` in CI once module 05 has written them."]}],"agentContracts":[{"agent":"reviewer","purpose":"Review one diff of `sample-app/spice_lite/` against the Frappe standards and return structured findings, so the human reviewer can decide faster whether the change is mergeable. On a Frappe app the Python is only half of a change: the reviewer reads the DocType JSON diff (fields, `permissions` array, `search_index`, `autoname`), `patches.txt`, `hooks.py` entries and fixtures together with the controllers and whitelisted methods. It covers correctness, design, readability, testing and standards; it flags security and performance concerns but defers deep analysis of them to the `security` and `sre` agents. It never changes code, never runs `bench`, and never approves a change.","inputs":["Base ref to diff against, e.g. `main` (required, in the task message).","Run id, e.g. `2026-09-30-feat-observation-interpretation` (required, in the task message; names the run folder).","Path of the upstream handoff that describes the intent of the change, e.g. `.ai-sdlc/runs/\u003crun-id>/04-developer.md` (optional; without it the reviewer reviews the diff on its own merits and says so).","Standards to apply: `context/standards/review-standards.md` and `context/standards/frappe-coding-standards.md` (always), `context/standards/testing-standards.md` when files under `tests/` or `test_*.py` change, `context/standards/api-standards.md` when `spice_lite/api/` changes.","Path-scoped rules that Claude Code loads by itself when the reviewer reads matching files: `.claude/rules/spice-lite-python.md` for `*.py` and `.claude/rules/doctype-json.md` for DocType JSON, `patches.txt` and `hooks.py`."],"outputs":["Final message to the main session: the complete handoff document (YAML front matter plus the sections in handoffFormat). The orchestrator, which has Write access to the run folder, saves it as `.ai-sdlc/runs/\u003crun-id>/NN-reviewer.md`.","A findings table with one row per finding: `id | severity | category | location | evidence | recommendation`, severity from `critical | high | medium | low | info`.","A \"Frappe surfaces in this diff\" line listing which of DocType JSON, `patches.txt`, `hooks.py`, fixtures and whitelisted methods the diff touched, so a human can see that the JSON was reviewed and not skipped.","An explicit \"no findings\" line for every category it checked and found clean."],"tools":["Read","Grep","Glob","Bash (only `git diff`, `git log`, `git status`)"],"permissions":"Frontmatter in `.claude/agents/reviewer.md`: `tools: Read, Grep, Glob, Bash` (an allowlist, so Edit, Write and Agent are not available) and `disallowedTools: Edit, Write, NotebookEdit` as a second guard, with `permissionMode: dontAsk`, which auto-denies anything that would prompt. In this repo that means the `ask` rules in `.claude/settings.json` (`bench --site * migrate`, `console`, `execute`, `install-app`, `git commit`, `git push`) are denied for the reviewer instead of reaching a human. Two gaps remain and are closed in module 05: `Bash(bench --site test.localhost run-tests *)` is on the project allow list, so `dontAsk` would still let the reviewer run tests; and a subagent's `permissionMode` is ignored when the parent session runs in `bypassPermissions`, `acceptEdits` or `auto`. Module 05 therefore adds a Claude Code `PreToolUse` hook in the agent's own frontmatter that exits 2 for any Bash command outside `git diff|git log|git status`. The project deny rules (`Read(**/site_config.json)`, `Read(**/common_site_config.json)`, `Read(./.env)`, `Read(./**/*.phi.*)`, `bench drop-site`, `reinstall`) apply to the reviewer like every other agent.","must":["Give every finding all six fields: id, severity, category, location as `path:line`, evidence quoted from the diff or file, recommendation. [convention: checked by the reviewer golden tasks in module 09-agent-evaluation]","Cite the standard violated as file plus rule number, e.g. `context/standards/frappe-coding-standards.md` rule 2 for a `frappe.get_all` in a request path. [convention: checked by the reviewer golden tasks]","Review DocType JSON, `patches.txt`, `hooks.py` and fixture changes together with the Python diff, and rate a schema or data change without a `patches.txt` entry, or a `permissions` array change without a security step, at least `high`. [convention: `context/standards/review-standards.md`, checked by a golden task with a seeded DocType JSON diff]","State \"no findings\" for each category it checked and found clean. [convention: human reviewer reads the handoff]","Read the change with `git diff \u003cbase>...HEAD`, not from memory of an earlier conversation. [mechanism: subagents start with no conversation history; Bash is limited to git by `permissionMode: dontAsk` plus allow rules]","End with a handoff whose front matter has `run_id`, `step`, `agent: reviewer`, `status`, `inputs`, `next`. [mechanism: the Claude Code hook `check-handoff.mjs` from module 08 rejects a handoff with missing keys]"],"mustNot":["Edit, create or delete any file, including DocType JSON and `patches.txt`. [mechanism: Edit and Write are absent from `tools` and listed in `disallowedTools`]","Delegate to other agents. [mechanism: `Agent` is absent from `tools`, so the reviewer stays at depth 1]","Run any shell command other than `git diff`, `git log` or `git status`; in particular no `bench` command (run-tests, migrate, console, execute). [mechanism: `permissionMode: dontAsk` auto-denies the `ask` rules, backed by the agent-scoped Claude Code `PreToolUse` hook from module 05 that also blocks the allowed run-tests]","Read `site_config.json` or `common_site_config.json`. [mechanism: `permissions.deny` rules `Read(**/site_config.json)` and `Read(**/common_site_config.json)` in `.claude/settings.json`]","Present its verdict as a merge approval or write \"LGTM\", \"approved\" or \"ready to merge\". [convention: `context/standards/review-standards.md`: the `APPROVE` verdict only means no blocking findings; merge approval is a human PR approval]","Quote PHI in evidence (MRN values, names, birth dates, search terms, patient-linked observation values); quote code and synthetic fixtures such as `MRN-000123` only. [convention: `context/security/phi-and-secrets-policy.md`, re-checked by the security agent]","Report the marked `TEACHING-DEFECT(perf-n+1)` in `spice_lite/api/fhir.py` `lastn()`, or the open defects D-1 and D-3, as new findings. They may be mentioned as known, with a reference to `sample-app/docs/KNOWN_DEFECTS.md`. [convention: reviewer golden tasks include a case that checks this]"],"failureConditions":["The diff against the base ref is empty or the base ref does not exist: return `status: blocked` with the exact `git` error.","The diff touches more than 40 files or 2,000 changed lines: return `status: needs-human` and ask for the change to be split (a regenerated DocType JSON with a reordered `field_order` counts; ask for it in its own commit).","A referenced standard file or upstream handoff path does not exist: return `status: needs-human` naming the missing path.","The change touches a DocType `permissions` array, `permission_query_conditions` or `has_permission` in `hooks.py`, a `@frappe.whitelist` decorator, `ignore_permissions`, or `spice_lite/audit.py`: review it, but set `next: security` and say why.","The change edits an existing line in `patches.txt`: Patch Log records the exact line text, so the patch would run again on every country site at the next migrate. Report it as a `high` finding and return `status: needs-human`.","The task asks the reviewer to fix the code, run the tests, or migrate a site: refuse, return `status: blocked` and recommend routing to `developer` or `tester`.","The run hits `maxTurns` (the output is marked partial): return `status: blocked` rather than a partial finding list presented as complete."],"validation":"This contract is checked with `node docs/foundations/validate-contract.mjs docs/foundations/reviewer-contract-draft.md` (exit 0, no warnings). Reviewer output is checked three ways: the handoff front matter by the Claude Code hook `check-handoff.mjs` (module 08); the findings against golden tasks in `evaluations/` (module 09), where a seeded diff that switches `search_patients` from `frappe.get_list` to `frappe.get_all` must produce a `security` finding citing frappe-coding-standards rule 2, and a seeded diff that retypes `SL Observation.value` in `sl_observation.json` without a `patches.txt` entry must produce a `high` `standards` finding citing rule 6; and a human spot-check that no finding lacks quoted evidence.","handoffFormat":"Markdown with YAML front matter as defined in `workflows/README.md` and the style guide: `run_id`, `step`, `agent: reviewer`, `status` (`complete | blocked | needs-human`), `inputs` (list of upstream handoff file names), `next` (`security`, `tester`, `developer` or `human`). Sections in order: `## Summary` (verdict in one sentence, counts per severity, the Frappe surfaces line), `## Findings` (the six-column table), `## Decisions` (what was out of scope and why), `## Open questions`, `## Artifacts` (always \"none written; returned to main session\"). Saved by the orchestrator as `.ai-sdlc/runs/\u003crun-id>/NN-reviewer.md`.","humanGate":"The reviewer is advisory; the gate is the human pull-request approval. Any `critical` or `high` finding blocks merge (review-standards), and in an orchestrated run the orchestrator stops with `status: needs-human` until a person accepts or rejects each one. Nothing the reviewer produces reaches a site or the remote: `git push` and `bench --site * migrate` are `ask` rules in `.claude/settings.json` (denied outright under the reviewer's `dontAsk`), force-push and `bench drop-site` are denied, and CLAUDE.md rule 9 leaves push, merge, migrating a shared site and deploying to a human."}],"checklist":["You can state, for a given job on the bench, whether it needs a different context, different tools or different authority, and therefore whether it is an agent.","`docs/foundations/anatomy-breakdown-reviewer.md` has twelve rows, each ending in Mechanism: or Convention:, and a Frappe surfaces table.","Every Claude Code field you cite exists in `build/CLAUDE_CODE_FACTS.md` (agent fields camelCase, skill fields hyphenated).","You never write a bare \"hook\": it is a Frappe hook in `hooks.py` or a Claude Code hook in `.claude/settings.json`.","`node docs/foundations/grade-classification.mjs` scores your classification at 10/12 or better, including both hook traps.","`agents/CONTRACT_TEMPLATE.md` has the eleven `## field` headings in schema order and passes `--template` validation.","`docs/foundations/reviewer-contract-draft.md` passes `validate-contract.mjs` with exit code 0 and no warnings.","Every `must` and `mustNot` rule in the reviewer draft is tagged `[mechanism: ...]` or `[convention: ...]`.","The reviewer draft omits `Agent`, `Edit` and `Write` from `tools`, grants no `bench` command, and says why.","The reviewer draft routes `permissions`-array and whitelist changes to `security` and treats an edited `patches.txt` line as `needs-human`.","The `humanGate` field names a real mechanism, and `bench migrate` on a shared site stays with a person.","`node --test docs/foundations/foundations.test.mjs` reports 16 passing tests."]}],"i18n":{"hinglish":{"modules":{}}}};

      return (s > 0 ? "…" : "") + esc(t.slice(s, i)) + "<mark>" + esc(t.slice(i, i + ql.length)) + "</mark>" + esc(t.slice(i + ql.length, e)) + (e < t.length ? "…" : "");
    }
    function add(href, title, where, text) { var s = snip(text); if (s) out.push({ href: href, title: title, where: where, s: s }); }
    MODULES.forEach(function (m) {
      add("#m-" + m.id, m.title, "Module summary", m.title + " — " + m.summary);
      (m.concepts || []).forEach(function (c) { add("#m-" + m.id, c.heading, m.title + " · concept", c.heading + " — " + c.body_md); });
      (m.comparisonTables || []).forEach(function (t) { add("#m-" + m.id, t.title, m.title + " · table", t.title + " " + t.rows.map(function (r) { return r.join(" | "); }).join(" \n ")); });
      (m.exercises || []).forEach(function (x) {
        add("#x-" + x.id, x.title, m.title + " · exercise", x.title + " — " + x.objective);
        (x.implementation || []).forEach(function (f) { add("#" + slugPath(f.path), f.path, x.title + " · file", f.path + "\n" + f.content); });
        add("#x-" + x.id, x.title + " · expected output", m.title, x.expectedOutput);
      });
      (m.agentContracts || []).forEach(function (c) { add("#m-" + m.id, c.agent + " contract", m.title, [c.purpose].concat(c.must, c.mustNot, c.failureConditions, [c.humanGate]).join(" · ")); });
      (m.checklist || []).forEach(function (c) { add("#m-" + m.id, "Checklist item", m.title, c); });
    });
    view.innerHTML = '<div class="section"><span class="eyebrow">Search</span><h1>' + esc(t("results", { n: out.length })) + " “" + esc(q) + '”</h1></div><div class="results">' +
      out.slice(0, 200).map(function (r) { return '<a class="result" href="' + esc(r.href) + '"><b>' + esc(r.title) + "</b><small>" + esc(r.where) + "</small><span>" + r.s + "</span></a>"; }).join("") + "</div>";
  }
  function renderNotFound() { view.innerHTML = '<div class="section"><h1>' + t("notFound") + '</h1><p class="lede">That link does not match a module, exercise, or file. <a href="#home">Go to the overview</a>.</p></div>'; }

  /* ---------- enhancement: highlight, copy, mermaid ---------- */
  var mermaidReady = false;
  function isDark() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t) return t === "dark";
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function enhance(root) {
    root.querySelectorAll("pre code").forEach(function (c) {
      if (window.hljs && !c.dataset.hl) { try { hljs.highlightElement(c); } catch (e) {} c.dataset.hl = "1"; }
    });
    root.querySelectorAll("figure.code .copy").forEach(function (b) {
      if (b.dataset.wired) return; b.dataset.wired = "1";
      b.addEventListener("click", function () {
        var code = b.closest("figure").querySelector("code"), text = code.textContent;
        function ok() { b.textContent = "Copied"; b.classList.add("done"); setTimeout(function () { b.textContent = "Copy"; b.classList.remove("done"); }, 1500); }
        function fallback() { var r = document.createRange(); r.selectNodeContents(code); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Press Ctrl+C"; }
        try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
      });
    });
    var ms = root.querySelectorAll("pre.mermaid:not([data-processed])");
    if (ms.length && window.mermaid) {
      try {
        mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: isDark() ? "dark" : "neutral", fontFamily: "Public Sans, system-ui, sans-serif" });
        mermaid.run({ nodes: ms }).catch(function (e) { console.warn("mermaid", e); });
      } catch (e) { console.warn("mermaid", e); }
    }
  }

  /* ---------- router ---------- */
  var lastRoute = "";
  function route() {
    var h = decodeURIComponent((location.hash || "#home").slice(1)) || "home";
    lastRoute = h;
    document.body.classList.remove("nav-open"); closeScrim();
    if (h === "home") renderHome();
    else if (h.indexOf("m-") === 0) { var m = findMod(h.slice(2)); m ? renderModule(m) : renderNotFound(); }
    else if (h.indexOf("x-") === 0) { var e = findEx(h.slice(2)); e ? renderModule(e.m, e.x.id) : renderNotFound(); }
    else if (h.indexOf("c-") === 0) { renderType("contracts"); }
    else if (h.indexOf("t-") === 0) renderType(h.slice(2));
    else if (h.indexOf("f~") === 0) renderFile(h);
    else if (h.indexOf("s-") === 0) renderSearch(h.slice(2).replace(/_/g, " "));
    else renderNotFound();
    markActive(h);
    enhance(view);
    if (h.indexOf("x-") !== 0) window.scrollTo(0, 0);
  }

  /* ---------- zip download ---------- */
  function download() {
    var btn = document.getElementById("download");
    if (!window.JSZip) { btn.textContent = "Zip library failed to load"; return; }
    var zip = new JSZip(), impl = {};
    files.forEach(function (e) { if (e.kind === "implementation") impl[e.f.path] = e.f.content; });
    Object.keys(impl).forEach(function (p) { zip.file(p, impl[p]); });
    files.forEach(function (e) {
      if (e.kind !== "starting") return;
      var p = impl[e.f.path] !== undefined ? "starting-files/" + e.x.id + "/" + e.f.path : e.f.path;
      zip.file(p, e.f.content);
    });
    zip.file(ED.repo + "STARTER_README.md", "# AI-SDLC starter repo\n\nGenerated from the curriculum SPA (" + MODULES.length + " modules, " + exercises.length + " exercises).\n\n" +
      "Implementation files are at their real paths. Starting files that would overwrite an implementation file are under `starting-files/<exercise-id>/`.\n\n" +
      "The sample app is included only where exercises embed its files; clone the full reference repository for the complete `" + ED.repo + "sample-app/`.\n");
    btn.textContent = "Building zip…";
    zip.generateAsync({ type: "blob" }).then(function (blob) {
      try {
        var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "ai-sdlc-" + (ED.id || "starter") + "-starter.zip";
        document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
        btn.textContent = t("download");
      } catch (e) { btn.textContent = "Download blocked by this viewer"; }
    }, function () { btn.textContent = "Zip failed, try again"; });
  }

  /* ---------- theme + mobile nav ---------- */
  function toggleTheme() {
    var next = isDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next); store.set("ai-sdlc-theme", next);
    route();
  }
  (function () { var t = store.get("ai-sdlc-theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); })();
  var scrim = null;
  function closeScrim() { if (scrim) { scrim.remove(); scrim = null; } document.getElementById("nav-toggle").setAttribute("aria-expanded", "false"); }
  document.getElementById("nav-toggle").addEventListener("click", function () {
    var open = !document.body.classList.contains("nav-open");
    document.body.classList.toggle("nav-open", open);
    this.setAttribute("aria-expanded", String(open));
    if (open) { scrim = document.createElement("div"); scrim.className = "scrim"; scrim.addEventListener("click", function () { document.body.classList.remove("nav-open"); closeScrim(); }); document.body.appendChild(scrim); }
    else closeScrim();
  });
  document.getElementById("theme-toggle").addEventListener("click", toggleTheme);
  document.getElementById("theme-toggle-m").addEventListener("click", toggleTheme);
  document.getElementById("download").addEventListener("click", download);
  var qt = null;
  document.getElementById("q").addEventListener("input", function () {
    var v = this.value; clearTimeout(qt);
    qt = setTimeout(function () { if (v.trim().length >= 2) renderSearch(v); else if (lastRoute) route(); enhance(view); }, 180);
  });
  window.addEventListener("hashchange", route);

  function applyLang(l, rerender) {
    lang = (l === "hinglish" && I18N.hinglish) ? "hinglish" : "en";
    MODULES = modulesFor(lang);
    reindex();
    document.documentElement.setAttribute("lang", lang === "hinglish" ? "hi-Latn" : "en");
    document.querySelectorAll(".lang-switch [data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang)); });
    var m = document.getElementById("lang-toggle-m"); if (m) m.textContent = lang === "hinglish" ? "HI" : "EN";
    document.getElementById("q-label").textContent = t("search");
    document.getElementById("nav-levels-h").textContent = t("byLevel");
    document.getElementById("nav-types-h").textContent = t("byType");
    document.getElementById("download").textContent = t("download");
    document.getElementById("theme-toggle").textContent = t("theme");
    buildNav(); updateProgress();
    if (rerender) route();
  }
  document.querySelectorAll(".lang-switch [data-lang]").forEach(function (b) {
    b.addEventListener("click", function () { store.set(LKEY, b.getAttribute("data-lang")); applyLang(b.getAttribute("data-lang"), true); });
  });
  document.getElementById("lang-toggle-m").addEventListener("click", function () {
    var next = lang === "hinglish" ? "en" : "hinglish"; store.set(LKEY, next); applyLang(next, true);
  });
  (function () {
    var en = document.getElementById("edition-name"); if (en && ED.name) en.textContent = ED.name;
    var oe = document.getElementById("other-edition");
    if (oe && ED.other && ED.other.href) { oe.href = ED.other.href; oe.textContent = "Switch to " + ED.other.name; oe.hidden = false; }
  })();
  if (!I18N.hinglish) document.querySelectorAll(".lang-switch, #lang-toggle-m").forEach(function (e) { e.hidden = true; });
  applyLang(store.get(LKEY) || "en", false);
  route();
})();
</script>
</body>
</html>
