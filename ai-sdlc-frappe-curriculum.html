<style>
/* Layout: fixed left rail (levels + artifact types) beside a single reading column; code/tables/diagrams scroll inside their own frames. */
:root {
  --bg: #f6f8f8;
  --surface: #ffffff;
  --surface-2: #eef2f2;
  --fg: #16201f;
  --muted: #53625f;
  --line: #d5dedc;
  --accent: #0b6e69;
  --accent-soft: #d9eeec;
  --accent-fg: #ffffff;
  --warn: #9a5b00;
  --warn-soft: #fbefd9;
  --ok: #2c6e2f;
  --ok-soft: #e1f1e1;
  --code-bg: #f1f4f4;
  --code-fg: #1d2a28;
  --hl-kw: #8a2f6b;
  --hl-str: #2c6e2f;
  --hl-num: #9a5b00;
  --hl-com: #6b7b78;
  --hl-fn: #1c5aa6;
  --font-display: "Literata", Georgia, "Times New Roman", serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --rail: 300px;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1514; --surface: #151d1c; --surface-2: #1b2524; --fg: #e3ebe9; --muted: #98a9a5; --line: #2a3735;
    --accent: #4fc2b8; --accent-soft: #173634; --accent-fg: #06201e; --warn: #f0b35a; --warn-soft: #3a2b12;
    --ok: #86cf88; --ok-soft: #173019; --code-bg: #111a19; --code-fg: #d6e2df;
    --hl-kw: #e28ac6; --hl-str: #93d18f; --hl-num: #f0b35a; --hl-com: #7d8f8b; --hl-fn: #86b6f2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #151d1c; --surface-2: #1b2524; --fg: #e3ebe9; --muted: #98a9a5; --line: #2a3735;
  --accent: #4fc2b8; --accent-soft: #173634; --accent-fg: #06201e; --warn: #f0b35a; --warn-soft: #3a2b12;
  --ok: #86cf88; --ok-soft: #173019; --code-bg: #111a19; --code-fg: #d6e2df;
  --hl-kw: #e28ac6; --hl-str: #93d18f; --hl-num: #f0b35a; --hl-com: #7d8f8b; --hl-fn: #86b6f2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 16px/1.6 var(--font-body); -webkit-text-size-adjust: 100%; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 650; line-height: 1.25; text-wrap: balance; margin: 0; }
h1 { font-size: 2rem; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.15rem; }
code, pre, kbd { font-family: var(--font-mono); font-size: .86em; }
:not(pre) > code { background: var(--code-bg); padding: .1em .35em; border-radius: 4px; overflow-wrap: anywhere; }

.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }
.topbar { display: none; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface); padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--fg); }
.brand b { font-family: var(--font-display); font-size: 1.15rem; }
.brand span { color: var(--muted); font-size: .8rem; }
.brand .edition { color: var(--accent); font-weight: 700; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; }
.search input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--fg); font: inherit; font-size: .92rem; }
.navgroup h4 { font-family: var(--font-body); font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.navgroup ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.navgroup a { display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 4px; text-decoration: none; color: var(--fg); font-size: .9rem; }
.navgroup a:hover { background: var(--surface-2); }
.navgroup a.active { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.navgroup .lv { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); min-width: 2.2em; font-variant-numeric: tabular-nums; }
.navgroup .count { margin-left: auto; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.rail-actions { display: flex; flex-direction: column; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 7px 12px; border-radius: var(--radius); font: 600 .85rem var(--font-body); cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.progress-meter { font-size: .8rem; color: var(--muted); }
.lang-switch { display: flex; gap: 0; }
.lang-switch .btn { flex: 1; border-radius: 0; }
.lang-switch .btn:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.lang-switch .btn:last-child { border-radius: 0 var(--radius) var(--radius) 0; margin-left: -1px; }
.lang-switch .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.progress-bar { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.progress-bar i { display: block; height: 100%; background: var(--accent); width: 0; }

main { min-width: 0; padding-block: 32px 80px; padding-inline: clamp(16px, 4vw, 56px); }
.content { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.eyebrow { font-size: .75rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.lede { font-size: 1.08rem; color: var(--muted); max-width: 68ch; }
.prose { max-width: 70ch; }
.prose p, .prose ul, .prose ol { margin: 0 0 .8em; }
.prose table { border-collapse: collapse; display: block; max-width: 100%; overflow-x: auto; font-size: .9rem; }
.prose th, .prose td { text-align: left; vertical-align: top; padding: 6px 10px; border: 1px solid var(--line); }
.prose th { background: var(--surface-2); }
.prose pre { max-width: 100%; overflow-x: auto; padding: 12px 14px; background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); }
.section { display: flex; flex-direction: column; gap: 14px; }
.section > h2 { padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .78rem; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); text-decoration: none; }
.chip.tag-verified { background: var(--ok-soft); border-color: transparent; color: var(--ok); font-weight: 600; }
.chip.tag-illustrative { background: var(--warn-soft); border-color: transparent; color: var(--warn); font-weight: 600; }
.concept { display: flex; flex-direction: column; gap: 8px; }

.scroll-x { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table.cmp { border-collapse: collapse; width: 100%; font-size: .9rem; min-width: 560px; }
table.cmp th, table.cmp td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
table.cmp th { background: var(--surface-2); font-weight: 700; white-space: nowrap; }
table.cmp tr:last-child td { border-bottom: 0; }
table.cmp td:first-child { font-weight: 600; }

.diagram { padding: 16px; text-align: center; }
.diagram .mermaid { display: inline-block; min-width: 100%; }
.diagram-title { font-size: .85rem; color: var(--muted); margin: 0 0 6px; }

figure.code { margin: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--code-bg); overflow: hidden; min-width: 0; }
figure.code figcaption { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); font: .78rem var(--font-mono); color: var(--muted); min-width: 0; }
figure.code figcaption .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
figure.code pre { margin: 0; padding: 12px 14px; overflow-x: auto; color: var(--code-fg); line-height: 1.5; }
figure.code pre code { background: none; padding: 0; font-size: .82rem; }
.copy { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 4px; padding: 2px 8px; font: 600 .72rem var(--font-body); cursor: pointer; }
.copy.done { color: var(--ok); border-color: var(--ok); }
.hljs-keyword, .hljs-selector-tag, .hljs-built_in, .hljs-type, .hljs-literal { color: var(--hl-kw); }
.hljs-string, .hljs-attr + .hljs-string, .hljs-regexp, .hljs-addition { color: var(--hl-str); }
.hljs-number, .hljs-symbol, .hljs-variable, .hljs-template-variable { color: var(--hl-num); }
.hljs-comment, .hljs-quote, .hljs-meta, .hljs-deletion { color: var(--hl-com); font-style: italic; }
.hljs-title, .hljs-function, .hljs-section, .hljs-attr, .hljs-name, .hljs-attribute { color: var(--hl-fn); }

.exercise { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); display: flex; flex-direction: column; min-width: 0; scroll-margin-top: 16px; }
.exercise header { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
.exercise header .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.exercise header .xid { font: .75rem var(--font-mono); color: var(--muted); }
.done-toggle { display: inline-flex; gap: 8px; align-items: center; font-size: .85rem; font-weight: 600; cursor: pointer; padding: 5px 10px; border: 1px solid var(--line); border-radius: var(--radius); }
.done-toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
.exercise.is-done header { background: var(--ok-soft); }
.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 0 10px; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tabs button { flex: none; border: 0; background: none; color: var(--muted); font: 600 .82rem var(--font-body); padding: 10px 10px 9px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs button .n { font-family: var(--font-mono); font-size: .7rem; margin-right: 4px; color: var(--muted); }
.panel { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel pre.plain { margin: 0; padding: 12px 14px; background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; font-size: .82rem; white-space: pre; }
.testcase { border: 1px solid var(--line); border-radius: var(--radius); display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
.testcase > div { padding: 10px 12px; min-width: 0; }
.testcase > div + div { border-left: 1px solid var(--line); }
.testcase .name { grid-column: 1 / -1; font-weight: 700; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.testcase .lbl { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
.testcase pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: .8rem; }
ul.criteria { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }

.contract { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.contract header { padding: 12px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
.contract header code { font-size: 1rem; font-weight: 600; }
.contract dl { margin: 0; display: grid; grid-template-columns: 170px minmax(0, 1fr); }
.contract dt, .contract dd { margin: 0; padding: 9px 16px; border-bottom: 1px solid var(--line); font-size: .9rem; min-width: 0; }
.contract dt { font-weight: 700; color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
.contract dd ul { margin: 0; padding-left: 1.1em; }
.contract dd.gate { background: var(--warn-soft); }

.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checklist li { display: flex; gap: 10px; align-items: flex-start; }
.checklist li::before { content: ""; flex: none; width: 14px; height: 14px; margin-top: 5px; border: 1.5px solid var(--accent); border-radius: 3px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 14px 16px; text-decoration: none; color: var(--fg); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card:hover { border-color: var(--accent); }
.card .meta { font-size: .78rem; color: var(--muted); }
.card b { font-family: var(--font-display); font-weight: 650; font-size: 1.02rem; }
.card p { margin: 0; font-size: .88rem; color: var(--muted); }

.results { display: flex; flex-direction: column; gap: 8px; }
.result { padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); text-decoration: none; color: var(--fg); display: flex; flex-direction: column; gap: 2px; }
.result:hover { border-color: var(--accent); }
.result small { color: var(--muted); }
.result mark { background: var(--accent-soft); color: var(--fg); padding: 0 2px; }
.notice { padding: 10px 14px; border-radius: var(--radius); background: var(--warn-soft); color: var(--fg); font-size: .9rem; }
.stats { display: flex; flex-wrap: wrap; gap: 24px; font-variant-numeric: tabular-nums; }
.stats div { display: flex; flex-direction: column; }
.stats b { font-family: var(--font-display); font-size: 1.6rem; }
.stats span { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; align-items: center; gap: 10px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .topbar b { font-family: var(--font-display); flex: 1; }
  .rail { position: fixed; z-index: 30; inset: 0 auto 0 0; width: min(88vw, 320px); transform: translateX(-100%); transition: transform .2s ease; box-shadow: 0 0 40px rgba(0,0,0,.25); padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
  body.nav-open .rail { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.35); }
  .contract dl { grid-template-columns: minmax(0, 1fr); }
  .contract dt { border-bottom: 0; padding-bottom: 0; }
  .testcase { grid-template-columns: minmax(0, 1fr); }
  .testcase > div + div { border-left: 0; border-top: 1px solid var(--line); }
  h1 { font-size: 1.6rem; }
  .exercise, .contract { scroll-margin-top: 72px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

<script>
window.CURRICULUM = {"builtAt":"2026-09-30T08:45:13.633Z","edition":{"id":"frappe","name":"Frappe edition","short":"Frappe","repo":"AI-SDLC-frappe/","title":"AI-SDLC for Frappe","stack":"Frappe v15 · Python · PostgreSQL 16 · Redis · bench","homeLede":{"en":"Build a working, reviewable AI engineering system for a Frappe clinical app: subagents with contracts, skills as tested assets, hooks and permissions as real human gates, and an evaluation harness that tells you when a prompt change made things worse.","hinglish":"Ek Frappe clinical app ke liye ek working, reviewable AI engineering system banao: contracts ke saath subagents, tested assets ki tarah skills, asli human gates ki tarah hooks aur permissions, aur ek evaluation harness jo batata hai ki prompt change ne cheezein kab kharab kar di."},"other":{"name":"Java / Spring Boot edition","href":"ai-sdlc-curriculum.html"}},"modules":[{"id":"00-example","level":1,"title":"Orientation: Project Memory and Context Engineering on a Frappe App","summary":"Tour the Frappe edition of the AI-SDLC repository and give Claude Code the project knowledge every later agent depends on: a lean CLAUDE.md that knows where the bench is and which commands prove a change works, path-scoped rules for Python and DocType JSON, and a context pack that keeps PHI and site_config secrets out of every prompt.","prerequisites":["A working bench: `AI-SDLC-frappe/sample-app/scripts/setup-bench.sh` (Frappe v15, PostgreSQL 16)","Git and a terminal","Claude Code CLI installed and authenticated (`claude --version`)"],"concepts":[{"heading":"Why context comes before agents","body_md":"A subagent starts with **no conversation history**. Per the docs it receives its own system prompt (the body of its `.claude/agents/\u003cname>.md` file), the task message the main session sends it, basic environment details, git status, and the **CLAUDE.md hierarchy**. That last item is the only project knowledge every agent gets for free.\n\nOn a Frappe codebase this matters more than usual, because the knowledge an engineer needs is spread across places no generic model assumes:\n\n- the **bench** lives outside the repo (here `/home/user/frappe-bench`), so an agent that only sees the repo cannot even find the command that runs tests;\n- behaviour hides in **DocType JSON** (`permissions`, `search_index`, `autoname`), in **`hooks.py`**, and in **patches**, not only in Python;\n- secrets sit in **`site_config.json`** next to the code an agent is working on.\n\nSo in practice the quality of every agent in this course is capped by three things you write in this module:\n\n- `AI-SDLC-frappe/CLAUDE.md`: what the repo is, where the bench and site are, the commands that prove a change works, and the non-negotiable rules.\n- `AI-SDLC-frappe/.claude/rules/*.md`: rules that load only when Claude works on matching paths (Python vs DocType JSON).\n- `AI-SDLC-frappe/context/**`: reference material (architecture, Frappe coding standards, threat model, glossary) that agents read when the task needs it."},{"heading":"How CLAUDE.md loads (verified behaviour)","body_md":"From `build/CLAUDE_CODE_FACTS.md` §6:\n\n- Project memory lives in `./CLAUDE.md` or `./.claude/CLAUDE.md`. Personal overrides go in `./CLAUDE.local.md` (git-ignored). That is the right place for *your* bench path if it differs from `/home/user/frappe-bench`.\n- Claude Code walks from the working directory **up** to the root and **concatenates** every CLAUDE.md it finds, root first. Nothing overrides; closer files are read last.\n- CLAUDE.md files in **subdirectories** load on demand, when Claude reads files in that directory.\n- `@path/to/file` imports another file, relative to the importing file, up to 4 hops deep. Imported files load with the CLAUDE.md that imports them. Imports are not expanded inside code spans or code blocks.\n- Target under 200 lines. Everything in CLAUDE.md costs tokens on *every* turn of *every* agent.\n\nThe design consequence: put **rules and commands** in CLAUDE.md, put **reference material** in `context/`, import only the two or three files almost every task needs, and name the rest by path. The standards file for Frappe code is long and matters only when code is written, so CLAUDE.md names it instead of importing it."},{"heading":"Two rule files: Python and DocType JSON","body_md":"`.claude/rules/**/*.md` files are loaded as project instructions. The only frontmatter field Claude Code reads there is `paths` (a list of globs). A rule with `paths` applies only when Claude works with matching files.\n\nA Frappe app needs two different rule sets:\n\n- **`spice-lite-python.md`** (`paths: sample-app/spice_lite/**/*.py`): `frappe.get_list` not `frappe.get_all` in request paths, parameterised SQL, no `allow_guest`, names-only audit logging, keep `api/mappers.py` free of `import frappe`.\n- **`doctype-json.md`** (`paths` covering `**/doctype/**/*.json`, `patches.txt`, `hooks.py`): schema or data changes ship with a patch, `search_index` on filtered fields, never name documents by PHI, permission-array changes are security-reviewed, new `hooks.py` keys need an ADR.\n\nThe second file is the one generic agents get wrong: they edit a DocType JSON field and forget the patch, or widen `permissions` without anyone noticing. Keep every rule **testable**: a reviewer can check \"a DocType JSON change that retypes a field ships with a patch in `patches.txt`\"; nobody can check \"follow Frappe best practice\"."},{"heading":"Two meanings of \"hook\"","body_md":"This course uses both kinds, so the words must stay separate:\n\n| | Frappe hook | Claude Code hook |\n|---|---|---|\n| Lives in | `spice_lite/hooks.py` | `.claude/settings.json` or agent/skill frontmatter |\n| Runs when | a document event, install, migrate, a scheduler tick | a Claude Code event such as `PreToolUse` |\n| Runs as | Python inside the Frappe site | a shell command on the developer machine |\n| Example here | `after_install = \"spice_lite.install.after_install\"` | `block-secrets.mjs` on `Edit|Write` |\n\nCLAUDE.md rule 5 tells every agent to say \"Frappe hook\" or \"Claude Code hook\", never bare \"hook\". It sounds pedantic until an agent adds a `doc_events` entry to `hooks.py` because a ticket asked it to \"add a hook that blocks secrets\"."},{"heading":"The context pack, PHI, and site_config","body_md":"**Anything an agent reads can end up in a prompt, a log, a commit message, or an MCP call to Jira or GitHub.** The context pack does two jobs:\n\n1. **Informs**: `context/domain/spice-lite-glossary.md` defines `SL Patient`, `SL Encounter`, `SL Observation`, `SL Country`, MRN, LOINC codes and the FHIR-lite shapes exactly as `spice_lite` implements them, plus the country-app and integration-app patterns of a spice-style platform.\n2. **Constrains**: the glossary classifies every field as PHI or not (search terms are PHI too), and `context/security/phi-and-secrets-policy.md` says where PHI may never appear: logs, Error Log, `frappe.throw` messages, prompts, eval data.\n\nFrappe adds one more asset: `site_config.json` and `common_site_config.json` contain the database password and `encryption_key`. The policy forbids reading them, and `.claude/settings.json` enforces it with `Read(**/site_config.json)` in `permissions.deny`. The `PreToolUse` Claude Code hook `block-secrets.mjs` blocks writes containing site_config secrets, Frappe API tokens, or database URLs with passwords.\n\n**Rule of thumb:** instructions describe intent, permissions and Claude Code hooks enforce it. Write both."},{"heading":"What the reference repository contains","body_md":"`AI-SDLC-frappe/` is the Claude Code project root. It already contains:\n\n- `sample-app/spice_lite/`: a real Frappe v15 app (four DocTypes, FHIR-lite whitelisted API, a patch, 37 integration and 9 unit tests passing on PostgreSQL 16 and MariaDB) with one labelled teaching defect (`TEACHING-DEFECT(perf-n+1)` in `lastn()`) and five discovered defects documented in `sample-app/docs/KNOWN_DEFECTS.md`.\n- `sample-app/scripts/setup-bench.sh`: the idempotent script that built the bench used by every exercise.\n- `.claude/settings.json`: `allow` for `bench --site test.localhost run-tests`, `ask` for `migrate`/`console`/`execute`, `deny` for `site_config.json` reads, `drop-site` and `reinstall`, plus the block-secrets Claude Code hook.\n- `.claude/agents/`, `.claude/skills/`, `agents/`, `workflows/`, `evaluations/`, `docs/`: filled in by later modules.\n\nThe Java edition of this course teaches the same system on a Spring Boot app; the two share the roster, skills, handoff format, and evaluation approach, so you can compare them side by side."}],"diagrams":[{"title":"What a subagent actually receives at start-up","mermaid":"flowchart LR\n  A[\"Agent file body\u003cbr/>(.claude/agents/NAME.md)\"] --> S((\"Subagent context\"))\n  T[\"Task message from main session\"] --> S\n  C[\"CLAUDE.md hierarchy + imports\"] --> S\n  G[\"git status + env details\"] --> S\n  K[\"Preloaded skills (skills field)\"] --> S\n  H[\"Main-session history\"] -. \"not passed\" .-> S\n  B[\"The bench, site_config.json\"] -. \"not visible unless named in CLAUDE.md; site_config denied\" .-> S"},{"title":"Where project knowledge lives in the Frappe edition","mermaid":"flowchart TD\n  CM[\"CLAUDE.md: rules, bench path, commands\"] -->|\"@import\"| AO[\"context/architecture/overview.md\"]\n  CM -->|\"@import\"| GL[\"context/domain/spice-lite-glossary.md\"]\n  CM -->|\"@import\"| PP[\"context/security/phi-and-secrets-policy.md\"]\n  CM -.->|\"named, read on demand\"| ST[\"context/standards/frappe-coding-standards.md and others\"]\n  RP[\".claude/rules/spice-lite-python.md\"] -->|\"paths: **/*.py\"| PY[\"Python edits\"]\n  RJ[\".claude/rules/doctype-json.md\"] -->|\"paths: doctype JSON, patches.txt, hooks.py\"| DJ[\"Schema and Frappe hook edits\"]"}],"comparisonTables":[{"title":"Where should this piece of Frappe knowledge go?","columns":["Knowledge","Mechanism","Why there","Example in this repo"],"rows":[["How to run tests, where the bench is","`CLAUDE.md`","Every agent needs it on every turn","`bench --site test.localhost run-tests --app spice_lite`"],["DocTypes, fields, PHI classification","`@import` from CLAUDE.md","Nearly every task touches the domain","`@context/domain/spice-lite-glossary.md`"],["get_list vs get_all, SQL parameters, whitelist rules","`.claude/rules/spice-lite-python.md` with `paths`","Only relevant when Python is edited","`paths: sample-app/spice_lite/**/*.py`"],["Patches, search_index, permissions array","`.claude/rules/doctype-json.md` with `paths`","Only relevant for schema and `hooks.py` edits","`paths` on `**/doctype/**/*.json`"],["Full coding, testing, API, review standards","`context/standards/*.md` (named, not imported)","Long; read by the agent whose task needs it","`context/standards/frappe-coding-standards.md`"],["Your personal bench path","`CLAUDE.local.md`","Machine-specific, git-ignored","`Bench: /opt/bench/spice`"],["Never read site_config.json","`permissions.deny` (plus a CLAUDE.md rule)","An instruction is not a control","`Read(**/site_config.json)`"]]}],"exercises":[{"id":"00-claude-md","title":"Write a CLAUDE.md that knows where the bench is","objective":"Replace the stub `AI-SDLC-frappe/CLAUDE.md` with one that tells any agent what `spice_lite` is, where the bench and site are, which commands prove a change works (integration tests, unit tests, migrate), and which rules are non-negotiable, while importing only the three context files nearly every task needs. Verify that Claude Code loads it by asking a question only CLAUDE.md can answer.","startingFiles":[{"path":"AI-SDLC-frappe/CLAUDE.md","content":"# spice_lite\n\nThis is a Frappe app. Please write good code and tests.\n"}],"requiredStructure":"AI-SDLC-frappe/\n├── CLAUDE.md                                  # \u003c 200 lines, 3 @imports, bench path, commands\n├── .gitignore                                 # CLAUDE.local.md, .ai-sdlc/runs/\n├── context/\n│   ├── architecture/overview.md\n│   ├── domain/spice-lite-glossary.md\n│   └── security/phi-and-secrets-policy.md\n└── sample-app/spice_lite/                     # unchanged","implementation":[{"path":"AI-SDLC-frappe/CLAUDE.md","language":"markdown","content":"# AI-SDLC reference repository (Frappe edition)\n\nThis repository is a working AI-assisted SDLC system for a small Frappe v15 clinical app. It contains Claude Code subagents, skills, Claude Code hooks, workflows, evaluations, and the Frappe app they operate on.\n\n## Layout\n- `sample-app/spice_lite/`: the Frappe app `spice_lite` (DocTypes `SL Patient`, `SL Encounter`, `SL Observation`, `SL Country`; FHIR-lite whitelisted API in `spice_lite/api/fhir.py`). A teaching-size slice of a `spice_next_core`-style clinical core.\n- The bench is NOT in this repo. Default bench: `/home/user/frappe-bench`, site `test.localhost` (PostgreSQL 16). Create one with `sample-app/scripts/setup-bench.sh`.\n- `.claude/agents/`: subagents: architect, developer, reviewer, tester, security, sre, orchestrator.\n- `.claude/skills/`: skills (architecture-review, code-review, test-strategy, security-review, performance-review, production-rca, and workflow entry points).\n- `agents/\u003cname>/CONTRACT.md`: the Agent Contract each subagent must satisfy. Treat it as the spec.\n- `workflows/`: feature-delivery, bug-fix, incident-response.\n- `context/`: architecture, standards, security, domain. Read the relevant file before acting.\n- `evaluations/`: golden datasets and the eval harness.\n\n## Context loaded at launch\n- Architecture: @context/architecture/overview.md\n- Domain terms and PHI classification: @context/domain/spice-lite-glossary.md\n- Security and PHI policy: @context/security/phi-and-secrets-policy.md\n- Standards live in `context/standards/` (frappe-coding, testing, api, review). Read the one that matches the task; do not load all of them.\n\n## Rules\n1. Never put PHI or secrets in code, logs, Error Log entries, `frappe.throw` messages, prompts, test fixtures, commit messages, or MCP calls. Use synthetic data such as `MRN-000123`.\n2. Never read `site_config.json` or `common_site_config.json`: they hold database passwords and encryption keys.\n3. Every change to `spice_lite` needs tests, and `bench --site test.localhost run-tests --app spice_lite` must pass before you report completion. Schema or data changes need a patch in `patches.txt`.\n4. Follow `context/standards/frappe-coding-standards.md`: permission-aware reads (`frappe.get_list`, not `frappe.get_all`, in request paths), parameterised SQL only, no `allow_guest` on clinical data, no `ignore_permissions` without a written reason.\n5. \"Hook\" is ambiguous here. Say \"Frappe hook\" for `hooks.py` entries and \"Claude Code hook\" for `.claude/settings.json` hooks.\n6. Findings use the format in `context/standards/review-standards.md` (id, severity, category, location, evidence, recommendation).\n7. Agent handoffs go to `.ai-sdlc/runs/\u003crun-id>/NN-\u003cagent>.md` with the YAML front matter defined in `workflows/README.md`.\n8. Do not fix `TEACHING-DEFECT(perf-n+1)` or the open discovered defects in `sample-app/docs/KNOWN_DEFECTS.md` unless the task explicitly asks for it; exercises depend on them.\n9. Never push, merge, migrate a shared site, or deploy. A human does that after review.\n\n## Commands (run from the bench directory, as the bench user)\n- Tests (integration + unit, 46): `bench --site test.localhost run-tests --app spice_lite`\n- One module: `bench --site test.localhost run-tests --module spice_lite.tests.test_fhir_api`\n- Unit tests, no bench needed: `cd sample-app/spice_lite && python -m unittest discover -s spice_lite/tests/unit -t .`\n- Apply schema/patch changes to the test site: `bench --site test.localhost migrate`\n- Evals (offline replay): `node evaluations/harness/run-evals.mjs --mode replay`\n","tag":"verified-format"},{"path":"AI-SDLC-frappe/.gitignore","language":"plaintext","content":".ai-sdlc/runs/\n.claude/settings.local.json\nCLAUDE.local.md\nevaluations/reports/live-*\n__pycache__/\n*.egg-info/\n.env\n.env.*\n","tag":"illustrative"}],"exampleInput":"cd AI-SDLC-frappe\nclaude -p \"Without running anything: which exact command runs the spice_lite integration tests, from which directory, and which two files must you never read? Answer in three bullet points.\" --output-format json | jq -r '.result'","expectedOutput":"- From the bench directory (`/home/user/frappe-bench`), as the bench user: `bench --site test.localhost run-tests --app spice_lite`.\n- Unit tests that need no bench: `cd sample-app/spice_lite && python -m unittest discover -s spice_lite/tests/unit -t .`.\n- Never read `site_config.json` or `common_site_config.json`; they hold the database password and encryption keys.","testCases":[{"name":"CLAUDE.md stays lean","input":"wc -l AI-SDLC-frappe/CLAUDE.md","expected":"Fewer than 200 lines (the reference file is about 45)."},{"name":"Exactly three imports that resolve","input":"for p in $(grep -o '@context/[^ ]*' AI-SDLC-frappe/CLAUDE.md | tr -d '@'); do test -f AI-SDLC-frappe/$p && echo ok $p; done","expected":"ok context/architecture/overview.md\nok context/domain/spice-lite-glossary.md\nok context/security/phi-and-secrets-policy.md"},{"name":"The documented test command really works","input":"cd /home/user/frappe-bench && bench --site test.localhost run-tests --app spice_lite 2>&1 | tail -3","expected":"Ran 46 tests in 2.7s\n\nOK\n(46 = 37 integration + 9 unit; one expected Postgres error line printed by the D-2 pinning test is normal)"},{"name":"Claude answers from memory, not by guessing","input":"The exampleInput command above","expected":"The answer names `bench --site test.localhost run-tests --app spice_lite` and both config files. If it suggests `pytest` for the integration tests or `python manage.py test`, CLAUDE.md was not loaded (run it from inside AI-SDLC-frappe/)."},{"name":"Local overrides stay out of git","input":"grep -x 'CLAUDE.local.md' AI-SDLC-frappe/.gitignore","expected":"CLAUDE.local.md"}],"evaluationCriteria":["The bench location, site name and bench user are stated, and a personal override path (`CLAUDE.local.md`) is offered.","Commands are copy-pasteable and correct for this bench (verified by running them).","The \"hook\" ambiguity is resolved in the rules.","Secrets rules name `site_config.json` and `common_site_config.json` explicitly.","Long reference material is imported or named, not pasted inline."],"improvements":["Put your own bench path and site in `CLAUDE.local.md` if they differ from `/home/user/frappe-bench` and `test.localhost`.","Add a `sample-app/spice_lite/CLAUDE.md` with app-internal tips (test users, `tests/utils.py` helpers); it loads only when Claude reads files there.","Run `/memory` in an interactive session to confirm which memory files loaded."]},{"id":"00-path-scoped-rules","title":"Separate rules for Python and for DocType JSON","objective":"Create `.claude/rules/spice-lite-python.md` and `.claude/rules/doctype-json.md` with `paths` globs, so Python conventions load for `.py` edits and the patch/permission rules load for DocType JSON, `patches.txt` and `hooks.py`. Show that a DocType field change pulls in the patch rule.","startingFiles":[],"requiredStructure":"AI-SDLC-frappe/.claude/rules/\n├── spice-lite-python.md   # paths: sample-app/spice_lite/**/*.py\n└── doctype-json.md        # paths: **/doctype/**/*.json, patches.txt, hooks.py","implementation":[{"path":"AI-SDLC-frappe/.claude/rules/spice-lite-python.md","language":"markdown","content":"---\npaths:\n  - \"sample-app/spice_lite/**/*.py\"\n---\n\n# Python rules for spice_lite\n\n- Frappe v15, Python 3.11, tabs for indentation (Frappe style), type hints on whitelisted method parameters.\n- Request paths read with `frappe.get_list` (permission-aware). `frappe.get_all` and `ignore_permissions=True` need a comment explaining why permissions do not apply.\n- SQL: `frappe.db.sql` with `%(name)s` parameters or `frappe.qb`; never f-strings or `%` formatting into SQL. `frappe.qb` and raw SQL skip permissions, so check `frappe.has_permission` first.\n- Whitelisted methods: `@frappe.whitelist(methods=[...])`, never `allow_guest=True`; errors return an `OperationOutcome` via the helpers in `spice_lite/api/fhir.py`.\n- Log access through `spice_lite.audit.log_access` with document names only. Never log field values or search terms.\n- Keep `spice_lite/api/mappers.py` free of `import frappe` so its unit tests run without a site.\n- No queries inside loops over documents (the one exception is the marked teaching defect).\n","tag":"verified-format"},{"path":"AI-SDLC-frappe/.claude/rules/doctype-json.md","language":"markdown","content":"---\npaths:\n  - \"sample-app/spice_lite/**/doctype/**/*.json\"\n  - \"sample-app/spice_lite/spice_lite/patches.txt\"\n  - \"sample-app/spice_lite/spice_lite/hooks.py\"\n---\n\n# DocType, patch and Frappe hook rules\n\n- A DocType JSON change that adds, renames or retypes a field, or changes data, ships with a patch module listed in `patches.txt` (`[pre_model_sync]` for work before schema sync, `[post_model_sync]` for data fixes after it).\n- Fields used in list filters or search get `search_index: 1`. Identifiers such as MRN get `unique: 1`.\n- Permissions live in the DocType JSON `permissions` array: `Clinician` may read/write/create, never delete; `System Manager` has full access. Changing that array is a security-reviewed change.\n- Never name documents by PHI (`autoname` stays a series like `SLP-.#####`).\n- A new `hooks.py` key (`doc_events`, `scheduler_events`, `permission_query_conditions`, `has_permission`, `override_whitelisted_methods`) is an architecture decision: record it in an ADR under `docs/adr/`.\n","tag":"verified-format"}],"exampleInput":"cd AI-SDLC-frappe\nclaude -p \"Plan (do not edit) adding a 'national_id' Data field to SL Patient and searching by it in search_patients. List the files you would change and the repo rules that apply.\" --permission-mode plan --output-format json | jq -r '.result'","expectedOutput":"Files:\n1. sample-app/spice_lite/spice_lite/clinical/doctype/sl_patient/sl_patient.json: add `national_id` (Data, `unique: 1`, `search_index: 1`).\n2. sample-app/spice_lite/spice_lite/api/fhir.py: accept an `identifier` system for national id in `search_patients`, still through `frappe.get_list`.\n3. sample-app/spice_lite/spice_lite/api/mappers.py: add a second `identifier` entry.\n4. A patch under `patches/v0_2/` listed in `patches.txt` only if existing rows need a value.\n5. Tests in `tests/test_fhir_api.py` and `tests/unit/test_mappers.py`.\nRules: `national_id` is PHI, so it is never logged or used as the document name; the new search goes through `frappe.get_list`; the field change is a schema change reviewed together with `patches.txt`.","testCases":[{"name":"Frontmatter uses only paths","input":"head -5 AI-SDLC-frappe/.claude/rules/doctype-json.md","expected":"---\npaths:\n  - \"sample-app/spice_lite/**/doctype/**/*.json\"\n  - \"sample-app/spice_lite/spice_lite/patches.txt\""},{"name":"Globs match real files","input":"cd AI-SDLC-frappe && ls sample-app/spice_lite/spice_lite/clinical/doctype/*/*.json sample-app/spice_lite/spice_lite/patches.txt | wc -l","expected":"5 (four DocType JSON files plus patches.txt)"},{"name":"DocType task picks up the patch rule","input":"The exampleInput command","expected":"Output mentions `patches.txt`, `search_index`, and that `national_id` is PHI."},{"name":"Every Python rule names a real symbol","input":"cd AI-SDLC-frappe/sample-app/spice_lite && grep -c 'def log_access' spice_lite/audit.py && grep -c 'import frappe' spice_lite/api/mappers.py","expected":"1\n0"}],"evaluationCriteria":["Uses `paths` as the only frontmatter key.","Python and schema rules are split so each loads only where it matters.","Each rule is checkable against real code (`log_access`, `get_list`, `patches.txt`).","Does not duplicate CLAUDE.md."],"improvements":["Add a rule for `**/fixtures/*.json` in a country app (Custom Field and Property Setter fixtures are schema changes too).","Add a rule for `**/*.js` form scripts once the app has client code."]},{"id":"00-context-pack","title":"Build the domain, PHI and secrets context pack","objective":"Write the spice_lite glossary with a PHI table (including search terms), the PHI and secrets policy (including `site_config.json`), and the threat model. Then prove the pack changes behaviour: ask Claude to draft the audit call for a patient search before and after the pack exists.","startingFiles":[{"path":"AI-SDLC-frappe/context/domain/spice-lite-glossary.md","content":"# Glossary\n\nSL Patient: a patient.\nSL Observation: a measurement.\n"}],"requiredStructure":"AI-SDLC-frappe/context/\n├── domain/spice-lite-glossary.md         # DocTypes, rules, PHI table\n└── security/\n    ├── phi-and-secrets-policy.md          # PHI + site_config + API tokens\n    └── threat-model.md                    # STRIDE rows mapped to agent checks","implementation":[{"path":"AI-SDLC-frappe/context/domain/spice-lite-glossary.md","language":"markdown","content":"# spice_lite domain glossary\n\n`spice_lite` implements a small FHIR-lite subset over Frappe DocTypes. It is **not** a conformant FHIR server. Agents must use these terms exactly.\n\n| Term | Meaning in this repo |\n|---|---|\n| SL Patient | DocType for a person receiving care. Fields: `mrn`, `first_name`, `last_name`, `gender` (`male`, `female`, `other`, `unknown`), `birth_date`, `active`, `country`. Document name is a series (`SLP-00001`), never PHI. |\n| SL Encounter | A visit: `patient`, `encounter_date`, `encounter_type` (`screening`, `assessment`, `follow-up`), `status` (`planned`, `in-progress`, `finished`), `practitioner`. |\n| SL Observation | A measurement: `patient`, `encounter`, `code` (LOINC), `code_display`, `status` (`registered`, `preliminary`, `final`, `amended`), `effective_datetime`, `value`, `unit`, `replaces`. |\n| SL Country | The country of a deployment (one deployment per country). |\n| MRN | Medical Record Number, unique per patient. Synthetic values only: `MRN-` + 6 digits. |\n| LOINC | Observation code system `http://loinc.org`. Test codes: `8867-4` heart rate, `8480-6` systolic BP, `29463-7` body weight, `2339-0` glucose. |\n| FHIR-lite resource | JSON with `resourceType`: `Patient`, `Observation`, `Bundle` (`type: searchset`, `total`, `entry[]`), `OperationOutcome` (`issue[]` with `severity`, `code`, `diagnostics`). Frappe wraps whitelisted-method return values in `{\"message\": ...}`. |\n| Country app | A Frappe app installed only in one country's deployment that customises the core through Custom Fields, Property Setters and `doc_events`. |\n| Integration app | A Frappe app with `required_apps = [\"spice_lite\"]` that connects an external system (telephony, ERPNext, a national ID service). |\n\n## Business rules\n1. MRN is required and unique; a duplicate MRN fails validation.\n2. `birth_date` cannot be in the future.\n3. An Observation must reference an existing SL Patient; a `final` Observation needs `value` and `unit`.\n4. `final` Observations are immutable. Corrections create a new `amended` Observation with `replaces` set.\n5. `Clinician` cannot delete clinical documents. Only `System Manager` can.\n6. `search_patients` requires `family` or `identifier`; with neither it returns a 400 `OperationOutcome`. Wildcards (`%`, `_`) in `family` are rejected.\n\n## PHI classification\n| Field | PHI? | May appear in logs, Error Log, prompts? |\n|---|---|---|\n| Document name (`SLP-00001`, `SLO-00001`) | No (opaque series) | Yes |\n| `mrn` | **Yes** | No |\n| `first_name`, `last_name`, `birth_date`, `gender` | **Yes** | No |\n| Search terms (`family`, `identifier`) | **Yes** | No |\n| Observation `value`/`unit` linked to a patient | **Yes** | No (log the observation name only) |\n| LOINC `code`, `status`, counts | No | Yes |\n| `country` | No on its own | Yes |\n","tag":"illustrative"},{"path":"AI-SDLC-frappe/context/security/phi-and-secrets-policy.md","language":"markdown","content":"# PHI and secrets policy (agents and humans, Frappe edition)\n\nApplies to code, logs, Error Log, Version history, prompts, eval datasets, commit messages, and anything an agent sends to an MCP server.\n\n## PHI\n- Never log PHI. `spice_lite.audit.log_access` logs document names and counts only. Do not use `frappe.logger(..., with_more_info=True)`: it appends `frappe.form_dict` (request parameters, including search terms) to every line.\n- `frappe.throw` messages and `OperationOutcome.diagnostics` must not echo field values or search terms. They reach the client and the Error Log.\n- Never paste real patient data into a prompt, a skill, an eval case, or a Jira/GitHub comment. Use synthetic data (`MRN-000123`, \"Test Patient\").\n- Attachments with clinical content are `is_private = 1`.\n- Agents must not read `**/*.phi.*` (enforced by `permissions.deny` in `.claude/settings.json`).\n\n## Secrets\n- `sites/\u003csite>/site_config.json` and `sites/common_site_config.json` hold the database password, `encryption_key`, and other secrets. Agents never read them (`permissions.deny`). They are never committed.\n- Integration users authenticate with an API key and secret (`Authorization: token \u003ckey>:\u003csecret>`). Keys come from environment variables or a secret store, never from the repo.\n- MCP server credentials use `${VAR}` expansion in `.mcp.json`.\n- A `PreToolUse` Claude Code hook (`.claude/hooks/block-secrets.mjs`) blocks writes containing likely secrets: site_config secrets, Frappe API tokens, database URLs with passwords, private keys.\n\n## Authentication and authorization\n- Every whitelisted method in `spice_lite/api/fhir.py` requires login (no `allow_guest`), and GET/POST methods are restricted with `methods=[...]`.\n- Roles: `Clinician` (read/write/create clinical DocTypes, no delete), `System Manager` (all).\n- Reads use `frappe.get_list` / `frappe.has_permission`. `frappe.get_all`, `frappe.qb`, `frappe.db.sql` and `ignore_permissions=True` skip permission checks, so they must not decide what a user can see.\n\n## Review severities\n`critical` (exploitable now, PHI leaves the service, guest access to clinical data) · `high` (permission bypass on a read or write path, PHI in logs) · `medium` (defence-in-depth gap) · `low` (hardening) · `info`.\n","tag":"illustrative"},{"path":"AI-SDLC-frappe/context/security/threat-model.md","language":"markdown","content":"# Threat model: spice_lite (STRIDE summary)\n\n| Asset | Threat | STRIDE | Current control | Gap / agent check |\n|---|---|---|---|---|\n| Patient records | Guest or unauthenticated read | Spoofing / Info disclosure | No `allow_guest` on `spice_lite.api.fhir.*` | security agent checks every new `@frappe.whitelist` |\n| Patient records | Permission bypass through `frappe.get_all`, `frappe.qb`, raw SQL or `ignore_permissions` | Elevation of privilege | API uses `frappe.get_list` except the teaching defect | reviewer and security flag each bypass in request paths |\n| Clinical documents | Clinician deletes data | Tampering | DocType permissions: no delete for `Clinician` | security agent reviews every change to a DocType `permissions` array |\n| Search parameters | SQL injection via `frappe.db.sql` string building | Tampering | No raw SQL in the app today | reviewer flags f-strings or `%` formatting into SQL |\n| Search parameters | Wildcard enumeration (`family=\"%\"`) | Info disclosure | Rejected (D-5 fixed) | test-strategy keeps the regression test |\n| Logs, Error Log, Version | PHI leakage | Info disclosure | `audit.py` logs names only | security agent greps for `frappe.log_error`, `frappe.logger`, `frappe.throw` with field values |\n| `site_config.json` | Secret disclosure to agents or repo | Info disclosure | `permissions.deny` + block-secrets Claude Code hook | security agent scans diffs and manifests |\n| Availability | N+1 in `lastn`, unbounded lists, long jobs on the default queue | Denial of service | `MAX_LASTN_SUBJECTS = 100` | sre / performance-review flag query counts and queue timeouts |\n| Agent tooling | Prompt injection via Jira tickets, DocType field content, or MCP results | Tampering / Elevation | deny rules, `ask` on outbound actions, human gates | see `docs/governance/prompt-injection.md` |\n","tag":"illustrative"}],"exampleInput":"cd AI-SDLC-frappe\nclaude -p \"Write the one Python statement search_patients() should use to record the search for auditing, then one sentence explaining the choice.\" --permission-mode plan --output-format json | jq -r '.result'","expectedOutput":"Before the context pack (typical):\nfrappe.logger().info(f\"search_patients family={family} identifier={identifier} -> {len(rows)} rows\")\n\nAfter the context pack:\nlog_access(\"search\", \"SL Patient\", rows, result_count=len(rows))\nSearch terms and MRNs are PHI under context/domain/spice-lite-glossary.md, so only the matching document names and a count are logged, through spice_lite.audit.log_access.","testCases":[{"name":"PHI table covers search terms","input":"grep -c 'Search terms' AI-SDLC-frappe/context/domain/spice-lite-glossary.md","expected":"1"},{"name":"Policy names site_config and the enforcing mechanisms","input":"grep -E 'site_config.json|permissions.deny|PreToolUse' AI-SDLC-frappe/context/security/phi-and-secrets-policy.md | wc -l","expected":"At least 3 lines."},{"name":"The real code already follows the policy","input":"grep -n 'log_access(' AI-SDLC-frappe/sample-app/spice_lite/spice_lite/api/fhir.py | head -3","expected":"Calls pass document names and counts only, never `family` or `identifier`."},{"name":"Behaviour change","input":"Run exampleInput with and without the glossary import in CLAUDE.md","expected":"Without: the log line contains `family=` or `identifier=`. With: `log_access(...)` with names and a count only."},{"name":"No real data","input":"grep -rE 'MRN-[0-9]{6}' AI-SDLC-frappe/context | grep -v 'MRN-000'","expected":"No output: only synthetic MRN-000xxx values appear."}],"evaluationCriteria":["Glossary field names match the real DocType JSON (`mrn`, `last_name`, `effective_datetime`, …).","Search terms are classified as PHI, which generic policies miss.","Secrets section covers `site_config.json`, `common_site_config.json`, and API key/secret tokens.","Each threat-model row maps to a check a named roster agent performs."],"improvements":["Add `context/domain/country-apps.md` describing how a country app customises `spice_lite` (Custom Fields, Property Setters, `doc_events`).","Turn the PHI table into `phi-fields.json` so a Claude Code hook can scan diffs for new logging of those fields.","Add the Error Log and Version DocTypes to the policy's list of places PHI must not reach, with a query a reviewer can run to check."]}],"agentContracts":[],"checklist":["`AI-SDLC-frappe/CLAUDE.md` is under 200 lines, names the bench path and site, and has three `@context/...` imports that resolve.","`bench --site test.localhost run-tests --app spice_lite` passes from the bench directory (Ran 46 tests, OK).","`python -m unittest discover -s spice_lite/tests/unit -t .` passes without a bench (9 tests).","Both rule files use only the `paths` frontmatter key and their globs match real files.","The glossary classifies every DocType field and search terms as PHI or not.","`site_config.json` reads are denied in `.claude/settings.json`, not just discouraged in prose.","Frappe hooks and Claude Code hooks are never called bare \"hooks\" in your files."]},{"id":"01-foundations","level":1,"title":"Foundations: Agent Anatomy, Primitives and the Agent Contract on a Frappe Team","summary":"Learn what separates an agent from a prompt or a template, take an agent apart into twelve anatomy elements and map each one to the Claude Code mechanism that implements it (or admit it is only a convention), map those elements onto who reviews DocType JSON, patches and fixtures on a Frappe team today, choose correctly between prompt, skill, agent, workflow, MCP server, Claude Code hook and Frappe hook, and write your first Agent Contract for the spice_lite reviewer, checked by a validator you run.","prerequisites":["00-example","Node 22 (`node --version`)","Claude Code CLI installed and authenticated (`claude --version`)","A bench with `spice_lite` installed on `test.localhost` (`sample-app/scripts/setup-bench.sh`)","Comfort reading a Frappe whitelisted method and a DocType JSON file"],"concepts":[{"heading":"Prompt, template, agent: what actually differs","body_md":"A **prompt** is one instruction inside the conversation you are already in. It borrows everything from that conversation: its history, its tools, its permission mode, and your attention to check the answer. A **template** is a prompt you saved so you can paste it again. In Claude Code the saved, versioned form of a template is a **skill** (`.claude/skills/\u003cname>/SKILL.md`): same idea, plus supporting files, arguments (`$ARGUMENTS`, `$0` for the first one) and an optional `/name` entry point.\n\nAn **agent** (a Claude Code subagent, `.claude/agents/\u003cname>.md`) is different in kind, not in wording. Per `build/CLAUDE_CODE_FACTS.md` §1 it has:\n\n- **its own context window**: it starts with its file body as system prompt, the task message, the CLAUDE.md hierarchy, git status and any preloaded `skills`. It does **not** get your conversation history, the Claude Code system prompt, your output style or auto memory;\n- **its own tool boundary**: `tools` is an allowlist, `disallowedTools` a denylist;\n- **its own authority**: `permissionMode`, `maxTurns`, `model`, optional `memory`, `hooks` and `isolation: worktree`;\n- **a loop**: it keeps calling tools until it decides it is done, then returns **one final message** to the main session.\n\nSo the practical test is not \"is the prompt long\". It is: *does this job need a different context, different tools, or different authority from the conversation that asks for it?* On a bench the answer is often yes. The session that just wrote a new field into `sl_patient.json` is not an independent reviewer of that JSON. A reviewer that holds `Edit` can quietly \"fix\" the `permissions` array it was asked to judge. A session that may run `bench --site test.localhost console` holds an IPython shell with full database access (FRAPPE_FACTS §10). Those are problems a better prompt cannot solve and a subagent definition can.\n\nThe cost is real too: a subagent re-reads `fhir.py` and the DocType JSON that the main session already knows, and whatever you forget to put in its task message (the base ref, the run id) it simply does not have. So in practice you promote a prompt to an agent only when isolation, a tool boundary or a repeatable independent opinion is worth that cost."},{"heading":"Agent anatomy: twelve elements","body_md":"Every agent in this course is specified with the same twelve elements. Most failures of \"it worked once in chat\" prompts come from leaving one of them implicit.\n\n1. **Responsibilities**: the one job. Two jobs (review *and* fix, or review *and* migrate) means two agents.\n2. **Boundaries**: what is out of scope, even if the agent could do it.\n3. **Inputs**: exactly what arrives in the task message (base ref, run id, handoff path). A subagent has nothing else from you.\n4. **Outputs**: the artifact and its format, precise enough for a script to check.\n5. **Tools**: the allowlist, spelled as Claude Code spells tools (`Read`, `Grep`, `Glob`, `Bash`, `mcp__server__tool`), with the Bash scope written out (`git diff` only; `bench --site test.localhost run-tests` only).\n6. **Context**: which project knowledge it loads automatically (CLAUDE.md, path-scoped `.claude/rules/`, preloaded skills) and which files it must `Read` for this task (`context/standards/frappe-coding-standards.md`).\n7. **Instructions**: the procedure, not a persona. \"You are a senior Frappe developer\" is not a step.\n8. **Memory/state**: what survives between runs (the `memory` field, or handoff files) and what deliberately does not.\n9. **Permissions**: what it may do without asking, what needs a human (`bench --site * migrate`), what is denied (`Read(**/site_config.json)`, `bench drop-site`).\n10. **Verification**: how anyone can tell a good output from a plausible one.\n11. **Failure handling**: what it does when the input is bad or the job is too big, instead of guessing.\n12. **Handoffs**: the structured artifact the next step consumes.\n\nThe table *Anatomy element to Claude Code mechanism* below maps each element to the real configuration that implements it. The pattern to notice: elements 1, 5, 6, 7, 8 and 9 have first-class Claude Code fields; elements 2, 3, 4, 10, 11 and 12 are mostly **conventions** until you add a Claude Code hook, a permission rule or an eval that enforces them. Modules 05, 08, 09 and 10 exist largely to turn those conventions into mechanisms.\n\nExercise `01-anatomy-breakdown` applies this list to a real one-off review prompt against `spice_lite/api/fhir.py` and shows which elements it leaves undefined."},{"heading":"Anatomy on a Frappe team: who reviews DocType JSON, patches and fixtures","body_md":"Before you design agents, write down who does the work today. On a Frappe team modelled on `spice_next_core` a change is rarely only Python, and the review is spread over people:\n\n- **The core maintainer** reads the DocType JSON diff: a new field without `search_index`, an `autoname` that would name documents by MRN, a widened `permissions` array. Review-standards makes a schema change without a patch, or a permissions change without security review, at least `high`.\n- **Whoever owns releases** reads `patches.txt`: is the new patch in `[pre_model_sync]` or `[post_model_sync]`, is it idempotent, and did anyone edit an existing line? Patch Log records the exact line text, so an edited comment makes the patch run again on every country site (FRAPPE_FACTS §11).\n- **The country lead** reads fixtures: Custom Field and Property Setter fixtures belong in the country app, not in `spice_lite` (frappe-coding-standards rule 12). Fixtures are overwritten on every migrate, so a stray one wins silently.\n- **Someone with site access** runs `bench --site \u003csite> migrate` on the shared site, after merge.\n\nEach of those people is an implicit agent with implicit anatomy: a **responsibility** (the JSON, the patch order), a **context** (they know that `frappe.get_all` skips permissions), a **permission** (only one of them may migrate), and a **human gate** (the PR approval). Turning them into agents means writing those down:\n\n- the `reviewer` gets the DocType JSON, `patches.txt`, `hooks.py` and fixture checks as **must** rules, and `.claude/rules/doctype-json.md` supplies that context when Claude works with those files (a path-scoped rule; the docs do not say whether a subagent's reads trigger it, so the agent body also names the file to Read);\n- the `security` agent is the `next` step whenever the `permissions` array, a `@frappe.whitelist` decorator or `ignore_permissions` changes, which is a **failure condition** of the reviewer;\n- `migrate` stays with a person: an `ask` rule in `.claude/settings.json` and CLAUDE.md rule 9 make it a **human gate**, not a tool of any agent.\n\nThe comparison table *Frappe review surface to agent anatomy* below lists each surface. So in practice the first draft of an Agent Contract is an interview with the people who review your DocType JSON today."},{"heading":"Mechanism or convention: enforced versus requested","body_md":"Module 00 stated the rule: **instructions describe intent, permissions and Claude Code hooks enforce it.** This module makes it a habit: every rule you write for an agent gets labelled as one or the other.\n\nA **mechanism** is something Claude Code itself does regardless of what the model decides:\n\n- `tools: Read, Grep, Glob` means `Edit` is not in the agent's toolset. It cannot be talked into editing `sl_patient.json`.\n- `permissions.deny: [\"Read(**/site_config.json)\"]` in `.claude/settings.json` blocks the read for every agent.\n- `permissionMode: dontAsk` auto-denies anything that would prompt. In this repo `bench --site * console`, `execute` and `migrate` are `ask` rules, so a `dontAsk` reviewer is refused them instead of a human being asked.\n- `.claude/hooks/block-secrets.mjs` is a Claude Code `PreToolUse` hook on `Edit|Write`; it exits **2**, which blocks the call. Exit 1 would not block. Settings hooks fire inside subagents too.\n\nA **convention** is something only a person, a script or an eval checks: the six-field finding format, \"cite the standard\", \"never write LGTM\", \"review `patches.txt` with the JSON\", the handoff front matter until module 08 adds `check-handoff.mjs`.\n\nConventions are not bad; most of a contract is convention. The failure mode is believing a convention is a mechanism. Three real traps:\n\n- `dontAsk` denies only what would prompt. `Bash(bench --site test.localhost run-tests *)` is on the project **allow** list, so a `dontAsk` reviewer can still run the test suite. Restricting it to git needs an agent-scoped Claude Code `PreToolUse` hook (module 05).\n- A subagent's `permissionMode` is **ignored** when the parent session runs in `bypassPermissions`, `acceptEdits` or `auto`. The same Claude Code hook is the durable guard.\n- Skill `allowed-tools` **pre-approves** tools for the turn; it does not restrict them. Use `disallowed-tools` to remove one.\n\nSo in practice, each `must` and `mustNot` line in an Agent Contract ends with `[mechanism: ...]` or `[convention: ...]`, and `validate-contract.mjs` rejects a line that has neither. When a `mustNot` has only conventions, the validator warns you: that agent's boundaries depend entirely on the model behaving."},{"heading":"Six Claude Code primitives, one Frappe hook, and how to choose","body_md":"Claude Code gives you six building blocks for SDLC automation: **prompt, skill, agent, workflow, MCP server, Claude Code hook**. A Frappe team has a seventh thing called a hook that is not a Claude Code primitive at all: a **Frappe hook**, an entry in an app's `hooks.py` (`doc_events`, `scheduler_events`, `permission_query_conditions`, `fixtures`, `after_migrate`, ...). It is product code that runs inside the site, when a clinician saves a form or the scheduler ticks. A Claude Code hook runs on the developer's machine, when Claude calls a tool.\n\nThe collision is not academic. A ticket that says \"add a hook that blocks secrets\" can end up as a `doc_events` entry in `hooks.py`; \"run a hook when an Observation is finalised\" can end up as a `PostToolUse` entry in `settings.json` that fires when Claude writes a file. That is why CLAUDE.md rule 5 bans the bare word, the validator warns on it, and the grader in exercise `01-classify-primitives` scores a bare `hook` as `AMBIGUOUS`.\n\nUse this decision order; the first \"yes\" wins (it is also the answer key logic):\n\n0. **Is it behaviour of the running app on a site?** It is a **Frappe hook** or a controller method, and it ships through the normal workflow like any code change.\n1. **Must it happen every time Claude acts**, whether or not the model remembers? Use a **Claude Code hook** (or a permission rule): secrets scanning, handoff validation, blocking edits to an applied line of `patches.txt`.\n2. **Does it need data or actions outside the repo** (Jira, GitHub, the Frappe REST API of a site)? Use an **MCP server**, so access is a named tool (`mcp__\u003cserver>__\u003ctool>`) that permission rules can allow or deny.\n3. **Does it chain several roles with human gates** between them? Use a **workflow** in `workflows/`, run from the main session (module 08).\n4. **Does it need its own context, its own tool limits, or an independent opinion?** Use an **agent**.\n5. **Will the same procedure be repeated** by people or agents? Use a **skill**. Agents preload skills with the `skills` field.\n6. Otherwise it is a **prompt**.\n\nTwo combinations recur: **agent + preloaded skill** (`reviewer` preloads `code-review`; `sre` preloads `production-rca`) and **workflow + Claude Code hooks** (the workflow defines order and gates; the Claude Code hooks make the gates real)."},{"heading":"The Agent Contract","body_md":"An **Agent Contract** is this course's specification for an agent, written before the agent file and kept next to it. It is a convention, not a Claude Code feature: Claude Code only reads `.claude/agents/\u003cname>.md`. The contract is what that file is reviewed against, what the evals in module 09 score, and what a new team member reads first.\n\nEleven fields, identical to `agentContracts` in `build/schema.json`:\n\n| Field | Question it answers |\n|---|---|\n| `purpose` | What single decision does the output support? |\n| `inputs` / `outputs` | What arrives in the task message; what comes back and where it is saved |\n| `tools` | Exact tool names, with scope (\"Bash (only `git diff`, `git log`, `git status`)\") |\n| `permissions` | Which frontmatter and settings enforce the boundary |\n| `must` / `mustNot` | Required and forbidden behaviour, each tagged mechanism or convention |\n| `failureConditions` | When to stop with `blocked` or `needs-human` instead of guessing |\n| `validation` | The command, eval or check that proves an output acceptable |\n| `handoffFormat` | The run-folder file and its front matter |\n| `humanGate` | Where a person approves, and the real mechanism that waits for them |\n\nThe reusable template is `AI-SDLC-frappe/agents/CONTRACT_TEMPLATE.md`; each roster agent's filled copy lives at `AI-SDLC-frappe/agents/\u003cagent>/CONTRACT.md`. `AI-SDLC-frappe/docs/foundations/validate-contract.mjs` checks that all eleven `## field` headings are present and in order, that list fields are bullets, that tool names are real Claude Code tools, that every `must`/`mustNot` line names its enforcement, that `humanGate` names a real mechanism, and two Frappe rules: a Bash scope may not grant `bench console`, `execute`, `drop-site` or `reinstall`, and a `migrate` scope must say it sits behind the `ask` rule. A bare \"hook\" is a warning. `--json` prints the contract as a schema-shaped object.\n\nThis module ships a worked **reviewer** draft (`docs/foundations/reviewer-contract-draft.md`) and a first attempt with five planted mistakes. Module 02 builds a deliberately simple first reviewer, module 05-agent-roster finalises this contract as `agents/reviewer/CONTRACT.md` with the runtime definition, and module 09 measures the agent against it. So in practice the contract changes through review like code, and the agent file follows it."},{"heading":"Handoffs and depth: why the roster stays flat","body_md":"Agents in this course never talk to each other directly. Each one returns a **handoff**: a Markdown document with YAML front matter (`run_id`, `step`, `agent`, `status`, `inputs`, `next`) saved under `.ai-sdlc/runs/\u003crun-id>/NN-\u003cagent>.md`. The next agent reads the file, not the previous agent's conversation, because it has none.\n\nClaude Code does allow deeper structures: per the current docs a subagent **can** spawn subagents of its own, and an `Agent(...)` type allowlist is only enforced for an agent running as the main thread. The exact limits and settings are taught in module 07-agent-composition.\n\nThis course's design decision built on those facts:\n\n- The **orchestrator** runs as the main thread (`claude --agent orchestrator`, or the `/feature` skill in the main session). It is the only place delegation happens.\n- Roster agents (`architect`, `developer`, `reviewer`, `tester`, `security`, `sre`) do **not** list `Agent` in `tools`. They run at depth 1, so every delegation is visible in one place and every handoff is a file you can audit.\n\nOn a Frappe change the flat chain has a concrete payoff. A feature that touches `sl_observation.json`, the controller, a patch and the tests produces, in order, a developer handoff, a reviewer handoff whose `next` is `security` because the `permissions` array changed, and a tester handoff with the `bench --site test.localhost run-tests` result. A human reads three files and decides; nobody has to reconstruct which nested agent ran `migrate`, because no agent can.\n\nFor the anatomy that means element 12 (handoffs) and element 2 (boundaries) meet: leaving `Agent` out of `tools` is a mechanism that keeps the handoff chain linear. The reviewer draft's `mustNot` records it as exactly that."}],"diagrams":[{"title":"Contract fields and the Claude Code mechanisms behind them","mermaid":"flowchart LR\n  P[\"purpose\"] --> D[\"description field + agent file body\"]\n  I[\"inputs\"] --> TM[\"Agent tool prompt (task message)\"]\n  T[\"tools\"] --> TL[\"tools / disallowedTools\"]\n  PM[\"permissions\"] --> PS[\"permissionMode + settings allow/ask/deny (bench migrate = ask)\"]\n  MN[\"must / mustNot\"] --> HK[\"Claude Code hooks (exit 2 blocks)\"]\n  MN -.->|\"when not enforceable\"| CV[\"convention: evals, human review\"]\n  F[\"failureConditions\"] --> MT[\"maxTurns + status: blocked\"]\n  V[\"validation\"] --> EV[\"scripts, golden tasks, SubagentStop Claude Code hook\"]\n  H[\"handoffFormat\"] --> RF[\"file in .ai-sdlc/runs/RUN-ID/\"]\n  G[\"humanGate\"] --> HG[\"plan mode, ask rule, PR approval\"]"},{"title":"Choosing a primitive (first yes wins)","mermaid":"flowchart TD\n  Q0{\"Runtime behaviour of the app on a site?\"} -->|\"yes\"| FH[\"Frappe hook in hooks.py or a controller method\"]\n  Q0 -->|\"no\"| Q1{\"Must it happen every time Claude acts?\"}\n  Q1 -->|\"yes\"| HOOK[\"Claude Code hook or permission rule\"]\n  Q1 -->|\"no\"| Q2{\"Needs a system outside the repo?\"}\n  Q2 -->|\"yes\"| MCP[\"MCP server\"]\n  Q2 -->|\"no\"| Q3{\"Several roles with human gates?\"}\n  Q3 -->|\"yes\"| WF[\"workflow\"]\n  Q3 -->|\"no\"| Q4{\"Own context, tool limits or independent opinion?\"}\n  Q4 -->|\"yes\"| AG[\"agent\"]\n  Q4 -->|\"no\"| Q5{\"Repeated procedure?\"}\n  Q5 -->|\"yes\"| SK[\"skill\"]\n  Q5 -->|\"no\"| PR[\"prompt\"]"},{"title":"A reviewer run on a Frappe change under its contract","mermaid":"sequenceDiagram\n  participant H as Human\n  participant M as Main session (orchestrator)\n  participant R as reviewer subagent\n  participant F as Run folder .ai-sdlc/runs/RUN-ID\n  H->>M: Review the change against main\n  M->>R: Task message with base ref, run id and upstream handoff path\n  R->>R: git diff main...HEAD, including DocType JSON, patches.txt, hooks.py\n  R->>R: Read frappe-coding-standards (no Edit, no Agent, no bench)\n  R-->>M: Final message is the handoff, next is security if permissions changed\n  M->>F: Write NN-reviewer.md\n  M-->>H: status needs-human if any critical or high finding\n  H->>H: Approve the PR, then run bench migrate on the shared site"}],"comparisonTables":[{"title":"Prompt, skill, agent, workflow, MCP, Claude Code hook, Frappe hook","columns":["Primitive","Purpose","Where it lives","Who triggers it","Determinism","Example in this repo"],"rows":[["Prompt","One-off instruction in the current conversation","Nowhere (typed, or `claude -p \"...\"`)","You","Low: model output, shares the session's history and tools","`claude -p \"Which tests call spice_lite.api.fhir.lastn?\" --permission-mode plan`"],["Skill","Reusable procedure plus supporting files","`.claude/skills/\u003cname>/SKILL.md`","You via `/name`, Claude by `description` match, or preloaded into an agent via `skills`","Medium: loading and `!` shell injection are deterministic; execution is model-driven","`.claude/skills/run-tests/SKILL.md` wrapping `bench --site test.localhost run-tests` (module 02)"],["Agent","Isolated worker with its own context, tools and permissions","`.claude/agents/\u003cname>.md`","Main session delegation (by `description`, by name, `@agent-\u003cname>`) or `claude --agent \u003cname>`","Low output determinism, deterministic boundary (`tools`, `disallowedTools`)","`.claude/agents/reviewer.md` (module 05)"],["Workflow","Ordered composition of agents, skills and human gates","`workflows/*.md` spec plus an entry skill such as `/feature`","You, from the main session","Order and gates are fixed by the spec and Claude Code hooks; each step is model-driven","`workflows/feature-delivery.md`: DocType JSON + controller + patch + tests (module 08)"],["MCP server","Tools and data from a system outside the repo","`.mcp.json` (project scope) or `~/.claude.json` (local, user)","Claude calls `mcp__\u003cserver>__\u003ctool>` when the task needs it","The server code is deterministic; whether and how it is called is model-driven","Read-only, PHI-safe aggregates from the test site in `mcp/` (module 06)"],["Claude Code hook","Enforce or react at a Claude Code lifecycle event","`hooks` in `.claude/settings.json` (also agent or skill frontmatter)","Claude Code itself, on events such as `PreToolUse`, `SubagentStop`","High: a script; exit code 2 blocks","`.claude/hooks/block-secrets.mjs` on `Edit|Write` (exists today)"],["Frappe hook (`hooks.py`)","App behaviour inside a site: document events, scheduled jobs, row permissions, install and migrate steps, fixtures. Not an AI-SDLC primitive; product code that agents review","`\u003capp>/\u003capp>/hooks.py` (`doc_events`, `scheduler_events`, `permission_query_conditions`, `after_migrate`, ...)","Frappe, on a document save, a scheduler tick, a request, `bench migrate`","High: Python in the site; reviewed and tested like any code","`after_migrate = [\"spice_lite.install.after_migrate\"]` in `spice_lite/hooks.py`"]]},{"title":"Anatomy element to Claude Code mechanism","columns":["Element","Claude Code mechanism","Mechanism or convention","Frappe reviewer example"],"rows":[["Responsibilities","`description` frontmatter (delegation) and file body","Mechanism for routing; the single-job rule is convention","\"Reviews a spice_lite diff, DocType JSON included; never edits, never runs bench\""],["Boundaries","`tools`, `disallowedTools`, `permissions.deny`","Mechanism where a tool or rule expresses it; otherwise `mustNot` convention","No Edit, Write or Agent; no `site_config.json` reads"],["Inputs","Agent tool `prompt` (task message); CLAUDE.md hierarchy; git status","Mechanism for delivery; required fields are convention","Base ref, run id, upstream handoff path"],["Outputs","Subagent final message returned to the main session","Mechanism for return; format is convention","Six-field findings table plus a \"Frappe surfaces in this diff\" line"],["Tools","`tools` allowlist, `disallowedTools`, `mcpServers`","Mechanism","`Read, Grep, Glob, Bash` (git only)"],["Context","CLAUDE.md hierarchy, path-scoped `.claude/rules/`, `skills` preload, `omitClaudeMd`","Mechanism","`skills: [code-review]`; `doctype-json.md` rule for DocType JSON"],["Instructions","Agent file body = the subagent's system prompt","Mechanism (what the model reads), content is yours","Step-by-step procedure: Python, then JSON, then `patches.txt`, then `hooks.py`"],["Memory/state","`memory: user|project|local` (`MEMORY.md`); handoff files","Mechanism for `memory`; run state in files is convention","No memory; state in `.ai-sdlc/runs/`"],["Permissions","`permissionMode`, settings allow/ask/deny, Claude Code hooks","Mechanism (note: `permissionMode` ignored under `acceptEdits`, `auto`, `bypassPermissions` parents; `dontAsk` still runs allowed rules)","`permissionMode: dontAsk` + agent-scoped `PreToolUse` Claude Code hook"],["Verification","`SubagentStop`/`PostToolUse` Claude Code hooks, scripts, evals","Convention until a Claude Code hook runs the check","Golden tasks with seeded `get_all` and missing-patch diffs (module 09)"],["Failure handling","`maxTurns` (output marked partial); `-p` result `subtype`, `is_error`","Mechanism for limits; `status: blocked` is convention","Edited line in `patches.txt` returns `needs-human`"],["Handoffs","None built in","Convention; made a mechanism by `check-handoff.mjs` (module 08)","`.ai-sdlc/runs/\u003crun-id>/NN-reviewer.md`"]]},{"title":"Frappe review surface to agent anatomy","columns":["Surface","Who checks it today","What they check","Where it lands in the agent system","Anatomy element"],"rows":[["DocType JSON (`sl_patient.json`, ...)","Core maintainer","Patch for data changes, `search_index` on filtered fields, `autoname` not by PHI, `permissions` array","`reviewer` must rule; `.claude/rules/doctype-json.md`; security as `next` when `permissions` changes","Responsibilities, context, failure handling"],["`patches.txt` and `patches/`","Release owner","Section (`pre_model_sync` / `post_model_sync`), idempotency, no edited existing line","`reviewer` failure condition (`needs-human`); a `PreToolUse` Claude Code hook can block the edit","Failure handling, boundaries"],["`hooks.py` (Frappe hooks)","Core maintainer + architect","A new `doc_events`, `scheduler_events` or permission key has an ADR","`architect` ADR (module 05); `reviewer` checks the ADR exists","Handoffs, context"],["Fixtures (Custom Field, Property Setter)","Country lead","Country-specific fixtures live in the country app, not in `spice_lite`","`reviewer` must rule citing frappe-coding-standards rule 12","Responsibilities"],["Whitelisted methods (`api/fhir.py`)","Senior developer + security","`methods=[...]`, no `allow_guest`, `get_list` not `get_all`, no PHI in `frappe.throw`","`reviewer` findings; `security` agent for any decorator change","Responsibilities, handoffs"],["`bench --site \u003csite> migrate` on a shared site","Person with site access, after merge","That the merged patches and JSON apply cleanly","Nobody's tool: `ask` rule in `.claude/settings.json` plus CLAUDE.md rule 9","Permissions, human gate"]]}],"exercises":[{"id":"01-anatomy-breakdown","title":"Break a one-off Frappe review prompt into agent anatomy","objective":"Take the review prompt a Frappe developer pastes into chat today (it even asks the model to open `bench console` and run `migrate`), run it once in plan mode against the real `spice_lite/api/fhir.py` and `sl_patient.json`, then break it into the twelve anatomy elements. For each element record what the prompt says, the gap, and the Claude Code mechanism (or convention) that will implement it in the `reviewer` agent. Finish with the Frappe review surfaces the prompt forgot.","startingFiles":[{"path":"AI-SDLC-frappe/docs/foundations/one-off-review-prompt.md","content":"You are a senior Frappe developer. Look at my latest changes to the FHIR API and the Patient DocType\nand tell me what's wrong. Check for bugs, security, performance and style. Use our standards. Be\nthorough but concise. If you need to check the data, open bench console on the site. Fix anything\nobvious while you're at it, and run migrate if the DocType changed. If everything looks fine, reply LGTM.\n"}],"requiredStructure":"AI-SDLC-frappe/docs/foundations/\n├── one-off-review-prompt.md          # given: the prompt as pasted in chat\n└── anatomy-breakdown-reviewer.md     # you write:\n                                      #   12-row table: # | element | what the prompt says | gap or risk | where it lives in Claude Code\n                                      #   (last column starts with \"Mechanism:\" or \"Convention:\")\n                                      #   \"Frappe review surfaces the prompt forgot\" table: DocType JSON, patches.txt, hooks.py, fixtures, whitelisted methods","implementation":[{"path":"AI-SDLC-frappe/docs/foundations/anatomy-breakdown-reviewer.md","language":"markdown","content":"# Anatomy breakdown: the one-off review prompt (Frappe edition)\n\nReference answer for exercise `01-anatomy-breakdown` (module 01-foundations).\nSource prompt: `docs/foundations/one-off-review-prompt.md`.\n\nEach row takes one anatomy element, quotes what the prompt says about it, names the gap, and says\nwhere that element lives once the prompt becomes the `reviewer` agent. The last column starts with\n**Mechanism:** when Cla
