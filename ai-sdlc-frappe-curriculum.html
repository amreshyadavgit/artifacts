ude Code enforces or loads it, or **Convention:** when it is a course rule that\nonly a human, a script or an eval checks.\n\n| # | element | what the prompt says | gap or risk | where it lives in Claude Code |\n|---|---|---|---|---|\n| 1 | responsibilities | \"tell me what's wrong\", \"Fix anything obvious\", \"run migrate\" | Three jobs in one: reviewing, editing and changing a site's schema. An agent that fixes what it reviews cannot give an independent opinion. | Mechanism: the `description` frontmatter field decides when the main session delegates to `reviewer`; the body states the single job. |\n| 2 | boundaries | nothing | No statement of what is out of scope: deep security analysis, performance profiling, approving, touching the site. | Mechanism: `tools` allowlist and `disallowedTools`; Convention: the contract `mustNot` list for boundaries no tool setting can express (no LGTM, no PHI in evidence). |\n| 3 | inputs | \"my latest changes to the FHIR API and the Patient DocType\" | Which base ref? Staged or committed? A subagent has no conversation history, so \"latest\" means nothing to it. | Mechanism: the Agent tool `prompt` (task message) is the only runtime input besides CLAUDE.md, git status and preloaded skills; Convention: the contract names the required fields (base ref, run id). |\n| 4 | outputs | \"tell me\", \"be thorough but concise\" | No format, so findings cannot be counted, compared between runs, or checked by a script. | Mechanism: the subagent's final message is what returns to the main session; Convention: the six-field finding table from `context/standards/review-standards.md` and the handoff file. |\n| 5 | tools | \"open bench console on the site\" | Asks for the most dangerous tool on a bench: `bench console` is an IPython shell with full database access, and in the main session every other tool, including Edit and Write, is available too. | Mechanism: `tools: Read, Grep, Glob, Bash` in `.claude/agents/reviewer.md`; omitting `Agent` also stops it delegating; `Bash(bench --site * console)` is an `ask` rule in `.claude/settings.json`. |\n| 6 | context | \"Use our standards\" | Which standards? The model will invent generic Django or Python advice, and it will not look at `patches.txt` or the `permissions` array unless told they matter. | Mechanism: the CLAUDE.md hierarchy loads automatically, `.claude/rules/doctype-json.md` loads when DocType JSON is read, and `skills: [code-review]` preloads the review procedure; Convention: the body names `context/standards/frappe-coding-standards.md` and `review-standards.md` to Read. |\n| 7 | instructions | \"You are a senior Frappe developer\" | A persona, not a procedure. No steps, no order, no definition of done. | Mechanism: the agent file body becomes the subagent's system prompt (it does not get the Claude Code system prompt). |\n| 8 | memory/state | nothing | Nothing carries over between reviews, which is fine; but the prompt also relies on \"my latest changes\" living in chat history. | Mechanism: optional `memory: project` gives `.claude/agent-memory/reviewer/MEMORY.md`; Convention: run state lives in handoff files under `.ai-sdlc/runs/\u003crun-id>/`. |\n| 9 | permissions | \"Fix anything obvious\", \"run migrate if the DocType changed\" | Grants write authority and site authority implicitly. In `acceptEdits` mode the edits land without a prompt; `migrate` on a shared site changes the schema for everyone on it. | Mechanism: `permissionMode` in frontmatter plus project `permissions` allow/ask/deny in `.claude/settings.json` (`migrate`, `console`, `execute` are `ask`; `drop-site` is denied); the Claude Code hook `block-secrets.mjs` still runs inside subagents. |\n| 10 | verification | nothing | No way to tell a good review from a plausible one. | Convention: golden tasks in `evaluations/` (module 09) and `validate-contract.mjs` for the contract; Mechanism: a `SubagentStop` Claude Code hook can reject output that lacks the required structure (module 08). |\n| 11 | failure handling | \"If everything looks fine, reply LGTM\" | The only exit is success. No instruction for an empty diff, a huge regenerated DocType JSON, a missing standard, or an edited line in `patches.txt`, so the model guesses. | Mechanism: `maxTurns` caps the loop and marks the output partial; Convention: `status: blocked` or `needs-human` in the handoff front matter with the reason. |\n| 12 | handoffs | \"reply LGTM\" | \"LGTM\" reads as approval, which review-standards forbids, and it carries nothing the next step (security, tester) can use. | Convention: handoff file `.ai-sdlc/runs/\u003crun-id>/NN-reviewer.md` with front matter `run_id, step, agent, status, inputs, next`; Mechanism once module 08 adds it: the Claude Code hook `.claude/hooks/check-handoff.mjs`. |\n\n## Frappe review surfaces the prompt forgot\n\nOn a Frappe team the person who reviews a change today looks at more than Python. The prompt names\n\"the FHIR API and the Patient DocType\" and none of the following, so a model following it reviews\n`spice_lite/api/fhir.py` and skims the JSON:\n\n| surface | what a human reviewer checks today | where the agent gets that knowledge |\n|---|---|---|\n| DocType JSON (`sl_patient.json`) | new fields have a patch if data must change; `search_index` on filtered fields; `permissions` array unchanged or security-reviewed; `autoname` never by PHI | `.claude/rules/doctype-json.md` (loaded by `paths`), frappe-coding-standards rules 6 and 11 |\n| `patches.txt` | new patch in the right section (`[pre_model_sync]` or `[post_model_sync]`); no existing line edited, because Patch Log keys on the exact line text | `.claude/rules/doctype-json.md`, review-standards Frappe clause |\n| `hooks.py` | a new `doc_events`, `scheduler_events`, `permission_query_conditions` or `has_permission` key has an ADR | `.claude/rules/doctype-json.md` |\n| fixtures | Custom Field and Property Setter fixtures belong in the country app, not in `spice_lite` | frappe-coding-standards rule 12 |\n| whitelisted methods | `methods=[...]`, no `allow_guest`, `frappe.get_list` not `frappe.get_all` | `.claude/rules/spice-lite-python.md`, frappe-coding-standards rules 2 and 3 |\n\n## Rewritten as a contract (summary)\n\n- purpose: review one diff (Python, DocType JSON, `patches.txt`, `hooks.py`, fixtures) against the Frappe standards and return findings; never edit, never run `bench`, never give merge approval (an `APPROVE` verdict only means no blocking findings).\n- inputs: base ref and run id in the task message; optional upstream handoff path.\n- outputs: handoff with six-field findings table, a \"Frappe surfaces in this diff\" line, and explicit \"no findings\" per category.\n- tools: Read, Grep, Glob, Bash (git diff, git log, git status only).\n- humanGate: PR approval by a human; critical or high findings block merge; `bench --site * migrate` stays a human action behind an `ask` rule.\n\nFull draft: `docs/foundations/reviewer-contract-draft.md`.\n","tag":"illustrative"}],"exampleInput":"cd AI-SDLC-frappe\n# 1. Run the one-off prompt as-is (plan mode, so nothing is edited and no bench command runs)\nclaude -p \"$(cat docs/foundations/one-off-review-prompt.md) The changes are in sample-app/spice_lite/spice_lite/api/fhir.py and sample-app/spice_lite/spice_lite/clinical/doctype/sl_patient/sl_patient.json.\" --permission-mode plan --output-format json | jq -r '.result'\n\n# 2. Ask for the anatomy breakdown, then compare it with your own table\nclaude -p 'Read docs/foundations/one-off-review-prompt.md. For each of these elements: responsibilities, boundaries, inputs, outputs, tools, context, instructions, memory/state, permissions, verification, failure handling, handoffs, give one table row: what the prompt says, the gap, and the Claude Code subagent field or setting that would implement it, or the word convention if none does.' --permission-mode plan --output-format json | jq -r '.result'","expectedOutput":"Run 1 (the raw prompt), typical result:\n\nHere's what I found:\n1. Performance: `lastn()` in fhir.py loops over `subject_list` and calls `frappe.get_doc(\"SL Patient\", s)` and `frappe.get_all(\"SL Observation\", ..., fields=[\"*\"])` per subject, an N+1. I'd batch it with one `frappe.get_list` using `(\"in\", subjects)`.\n2. Security: that `frappe.get_all` skips permission checks on SL Observation.\n3. `create_observation` returns `str(e)` from the ValidationError as the 422 diagnostics.\n4. sl_patient.json: consider `search_index` on `mrn` for identifier searches.\n5. Style: `_iso()` in mappers.py emits datetimes without a timezone offset.\nI'd like to open `bench --site test.localhost console` to check how many observations a patient has, and I can apply fix 1 and run `bench migrate` if you exit plan mode. Otherwise LGTM.\n\nWhat is wrong with it: no severities, no `path:line`, no standard cited; findings 1 and 2 are the documented TEACHING-DEFECT(perf-n+1) and finding 5 is open defect D-3, both reported as new; finding 4 is wrong (`mrn` is `unique: 1`, which already creates an index); it never looks at `patches.txt` or the `permissions` array; it asks for `bench console` and offers to edit and migrate; it ends with LGTM, which review-standards forbids.\n\nRun 2 (anatomy), excerpt:\n\n| element | prompt says | gap | Claude Code |\n|---|---|---|---|\n| tools | \"open bench console\" | IPython with full DB access, plus every session tool incl. Edit | `tools: Read, Grep, Glob, Bash`; console is an `ask` rule |\n| inputs | \"my latest changes\" | subagent has no chat history | task message must name the base ref |\n| permissions | \"run migrate\" | changes a shared site's schema | `permissionMode`, `ask` rule on migrate |\n| handoffs | \"LGTM\" | nothing reusable | convention (handoff file) |","testCases":[{"name":"All twelve elements present","input":"grep -cE '^\\| (1[0-2]|[1-9]) \\|' AI-SDLC-frappe/docs/foundations/anatomy-breakdown-reviewer.md","expected":"12"},{"name":"Every row says mechanism or convention","input":"grep -E '^\\| [0-9]+ \\|' AI-SDLC-frappe/docs/foundations/anatomy-breakdown-reviewer.md | grep -vcE 'Mechanism:|Convention:'","expected":"0 (every row names one or the other)"},{"name":"Real subagent fields, no invented ones","input":"grep -oE '`(tools|disallowedTools|permissionMode|maxTurns|memory|skills|description)' AI-SDLC-frappe/docs/foundations/anatomy-breakdown-reviewer.md | sort -u | wc -l; grep -cE 'temperature|allowed-tools|timeout' AI-SDLC-frappe/docs/foundations/anatomy-breakdown-reviewer.md","expected":"7, then 0"},{"name":"The Frappe surfaces are named","input":"grep -cE '^\\| (DocType JSON|`patches.txt`|`hooks.py`|fixtures|whitelisted methods)' AI-SDLC-frappe/docs/foundations/anatomy-breakdown-reviewer.md","expected":"5"},{"name":"bench console and migrate are caught as tools and permissions gaps","input":"grep -nE 'bench console|migrate' AI-SDLC-frappe/docs/foundations/anatomy-breakdown-reviewer.md | grep -cE '^[0-9]+:\\| (5|9) \\|'","expected":"2 (row 5 tools and row 9 permissions)"},{"name":"The defect the raw prompt reports as new is already pinned","input":"cd /home/user/frappe-bench && bench --site test.localhost run-tests --module spice_lite.tests.test_fhir_api --test test_lastn_query_count_grows_with_subjects","expected":"Ran 1 test ... OK. The N+1 at `api/fhir.py` lines 155-182 is TEACHING-DEFECT(perf-n+1), documented in sample-app/docs/KNOWN_DEFECTS.md; your breakdown lists the prompt's ignorance of that file under context."}],"evaluationCriteria":["Every one of the twelve elements has a concrete gap, quoted from the prompt where it says anything.","The Claude Code column uses only fields and settings from build/CLAUDE_CODE_FACTS.md (no `temperature`, no hyphenated `allowed-tools` in an agent).","Conventions are labelled as conventions, not dressed up as mechanisms.","The breakdown identifies that \"Fix anything obvious\" and \"run migrate\" add two responsibilities and grant write and site authority.","`bench console` is identified as an arbitrary-code tool that no reviewer holds, with the `ask` rule that already guards it.","The Frappe surfaces table names DocType JSON, `patches.txt`, `hooks.py` and fixtures, and says where each rule comes from."],"improvements":["Repeat the breakdown for a one-off security prompt (\"check fhir.py for permission problems\") and compare which elements are mechanisms for `security` versus `reviewer`.","Add a column: which later module turns each convention into a mechanism.","Run the raw prompt three times and record how many findings differ between runs; that variance is the argument for a fixed output format."]},{"id":"01-classify-primitives","title":"Classify twelve needs into a Claude Code primitive or a Frappe hook","objective":"For twelve real needs from a Frappe team's SDLC, choose the one answer that fits (`prompt`, `skill`, `agent`, `workflow`, `mcp`, `claude-code-hook`, or `frappe-hook`) and justify it in one sentence. Grade yourself with a script against the answer key, then read the justification for anything you missed. Two needs are traps built on the word \"hook\"; a bare `hook` scores zero.","startingFiles":[{"path":"AI-SDLC-frappe/docs/foundations/my-classification.json","content":"{\n  \"N01\": {\n    \"need\": \"Refuse any file write by Claude that contains a Frappe API token (`token \u003ckey>:\u003csecret>`) or a `db_password` copied from `site_config.json`.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N02\": {\n    \"need\": \"Once, today: ask which existing tests exercise `spice_lite.api.fhir.lastn`.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N03\": {\n    \"need\": \"A repeatable procedure for reviewing a Frappe diff (Python, DocType JSON, `patches.txt`, `hooks.py`) against `context/standards/review-standards.md`, producing six-field findings, usable by a human with `/code-review` and preloaded by the reviewer agent.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N04\": {\n    \"need\": \"An independent second opinion on a diff, from something that starts with a clean context and physically cannot edit files or run `bench`.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N05\": {\n    \"need\": \"Deliver a feature: requirements, architect ADR, developer change (DocType JSON, controller, patch, tests), reviewer and security findings, then human approval before merge and before anyone migrates a shared site.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N06\": {\n    \"need\": \"Pull the summary and acceptance criteria of a Jira ticket into the requirements step.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N07\": {\n    \"need\": \"`/run-tests`: run `bench --site test.localhost run-tests --app spice_lite` from the bench and summarise failures with module and test name.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N08\": {\n    \"need\": \"Do not let a subagent finish until its handoff file has valid YAML front matter (`run_id`, `step`, `agent`, `status`, `inputs`, `next`).\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N09\": {\n    \"need\": \"Root-cause a backlog on the `long` RQ queue from worker logs and `RQ Job` / `Error Log` excerpts, and propose (not apply) a fix.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N10\": {\n    \"need\": \"While designing tests, look up PHI-safe counts of `SL Observation` rows per LOINC code on the running test site, read-only.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N11\": {\n    \"need\": \"Whenever an `SL Observation` is saved as `final` on the Kenya deployment, enqueue a push of it to the national health information exchange.\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  },\n  \"N12\": {\n    \"need\": \"Stop Claude from editing an existing line of `spice_lite/patches.txt` (Patch Log keys on the exact line, so the patch would run again on every site).\",\n    \"answer\": \"\",\n    \"why\": \"\"\n  }\n}\n"}],"requiredStructure":"AI-SDLC-frappe/docs/foundations/\n├── my-classification.json          # you fill: answer = prompt|skill|agent|workflow|mcp|claude-code-hook|frappe-hook, why = one sentence\n├── classification-answer-key.md    # key: table N01..N12 with answer, accepted, justification, repo example\n├── grade-classification.mjs        # zero-dependency grader, exit 0 at >= 10/12; bare \"hook\" = AMBIGUOUS\n└── example-answers.json            # a realistic attempt with two mistakes","implementation":[{"path":"AI-SDLC-frappe/docs/foundations/classification-answer-key.md","language":"markdown","content":"# Answer key: classify twelve needs on a Frappe team\n\nExercise `01-classify-primitives` (module 01-foundations, Frappe edition). For each need, pick exactly\none primary answer from `prompt | skill | agent | workflow | mcp | claude-code-hook | frappe-hook`.\nThe grader (`docs/foundations/grade-classification.mjs`) reads the table below: column `answer` is the\nprimary answer, column `accepted` lists other answers that earn full marks when the justification is sound.\nA bare `hook` is not an answer in this repo (CLAUDE.md rule 5): the grader marks it `AMBIGUOUS` and gives no point.\n\nThe first six are Claude Code primitives for building the SDLC system. `frappe-hook` is not one of\nthem: it is product code in an app's `hooks.py` (`doc_events`, `scheduler_events`, `permission_query_conditions`, ...)\nthat runs inside the Frappe site. It is on the list because the word \"hook\" makes people confuse the two.\n\nDecision order used for the key (first \"yes\" wins):\n\n0. Is it behaviour of the **running app on a site** (a document event, a scheduled job, who may see which rows)? -> `frappe-hook` (or a controller method). It ships through the normal workflow like any code change.\n1. Must it happen **every time** Claude acts, whether or not the model remembers? -> `claude-code-hook` (or a permission rule).\n2. Does it need data or actions in a **system outside the repo** (Jira, GitHub, the Frappe site)? -> `mcp`.\n3. Does it chain **several roles with a human gate** between them? -> `workflow`.\n4. Does it need **its own context, its own tool limits, or an independent opinion**? -> `agent`.\n5. Will it be **repeated** by people or agents with the same procedure? -> `skill`.\n6. Otherwise it is a one-off -> `prompt`.\n\n| id | need | answer | accepted | justification | repo example |\n|---|---|---|---|---|---|\n| N01 | Refuse any file write by Claude that contains a Frappe API token (`token \u003ckey>:\u003csecret>`) or a `db_password` copied from `site_config.json`. | claude-code-hook | none | Policy must hold even when the model ignores instructions. A Claude Code `PreToolUse` hook on `Edit\\|Write` that exits 2 is deterministic; a CLAUDE.md rule is only a request. | `.claude/hooks/block-secrets.mjs` |\n| N02 | Once, today: ask which existing tests exercise `spice_lite.api.fhir.lastn`. | prompt | none | One-off question with no reuse, no special tools and no need for isolation. Packaging it would cost more than it saves. | `claude -p \"Which tests call spice_lite.api.fhir.lastn?\" --permission-mode plan` |\n| N03 | A repeatable procedure for reviewing a Frappe diff (Python, DocType JSON, `patches.txt`, `hooks.py`) against `context/standards/review-standards.md`, producing six-field findings, usable by a human with `/code-review` and preloaded by the reviewer agent. | skill | none | Same procedure every time, invoked by people and preloaded into an agent. A skill keeps the steps and the output template in one versioned file with supporting files. | `.claude/skills/code-review/SKILL.md` (module 03) |\n| N04 | An independent second opinion on a diff, from something that starts with a clean context and physically cannot edit files or run `bench`. | agent | none | Needs isolation (fresh context, no author bias) and a tool boundary (`tools: Read, Grep, Glob, Bash` with Bash limited to git). Only a subagent gives both. | `.claude/agents/reviewer.md` (module 05) |\n| N05 | Deliver a feature: requirements, architect ADR, developer change (DocType JSON, controller, patch, tests), reviewer and security findings, then human approval before merge and before anyone migrates a shared site. | workflow | none | Several roles in a fixed order with gates and handoff files between them. No single agent should own all of it. | `workflows/feature-delivery.md` and `/feature` (module 08) |\n| N06 | Pull the summary and acceptance criteria of a Jira ticket into the requirements step. | mcp | none | The data lives in an external system. An MCP server exposes it as tools (`mcp__\u003cserver>__\u003ctool>`) that permission rules can allow or deny per tool. | `.mcp.json` and `/ticket-intake` (module 06) |\n| N07 | `/run-tests`: run `bench --site test.localhost run-tests --app spice_lite` from the bench and summarise failures with module and test name. | skill | none | A named, repeatable procedure with a user-invoked entry point. The bench command is already on the project allow list, and `allowed-tools` can pre-approve the parser script for that turn. | `.claude/skills/run-tests/SKILL.md` (module 02) |\n| N08 | Do not let a subagent finish until its handoff file has valid YAML front matter (`run_id`, `step`, `agent`, `status`, `inputs`, `next`). | claude-code-hook | none | Enforcement at a Claude Code lifecycle event: a `SubagentStop` Claude Code hook that exits 2 forces the agent to continue. Asking nicely in the prompt is not a control. | `.claude/hooks/check-handoff.mjs` (module 08) |\n| N09 | Root-cause a backlog on the `long` RQ queue from worker logs and `RQ Job` / `Error Log` excerpts, and propose (not apply) a fix. | agent | skill | Needs a read-only tool boundary and its own context for long log reading, so an agent (`sre`). The analysis procedure itself is the `production-rca` skill the agent preloads, so `skill` is accepted if the answer says it runs inside the `sre` agent. | `.claude/agents/sre.md` preloading `production-rca` (modules 04, 05) |\n| N10 | While designing tests, look up PHI-safe counts of `SL Observation` rows per LOINC code on the running test site, read-only. | mcp | none | Live data behind the Frappe REST API, reused by several agents, with a read-only boundary best enforced at the tool level (a read-only API user). | `mcp/` server (module 06) |\n| N11 | Whenever an `SL Observation` is saved as `final` on the Kenya deployment, enqueue a push of it to the national health information exchange. | frappe-hook | none | This is runtime behaviour of the app on one country's site, not something Claude does. It is a `doc_events` entry (`on_update`) in the Kenya country app's `hooks.py` that calls `frappe.enqueue`. A Claude Code hook fires on Claude's tool calls, never on a clinician saving a form. | `hooks.py` `doc_events` (commented example in `spice_lite/hooks.py`; the country-app decision is taught in module 03) |\n| N12 | Stop Claude from editing an existing line of `spice_lite/patches.txt` (Patch Log keys on the exact line, so the patch would run again on every site). | claude-code-hook | none | It concerns what Claude does to a file, so it is enforced at `PreToolUse` on `Edit\\|Write` with a script that exits 2. A `frappe-hook` cannot help: Frappe reads `patches.txt` only at install and `bench migrate`, long after the edit. | a `PreToolUse` Claude Code hook in `.claude/settings.json` (pattern; build it as an improvement of this exercise) |\n\nCommon wrong answers and why they lose marks:\n\n- N01 as `prompt` or CLAUDE.md rule: instructions describe intent; only Claude Code hooks and permission rules enforce it.\n- N04 as `skill`: a skill runs in the current context (unless `context: fork`), so it shares the author's history and tools.\n- N05 as `agent`: one agent doing every role hides the gates; a subagent cannot ask the user questions (`AskUserQuestion` is not available to subagents).\n- N08 as `agent`: a checker agent is itself non-deterministic; the check is a script, triggered by a Claude Code hook.\n- N11 as `claude-code-hook`: \"on save\" sounds like `PostToolUse` on `Write`, but the save happens in the Frappe desk or API, where Claude is not involved.\n- N12 as `frappe-hook`: `hooks.py` has no key that runs when a file in the repo changes; `before_migrate` would run only after the damage is merged.\n- Any answer `hook`: say which one. In this repo the word alone is a bug report waiting to happen.\n","tag":"illustrative"},{"path":"AI-SDLC-frappe/docs/foundations/grade-classification.mjs","language":"javascript","content":"#!/usr/bin/env node\n// Grade a learner's primitive classification against docs/foundations/classification-answer-key.md.\n// Frappe edition: seven answers, and a bare \"hook\" is AMBIGUOUS (CLAUDE.md rule 5). Zero dependencies, Node 22.\n//\n// Usage: node docs/foundations/grade-classification.mjs \u003canswers.json> [--key \u003canswer-key.md>] [--pass \u003cn>]\n// answers.json: { \"N01\": { \"answer\": \"claude-code-hook\", \"why\": \"...\" }, ... }  (a bare string is also accepted)\n// Exit codes: 0 score >= pass mark (default 10), 1 below pass mark, 2 usage or I/O error.\nimport { readFileSync } from \"node:fs\";\nimport { dirname, join } from \"node:path\";\nimport { fileURLToPath } from \"node:url\";\n\nexport const PRIMITIVES = [\"prompt\", \"skill\", \"agent\", \"workflow\", \"mcp\", \"claude-code-hook\", \"frappe-hook\"];\nexport const DEFAULT_PASS = 10;\nconst DEFAULT_KEY = join(dirname(fileURLToPath(import.meta.url)), \"classification-answer-key.md\");\n\n// Split a markdown table row on pipes that are not escaped as \\|\nfunction cells(row) {\n  return row.trim().replace(/^\\|/, \"\").replace(/\\|$/, \"\").split(/(?\u003c!\\\\)\\|/).map((c) => c.trim().replace(/\\\\\\|/g, \"|\"));\n}\n\nexport function parseKey(markdown) {\n  const key = new Map();\n  for (const line of markdown.split(\"\\n\")) {\n    if (!/^\\| N\\d{2} \\|/.test(line)) continue;\n    const [id, need, answer, accepted, justification] = cells(line);\n    if (!PRIMITIVES.includes(answer)) throw new Error(`${id}: answer \"${answer}\" is not a primitive`);\n    const alt = accepted === \"none\" ? [] : accepted.split(/,\\s*/);\n    key.set(id, { need, answer, accepted: alt, justification });\n  }\n  return key;\n}\n\nexport function grade(key, answers) {\n  const rows = [];\n  let score = 0;\n  for (const [id, k] of key) {\n    const raw = answers[id];\n    const given = String((raw && typeof raw === \"object\" ? raw.answer : raw) || \"\").trim().toLowerCase();\n    const why = raw && typeof raw === \"object\" ? String(raw.why || \"\").trim() : \"\";\n    let verdict;\n    if (!given) verdict = \"MISSING\";\n    else if (given === \"hook\" || given === \"hooks\") verdict = \"AMBIGUOUS\";\n    else if (!PRIMITIVES.includes(given)) verdict = \"INVALID\";\n    else if (given === k.answer) verdict = \"CORRECT\";\n    else if (k.accepted.includes(given)) verdict = \"ACCEPTED\";\n    else verdict = \"WRONG\";\n    const points = verdict === \"CORRECT\" || verdict === \"ACCEPTED\" ? 1 : 0;\n    score += points;\n    rows.push({ id, given: given || \"-\", expected: k.answer, verdict, points, noWhy: points === 1 && why.length \u003c 20 });\n  }\n  return { score, total: key.size, rows };\n}\n\nfunction main(argv) {\n  const args = [...argv];\n  const opt = (name, def) => { const i = args.indexOf(name); if (i \u003c 0) return def; const v = args[i + 1]; args.splice(i, 2); return v; };\n  const keyPath = opt(\"--key\", DEFAULT_KEY);\n  const pass = Number(opt(\"--pass\", String(DEFAULT_PASS)));\n  const [answersPath] = args;\n  if (!answersPath) { process.stderr.write(\"usage: grade-classification.mjs \u003canswers.json> [--key \u003cmd>] [--pass \u003cn>]\\n\"); return 2; }\n  let key, answers;\n  try {\n    key = parseKey(readFileSync(keyPath, \"utf8\"));\n    answers = JSON.parse(readFileSync(answersPath, \"utf8\"));\n  } catch (e) { process.stderr.write(`ERROR ${e.message}\\n`); return 2; }\n  const r = grade(key, answers);\n  for (const row of r.rows) {\n    let line = `${row.id}  ${row.verdict.padEnd(9)} given=${row.given.padEnd(16)} key=${row.expected}`;\n    if (row.verdict === \"WRONG\") line += `  -> ${key.get(row.id).justification}`;\n    if (row.verdict === \"AMBIGUOUS\") line += '  -> say \"claude-code-hook\" or \"frappe-hook\" (CLAUDE.md rule 5)';\n    if (row.verdict === \"ACCEPTED\") line += \"  (alternative answer: check the justification names the agent it runs in)\";\n    if (row.noWhy) line += \"  (warning: justification missing or under 20 characters)\";\n    process.stdout.write(line + \"\\n\");\n  }\n  const ok = r.score >= pass;\n  process.stdout.write(`SCORE ${r.score}/${r.total} (pass mark ${pass}) ${ok ? \"PASS\" : \"FAIL\"}\\n`);\n  return ok ? 0 : 1;\n}\n\nif (import.meta.url === `file://${process.argv[1]}`) process.exit(main(process.argv.slice(2)));\n","tag":"illustrative"},{"path":"AI-SDLC-frappe/docs/foundations/example-answers.json","language":"json","content":"{\n  \"N01\": { \"answer\": \"claude-code-hook\", \"why\": \"Must block every write deterministically; PreToolUse on Edit|Write exiting 2.\" },\n  \"N02\": { \"answer\": \"prompt\", \"why\": \"One question, asked once, no reuse or isolation needed.\" },\n  \"N03\": { \"answer\": \"skill\", \"why\": \"Same review procedure every time, shared by humans and the reviewer agent.\" },\n  \"N04\": { \"answer\": \"skill\", \"why\": \"Reuse the code-review skill for the second opinion.\" },\n  \"N05\": { \"answer\": \"workflow\", \"why\": \"Several roles in order with human approval before merge and before migrate.\" },\n  \"N06\": { \"answer\": \"mcp\", \"why\": \"Ticket data lives in Jira, outside the repo.\" },\n  \"N07\": { \"answer\": \"skill\", \"why\": \"Named user-invoked procedure around the allowed bench run-tests command.\" },\n  \"N08\": { \"answer\": \"claude-code-hook\", \"why\": \"SubagentStop Claude Code hook that exits 2 until the front matter is valid.\" },\n  \"N09\": { \"answer\": \"skill\", \"why\": \"The production-rca skill, run inside the sre agent with read-only tools.\" },\n  \"N10\": { \"answer\": \"mcp\", \"why\": \"Live read-only aggregates from the test site's REST API, reused by several agents.\" },\n  \"N11\": { \"answer\": \"claude-code-hook\", \"why\": \"Fire a PostToolUse hook when the Observation is saved.\" },\n  \"N12\": { \"answer\": \"claude-code-hook\", \"why\": \"PreToolUse on Edit that exits 2 when an existing patches.txt line changes.\" }\n}\n","tag":"illustrative"}],"exampleInput":"cd AI-SDLC-frappe\nnode docs/foundations/grade-classification.mjs docs/foundations/example-answers.json","expectedOutput":"N01  CORRECT   given=claude-code-hook key=claude-code-hook\nN02  CORRECT   given=prompt           key=prompt\nN03  CORRECT   given=skill            key=skill\nN04  WRONG     given=skill            key=agent  -> Needs isolation (fresh context, no author bias) and a tool boundary (`tools: Read, Grep, Glob, Bash` with Bash limited to git). Only a subagent gives both.\nN05  CORRECT   given=workflow         key=workflow\nN06  CORRECT   given=mcp              key=mcp\nN07  CORRECT   given=skill            key=skill\nN08  CORRECT   given=claude-code-hook key=claude-code-hook\nN09  ACCEPTED  given=skill            key=agent  (alternative answer: check the justification names the agent it runs in)\nN10  CORRECT   given=mcp              key=mcp\nN11  WRONG     given=claude-code-hook key=frappe-hook  -> This is runtime behaviour of the app on one country's site, not something Claude does. It is a `doc_events` entry (`on_update`) in the Kenya country app's `hooks.py` that calls `frappe.enqueue`. A Claude Code hook fires on Claude's tool calls, never on a clinician saving a form.\nN12  CORRECT   given=claude-code-hook key=claude-code-hook\nSCORE 10/12 (pass mark 10) PASS","testCases":[{"name":"Grader passes the example attempt","input":"node docs/foundations/grade-classification.mjs docs/foundations/example-answers.json; echo $?","expected":"Last two lines: `SCORE 10/12 (pass mark 10) PASS` and `0`"},{"name":"Stricter pass mark fails it","input":"node docs/foundations/grade-classification.mjs docs/foundations/example-answers.json --pass 11; echo $?","expected":"`SCORE 10/12 (pass mark 11) FAIL` then `1`"},{"name":"Blank starting file scores zero","input":"node docs/foundations/grade-classification.mjs docs/foundations/my-classification.json; echo $?   (before filling it in)","expected":"Twelve lines with `MISSING`, then `SCORE 0/12 (pass mark 10) FAIL`, then `1`"},{"name":"A bare hook answer is ambiguous","input":"echo '{\"N08\":\"hook\"}' > /tmp/h.json && node docs/foundations/grade-classification.mjs /tmp/h.json | grep N08","expected":"`N08  AMBIGUOUS given=hook ... -> say \"claude-code-hook\" or \"frappe-hook\" (CLAUDE.md rule 5)`"},{"name":"Key examples point at real files","input":"test -f .claude/hooks/block-secrets.mjs && grep -c 'after_migrate' sample-app/spice_lite/spice_lite/hooks.py && grep -c '# doc_events' sample-app/spice_lite/spice_lite/hooks.py","expected":"1 and 1: the N01 example is the Claude Code hook that exists today, and the N11 Frappe hook example is the commented `doc_events` block in `hooks.py`."},{"name":"Unit tests for the grader and key","input":"node --test docs/foundations/foundations.test.mjs","expected":"`# tests 16`, `# pass 16`, `# fail 0`"}],"evaluationCriteria":["Score at least 10/12 with the grader.","Each justification names the property that decided it (runtime app behaviour, enforcement, external system, gates, isolation, reuse), not just the primitive's name.","N01, N08 and N12 are recognised as enforcement of what Claude does (Claude Code hooks), not instruction problems.","N11 is recognised as a Frappe hook (`doc_events` in a country app) and N12 as a Claude Code hook, with the reason each trap is a trap.","For N09, an answer of `skill` explicitly says the skill runs inside the `sre` agent's tool boundary."],"improvements":["Add five needs from your own team's backlog to the key (for example a nightly `scheduler_events` job, or a check that every DocType JSON change has a patch), with a justification each, and have a colleague grade themselves.","Extend the grader to fail an answer whose `why` does not contain one of the decision-order keywords.","Build the N12 guard: a `PreToolUse` Claude Code hook on `Edit` that exits 2 when `old_string` contains an existing non-comment line of `patches.txt`, with a `node --test` suite."]},{"id":"01-contract-validate","title":"Write the spice_lite reviewer Agent Contract and validate it","objective":"Copy `agents/CONTRACT_TEMPLATE.md`, fill all eleven fields for the `reviewer` roster agent on `spice_lite`, tag every must and mustNot rule as mechanism or convention, and make `validate-contract.mjs` exit 0 with no warnings. See first what the validator reports on a realistic first attempt (invented tool, `bench console` in scope, untagged rule, bare \"hook\", gate without mechanism). Then export the contract as the JSON `agentContracts` entry. Module 05-agent-roster finalises this draft as `agents/reviewer/CONTRACT.md`.","startingFiles":[{"path":"AI-SDLC-frappe/docs/foundations/reviewer-contract-draft.md","content":"# Agent Contract: \u003cagent-name>\n\n\u003c!--\nHow to use this template (course convention, not a Claude Code feature):\n1. Copy it to agents/\u003cagent-name>/CONTRACT.md. \u003cagent-name> is one of:\n   architect, developer, reviewer, tester, security, sre, orchestrator.\n2. Replace every \u003cangle-bracket> placeholder. Keep the eleven \"## field\" headings exactly as\n   written, in this order: they are the agentContracts fields of build/schema.json, and\n   docs/foundations/validate-contract.mjs checks them.\n3. List fields (inputs, outputs, tools, must, mustNot, failureConditions) use \"- \" bullets.\n   Text fields (purpose, permissions, validation, handoffFormat, humanGate) are one paragraph.\n4. Every line in must / mustNot ends with how it is enforced, in square brackets:\n   [mechanism: \u003cthe Claude Code config or Claude Code hook that enforces it>] or\n   [convention: \u003cwho or what checks it>]. A rule with no enforcement is a wish.\n5. Frappe edition rules the validator also checks:\n   - A Bash scope in tools may name bench commands, but never `console`, `execute`,\n     `drop-site` or `reinstall` (arbitrary Python as Administrator, or destroys a site), and a\n     `migrate` scope must say it runs behind the `ask` rule in .claude/settings.json.\n   - Write \"Frappe hook\" for hooks.py entries and \"Claude Code hook\" for settings/frontmatter\n     hooks (CLAUDE.md rule 5). A bare \"hook\" is reported as a warning.\n6. Validate: node docs/foundations/validate-contract.mjs agents/\u003cagent-name>/CONTRACT.md\nBlock-level HTML comments like this one are ignored by the validator.\n-->\n\nStatus: \u003cdraft | final>\nOwner: \u003cteam or person accountable for this agent>\nRuntime definition: `.claude/agents/\u003cagent-name>.md`\nFrappe surfaces: \u003cwhich of controllers, whitelisted methods in api/, DocType JSON, patches.txt, hooks.py, fixtures this agent reads or writes>\nFinalised in: \u003cmodule id that ships the final version>\n\n## purpose\n\n\u003cOne paragraph: the single job this agent does, for whom, and the decision its output supports. Name what it does NOT do if that is a common confusion (for example: reviews DocType JSON but never runs `bench migrate`).>\n\n## inputs\n\n- \u003cInput 1: what it is, where it comes from (task message, handoff file path, repo path), required or optional>\n- \u003cInput 2>\n\n## outputs\n\n- \u003cOutput 1: the artifact, its path, and its format>\n- \u003cOutput 2: the final message returned to the main session>\n\n## tools\n\n- \u003cTool name exactly as Claude Code spells it, e.g. Read, Grep, Glob, Bash, Edit, Write, mcp__server__tool, plus any scope such as \"Bash (only `bench --site test.localhost run-tests *`)\">\n\n## permissions\n\n\u003cOne paragraph: the frontmatter and settings that bound this agent: `tools`, `disallowedTools`, `permissionMode`, and the project `permissions` allow/ask/deny rules it relies on (bench run-tests allowed, migrate/console/execute behind ask, site_config reads and drop-site denied). Say what is enforced by config and what is only requested.>\n\n## must\n\n- \u003cRequired behaviour> [mechanism: \u003cconfig or Claude Code hook>]\n- \u003cRequired behaviour> [convention: \u003cchecked by whom>]\n\n## mustNot\n\n- \u003cForbidden behaviour> [mechanism: \u003cconfig or Claude Code hook>]\n- \u003cForbidden behaviour> [convention: \u003cchecked by whom>]\n\n## failureConditions\n\n- \u003cCondition under which the agent must stop and report `status: blocked` or `status: needs-human` instead of guessing>\n\n## validation\n\n\u003cOne paragraph: how anyone can check an output is acceptable: a command that exits 0 (for example `bench --site test.localhost run-tests --app spice_lite`), a golden task in evaluations/, a Claude Code hook, a checklist a human applies.>\n\n## handoffFormat\n\n\u003cOne paragraph: the handoff file path (`.ai-sdlc/runs/\u003crun-id>/NN-\u003cagent-name>.md`), its YAML front matter keys (`run_id`, `step`, `agent`, `status`, `inputs`, `next`), and the required sections.>\n\n## humanGate\n\n\u003cOne paragraph: where a human must approve before the work continues, and the real mechanism that stops the work until they do (plan mode, a permission `ask` rule such as the one on `bench --site * migrate`, PR approval, a Claude Code hook that exits 2).>\n"}],"requiredStructure":"AI-SDLC-frappe/\n├── agents/\n│   └── CONTRACT_TEMPLATE.md               # 11 \"## field\" headings = build/schema.json agentContracts\n└── docs/foundations/\n    ├── reviewer-contract-draft.md         # you fill (starts as a copy of the template)\n    ├── reviewer-contract-first-attempt.md # given: five planted mistakes, do not fix\n    ├── validate-contract.mjs              # zero-dependency validator, exit 0 / 1 / 2, Frappe bench and hook checks\n    └── foundations.test.mjs               # node --test suite for the validator and grader","implementation":[{"path":"AI-SDLC-frappe/agents/CONTRACT_TEMPLATE.md","language":"markdown","content":"# Agent Contract: \u003cagent-name>\n\n\u003c!--\nHow to use this template (course convention, not a Claude Code feature):\n1. Copy it to agents/\u003cagent-name>/CONTRACT.md. \u003cagent-name> is one of:\n   architect, developer, reviewer, tester, security, sre, orchestrator.\n2. Replace every \u003cangle-bracket> placeholder. Keep the eleven \"## field\" headings exactly as\n   written, in this order: they are the agentContracts fields of build/schema.json, and\n   docs/foundations/validate-contract.mjs checks them.\n3. List fields (inputs, outputs, tools, must, mustNot, failureConditions) use \"- \" bullets.\n   Text fields (purpose, permissions, validation, handoffFormat, humanGate) are one paragraph.\n4. Every line in must / mustNot ends with how it is enforced, in square brackets:\n   [mechanism: \u003cthe Claude Code config or Claude Code hook that enforces it>] or\n   [convention: \u003cwho or what checks it>]. A rule with no enforcement is a wish.\n5. Frappe edition rules the validator also checks:\n   - A Bash scope in tools may name bench commands, but never `console`, `execute`,\n     `drop-site` or `reinstall` (arbitrary Python as Administrator, or destroys a site), and a\n     `migrate` scope must say it runs behind the `ask` rule in .claude/settings.json.\n   - Write \"Frappe hook\" for hooks.py entries and \"Claude Code hook\" for settings/frontmatter\n     hooks (CLAUDE.md rule 5). A bare \"hook\" is reported as a warning.\n6. Validate: node docs/foundations/validate-contract.mjs agents/\u003cagent-name>/CONTRACT.md\nBlock-level HTML comments like this one are ignored by the validator.\n-->\n\nStatus: \u003cdraft | final>\nOwner: \u003cteam or person accountable for this agent>\nRuntime definition: `.claude/agents/\u003cagent-name>.md`\nFrappe surfaces: \u003cwhich of controllers, whitelisted methods in api/, DocType JSON, patches.txt, hooks.py, fixtures this agent reads or writes>\nFinalised in: \u003cmodule id that ships the final version>\n\n## purpose\n\n\u003cOne paragraph: the single job this agent does, for whom, and the decision its output supports. Name what it does NOT do if that is a common confusion (for example: reviews DocType JSON but never runs `bench migrate`).>\n\n## inputs\n\n- \u003cInput 1: what it is, where it comes from (task message, handoff file path, repo path), required or optional>\n- \u003cInput 2>\n\n## outputs\n\n- \u003cOutput 1: the artifact, its path, and its format>\n- \u003cOutput 2: the final message returned to the main session>\n\n## tools\n\n- \u003cTool name exactly as Claude Code spells it, e.g. Read, Grep, Glob, Bash, Edit, Write, mcp__server__tool, plus any scope such as \"Bash (only `bench --site test.localhost run-tests *`)\">\n\n## permissions\n\n\u003cOne paragraph: the frontmatter and settings that bound this agent: `tools`, `disallowedTools`, `permissionMode`, and the project `permissions` allow/ask/deny rules it relies on (bench run-tests allowed, migrate/console/execute behind ask, site_config reads and drop-site denied). Say what is enforced by config and what is only requested.>\n\n## must\n\n- \u003cRequired behaviour> [mechanism: \u003cconfig or Claude Code hook>]\n- \u003cRequired behaviour> [convention: \u003cchecked by whom>]\n\n## mustNot\n\n- \u003cForbidden behaviour> [mechanism: \u003cconfig or Claude Code hook>]\n- \u003cForbidden behaviour> [convention: \u003cchecked by whom>]\n\n## failureConditions\n\n- \u003cCondition under which the agent must stop and report `status: blocked` or `status: needs-human` instead of guessing>\n\n## validation\n\n\u003cOne paragraph: how anyone can check an output is acceptable: a command that exits 0 (for example `bench --site test.localhost run-tests --app spice_lite`), a golden task in evaluations/, a Claude Code hook, a checklist a human applies.>\n\n## handoffFormat\n\n\u003cOne paragraph: the handoff file path (`.ai-sdlc/runs/\u003crun-id>/NN-\u003cagent-name>.md`), its YAML front matter keys (`run_id`, `step`, `agent`, `status`, `inputs`, `next`), and the required sections.>\n\n## humanGate\n\n\u003cOne paragraph: where a human must approve before the work continues, and the real mechanism that stops the work until they do (plan mode, a permission `ask` rule such as the one on `bench --site * migrate`, PR approval, a Claude Code hook that exits 2).>\n","tag":"illustrative"},{"path":"AI-SDLC-frappe/docs/foundations/reviewer-contract-draft.md","language":"markdown","content":"# Agent Contract: reviewer\n\n\u003c!--\nWorked example for module 01-foundations (Frappe edition). This is a DRAFT filled in from\nagents/CONTRACT_TEMPLATE.md. Module 05-agent-roster finalises it as agents/reviewer/CONTRACT.md and\nships the runtime definition .claude/agents/reviewer.md. Module 02 builds a simpler first version\n(evaluations/agent-versions/reviewer-v1.md).\n-->\n\nStatus: draft\nOwner: spice_lite core maintainers (the people who review DocType JSON, patches and `hooks.py` today)\nRuntime definition: `.claude/agents/reviewer.md`\nFrappe surfaces: reads controllers, whitelisted methods in `api/`, DocType JSON, `patches.txt`, `hooks.py` and fixtures; writes nothing\nFinalised in: 05-agent-roster\n\n## purpose\n\nReview one diff of `sample-app/spice_lite/` against the Frappe standards and return structured findings, so the human reviewer can decide faster whether the change is mergeable. On a Frappe app the Python is only half of a change: the reviewer reads the DocType JSON diff (fields, `permissions` array, `search_index`, `autoname`), `patches.txt`, `hooks.py` entries and fixtures together with the controllers and whitelisted methods. It covers correctness, design, readability, testing and standards; it flags security and performance concerns but defers deep analysis of them to the `security` and `sre` agents. It never changes code, never runs `bench`, and never approves a change.\n\n## inputs\n\n- Base ref to diff against, e.g. `main` (required, in the task message).\n- Run id, e.g. `2026-09-30-feat-observation-interpretation` (required, in the task message; names the run folder).\n- Path of the upstream handoff that describes the intent of the change, e.g. `.ai-sdlc/runs/\u003crun-id>/04-developer.md` (optional; without it the reviewer reviews the diff on its own merits and says so).\n- Standards to apply: `context/standards/review-standards.md` and `context/standards/frappe-coding-standards.md` (always), `context/standards/testing-standards.md` when files under `tests/` or `test_*.py` change, `context/standards/api-standards.md` when `spice_lite/api/` changes.\n- Path-scoped rules that Claude Code loads by itself when the reviewer reads matching files: `.claude/rules/spice-lite-python.md` for `*.py` and `.claude/rules/doctype-json.md` for DocType JSON, `patches.txt` and `hooks.py`.\n\n## outputs\n\n- Final message to the main session: the complete handoff document (YAML front matter plus the sections in handoffFormat). The orchestrator, which has Write access to the run folder, saves it as `.ai-sdlc/runs/\u003crun-id>/NN-reviewer.md`.\n- A findings table with one row per finding: `id | severity | category | location | evidence | recommendation`, severity from `critical | high | medium | low | info`.\n- A \"Frappe surfaces in this diff\" line listing which of DocType JSON, `patches.txt`, `hooks.py`, fixtures and whitelisted methods the diff touched, so a human can see that the JSON was reviewed and not skipped.\n- An explicit \"no findings\" line for every category it checked and found clean.\n\n## tools\n\n- Read\n- Grep\n- Glob\n- Bash (only `git diff`, `git log`, `git status`)\n\n## permissions\n\nFrontmatter in `.claude/agents/reviewer.md`: `tools: Read, Grep, Glob, Bash` (an allowlist, so Edit, Write and Agent are not available) and `disallowedTools: Edit, Write, NotebookEdit` as a second guard, with `permissionMode: dontAsk`, which auto-denies anything that would prompt. In this repo that means the `ask` rules in `.claude/settings.json` (`bench --site * migrate`, `console`, `execute`, `install-app`, `git commit`, `git push`) are denied for the reviewer instead of reaching a human. Two gaps remain and are closed in module 05: `Bash(bench --site test.localhost run-tests *)` is on the project allow list, so `dontAsk` would still let the reviewer run tests; and a subagent's `permissionMode` is ignored when the parent session runs in `bypassPermissions`, `acceptEdits` or `auto`. Module 05 therefore adds a Claude Code `PreToolUse` hook in the agent's own frontmatter that exits 2 for any Bash command outside `git diff|git log|git status`. The project deny rules (`Read(**/site_config.json)`, `Read(**/common_site_config.json)`, `Read(./.env)`, `Read(./**/*.phi.*)`, `bench drop-site`, `reinstall`) apply to the reviewer like every other agent.\n\n## must\n\n- Give every finding all six fields: id, severity, category, location as `path:line`, evidence quoted from the diff or file, recommendation. [convention: checked by the reviewer golden tasks in module 09-agent-evaluation]\n- Cite the standard violated as file plus rule number, e.g. `context/standards/frappe-coding-standards.md` rule 2 for a `frappe.get_all` in a request path. [convention: checked by the reviewer golden tasks]\n- Review DocType JSON, `patches.txt`, `hooks.py` and fixture changes together with the Python diff, and rate a schema or data change without a `patches.txt` entry, or a `permissions` array change without a security step, at least `high`. [convention: `context/standards/review-standards.md`, checked by a golden task with a seeded DocType JSON diff]\n- State \"no findings\" for each category it checked and found clean. [convention: human reviewer reads the handoff]\n- Read the change with `git diff \u003cbase>...HEAD`, not from memory of an earlier conversation. [mechanism: subagents start with no conversation history; Bash is limited to git by `permissionMode: dontAsk` plus allow rules]\n- End with a handoff whose front matter has `run_id`, `step`, `agent: reviewer`, `status`, `inputs`, `next`. [mechanism: the Claude Code hook `check-handoff.mjs` from module 08 rejects a handoff with missing keys]\n\n## mustNot\n\n- Edit, create or delete any file, including DocType JSON and `patches.txt`. [mechanism: Edit and Write are absent from `tools` and listed in `disallowedTools`]\n- Delegate to other agents. [mechanism: `Agent` is absent from `tools`, so the reviewer stays at depth 1]\n- Run any shell command other than `git diff`, `git log` or `git status`; in particular no `bench` command (run-tests, migrate, console, execute). [mechanism: `permissionMode: dontAsk` auto-denies the `ask` rules, backed by the agent-scoped Claude Code `PreToolUse` hook from module 05 that also blocks the allowed run-tests]\n- Read `site_config.json` or `common_site_config.json`. [mechanism: `permissions.deny` rules `Read(**/site_config.json)` and `Read(**/common_site_config.json)` in `.claude/settings.json`]\n- Present its verdict as a merge approval or write \"LGTM\", \"approved\" or \"ready to merge\". [convention: `context/standards/review-standards.md`: the `APPROVE` verdict only means no blocking findings; merge approval is a human PR approval]\n- Quote PHI in evidence (MRN values, names, birth dates, search terms, patient-linked observation values); quote code and synthetic fixtures such as `MRN-000123` only. [convention: `context/security/phi-and-secrets-policy.md`, re-checked by the security agent]\n- Report the marked `TEACHING-DEFECT(perf-n+1)` in `spice_lite/api/fhir.py` `lastn()`, or the open defects D-1 and D-3, as new findings. They may be mentioned as known, with a reference to `sample-app/docs/KNOWN_DEFECTS.md`. [convention: reviewer golden tasks include a case that checks this]\n\n## failureConditions\n\n- The diff against the base ref is empty or the base ref does not exist: return `status: blocked` with the exact `git` error.\n- The diff touches more than 40 files or 2,000 changed lines: return `status: needs-human` and ask for the change to be split (a regenerated DocType JSON with a reordered `field_order` counts; ask for it in its own commit).\n- A referenced standard file or upstream handoff path does not exist: return `status: needs-human` naming the missing path.\n- The change touches a DocType `permissions` array, `permission_query_conditions` or `has_permission` in `hooks.py`, a `@frappe.whitelist` decorator, `ignore_permissions`, or `spice_lite/audit.py`: review it, but set `next: security` and say why.\n- The change edits an existing line in `patches.txt`: Patch Log records the exact line text, so the patch would run again on every country site at the next migrate. Report it as a `high` finding and return `status: needs-human`.\n- The task asks the reviewer to fix the code, run the tests, or migrate a site: refuse, return `status: blocked` and recommend routing to `developer` or `tester`.\n- The run hits `maxTurns` (the output is marked partial): return `status: blocked` rather than a partial finding list presented as complete.\n\n## validation\n\nThis contract is checked with `node docs/foundations/validate-contract.mjs docs/foundations/reviewer-contract-draft.md` (exit 0, no warnings). Reviewer output is checked three ways: the handoff front matter by the Claude Code hook `check-handoff.mjs` (module 08); the findings against golden tasks in `evaluations/` (module 09), where a seeded diff that switches `search_patients` from `frappe.get_list` to `frappe.get_all` must produce a `security` finding citing frappe-coding-standards rule 2, and a seeded diff that retypes `SL Observation.value` in `sl_observation.json` without a `patches.txt` entry must produce a `high` `standards` finding citing rule 6; and a human spot-check that no finding lacks quoted evidence.\n\n## handoffFormat\n\nMarkdown with YAML front matter as defined in `workflows/README.md` and the style guide: `run_id`, `step`, `agent: reviewer`, `status` (`complete | blocked | needs-human`), `inputs` (list of upstream handoff file names), `next` (`security`, `tester`, `developer` or `human`). Sections in order: `## Summary` (verdict in one sentence, counts per severity, the Frappe surfaces line), `## Findings` (the six-column table), `## Decisions` (what was out of scope and why), `## Open questions`, `## Artifacts` (always \"none written; returned to main session\"). Saved by the orchestrator as `.ai-sdlc/runs/\u003crun-id>/NN-reviewer.md`.\n\n## humanGate\n\nThe reviewer is advisory; the gate is the human pull-request approval. Any `critical` or `high` finding blocks merge (review-standards), and in an orchestrated run the orchestrator stops with `status: needs-human` until a person accepts or rejects each one. Nothing the reviewer produces reaches a site or the remote: `git push` and `bench --site * migrate` are `ask` rules in `.claude/settings.json` (denied outright under the reviewer's `dontAsk`), force-push and `bench drop-site` are denied, and CLAUDE.md rule 9 leaves push, merge, migrating a shared site and deploying to a human.\n","tag":"illustrative"},{"path":"AI-SDLC-frappe/docs/foundations/reviewer-contract-first-attempt.md","language":"markdown","content":"# Agent Contract: reviewer\n\n\u003c!--\nA realistic FIRST ATTEMPT at the reviewer contract, kept so exercise 01-contract-validate can show\nwhat validate-contract.mjs reports. Five planted mistakes: (1) an invented tool name, (2) a Bash\nscope that grants `bench console`, (3) a must rule with no enforcement tag, (4) a bare \"hook\" in\nthat same rule, (5) a human gate with no real mechanism. Do not fix this file; fix your own copy.\nThe corrected version is reviewer-contract-draft.md.\n-->\n\nStatus: draft\nOwner: spice_lite core maintainers (the people who review DocType JSON, patches and `hooks.py` today)\nRuntime definition: `.claude/agents/reviewer.md`\nFrappe surfaces: reads controllers, whitelisted methods in `api/`, DocType JSON, `patches.txt`, `hooks.py` and fixtures; writes nothing\nFinalised in: 05-agent-roster\n\n## purpose\n\nReview one diff of `sample-app/spice_lite/` against the Frappe standards and return structured findings, so the human reviewer can decide faster whether the change is mergeable. On a Frappe app the Python is only half of a change: the reviewer reads the DocType JSON diff (fields, `permissions` array, `search_index`, `autoname`), `patches.txt`, `hooks.py` entries and fixtures together with the controllers and whitelisted methods. It covers correctness, design, readability, testing and standards; it flags security and performance concerns but defers deep analysis of them to the `security` and `sre` agents. It never changes code, never runs `bench`, and never approves a change.\n\n## inputs\n\n- Base ref to diff against, e.g. `main` (required, in the task message).\n- Run id, e.g. `2026-09-30-feat-observation-interpretation` (required, in the task message; names the run folder).\n- Path of the upstream handoff that describes the intent of the change, e.g. `.ai-sdlc/runs/\u003crun-id>/04-developer.md` (optional; without it the reviewer reviews the diff on its own merits and says so).\n- Standards to apply: `context/standards/review-standards.md` and `context/standards/frappe-coding-standards.md` (always), `context/standards/testing-standards.md` when files under `tests/` or `test_*.py` change, `context/standards/api-standards.md` when `spice_lite/api/` changes.\n- Path-scoped rules that Claude Code loads by itself when the reviewer reads matching files: `.claude/rules/spice-lite-python.md` for `*.py` and `.claude/rules/doctype-json.md` for DocType JSON, `patches.txt` and `hooks.py`.\n\n## outputs\n\n- Final message to the main session: the complete handoff document (YAML front matter plus the sections in handoffFormat). The orchestrator, which has Write access to the run folder, saves it as `.ai-sdlc/runs/\u003crun-id>/NN-reviewer.md`.\n- A findings table with one row per finding: `id | severity | category | location | evidence | recommendation`, severity from `critical | high | medium | low | info`.\n- A \"Frappe surfaces in this diff\" line listing which of DocType JSON, `patches.txt`, `hooks.py`, fixtures and whitelisted methods the diff touched, so a human can see that the JSON was reviewed and not skipped.\n- An explicit \"no findings\" line for every category it checked and found clean.\n\n## tools\n\n- Read\n- Grep\n- Glob\n- DocTypeInspector\n- Bash (`git diff`, `git log`, and `bench --site test.localhost console` to check data)\n\n## permissions\n\nFrontmatter in `.claude/agents/reviewer.md`: `tools: Read, Grep, Glob, Bash` (an allowlist, so Edit, Write and Agent are not available) and `disallowedTools: Edit, Write, NotebookEdit` as a second guard, with `permissionMode: dontAsk`, which auto-denies anything that would prompt. In this repo that means the `ask` rules in `.claude/settings.json` (`bench --site * migrate`, `console`, `execute`, `install-app`, `git commit`, `git push`) are denied for the reviewer instead of reaching a human. Two gaps remain and are closed in module 05: `Bash(bench --site test.localhost run-tests *)` is on the project allow list, so `dontAsk` would still let the reviewer run tests; and a subagent's `permissionMode` is ignored when the parent session runs in `bypassPermissions`, `acceptEdits` or `auto`. Module 05 therefore adds a Claude Code `PreToolUse` hook in the agent's own frontmatter that exits 2 for any Bash command outside `git diff|git log|git status`. The project deny rules (`Read(**/site_config.json)`, `Read(**/common_site_config.json)`, `Read(./.env)`, `Read(./**/*.phi.*)`, `bench drop-site`, `reinstall`) apply to the reviewer like every other agent.\n\n## must\n\n- Give every finding all six fields: id, severity, category, location as `path:line`, evidence quoted from the diff or file, recommendation. [convention: checked by the reviewer golden tasks in module 09-agent-evaluation]\n- Cite the standard violated as file plus rule number, e.g. `context/standards/frappe-coding-standards.md` rule 2 for a `frappe.get_all` in a request path. [convention: checked by the reviewer golden tasks]\n- Review DocType JSON, `patches.txt`, `hooks.py` and fixture changes together with the Python diff, and rate a schema or data change without a `patches.txt` entry, or a `permissions` array change without a security step, at least `high`. [convention: `context/standards/review-standards.md`, checked by a golden task with a seeded DocType JSON diff]\n- Check that a new doc_events entry has a matching hook test.\n- Read the change with `git diff \u003cbase>...HEAD`, not from memory of an earlier conversation. [mechanism: subagents start with no conversation history; Bash is limited to git by `permissionMode: dontAsk` plus allow rules]\n- End with a handoff whose front matter has `run_id`, `step`, `agent: reviewer`, `status`, `inputs`, `next`. [mechanism: the Claude Code hook `check-handoff.mjs` from module 08 rejects a handoff with missing keys]\n\n## mustNot\n\n- Edit, create or delete any file, including DocType JSON and `patches.txt`. [mechanism: Edit and Write are absent from `tools` and listed in `disallowedTools`]\n- Delegate to other agents. [mechanism: `Agent` is absent from `tools`, so the reviewer stays at depth 1]\n- Run any shell command other than `git diff`, `git log` or `git status`; in particular no `bench` command (run-tests, migrate, console, execute). [mechanism: `permissionMode: dontAsk` auto-denies the `ask` rules, backed by the agent-scoped Claude Code `PreToolUse` hook from module 05 that also blocks the allowed run-tests]\n- Read `site_config.json` or `common_site_config.json`. [mechanism: `permissions.deny` rules `Read(**/site_config.json)` and `Read(**/common_site_config.json)` in `.claude/settings.json`]\n- Present its verdict as a merge approval or write \"LGTM\", \"approved\" or \"ready to merge\". [convention: `context/standards/review-standards.md`: the `APPROVE` verdict only means no blocking findings; merge approval is a human PR approval]\n- Quote PHI in evidence (MRN values, names, birth dates, search terms, patient-linked observation values); quote code and synthetic fixtures such as `MRN-000123` only. [convention: `context/security/phi-and-secrets-policy.md`, re-checked by the security agent]\n- Report the marked `TEACHING-DEFECT(perf-n+1)` in `spice_lite/api/fhir.py` `lastn()`, or the open defects D-1 and D-3, as new findings. They may be mentioned as known, with a reference to `sample-app/docs/KNOWN_DEFECTS.md`. [convention: reviewer golden tasks include a case that checks this]\n\n## failureConditions\n\n- The diff against the base ref is empty or the base ref does not exist: return `status: blocked` with the exact `git` error.\n- The diff touches more than 40 files or 2,000 changed lines: return `status: needs-human` and ask for the change to be split (a regenerated DocType JSON with a reordered `field_order` counts; ask for it in its own commit).\n- A referenced standard file or upstream handoff path does not exist: return `status: needs-human` naming the missing path.\n- The change touches a DocType `permissions` array, `permission_query_conditions` or `has_permission` in `hooks.py`, a `@frappe.whitelist` decorator, `ignore_permissions`, or `spice_lite/audit.py`: review it, but set `next: security` and say why.\n- The change edits an existing line in `patches.txt`: Patch Log records the exact line text, so the patch would run again on every country site at the next migrate. Report it as a `high` finding and return `status: needs-human`.\n- The task asks the reviewer to fix the code, run the tests, or migrate a site: refuse, return `status: blocked` and recommend routing to `developer` or `tester`.\n- The run hits `maxTurns` (the output is marked partial): return `status: blocked` rather than a partial finding list presented as complete.\n\n## validation\n\nThis contract is checked with `node docs/foundations/validate-contract.mjs docs/foundations/reviewer-contract-draft.md` (exit 0, no warnings). Reviewer output is checked three ways: the handoff front matter by the Claude Code hook `check-handoff.mjs` (module 08); the findings against golden tasks in `evaluations/` (module 09), where a seeded diff that switches `search_patients` from `frappe.get_list` to `frappe.get_all` must produce a `security` finding citing frappe-coding-standards rule 2, and a seeded diff that retypes `SL Observation.value` in `sl_observation.json` without a `patches.txt` entry must produce a `high` `standards` finding citing rule 6; and a human spot-check that no finding lacks quoted evidence.\n\n## handoffFormat\n\nMarkdown with YAML front matter as defined in `workflows/README.md` and the style guide: `run_id`, `step`, `agent: reviewer`, `status` (`complete | blocked | needs-human`), `inputs` (list of upstream handoff file names), `next` (`security`, `tester`, `developer` or `human`). Sections in order: `## Summary` (verdict in one sentence, counts per severity, the Frappe surfaces line), `## Findings` (the six-column table), `## Decisions` (what was out of scope and why), `## Open questions`, `## Artifacts` (always \"none written; returned to main session\"). Saved by the orchestrator as `.ai-sdlc/runs/\u003crun-id>/NN-reviewer.md`.\n\n## humanGate\n\nThe tech lead reads the findings before the sprint review and decides what to do with them.\n","tag":"illustrative"},{"path":"AI-SDLC-frappe/docs/foundations/validate-contract.mjs","language":"javascript","content":"#!/usr/bin/env node\n// Validate an Agent Contract markdown file (course convention; see agents/CONTRACT_TEMPLATE.md).\n// Frappe edition. Zero dependencies, Node 22.\n//\n// Usage (from AI-SDLC-frappe/):\n//   node docs/foundations/validate-contract.mjs \u003ccontract.md> [more.md ...]   validate filled contracts\n//   node docs/foundations/validate-contract.mjs --template agents/CONTRACT_TEMPLATE.md   headings only\n//   node docs/foundations/validate-contract.mjs --json \u003ccontract.md>   print the agentContracts JSON object\n// Exit codes: 0 valid, 1 invalid, 2 usage or I/O error.\nimport { readFileSync } from \"node:fs\";\n\nexport const FIELDS = [\n  \"purpose\", \"inputs\", \"outputs\", \"tools\", \"permissions\", \"must\", \"mustNot\",\n  \"failureConditions\", \"validation\", \"handoffFormat\", \"humanGate\",\n];\nexport const LIST_FIELDS = new Set([\"inputs\", \"outputs\", \"tools\", \"must\", \"mustNot\", \"failureConditions\"]);\nexport const ROSTER = [\"architect\", \"developer\", \"reviewer\", \"tester\", \"security\", \"sre\", \"orchestrator\"];\n// Built-in tool names as Claude Code spells them (build/CLAUDE_CODE_FACTS.md section 1), plus MCP tools.\nconst TOOLS = new Set([\n  \"Read\", \"Grep\", \"Glob\", \"LSP\", \"Bash\", \"PowerShell\", \"Edit\", \"Write\", \"NotebookEdit\", \"WebFetch\",\n  \"WebSearch\", \"TodoWrite\", \"Skill\", \"ToolSearch\", \"EnterWorktree\", \"ExitWorktree\", \"Monitor\",\n  \"TaskStop\", \"SendMessage\", \"Agent\",\n]);\nconst MCP_TOOL = /^mcp__[A-Za-z0-9_-]+(__[A-Za-z0-9_*-]+)?$/;\nconst ENFORCEMENT = /\\[(mechanism|convention):\\s*[^\\]]+\\]\\s*$/;\nconst GATE_MECHANISM = /plan mode|permissionMode: plan|`ask`|\\bask rule|pull[- ]request approval|PR approval|Claude Code hook|exit 2/i;\n// bench sub-commands that must never be in an agent's tool scope (FRAPPE_FACTS section 10):\n// console and execute run arbitrary Python as Administrator and commit; drop-site and reinstall destroy data.\nconst BENCH_FORBIDDEN = /\\bbench\\b[^;\\n]*\\b(console|execute|drop-site|reinstall)\\b/;\nconst BENCH_MIGRATE = /\\bbench\\b[^;\\n]*\\bmigrate\\b/;\n\nconst stripComments = (s) => s.replace(/\u003c!--[\\s\\S]*?-->/g, \"\");\nconst stripCode = (s) => s.replace(/`[^`\\n]*`/g, \"``\");\n\nexport function parseContract(markdown) {\n  const text = stripComments(markdown);\n  const title = (text.match(/^# Agent Contract:\\s*(.+?)\\s*$/m) || [])[1] || null;\n  const sections = [];\n  let current = null;\n  for (const line of text.split(\"\\n\")) {\n    const h = line.match(/^## (\\S.*?)\\s*$/);\n    if (h) { current = { name: h[1], lines: [] }; sections.push(current); continue; }\n    if (/^# /.test(line)) { current = null; continue; }\n    if (current) current.lines.push(line);\n  }\n  return { title, sections };\n}\n\n// CLAUDE.md rule 5: \"hook\" alone is ambiguous in a Frappe repo. Returns the number of bare uses.\nexport function bareHookCount(text) {\n  const prose = stripCode(text);\n  let n = 0;\n  for (const m of prose.matchAll(/\\bhooks?\\b/gi)) {\n    const before = prose.slice(Math.max(0, m.index - 20), m.index);\n    if (!/(Frappe|Claude Code)(\\s+``)?\\s+$/.test(before)) n++;\n  }\n  return n;\n}\n\nexport function validateContract(markdown, { template = false } = {}) {\n  const errors = [];\n  const warnings = [];\n  const { title, sections } = parseContract(markdown);\n  const names = sections.map((s) => s.name);\n\n  if (!title) errors.push('missing title line \"# Agent Contract: \u003cagent>\"');\n  else if (!template && !ROSTER.includes(title)) errors.push(`agent \"${title}\" is not in the roster (${ROSTER.join(\", \")})`);\n\n  for (const f of FIELDS) {\n    const n = names.filter((x) => x === f).length;\n    if (n === 0) errors.push(`missing section \"## ${f}\"`);\n    if (n > 1) errors.push(`section \"## ${f}\" appears ${n} times`);\n  }\n  const known = names.filter((x) => FIELDS.includes(x));\n  const expectedOrder = FIELDS.filter((f) => known.includes(f));\n  if (known.join() !== expectedOrder.join()) errors.push(`sections out of order: expected ${expectedOrder.join(\", \")}`);\n  for (const x of names) if (!FIELDS.includes(x)) warnings.push(`extra section \"## ${x}\" is not an agentContracts field`);\n\n  if (template) return { ok: errors.length === 0, errors, warnings };\n\n  for (const s of sections) {\n    if (!FIELDS.includes(s.name)) continue;\n    const body = s.lines.join(\"\\n\").trim();\n    const bullets = s.lines.filter((l) => /^- \\S/.test(l)).map((l) => l.slice(2).trim());\n    if (!body) { errors.push(`${s.name}: section is empty`); continue; }\n    if (/\u003c[a-z][^>\\n]*>/i.test(stripCode(body))) errors.push(`${s.name}: unreplaced \u003cplaceholder> text`);\n    if (LIST_FIELDS.has(s.name) && bullets.length === 0) errors.push(`${s.name}: needs at least one \"- \" bullet`);\n    if (!LIST_FIELDS.has(s.name) && bullets.length > 0) errors.push(`${s.name}: must be a paragraph, not a bullet list`);\n    const bare = bareHookCount(body);\n    if (bare) warnings.push(`${s.name}: ${bare} bare \"hook\" (say \"Frappe hook\" or \"Claude Code hook\", CLAUDE.md rule 5)`);\n    if (s.name === \"must\" || s.name === \"mustNot\") {\n      bullets.forEach((b, i) => {\n        if (!ENFORCEMENT.test(b)) errors.push(`${s.name}[${i + 1}]: must end with [mechanism: ...] or [convention: ...]`);\n      });\n      const mech = bullets.filter((b) => /\\[mechanism:/.test(b)).length;\n      if (s.name === \"mustNot\" && bullets.length && mech === 0) warnings.push(\"mustNot: no rule is enforced by a mechanism; all are conventions\");\n    }\n    if (s.name === \"tools\") {\n      bullets.forEach((b) => {\n        const name = b.split(/[\\s(]/)[0];\n        if (!TOOLS.has(name) && !MCP_TOOL.test(name)) errors.push(`tools: \"${name}\" is not a Claude Code tool name`);\n        // only the granted part of the scope counts: \"Bash (git diff only; never bench console)\" is fine\n        const granted = b.split(/\\b(never|not|no|except)\\b/i)[0];\n        const bench = granted.match(BENCH_FORBIDDEN);\n        if (bench) errors.push(`tools: \"bench ... ${bench[1]}\" must not be in a tool scope (arbitrary code as Administrator or destroys a site)`);\n        if (BENCH_MIGRATE.test(granted) && !/\\bask\\b/.test(b)) errors.push('tools: a \"bench ... migrate\" scope must say it runs behind the `ask` rule');\n      });\n    }\n    if (s.name === \"humanGate\" && !GATE_MECHANISM.test(body)) {\n      errors.push(\"humanGate: name the real mechanism (plan mode, a permission ask rule, PR approval, or a Claude Code hook that exits 2)\");\n    }\n    if (s.name === \"handoffFormat\" && !body.includes(\".ai-sdlc/runs/\")) {\n      errors.push(\"handoffFormat: must name the run-folder path .ai-sdlc/runs/\u003crun-id>/NN-\u003cagent>.md\");\n    }\n  }\n  return { ok: errors.length === 0, errors, warnings };\n}\n\nexport function toAgentContract(markdown) {\n  const { title, sections } = parseContract(markdown);\n  const out = { agent: title };\n  for (const f of FIELDS) {\n    const s = sections.find((x) => x.name === f);\n    const lines = s ? s.lines : [];\n    out[f] = LIST_FIELDS.has(f)\n      ? lines.filter((l) => /^- \\S/.test(l)).map((l) => l.slice(2).trim())\n      : lines.join(\"\\n\").trim().replace(/\\s*\\n\\s*/g, \" \");\n  }\n  return out;\n}\n\nfunction main(argv) {\n  const template = argv.includes(\"--template\");\n  const json = argv.includes(\"--json\");\n  const files = argv.filter((a) => !a.startsWith(\"--\"));\n  if (files.length === 0) {\n    process.stderr.write(\"usage: validate-contract.mjs [--template] [--json] \u003ccontract.md> [...]\\n\");\n    return 2;\n  }\n  let failed = false;\n  for (const file of files) {\n    let md;\n    try { md = readFileSync(file, \"utf8\"); } catch (e) { process.stderr.write(`ERROR ${file}: ${e.message}\\n`); return 2; }\n    const r = validateContract(md, { template });\n    for (const w of r.warnings) process.stderr.write(`WARN  ${file}: ${w}\\n`);\n    for (const e of r.errors) process.stderr.write(`FAIL  ${file}: ${e}\\n`);\n    if (!r.ok) { failed = true; continue; }\n    if (json) process.stdout.write(JSON.stringify(toAgentContract(md), null, 2) + \"\\n\");\n    else process.stdout.write(`OK    ${file}: ${FIELDS.length}/${FIELDS.length} contract sections${template ? \" (template mode)\" : \"\"}\\n`);\n  }\n  return failed ? 1 : 0;\n}\n\nif (import.meta.url === `file://${process.argv[1]}`) process.exit(main(process.argv.slice(2)));\n","tag":"illustrative"},{"path":"AI-SDLC-frappe/docs/foundations/foundations.test.mjs","language":"javascript","content":"// Tests for the module 01-foundations scripts (Frappe edition). Run from AI-SDLC-frappe/:\n//   node --test docs/foundations/foundations.test.mjs\nimport { test } from \"node:test\";\nimport assert from \"node:assert/strict\";\nimport { readFileSync } from \"node:fs\";\nimport { spawnSync } from \"node:child_process\";\nimport { dirname, join } from \"node:path\";\nimport { fileURLToPath } from \"node:url\";\nimport { validateContract, toAgentContract, bareHookCount, FIELDS } from \"./validate-contract.mjs\";\nimport { parseKey, grade, PRIMITIVES } from \"./grade-classification.mjs\";\n\nconst HERE = dirname(fileURLToPath(import.meta.url));\nconst ROOT = join(HERE, \"..\", \"..\");\nconst draft = readFileSync(join(HERE, \"reviewer-contract-draft.md\"), \"utf8\");\nconst firstAttempt = readFileSync(join(HERE, \"reviewer-contract-first-attempt.md\"), \"utf8\");\nconst template = readFileSync(join(ROOT, \"agents\", \"CONTRACT_TEMPLATE.md\"), \"utf8\");\nconst keyMd = readFileSync(join(HERE, \"classification-answer-key.md\"), \"utf8\");\nconst run = (script, args) => spawnSync(process.execPath, [join(HERE, script), ...args], { encoding: \"utf8\" });\n\ntest(\"reviewer draft is a valid contract with no warnings\", () => {\n  const r = validateContract(draft);\n  assert.deepEqual(r.errors, []);\n  assert.deepEqual(r.warnings, []);\n  assert.equal(r.ok, true);\n});\n\ntest(\"template passes template mode but fails as a filled contract\", () => {\n  assert.equal(validateContract(template, { template: true }).ok, true);\n  const r = validateContract(template);\n  assert.equal(r.ok, false);\n  assert.ok(r.errors.some((e) => e.includes(\"unreplaced \u003cplaceholder>\")));\n});\n\ntest(\"template headings are the schema fields in order\", () => {\n  const headings = template.split(\"\\n\").filter((l) => l.startsWith(\"## \")).map((l) => l.slice(3));\n  assert.deepEqual(headings, FIELDS);\n});\n\ntest(\"first attempt reports exactly the five planted mistakes\", () => {\n  const r = validateContract(firstAttempt);\n  assert.deepEqual(r.errors, [\n    'tools: \"DocTypeInspector\" is not a Claude Code tool name',\n    'tools: \"bench ... console\" must not be in a tool scope (arbitrary code as Administrator or destroys a site)',\n    \"must[4]: must end with [mechanism: ...] or [convention: ...]\",\n    \"humanGate: name the real mechanism (plan mode, a permission ask rule, PR approval, or a Claude Code hook that exits 2)\",\n  ]);\n  assert.deepEqual(r.warnings, ['must: 1 bare \"hook\" (say \"Frappe hook\" or \"Claude Code hook\", CLAUDE.md rule 5)']);\n});\n\ntest(\"missing section is reported\", () => {\n  const r = validateContract(draft.replace(\"## humanGate\", \"## Human gate\"));\n  assert.ok(r.errors.includes('missing section \"## humanGate\"'));\n  assert.ok(r.warnings.some((w) => w.includes('\"## Human gate\"')));\n});\n\ntest(\"sections out of order are reported\", () => {\n  const swapped = draft.replace(\"## must\\n\", \"## TMP\\n\").replace(\"## mustNot\\n\", \"## must\\n\").replace(\"## TMP\\n\", \"## mustNot\\n\");\n  assert.ok(validateContract(swapped).errors.some((e) => e.startsWith(\"sections out of order\")));\n});\n\ntest(\"must rule without enforcement tag fails\", () => {\n  const bad = draft.replace(\"[convention: human reviewer reads the handoff]\", \"\");\n  assert.ok(validateContract(bad).errors.some((e) => /^must\\[4\\]/.test(e)));\n});\n\ntest(\"bench execute and drop-site scopes fail; migrate needs the ask rule; negated scopes pass\", () => {\n  const withTool = (t) => validateContract(draft.replace(\"- Glob\\n\", `- Glob\\n- ${t}\\n`));\n  assert.ok(withTool(\"Bash (`bench --site test.localhost execute spice_lite.demo.seed_demo`)\").errors.some((e) => e.includes(\"execute\")));\n  assert.ok(withTool(\"Bash (`bench drop-site scratch.localhost`)\").errors.some((e) => e.includes(\"drop-site\")));\n  assert.ok(withTool(\"Bash (`bench --site test.localhost migrate`)\").errors.some((e) => e.includes(\"migrate\")));\n  assert.equal(withTool(\"Bash (`bench --site test.localhost migrate`, behind the `ask` rule)\").ok, true);\n  assert.equal(withTool(\"Bash (`bench --site test.localhost run-tests *`; never console or execute)\").ok, true);\n});\n\ntest(\"bare hook is a warning; Frappe hook and Claude Code hook are not\", () => {\n  assert.equal(bareHookCount(\"add a hook for this\"), 1);\n  assert.equal(bareHookCount(\"a Frappe hook in `hooks.py` and a Claude Code `PreToolUse` hook\"), 0);\n  assert.equal(bareHookCount(\"Claude Code hooks fire inside subagents\"), 0);\n});\n\ntest(\"MCP tool names are accepted, invented names are not\", () => {\n  assert.equal(validateContract(draft.replace(\"- Glob\\n\", \"- Glob\\n- mcp__spice-site__observation_counts\\n\")).ok, true);\n  assert.ok(validateContract(draft.replace(\"- Glob\\n\", \"- BenchConsole\\n\")).errors.includes('tools: \"BenchConsole\" is not a Claude Code tool name'));\n});\n\ntest(\"agent outside the roster fails\", () => {\n  const bad = draft.replace(\"# Agent Contract: reviewer\", \"# Agent Contract: frappe-reviewer\");\n  assert.ok(validateContract(bad).errors.some((e) => e.includes(\"not in the roster\")));\n});\n\ntest(\"toAgentContract yields every schema field with the right types\", () => {\n  const c = toAgentContract(draft);\n  assert.deepEqual(Object.keys(c), [\"agent\", ...FIELDS]);\n  assert.equal(c.agent, \"reviewer\");\n  for (const f of [\"inputs\", \"outputs\", \"tools\", \"must\", \"mustNot\", \"failureConditions\"]) assert.ok(Array.isArray(c[f]) && c[f].length > 0, f);\n  for (const f of [\"purpose\", \"permissions\", \"
