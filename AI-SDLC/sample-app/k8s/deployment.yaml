# Expects a Secret created out-of-band (never commit real values), e.g.:
#   kubectl create secret generic fhir-lite-secrets \
#     --from-literal=db-password=... \
#     --from-literal=clinician-password=... \
#     --from-literal=admin-password=...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhir-lite-api
  labels:
    app: fhir-lite-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fhir-lite-api
  template:
    metadata:
      labels:
        app: fhir-lite-api
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: fhir-lite-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/fhir
            - name: DB_USERNAME
              value: fhir
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fhir-lite-secrets
                  key: db-password
            - name: FHIR_CLINICIAN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fhir-lite-secrets
                  key: clinician-password
            - name: FHIR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fhir-lite-secrets
                  key: admin-password
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
